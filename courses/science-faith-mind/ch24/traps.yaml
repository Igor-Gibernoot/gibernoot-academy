id: ch24-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: choosing a way to live"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: essence and existence, nihilism and "God is dead", the absurd, Stoicism, Epicureanism, humanism, skepticism, pragmatism and the hope of defeating death by technology. Every shortcut is a *useful idea pushed too far*.

      Nothing here asks you to adopt a way of life. Answers are given *according to* someone, and the feedback keeps three layers apart: **established fact** (dates, texts), **scholarly debate** (say which), and **faith or metaphysical commitment**. Guess before you read the options.

  - type: mcq
    id: trap-knife
    title: "Existence first for everything?"
    prompt: |
      A student summarizes Sartre: "Existence precedes essence, for knives and for people alike." What is the fairest correction?
    options:
      - text: "According to Sartre's lecture, the order is reversed only for humans. A paper-knife is conceived and given a purpose by an artisan before it is made, so for the knife essence comes first. For a person there is no such conception, so existence comes first."
        correct: true
        feedback: |
          Yes. The knife is Sartre's own contrast case. The slogan is a claim about human beings, and the reason he gives is that no one has a conception of a human being to make it from, since, in his words, there is no God to have one.
      - text: "Sartre said that nothing has an essence, not even a knife."
        feedback: |
          The lecture uses the knife precisely as a thing whose essence comes first. The reversal is claimed for people only.
      - text: "Sartre said that people have no essence, so they cannot be held responsible for what they do."
        feedback: |
          The opposite. Because no essence is given, each person makes herself by what she does, and Sartre says she is "condemned to be free" and responsible.
      - text: "Sartre said essence comes first for people too, and he only disagreed with Aristotle about knives."
        feedback: |
          That reverses the quarrel. Sartre denies a given human essence, and his rival here is the view that a creator conceives us.
    explanation: |
      Layers: the lecture (late 1945 or 1946 depending on the source, published 1946) and its wording are documented. Whether any "human nature" survives, in biology or in the human sciences, is live debate. Whether a creator conceives us is a commitment, and it is where Aquinas and Sartre part ways, while agreeing about the knife.

  - type: mcq
    id: trap-nature
    title: "No nature, no common ground?"
    prompt: |
      Someone says: "If Sartre denies human nature, he must say that people have nothing in common." According to the lecture, what is wrong?
    options:
      - text: "Sartre separates a human nature (denied) from a human condition (affirmed): being born, having to work, having to die, living among others. This universality is not given in advance but, in his phrase, is perpetually made."
        correct: true
        feedback: |
          Yes. He denies a fixed blueprint, not shared limits. People in all ages face the same kind of situation and answer it differently.
      - text: "He says people share a nature that is the same in every culture."
        feedback: |
          That is the position he rejects. The common ground he grants is a condition, not a nature.
      - text: "He says the common ground is a gift from God."
        feedback: |
          Sartre's argument starts without a God who conceives us. Shared limits come from our situation, not from a plan.
      - text: "He says people share nothing, and each lives in a private world."
        feedback: |
          He explicitly writes of a human universality of condition, so this overstates the claim.
    explanation: |
      Layers: the distinction is in the text. Whether a "condition" differs enough from a "nature" to matter is debate among readers of Sartre. Notice that Camus took a different line: he believed in a common human nature and rejected the label "existentialist".

  - type: mcq
    id: trap-god-dead
    title: "Nietzsche proved atheism?"
    prompt: |
      A reader says: "In The Gay Science, Nietzsche announces that God is dead, so he is claiming to have proved that God does not exist." What is the best correction?
    options:
      - text: "The madman's announcement (section 125) comes as news to people who already do not believe. According to Nietzsche scholars, it says that belief in the Christian God has become unbelievable, and that European values built on it are in danger, not that atheism has been demonstrated."
        correct: true
        feedback: |
          Yes. The point is cultural and psychological: a foundation of values has lost its hold, and the people who say they do not believe have not yet felt the consequences. The tone is of loss and alarm, not of a victory for argument.
      - text: "He proves it with an argument from evil in the same section."
        feedback: |
          The section is a parable, not a proof. It contains no argument of that kind.
      - text: "He says God was a real being who died at some date."
        feedback: |
          It is a diagnosis of belief. The statement describes what has happened to Europe's faith, not the death of a literal being.
      - text: "He says nothing about values, only about churches."
        feedback: |
          Values are the center of it. The worry about what remains once the ground has gone is what he calls nihilism.
    explanation: |
      Layers: the text (Gay Science, 1882, section 125, extended in the 1887 edition) is documented. How to read the tone, and what the Overman of Zarathustra means, is scholarly debate. Whether God exists is a commitment that the sentence does not settle either way.

  - type: mcq
    id: trap-nihilism
    title: "Nihilism: one claim?"
    prompt: |
      A friend says: "Nihilism is the view that nothing matters, so anything is allowed." What is the most useful correction?
    options:
      - text: "Nihilism about meaning is a claim about whether life can have meaning at all. According to the Stanford Encyclopedia, one route to it combines the view that meaning needs God or a soul with the belief that neither exists. Whether morality survives is a separate question, and many who deny cosmic meaning keep their ethics."
        correct: true
        feedback: |
          Yes. The step from "no ultimate meaning" to "anything is allowed" needs an extra premise (that morality or value also depends on that meaning). Sartre, Camus and the naturalists of this level all reject that step, in different ways.
      - text: "Nihilism is the view that life is meaningful but unpleasant."
        feedback: |
          That is pessimism. Nihilism about meaning says the conditions for meaning cannot be met, which is not a claim about pleasure.
      - text: "Nihilism is only a nineteenth-century word, with no argument behind it."
        feedback: |
          The word is old enough to have a history, but arguments for meaning nihilism are discussed in current philosophy of life, from Mackie's denial of objective values to Benatar.
      - text: "Nihilism is a claim only believers make, since atheists find meaning anyway."
        feedback: |
          The route to it described above includes believers' premise (meaning needs God) plus a doubt that God exists. The premise is about meaning, and each side of the God question reads it differently.
    explanation: |
      Layers: the arguments and who made them are documented. Whether meaning must be felt, grounded or both is live debate. Whether God exists decides which premise about meaning a person accepts: a commitment.

  - type: mcq
    id: trap-absurd-where
    title: "Where is the absurd?"
    prompt: |
      According to Camus in The Myth of Sisyphus, where does the absurd live?
    options:
      - text: "In neither the world alone nor us alone, but in the relation between our demand for meaning and the world's silence. It exists only while both are held in view."
        correct: true
        feedback: |
          Yes. If the demand went away, or if the world answered, there would be no clash. That is why Camus will not accept either exit that removes one side.
      - text: "In the world: the universe is irrational, whatever anyone thinks."
        feedback: |
          According to Camus the clash needs a questioner: the world's 'unreasonable silence' only counts as absurd against our demand for meaning.
      - text: "In us: it is a mood of sadness that therapy could remove."
        feedback: |
          It is a relation, not a mood. Camus treats it as a lucid fact to live with, not a symptom to cure.
      - text: "In God: the absurd is the name of a creator beyond reason."
        feedback: |
          Camus names the move to a God beyond reason, the leap, as an escape he calls philosophical suicide. It is not his meaning of the absurd.
    explanation: |
      Layers: Camus's position is documented (Myth of Sisyphus, 1942). Whether the world's silence is final is a commitment that a believer and a nonbeliever read differently.

  - type: mcq
    id: trap-sisyphus
    title: "Sisyphus is happy, proved?"
    prompt: |
      A reader says: "Camus proves that Sisyphus is happy. The argument is airtight." What does the reconstruction of the argument show?
    options:
      - text: "Premises about the absurd, the three possible responses, and the rejection of suicide and the leap lead to a stance of lucid revolt. A further bridge premise is needed to get from lucid to happy: that a life lived in lucid revolt can be full enough to call happy. That bridge can be questioned."
        correct: true
        feedback: |
          Yes. Validity needs the bridge, and the bridge is where critics push. Nagel, for one, argued that irony fits better than defiance, because defiance makes too much of the absurd.
      - text: "The argument is invalid, so Camus is simply wrong."
        feedback: |
          With the bridge premise the argument is valid. The question is whether its premises are true, which is a separate matter from validity.
      - text: "The argument proves that every human life is happy."
        feedback: |
          Nothing of the kind. The conclusion is a stance one is invited to imagine for one figure.
      - text: "The argument is a proof only if there is no God."
        feedback: |
          A believer rejects the first premise (the silence is final), but that is a reason to reject a premise, not a part of the argument's form.
    explanation: |
      Layers: what Camus and Nagel wrote is documented. Whether the bridge is plausible, and whether revolt or irony is the better stance, is live debate. Whether the world's silence is final is a commitment.

  - type: mcq
    id: trap-labels
    title: "Who is an existentialist?"
    multiple: true
    prompt: |
      Select every statement that is fair according to the sources used in this level.
    options:
      - text: "Camus repeatedly denied that he was an existentialist."
        correct: true
        feedback: |
          Yes. He rejected the label, and, unlike Sartre, believed in a common human nature.
      - text: "Kierkegaard presents faith as a passion, not as a conclusion that reason has proved, which is why defenders reject the charge that he simply leaps."
        correct: true
        feedback: |
          Yes. That is the defenders' reading. Camus took Kierkegaard to make a leap and called that philosophical suicide. The two readings of Kierkegaard are a live debate.
      - text: "Camus called the leap to a meaning beyond reason philosophical suicide because it escapes the clash by giving up lucid thought."
        correct: true
        feedback: |
          Yes. Physical suicide removes the one who asks, and the leap removes the clash by trading thought for a doctrine. Camus refuses both.
      - text: "Sartre and Camus agreed on every point, so the two names mean the same philosophy."
        feedback: |
          They disagreed about human nature and about the label. Sharing a period and some themes is not sharing a philosophy.
      - text: "Beauvoir held that freedom is won entirely alone, with no need for others."
        feedback: |
          According to Beauvoir's Ethics of Ambiguity (1947), a person's freedom needs the freedom of others, so it cannot be won entirely alone.
    explanation: |
      Layers: who held what is documented. Whether Kierkegaard's faith is a leap, and whether Camus's revolt is an answer or a mood, are live debates.

  - type: mcq
    id: trap-stoic-feelings
    title: "Stoics feel nothing?"
    prompt: |
      A friend says: "To be Stoic is to suppress every emotion and not care about anything." What do the sources say?
    options:
      - text: "According to the Stoics, a passion is an excessive impulse resting on a false value judgment, such as treating money as a real good. They aimed at freedom from such passions (apatheia), not at the suppression of all feeling, and they allowed healthy emotions such as joy and caution."
        correct: true
        feedback: |
          Yes. The Stanford and Internet Encyclopedia entries both say it is wrong to describe the Stoics as aiming at a passionless life. The target is the false judgment, not feeling as such. Some first reactions, such as a start at a loud noise, are not passions at all.
      - text: "The Stoics said health and wealth are worthless and should always be refused."
        feedback: |
          They called them indifferents: neither good nor bad. But some are preferred, and a wise person normally chooses them, though never at the cost of virtue.
      - text: "The Stoics taught that only pleasure is good."
        feedback: |
          That is the Epicurean view. For the Stoics only virtue is good.
      - text: "The Stoics said feelings are caused entirely by events, so nothing can be done about them."
        feedback: |
          The reverse. According to Epictetus, people are disturbed by the judgments they form about things, and the judgment is the part we can change.
    explanation: |
      Layers: the texts and the Stoic definitions are documented. How far the line between what is up to us and what is not holds, and whether the ideal asks too much, is live debate. Whether the universe is ordered by reason, as the Stoics held, is a commitment.

  - type: mcq
    id: trap-stoic-control
    title: "Up to us means giving up?"
    prompt: |
      A critic says: "The dichotomy of control tells you to give up on anything outside your power, so Stoicism is passivity." What is the best reply according to Stoic sources?
    options:
      - text: "The advice is about where to stake your peace, not about when to act. Stoics held that we have duties to others and should act well in our role. Seneca's habit is to plan a journey with the reservation 'unless something interferes', so the effort is full and the outcome is held loosely."
        correct: true
        feedback: |
          Yes. The discipline of action in Epictetus is social and active. Critics can still reply that the line between up to us and not up to us is blurry, and that holding outcomes loosely is hard.
      - text: "Stoics held that effort is pointless because everything is fated."
        feedback: |
          The Stoics were determinists, yet they did not draw passivity from it. The dog-and-cart image says to walk willingly with the cart rather than be dragged, and assent and action remain ours.
      - text: "Stoics held that our body and reputation are fully up to us."
        feedback: |
          According to Epictetus they are not: body, property, reputation and office are outside what is wholly ours.
      - text: "Stoics held that nothing at all is up to us."
        feedback: |
          Our judgments, pursuits, desires and aversions are up to us. The whole teaching rests on that.
    explanation: |
      Layers: the texts are documented. Whether Stoic acceptance amounts to fatalism is live debate. Commitment: whether virtue is the only good.

  - type: mcq
    id: trap-cbt
    title: "Stoicism is therapy?"
    prompt: |
      A magazine says: "Cognitive behavioral therapy is just Stoicism with a clinic." What do the sources support?
    options:
      - text: "Albert Ellis and Aaron Beck cited Stoic thinkers (Epictetus, Marcus Aurelius and others) as forerunners. Commentators note that the technique of examining one's judgments was kept, while the Stoic view of virtue and human nature was not. So the link is real and partial."
        correct: true
        feedback: |
          Yes. Citing a precedent is a fact. Calling CBT 'just' Stoicism is a claim about content, and the Stoic normative picture (virtue as the only good, a rational cosmos) is absent from therapy.
      - text: "CBT was invented by Epictetus, and Beck copied his book."
        feedback: |
          Ellis and Beck cited Stoics as forerunners. They built their own methods and tested them in modern clinical settings.
      - text: "There is no link, and the therapists never read the Stoics."
        feedback: |
          Both named Stoic authors in their writings.
      - text: "CBT keeps the Stoic ethics entirely and drops only the technique."
        feedback: |
          It is the other way round: the technique of examining judgments was kept, the ethics largely not.
    explanation: |
      Layers: the citations are documented (secondary summaries here). How much of CBT is truly Stoic is live debate. Whether virtue is the only good is a commitment.

  - type: mcq
    id: trap-feast
    title: "Epicurean means feasting?"
    prompt: |
      A restaurant calls its tasting menu "the Epicurean experience". What would Epicurus say?
    options:
      - text: "According to the Letter to Menoeceus, pleasure is the end, but he defines it as freedom from bodily pain and mental disturbance, and he says not every pleasure is worth choosing. Sober reasoning, simple fare and friends beat a feast that brings later pain."
        correct: true
        feedback: |
          Yes. The goal he describes is a stable state of calm (katastematic pleasure, ataraxia), often described by what it lacks. Natural but unnecessary desires, such as a fine meal, may be enjoyed but need not be met, and empty ones, such as fame, should be dropped.
      - text: "He would approve: the most pleasure is the best life."
        feedback: |
          He worried that ever-growing desires depend on a painful lack and add agitation. A maximum of pleasure is not his target.
      - text: "He would refuse any pleasure at all, since only virtue is good."
        feedback: |
          That is the Stoic position. He did say pleasure is the good.
      - text: "He would agree, because the Garden held banquets for its members."
        feedback: |
          The sources stress friends, sober reasoning and few needs. Critics did call the school's ethics one for swine, and Epicurus replied that wise pleasure needs prudence, honour and justice.
    explanation: |
      Layers: the Letter to Menoeceus and the doctrine are documented. How the kinetic and the settled pleasures relate is scholarly debate. Whether pleasure is the only good is a commitment.

  - type: mcq
    id: trap-gods
    title: "Epicureans denied the gods?"
    prompt: |
      A student writes: "Epicurus was an atheist: he said the gods do not exist." According to the Stanford Encyclopedia, what is the fairer summary?
    options:
      - text: "Epicurus held that gods exist but are blessed and do not concern themselves with human affairs, since intervening would disturb their blessedness. So there is no divine punishment to fear. Whether this counts as belief in any ordinary sense is debated."
        correct: true
        feedback: |
          Yes. The point of the doctrine is peace of mind: no gods to dread, no afterlife punishment. The nature of these gods is unclear even in the sources, and ancient critics suspected that the gods were a polite fiction.
      - text: "He said the gods exist and reward the virtuous in the afterlife."
        feedback: |
          There is no afterlife in his physics: the soul is made of atoms and does not survive the body.
      - text: "He said the gods created the atoms and steer them."
        feedback: |
          The world is atoms and void, with a random swerve, and the gods take no part in running it.
      - text: "He said the gods are punishing us through disease."
        feedback: |
          That is the fear the remedy is meant to remove.
    explanation: |
      Layers: the ancient reports are documented. Whether Epicurus sincerely believed in gods is scholarly debate. Whether gods exist at all is a commitment.

  - type: mcq
    id: trap-death
    title: "Nagel and the painful death?"
    prompt: |
      Epicurus argued that death is nothing to us. Someone replies: "Nagel answers him by saying that death is painful." Which is accurate?
    options:
      - text: "Nagel's deprivation account says death can be bad because it takes away goods the person would have had. It does not need death to be painful: a painless death can still be bad for the one who dies."
        correct: true
        feedback: |
          Yes. Epicurus assumed that only experienced pleasure and pain count as good or bad. The deprivation account denies that assumption: something can be bad for you by preventing goods, with no bad experience at all. Defenders of Epicurus can reply with the symmetry argument from Lucretius about the time before birth.
      - text: "Nagel agreed with Epicurus that death cannot harm."
        feedback: |
          He disagreed, in 'Death' (1970), for the reason above.
      - text: "Nagel said the dead suffer in the afterlife."
        feedback: |
          His argument is about loss, not about any afterlife.
      - text: "Nagel only said that the fear of death is natural."
        feedback: |
          The claim is about whether death is bad, not about the feeling of fear.
    explanation: |
      Layers: the two arguments are documented. Whether the deprivation account survives the symmetry objection is live debate. Whether death is natural and given, or an evil to defeat, is a commitment (it returns in transhumanism).

  - type: mcq
    id: trap-humanism
    title: "Humanism means atheism?"
    prompt: |
      A reader says: "Humanism has always meant rejecting religion." What do the sources say?
    options:
      - text: "Humanism is a family of views that centre human dignity, reason and responsibility. Renaissance humanists were mostly Christians who wanted to renew Christianity through classical learning, and there are religious humanisms (Christian, Islamic, Humanistic Judaism) beside the secular one."
        correct: true
        feedback: |
          Yes. Historians warn against reading the Renaissance word in its modern secular sense. Secular humanists, such as those in the Humanists International declaration (2022), say morality needs no source outside humanity, and religious humanists put the source of dignity in God. They split there, and agree on much else.
      - text: "Humanism began as an atheist movement in the twentieth century."
        feedback: |
          The studia humanitatis (grammar, rhetoric, history, poetry, moral philosophy) came from the Italian Renaissance, centuries earlier.
      - text: "Humanism says humans are the measure of all things and that no reason can be given for ethics."
        feedback: |
          Humanisms aim at an ethics of human flourishing and give reasons for it.
      - text: "Humanism was invented by Kant."
        feedback: |
          Kant's 1784 essay gave Enlightenment humanism the motto "sapere aude" (in one translation, 'Have courage to use your own reason'), but the tradition is older: the studia humanitatis go back to the Italian Renaissance.
    explanation: |
      Layers: dates, texts and the declarations are documented. Whether Renaissance humanism was secular, and whether 'Islamic humanism' is the right label, is live debate. Whether dignity needs God is a commitment.

  - type: mcq
    id: trap-skeptic
    title: "Skeptics claim to know nothing?"
    prompt: |
      A student says: "A skeptic is someone who claims that nothing can be known." According to the Stanford Encyclopedia on ancient skepticism, what is the fairer picture?
    options:
      - text: "Pyrrhonists suspend judgment (epoché) and keep inquiring; they refuse to assert even that a matter is unknowable. According to Sextus, the Academics hold that things cannot be grasped, which he treats as a negative dogmatism of its own. The ancient schools differ on this."
        correct: true
        feedback: |
          Yes. Saying 'nothing can be known' is itself a claim to know something. Pyrrhonists aim at a calm that comes from suspending judgment (ataraxia). The Stanford entry adds that the contrast is less sharp than it looks, since both describe themselves as inquirers.
      - text: "Skeptics hold that everything is false."
        feedback: |
          Claiming that everything is false is another dogma, and skeptics avoid it.
      - text: "Skeptics were all enemies of philosophy and answered nobody."
        feedback: |
          They argued against Stoic and Epicurean claims in detail. Socrates, honest about what he did not know, is part of the same family of attitude.
      - text: "Skeptics claimed to have the final truth, that no truth exists."
        feedback: |
          That is exactly what Pyrrhonists try not to say.
    explanation: |
      Layers: the schools and their reports are documented. How far Pyrrhonists lacked every belief is live debate. Whether doubt is a relief or a loss is a commitment.

  - type: mcq
    id: trap-apraxia
    title: "Can a skeptic act?"
    prompt: |
      The classical charge is that a skeptic who suspends judgment about everything could not get out of bed. What is the Pyrrhonist reply, according to the sources?
    options:
      - text: "According to Sextus, the skeptic follows appearances as a practical guide, through four things: nature, the compulsion of feelings (thirst, say), custom and tradition, and learned skills. Acting on how things appear is not the same as asserting how they really are."
        correct: true
        feedback: |
          Yes. Thirst drives one to drink without a theory of water. The Academic Arcesilaus had a related answer: act on what is reasonable. Critics still ask whether this leaves any belief at all, and Hume later said extreme Pyrrhonism cannot be kept up in daily life, so he recommended a mitigated skepticism.
      - text: "The skeptic does not act, and says so."
        feedback: |
          The charge is real, but the skeptics' reply is that action does not need assent.
      - text: "The skeptic acts on certain knowledge of the good."
        feedback: |
          That would be a dogmatist. The reply keeps judgment suspended.
      - text: "The skeptic acts at random, with no reason."
        feedback: |
          The four guides above are reasons of a kind, just not claims about ultimate truth.
    explanation: |
      Layers: the charge and the replies are documented. How far this reply works is live debate. Hume's mitigated skepticism (lower confidence, narrow scope) is the lasting form.

  - type: mcq
    id: trap-james-truth
    title: "True because it comforts?"
    prompt: |
      Russell objected that William James's view makes "Santa Claus exists" true for anyone it comforts. Which is the fairer reading of James?
    options:
      - text: "According to the Stanford Encyclopedia, James said that a belief is true when it proves good in the way of belief, for definite assignable reasons. Comfort is one factor, but a belief must also fit the wider range of experience. On this reading the Santa Claus objection is unfair."
        correct: true
        feedback: |
          Yes. A belief that leads to repeated disappointing experiences does not prove good. Whether this saves James from relativism is still debated, and some philosophers think usefulness can never be a mark of truth.
      - text: "James said any belief that works for you is true for you, with no limit."
        feedback: |
          The 'definite assignable reasons' and the fit with wider experience are limits that, according to the Stanford Encyclopedia, the objection leaves out.
      - text: "James said truth is whatever a majority believes."
        feedback: |
          His criterion is practical success in experience, not a vote.
      - text: "James said truth has nothing to do with usefulness."
        feedback: |
          Truth as a species of the good, like health, is central to his Pragmatism (1907).
    explanation: |
      Layers: the quotation and the objection are documented. Whether usefulness can ever be a mark of truth is live debate.

  - type: mcq
    id: trap-will
    title: "Believe what you like?"
    prompt: |
      A reader sums up The Will to Believe (1896): "James says you may believe anything you want if it makes you happy." Which correction fits the essay?
    options:
      - text: "James's claim is narrow. An option must be genuine: live (a real possibility for you), forced (you cannot avoid choosing) and momentous (the stakes are high). Only then, when it cannot be settled on intellectual grounds, may our passional nature decide."
        correct: true
        feedback: |
          Yes. That is nearly his own wording. He later said 'the right to believe' would have been a better title. Critics ask whether religious belief really meets the conditions, and whether the right ends up licensing wishful thinking.
      - text: "James said all beliefs are equal and evidence does not matter."
        feedback: |
          Where evidence can settle the matter, he does not license choosing otherwise. The permission covers only options that evidence cannot decide.
      - text: "James said we must always wait for proof before believing."
        feedback: |
          That is closer to Clifford, the opponent the essay answers. James argues that a forced and momentous option cannot be put off at no cost.
      - text: "James said belief should be chosen by a vote of friends."
        feedback: |
          The essay is about the individual's right under certain conditions, not about majorities.
    explanation: |
      Layers: the essay and its conditions are documented. Whether the conditions hold for religious questions, and whether the argument licenses wishful thinking, is live debate. Commitment: whether such options are open to a rational person at all.

  - type: mcq
    id: trap-transhuman
    title: "Is immortality a product?"
    prompt: |
      A headline says: "Technology has already given us ways to escape death: cryonics and mind uploading." What is the careful reading?
    options:
      - text: "Cryonics (preserving a body at very low temperature in the hope of future revival) has been practised since 1967, when James Bedford was first preserved, but no revival has been demonstrated. Mind uploading does not exist: no copy of a human mind exists, only plans and partial models. Both are hopes, not results."
        correct: true
        feedback: |
          Yes. These items are fact (practice, dates), and the claims of future revival or uploading are speculative. Anti-ageing research aims first at a longer healthspan, not endless life.
      - text: "Cryonics has revived dozens of people and uploading has been done on volunteers."
        feedback: |
          No revival has been demonstrated, and no human mind has been uploaded.
      - text: "Both are impossible in principle, as physics proves."
        feedback: |
          That is also too strong. They are unproved, and critics doubt them, but no proof of impossibility is on offer.
      - text: "Transhumanists claim these already work, so they are lying."
        feedback: |
          Transhumanists present them as aims or bets. Accusing them of lying is a claim of its own, and it is not supported by the sources.
    explanation: |
      Layers: practice since 1967 and the current state of uploading are documented. Whether a future upload would be you (psychological continuity or animalism), and whether endless life would be good, is live debate. Whether death is natural and given, or an evil to defeat, is a commitment.

  - type: mcq
    id: trap-layers
    title: "Sort the layers"
    multiple: true
    prompt: |
      Select every statement that is **established fact** (a documented date, text or practice), not debate or commitment.
    options:
      - text: "Nietzsche's madman announces 'God is dead' in The Gay Science, section 125 (1882)."
        correct: true
        feedback: |
          Yes. A documented text and date. What it means is the debate.
      - text: "Epicurus's surviving letters and the Principal Doctrines are preserved in Diogenes Laertius, Book 10."
        correct: true
        feedback: |
          Yes. A documented fact about the sources.
      - text: "Camus's Myth of Sisyphus appeared in 1942."
        correct: true
        feedback: |
          Yes. The reading of its last line is the debate.
      - text: "Death is nothing to us."
        feedback: |
          This is Epicurus's conclusion, contested by Nagel's deprivation account. A live argument, with a commitment behind it about what makes things bad.
      - text: "Virtue is the only good."
        feedback: |
          The Stoic thesis. A claim about value, open to the Epicurean and Aristotelian replies.
      - text: "Human dignity needs God as its source."
        feedback: |
          A religious humanist's commitment, denied by secular humanists.
    explanation: |
      The sorting is a habit worth keeping: dates, texts and practices are one layer, positions in a live debate are another, and claims about ultimate value or reality are a third. A trap usually slides a claim from one layer into the one above.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      Each trap took a useful idea one step too far: existence-first as true of knives, no human nature as no common ground, "God is dead" as a proof, nihilism as "anything goes", the absurd as a fact about the world alone, the happy Sisyphus as a proof, Camus as an existentialist, Stoicism as numbness or passivity or just therapy, Epicureanism as feasting or atheism, Nagel as a claim about pain, humanism as atheism, skepticism as "nothing can be known", the skeptic as unable to act, pragmatism as "true because it comforts", the will to believe as "believe anything", and transhuman technology as already delivered.

      A quick check for any such claim about a way of life: ask what exactly the source says, which layer the claim belongs to, and what a thoughtful critic on the other side would reply.

      **Next:** Quick Recall, the main ideas and distinctions of this level in a few fast cards.
