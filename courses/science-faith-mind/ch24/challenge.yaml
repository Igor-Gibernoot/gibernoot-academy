id: ch24-challenge
title: "Level Challenge: Choose a Way to Live? Test It"
kind: challenge

cards:
  - type: text
    id: welcome
    title: "Challenge: ten years"
    body: |
      One **invented** case runs through every problem. A person aged 45 is told they have a progressive illness (invented, no real disease) that will limit their health more and more over about ten years. They must decide how to spend those years. The person has savings, a few close friends, and a work they care about. Nothing here is medical advice, and the problems ask what each way of living implies, never which is right.

      - **Problem 1 · Meaning.** Which premise of the nihilism argument does each reply reject?
      - **Problem 2 · Calm.** What would a Stoic, an Epicurean and a Pyrrhonist advise?
      - **Problem 3 · Death.** Epicurus against the deprivation account, and a hypothetical gamble.
      - **Problem 4 · Stance.** Revolt, irony or solidarity.
      - **Problem 5 · The option.** Is the choice genuine, and what may decide it?

      Each thinker is told *according to* their texts. Each problem ends by separating fact, live debate and commitment.

  - type: text
    id: recall
    title: "Toolkit recall"
    body: |
      - **Nihilism.** According to Nietzsche (*The Gay Science*, 1882), the argument runs: P1, the values rested on belief in God; P2, that belief has collapsed; C, the values lose their ground. A believer rejects P2. According to Sartre, a person has no fixed nature and makes meaning by free choice.
      - **Three schools.** According to Epictetus (*Enchiridion*), some things are up to us (opinion, pursuit, desire, aversion, our own actions) and others are not (body, property, reputation). According to Epicurus, good and bad lie in sensation, and calm comes from sorting desires. According to Pyrrhonists, equal opposed arguments lead to *epoché* (suspending judgement) and then *ataraxia* (freedom from worry).
      - **Death.** According to Epicurus (*Letter to Menoeceus*), death is nothing to us: when we are, death is not here, and when death is here, we are not. According to Thomas Nagel ("Death", 1970), the **deprivation account**: death is bad when it takes goods the person would have had.
      - **The absurd.** According to Camus (*The Myth of Sisyphus*, 1942), the absurd is the clash between our demand for meaning and the silence of the world. According to Nagel ("The Absurd"), irony suits it better than heroism or despair. According to Simone de Beauvoir (*The Ethics of Ambiguity*, 1947), freedom is not won alone.
      - **James.** According to William James ("The Will to Believe"), an option is **genuine** when it is live, forced and momentous.

  - type: mcq
    id: hook
    title: "Guess first"
    prompt: |
      An invented person aged 45 learns they have a progressive illness and about ten years of declining health. Six ways of living are on the table: the believer's, Sartre's, the Stoic's, the Epicurean's, the Pyrrhonist's and the transhumanist's. Before any analysis, guess: how much would these six agree on what the person should do?
    options:
      - text: "They would agree on some practical things (value close friends, drop empty worries) but differ sharply on why, and on what to do about death itself."
        correct: true
        feedback: |
          Yes, as the problems will show. Stoics and Epicureans both point toward friendship and calm, yet one builds on virtue and the other on pleasure. The transhumanist treats death as a problem to attack, while Epicurus says it is nothing to us.
      - text: "They would all give the same advice, because all of them care about a good life."
        feedback: |
          They share a topic, not a method. The reasons, and the choices about death, differ a lot.
      - text: "They would have nothing in common, since each rests on a different foundation."
        feedback: |
          Different foundations can still support overlapping advice, such as caring for friends. Overlap in practice with disagreement in reasons is common in ethics.
    explanation: |
      Keep the guess. Each problem takes one question the six ways answer differently.

  # ---------------- Problem 1 ----------------
  - type: order
    id: p1-argument
    title: "Problem 1 · Meaning"
    prompt: |
      **Problem 1.** Nietzsche's diagnosis in *The Gay Science* can be written as an argument. P1 says the values rested on belief in God. P2 says belief in God has collapsed. C says the values lose their ground. Put the argument in order, premises first, then the conclusion.
    steps:
      - "P1: the highest values rested on belief in God."
      - "P2: belief in God has become unbelievable."
      - "C: the values lose their ground (nihilism)."
    hint: |
      The conclusion needs both premises.
    explanation: |
      The form is $\text{P1}\wedge\text{P2}\Rightarrow\text{C}$. The step is valid, so any reply must reject a premise or deny the step.

  - type: mcq
    id: p1-believer
    title: "The believer"
    prompt: |
      The person in the case is a believer. They say: "My life has a meaning because God gave it one, and my illness does not change that." In the argument P1 (the values rested on God), P2 (belief in God has collapsed), C (the values lose their ground), which premise does the person reject?
    options:
      - text: "P2: for the person, belief in God has not collapsed."
        correct: true
        feedback: |
          Yes. A believer keeps P1, since they agree meaning is rooted in God, and denies P2. The argument no longer reaches C for them.
      - text: "P1: the person denies that values rested on God."
        feedback: |
          The believer's reply is the opposite: values do rest on God, which is why the believer feels safe. The weak point they reject is the collapse of belief.
      - text: "The step from P1 and P2 to C: it is invalid."
        feedback: |
          The step is valid. If both premises were true, C would follow. A reply that denies the step is Sartre's kind, taken in the next card.
    explanation: |
      A believer and a nonbeliever read P2 differently. Which of them is right is a commitment, not something the argument itself decides.

  - type: mcq
    id: p1-others
    title: "The nonbeliever"
    prompt: |
      A second invented person, also 45 and ill, is not a believer and accepts P2. They still find the ten years worth living. Which replies from the level let them keep P2 and deny C? Select all that apply.
    multiple: true
    options:
      - text: "Sartre: meaning is made by a free person choosing what to commit to."
        correct: true
        feedback: |
          Yes. Existence comes before essence, so meaning is something a person makes.
      - text: "The naturalist objectivist (Susan Wolf, as the Stanford Encyclopedia summarises): meaning combines being drawn to something with its being worthwhile."
        correct: true
        feedback: |
          Yes. Meaning does not need God, only an object that is both loved and worth loving.
      - text: "The believer: meaning is rooted in God, so P2 fails."
        feedback: |
          The believer rejects P2 instead of keeping it. That is a different reply.
      - text: "The illness itself: it shows that C is true."
        feedback: |
          Illness is not a premise of the argument. It raises the question of death, which Problem 3 takes up, but it does not supply P1, P2 or C.
    explanation: |
      Replies split at a named premise: believers at P2, Sartre and the objectivists at the step to C. The illness belongs to a separate question.

  # ---------------- Problem 2 ----------------
  - type: mcq
    id: p2-stoic
    title: "Problem 2 · Calm"
    prompt: |
      **Problem 2.** A 45-year-old with a progressive illness asks a Stoic for advice. According to Epictetus, some things are up to us (opinion, pursuit, desire, aversion, our own actions) and others are not (body, property, reputation). What would the Stoic say about the course of the illness and about the person's response to it?
    options:
      - text: "The course of the body is not up to the person, but their judgments about it and their actions are, so peace should rest on those."
        correct: true
        feedback: |
          Yes. The body falls in the second group. The person's opinions, desires and actions fall in the first.
      - text: "The person should deny the illness is real, because only virtue is real."
        feedback: |
          Stoics do not deny the illness. They call health an indifferent, which is not the same as unreal: it does not make a life good or bad, and a wise person may still prefer it.
      - text: "Everything about the illness is up to the person if they have enough willpower."
        feedback: |
          The dichotomy says the opposite for the body. Willpower belongs to judgment and action, not to the disease.
    explanation: |
      The Stoic move is to relocate the stakes: not what the illness does, but what the person judges and does about it.

  - type: mcq
    id: p2-epicurean
    title: "The Epicurean"
    prompt: |
      The same person asks an Epicurean. According to Epicurus, desires are natural and necessary (food, shelter), natural but unnecessary (a fine meal) or empty (fame, great wealth), and the best life is freedom from bodily pain and mental disturbance. For the ten years, what would the Epicurean advise?
    options:
      - text: "Meet the necessary desires, keep friendship, enjoy the unnecessary ones without needing them, and drop empty ambitions such as fame."
        correct: true
        feedback: |
          Yes. Calm comes from sorting desires. Epicurus counted friendship among the greatest goods, so the few close friends matter more than a larger career.
      - text: "Chase as many intense pleasures as possible before the illness advances."
        feedback: |
          That is the "feast" reading Epicurus rejected. For him the highest pleasure is a settled state of freedom from pain and worry, and wise pleasure needs prudence.
      - text: "Withdraw from everyone, since pleasure only comes from solitude."
        feedback: |
          Epicurus advised avoiding politics but praised friendship, so the advice keeps the friends.
    explanation: |
      The Epicurean route is to shrink desire toward what is natural and necessary, and to remove the fear of death by argument, which Problem 3 tests.

  - type: mcq
    id: p2-pyrrhonist
    title: "The Pyrrhonist"
    prompt: |
      The person asks a Pyrrhonist, who aims at *ataraxia* (freedom from worry) by *epoché* (suspending judgement when arguments on both sides are equally balanced). The person keeps thinking "this illness is terrible". In essence, what would the Pyrrhonist suggest?
    options:
      - text: "Notice how things appear, suspend judgement on whether they are bad in themselves, and keep acting by appearances such as seeking care."
        correct: true
        feedback: |
          Yes. According to Sextus, a skeptic still follows nature, necessary feelings, custom and learned skills, so seeking care is consistent. What is dropped is the added belief that the illness is really and certainly an evil, which is where the worry grew.
      - text: "Decide firmly that the illness is not an evil, which ends the worry."
        feedback: |
          That is a belief, and a Pyrrhonist has no belief to put in its place. A firm denial is as dogmatic as a firm assertion.
      - text: "Refuse all treatment, since a skeptic cannot act without beliefs."
        feedback: |
          That is the charge of *apraxia*. Sextus answers it: the skeptic acts by appearances and is guided without strong belief.
    explanation: |
      The Pyrrhonist offers calm by holding fewer beliefs, not by holding better ones.

  - type: order
    id: p2-chain
    title: "The Pyrrhonist chain"
    prompt: |
      Put the Pyrrhonist route to calm in order, for a person disturbed by a disagreement they cannot settle.
    steps:
      - "Arguments on both sides of a question carry equal weight."
      - "The person suspends judgement (*epoché*)."
      - "Freedom from worry follows (*ataraxia*)."
    hint: |
      Calm is the outcome of the chain.
    explanation: |
      Equal opposed arguments lead to *epoché* (suspension), and suspension to *ataraxia*. The Stoic and Epicurean routes reach calm by other steps.

  - type: mcq
    id: p2-apatheia
    title: "A trap: apatheia"
    prompt: |
      A friend says: "The Stoic goal *apatheia* means the person with the illness should feel nothing at all about the diagnosis." According to the Stoics, is that right?
    options:
      - text: "No: *apatheia* is freedom from passions, meaning excessive impulses built on false value judgments, and good feelings toward real goods remain."
        correct: true
        feedback: |
          Yes. Treating an indifferent, such as health, as truly bad is a false judgment that fear or distress rest on. The Stoics keep good feelings (*eupatheiai*) toward virtue and friends, and later Stoics allowed involuntary first reactions.
      - text: "Yes: the Stoic sage feels no emotion of any kind."
        feedback: |
          That is the common caricature, from the English word "apathy". The Stoic target is a kind of judgment, not feeling as such.
      - text: "No: Stoics say the person should feel as much distress as possible to prove they care."
        feedback: |
          The Stoics hold that distress rests on a false judgment, so they would not cultivate it.
    explanation: |
      Critics reply that the line between feeling and judgment is blurry. That is a live debate, and whether virtue is the only good is a commitment.

  - type: mcq
    id: p2-differ
    title: "Where the schools differ"
    prompt: |
      Stoics and Epicureans both offer calm to a person facing a hard ten years. On what do they disagree most basically?
    options:
      - text: "What is good: only virtue, according to the Stoics, and pleasure as freedom from pain and worry, according to the Epicureans."
        correct: true
        feedback: |
          Yes. They share the aim of calm and differ on its foundation. This is a commitment about value, not a fact the case can settle.
      - text: "Whether calm matters: Stoics do not care about it."
        feedback: |
          Both care about calm. The Stoic route is by judgment and the Epicurean by sorting desires.
      - text: "Whether friends matter: only Epicureans value them."
        feedback: |
          Stoics also value friends and duties to others, so this does not separate them.
    explanation: |
      A third route, the Pyrrhonist's, shares the goal but asks whether calm needs any beliefs at all.

  # ---------------- Problem 3 ----------------
  - type: mcq
    id: p3-epicurus
    title: "Problem 3 · Death"
    prompt: |
      **Problem 3.** According to Epicurus, good and bad lie in sensation, so death, which ends sensation, is nothing to us: when we are, death is not here, and when death is here, we are not. According to Nagel's deprivation account, death is bad because it removes the goods the life would have had. For the 45-year-old, which pair of statements fits?
    options:
      - text: "Epicurus: being dead is not bad for the person. Nagel: the loss of the years the person would have had is a real harm, even if it causes no pain."
        correct: true
        feedback: |
          Yes. They disagree on whether harm needs experience. The Stanford Encyclopedia notes the argument rests on contestable premises such as hedonism.
      - text: "Both say death is bad, and they differ only on how soon it comes."
        feedback: |
          Epicurus denies that death is bad at all, since there is no one left to be harmed.
      - text: "Both say death is nothing, and differ on what the gods do."
        feedback: |
          Nagel says death can harm by deprivation, so he does not say it is nothing. The gods are not the point here.
    explanation: |
      Neither view decides the case by itself. Each changes how much a long life is worth, which the next card turns into numbers.

  - type: widget
    id: p3-widget
    widget: decision-matrix
    config:
      actions: ["Pay for the gamble", "Live the ten years fully"]
      states: ["The gamble works", "The gamble fails"]
      payoffs: [[400, 60], [100, 100]]
      probs: [0.1, 0.9]
      threshold: true
      labels:
        corner: "Act / State"
      presets:
        - { label: "Revival worth a lot", payoffs: [[400, 60], [100, 100]] }
        - { label: "Deprivation, huge loss", payoffs: [[1000, 60], [100, 100]] }
        - { label: "Revival adds nothing", payoffs: [[60, 60], [100, 100]] }
    body: |
      A **hypothetical** gamble, since no person has been revived after cryopreservation (according to reports on the first case, from 1967, and the Society for Cryobiology, which says the knowledge to revive whole mammals does not exist). The person could pay a clinic for a procedure that might one day bring them back, at the price of a poorer ten years. Payoffs are invented points for the value of the whole outcome. Paying and failing leaves $60$; living the years fully gives $100$ either way. Drag the chance of success, read the break-even chance, and try the three presets.

  - type: numeric
    id: p3-threshold
    title: "How much chance is enough?"
    prompt: |
      A hypothetical gamble costs a person some quality of their last ten years. If it works the outcome is worth $400$ points, if it fails $60$. Living the ten years fully is worth $100$ points whatever happens. At what chance $p$ of success are the two options equal in expected value? Give a decimal.
    answer: 0.1176
    tolerance: 0.003
    answerText: '40/340 ≈ 0.118'
    wrong:
      - { value: 0.4, feedback: 'That is $40/100$, which compares the loss to the sure value. The gain from success is $400-100=300$ and the loss from failure is $100-60=40$, so the break-even is $40/(300+40)$.' }
      - { value: 0.1, feedback: 'That is the starting slider, not the break-even. Compute $p\times400+(1-p)\times60=100$.' }
      - { value: 0.5, feedback: 'That would hold only if the gain and the loss were equal. Here the gain is much larger, so far less than one half is enough.' }
    hint: |
      Set $400p+60(1-p)=100$ and solve for $p$.
    explanation: |
      $400p+60-60p=100$, so $340p=40$ and $p\approx0.118$. Equivalently $p^*=c/(G+c)$ with $G=300$ and $c=40$. Whether a real chance of that size exists is a fact question, and so far no revival has been shown.

  - type: mcq
    id: p3-imply
    title: "What each view implies"
    prompt: |
      In the hypothetical gamble, paying costs quality now and might buy a revival. Which statement links each view of death to the numbers? On the first, a revival adds no value because being dead is not bad. On the second, a revival avoids a very large loss.
    options:
      - text: "Epicurus's view sets the payoff of revival near the same as failing, so no chance makes the gamble worth its cost. The deprivation account raises the payoff, so a small chance can be enough."
        correct: true
        feedback: |
          Yes, in essence. The gamble's value depends on what is lost by dying, and the two views give opposite answers. Neither one supplies the probability.
      - text: "Both views make the gamble worth it at any chance above zero."
        feedback: |
          Only a payoff that is large enough justifies a small chance. Under Epicurus's view the payoff does not rise.
      - text: "The deprivation account proves the gamble will work."
        feedback: |
          It speaks to how bad dying is, not to whether revival is possible. That is a question of fact.
    explanation: |
      The valuation is a philosophical commitment, and the chance is an empirical fact. A choice needs both.

  - type: mcq
    id: p3-layers
    title: "Fact or commitment?"
    prompt: |
      Sort three claims in the case. Which one is a **layer-1** claim, an established fact?
    options:
      - text: "No person has been revived after cryopreservation."
        correct: true
        feedback: |
          Yes, according to reports on the first cryonic preservation (1967) and the Society for Cryobiology, which says the knowledge needed to revive whole mammals does not exist. Mainstream science treats cryonics revival as speculative.
      - text: "Death is a loss to the person who dies."
        feedback: |
          This is the contested question between Epicurus and the deprivation account, a live debate resting on a commitment about what is good.
      - text: "Death is nothing to the one who dies."
        feedback: |
          Same dispute from the other side. A view about what harm is, not a fact.
    explanation: |
      Keeping these layers apart stops a fact about technology from being argued as if it were a view about value, and the reverse.

  # ---------------- Problem 4 ----------------
  - type: mcq
    id: p4-camus
    title: "Problem 4 · Stance"
    prompt: |
      **Problem 4.** According to Camus (*The Myth of Sisyphus*), the absurd is the clash between our demand for meaning and the silence of the world, and he rejects suicide and the leap to a meaning beyond reason. For the 45-year-old, which behaviour fits his answer?
    options:
      - text: "Live the ten years lucidly, facing the clash without a comforting doctrine, and with as much passion as possible."
        correct: true
        feedback: |
          Yes. Camus names revolt, freedom and passion as the consequences (the wording is from secondary summaries of the essay), and ends with Sisyphus imagined happy.
      - text: "End the years early, so the clash stops."
        feedback: |
          Camus rejects physical suicide because it removes one side of the clash instead of facing it.
      - text: "Adopt a doctrine that promises a final answer, so the silence does not matter."
        feedback: |
          Camus calls this philosophical suicide: it escapes the clash by giving up lucid thought. A believer replies that faith is not an escape, which is the reading of Kierkegaard's defenders.
    explanation: |
      Whether lucid revolt is a real answer or a mood is a live debate. The reconstruction needs a bridge premise from lucid to happy.

  - type: mcq
    id: p4-nagel
    title: "Irony"
    prompt: |
      According to Thomas Nagel ("The Absurd"), we can meet an absurd life with irony instead of heroism or despair (this wording comes from secondary summaries of the essay). The person in the case thinks: "My illness makes the ten years feel like Sisyphus's rock." Which reply is in Nagel's spirit?
    options:
      - text: "Take the life seriously and also see that this seriousness could be doubted, and let that second thought be ironic, not a battle."
        correct: true
        feedback: |
          Yes. For Nagel the absurd arises from the clash between how seriously we take our lives and our ability to step back and doubt it. Irony accepts the clash without making a heroic project of it.
      - text: "Defy the silence of the universe with a fixed purpose."
        feedback: |
          That is closer to the heroic revolt Nagel finds too grand.
      - text: "Conclude that nothing matters and stop caring."
        feedback: |
          That is the despair Nagel also sets aside.
    explanation: |
      Camus and Nagel agree on a clash and differ on tone: lucid defiance or ironic acceptance.

  - type: mcq
    id: p4-beauvoir
    title: "Solidarity"
    prompt: |
      Suppose the person spends part of the ten years helping others with the same illness gain access to care. Which thinker's principle best supports this as a way of living?
    options:
      - text: "Beauvoir: a person cannot affirm and live their freedom without also affirming the freedom of others."
        correct: true
        feedback: |
          Yes, in *The Ethics of Ambiguity* (1947), as summarised by the Stanford Encyclopedia and the Internet Encyclopedia of Philosophy. Freedom is tied to others', so acting with them counts as part of living freely.
      - text: "Epicurus: avoid public life where possible."
        feedback: |
          Epicurus did praise friendship but advised avoiding politics. This one does not point to a campaign.
      - text: "Pyrrho: suspend judgement on whether helping is good."
        feedback: |
          A Pyrrhonist may help by following custom and appearances, but suspension is not a reason to act for others.
    explanation: |
      Revolt, irony and solidarity are three stances toward the same clash. Choosing among them is a matter of weight and temperament, not of fact.

  - type: mcq
    id: p4-believer
    title: "The believer's rejection"
    prompt: |
      Camus's reconstruction begins with P1: the absurd holds, because the world is silent and gives no meaning we can find. A believer reads the same life differently. Which premise do they reject, and why?
    options:
      - text: "P1: for the believer the silence of the world is not final, so there is no unanswered demand."
        correct: true
        feedback: |
          Yes. The believer reads the same silence as not final. Whether it is final is a commitment, not a conclusion evidence forces.
      - text: "P4: lucid life cannot be revolt because the believer feels no emotion."
        feedback: |
          Belief does not remove feeling. The believer's point is about the first premise, not about emotion.
      - text: "The validity of the argument: it contains a calculation error."
        feedback: |
          The criticism is about a premise, not logic. A believer can accept that the argument is valid and still deny P1.
    explanation: |
      A reader of Kierkegaard adds a second reply: faith can be a passion, not an escape from lucid thought.

  # ---------------- Problem 5 ----------------
  - type: mcq
    id: p5-live
    title: "Problem 5 · The option"
    prompt: |
      **Problem 5.** According to James ("The Will to Believe"), an option is **live** when it is a real possibility to the person, **forced** when there is no neutral choice, and **momentous** when the stakes are high. A 45-year-old with a progressive illness is offered a hypothetical gamble on future revival. They find the idea absurd and give it no chance. Which condition fails for them?
    options:
      - text: "Live: the option is not a real possibility for them, so it is not genuine."
        correct: true
        feedback: |
          Yes. Liveness depends on the person. For someone who finds it incredible, the option is dead and James's argument has no work to do. For a person who finds revival possible, it may be live.
      - text: "Forced: the person can avoid deciding."
        feedback: |
          Declining is itself a choice here, because the money is spent or not. The forced condition holds.
      - text: "Momentous: the stakes are low."
        feedback: |
          The stakes are high: the money and the last years.
    explanation: |
      James's test is about the person, not the world, so two people can face different options.

  - type: mcq
    id: p5-genuine
    title: "Forced and momentous"
    prompt: |
      A 45-year-old with a progressive illness must decide how to spend ten years: continue demanding work, spend time with friends, or travel. They may delay, but the years pass either way, and the choice cannot be undone. Which of James's conditions does this show? Select all that apply.
    multiple: true
    options:
      - text: "Forced: not choosing is itself a way of spending the years."
        correct: true
        feedback: |
          Yes. There is no standing place outside the alternatives.
      - text: "Momentous: the stakes are high and the years cannot be recovered."
        correct: true
        feedback: |
          Yes. The opportunity is unique and not easily reversed.
      - text: "Avoidable: the person can stay out of the choice."
        feedback: |
          An avoidable option is one you can decline without cost, such as whether to carry an umbrella by staying inside. Here declining spends the years too.
    explanation: |
      Whether the choice is also live depends on which options the person finds real: for someone who finds revival incredible, a gamble on it is a dead option.

  - type: mcq
    id: p5-passional
    title: "What may decide?"
    prompt: |
      According to James, our passional nature may decide an option that is genuine and cannot by its nature be decided on intellectual grounds. In the case, the person must decide how likely their illness is to progress as predicted, and also whether a life of ten more years is worth living in the way they choose. For which question does James's permission apply?
    options:
      - text: "The second: the worth of a way of living is not settled by evidence, while the prognosis can be improved by evidence and should be."
        correct: true
        feedback: |
          Yes. James's permission is limited to genuine options that evidence cannot settle. The medical facts are not in that class.
      - text: "The first: the person may hope the prognosis is better because hope feels good."
        feedback: |
          That is wishful thinking, the misuse of James that critics worry about. Evidence can bear on the prognosis, so the permission does not apply.
      - text: "Both: passion may decide anything under James's view."
        feedback: |
          James restricts the permission to genuine options that intellect cannot decide. He does not license belief against evidence on factual questions.
    explanation: |
      Whether James's line is drawn well is a live debate. Applied to the case it separates the facts to be checked from the values to be chosen.

  # ---------------- Closing ----------------
  - type: mcq
    id: close-part
    title: "Closing weighing"
    prompt: |
      Across the case, thoughtful people part ways at several points. Which of these is a **layer-3** claim (a commitment that the cases cannot settle)?
    options:
      - text: "The silence of the world is final, so no ultimate meaning exists."
        correct: true
        feedback: |
          Yes. A believer and a nonbeliever read the same silence differently, and nothing in the case forces either reading.
      - text: "Epictetus's *Enchiridion* distinguishes what is up to us from what is not."
        feedback: |
          That is layer 1, what a text says.
      - text: "Philosophers disagree on whether Epicurus's argument about death works."
        feedback: |
          That is layer 2, a report of a live debate.
    explanation: |
      The level does not say which way to live is best. It shows where the disagreement sits: in facts (revival is unproven), in live debates (does the death argument work, revolt or irony) and in commitments (is the silence final, is death a loss).

  - type: text
    id: summary
    title: "What you now own"
    body: |
      The method: take one hard case, ask which way of living answers each part, name the premise or value on which each answer rests, and sort the claims into fact, live debate and commitment.

      Tools used. The nihilism argument, with P1 (the values rested on God), P2 (belief in God has collapsed) and C (the values lose their ground):
      $$\text{P1} \wedge \text{P2} \Rightarrow \text{C}.$$
      A believer rejects P2, Sartre denies the step to C. Calm by three routes: Stoics judge only what is up to us (*apatheia* is freedom from passions, not from all feeling), Epicureans sort desires, Pyrrhonists move from equal opposed arguments to *epoché* to *ataraxia*. Death: Epicurus says it is nothing to us, Nagel's deprivation account says it takes the goods the life would have had. A gamble that costs $c$ and pays $G$ more if it works is worth taking when its chance exceeds
      $$p^*=\frac{c}{G+c}.$$
      Stances: Camus's revolt, Nagel's irony, Beauvoir's solidarity. James's genuine option:
      $$\text{live} \wedge \text{forced} \wedge \text{momentous}.$$

      What stays open: whether the silence of the world is final, whether death is a loss, whether revolt or irony is the better stance, and where James's line between values and facts falls.

      **Next:** Level 25 asks what makes a life meaningful, where ethics comes from, and how traditions and philosophers face death.
