id: ch24-essence
title: "Essence and Existence"
kind: concept
own: |
  The setting: a thing (a knife, a person) can be asked two questions, *what is it* (its **essence**: what makes it the kind of thing it is) and *that it is* (its **existence**: that there actually is one). Thinkers differ on which comes first for a human being, and each position is told *according to* its source.
  - **Things that are made.** According to Sartre's lecture *Existentialism Is a Humanism* (given in late 1945 according to the Stanford Encyclopedia, dated 1946 in some editions), a paper-knife is made by an artisan who first has a conception of it and a purpose for it. Its essence comes before its existence:
  $$\text{essence} \to \text{existence}.$$
  - **Aristotle (384-322 BCE).** According to the *Nicomachean Ethics*, every kind of thing with a job has a function (*ergon*), and a good one does it well. For humans he identifies the function as {{ an activity of the soul that follows or implies a rational principle }}. An **essential** property belongs to a thing as the kind of thing it is (rational, for a human); an **accidental** one it could lose and stay itself (being pale or musical).
  - **Aquinas (c. 1225-1274).** According to *On Being and Essence*, in every creature the essence (what it is) and the act of existing (*esse*) are distinct: one can grasp what a human is without yet knowing whether any human exists. In God alone, he held, {{ essence and existence are the same }}. For Aquinas the human essence is given, because God conceives it.
  - **Sartre (1905-1980).** For a human being there is no such conception, so, according to the lecture, the order is reversed:
  $$\text{existence} \to \text{essence}.$$
  A person first exists, then defines herself by what she makes of herself. Hence {{ "there is no human nature, because there is no God to have a conception of it" }}, and each person is "condemned to be free" and responsible for what she does.
  - **Nature versus condition.** Sartre denies a human nature but affirms a universal human *condition*: being born, working, dying, living among others. According to the lecture, this universality is not given but "perpetually made".
  - **Where thoughtful people part ways.** Fact: who wrote what. Live debate: whether biology (population variation) or the human sciences still allow a "human nature" in some form. Commitment: whether a creator conceives us, which is exactly where Aquinas and Sartre split; both agree about the knife.

cards:
  - type: text
    id: hook
    title: "What is a knife for? What is a person for?"
    body: |
      Hold a paper-knife. Ask what it is for, and the answer is immediate: it is for slitting envelopes. Someone made it for that, and someone had a picture of it in mind before any metal was cut.

      Now ask the same of yourself. What are you for? The question sounds odd, and it is worth noticing why. Either it sounds odd because nothing made you for anything, or because the answer is real and hard to see.

      This lesson follows three thinkers who answered differently, each by his own premises: Aristotle, Aquinas and Sartre. The lesson does not say who is right. It shows where they part ways, and why.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Before any theory: which order seems right for a paper-knife, and for a human being? (*Essence* here means what a thing is, its definition. *Existence* means that there actually is one.)
    options:
      - text: "Knife: its essence comes first (the maker's idea), then the knife. Human: the same order, since a person must also have a purpose."
        feedback: |
          This is one coherent position, held by Aristotle and Aquinas in their own ways. It is not the only one, and it is exactly what the lesson tests.
      - text: "Knife: its essence comes first. Human: a person exists first and defines himself afterwards."
        feedback: |
          This is Sartre's position in his lecture. It is also one coherent answer, and the lesson asks which premise it rests on.
      - text: "Neither can be settled by guessing; each answer rests on a premise that can be named and examined."
        correct: true
        feedback: |
          Yes, and that is the method of the lesson. The first two options are real positions held by serious thinkers; the point is to see which premise each one needs.
    explanation: |
      Layer: the positions are fact about the history of philosophy; which one is true is live debate, and it depends on commitments about whether anyone conceives human beings in advance.

  - type: text
    id: aristotle
    title: "Aristotle: form, essence, function"
    image:
      src: img/aristotle.webp
      alt: "Marble portrait bust of Aristotle, a bearded man with a furrowed brow"
      caption: "Aristotle (384-322 BCE), whose *Nicomachean Ethics* asks what the good life is by first asking what a human being is."
      credit: "After Lysippos, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Aristotle_Altemps_Inv8575.jpg"
    body: |
      According to the *Stanford Encyclopedia of Philosophy*, Aristotle calls the **form** of a thing its essence: what it is in itself, not the stuff it is made of. A human being is a compound of matter (flesh and bone) and form, and the form of a human is always found in flesh and bones.

      His ethics uses this. In the *Nicomachean Ethics* (Book I, chapter 7, Ross's translation) he notes that a flute-player, a sculptor and every craftsman has a **function** (Greek *ergon*, "characteristic work"), and so do the parts of the body: eye, hand, foot. He asks whether a human being as such has one. His answer is an activity of the soul that follows or implies a rational principle. A good flute-player plays well; a good human, he argues, uses reason well over a whole life.

      Notice the move. From *what a human is* (a rational living thing) he derives *what a good human life is*. A given nature supports an ethics.

  - type: order
    id: ergon-order
    title: "The function argument"
    prompt: |
      According to Aristotle's function argument in the *Nicomachean Ethics*, put the reasoning in order.
    steps:
      - "A flute-player, a sculptor, and each part of the body (eye, hand, foot) has a function, and doing it well is its good."
      - "It would be odd if a human being as such had no function."
      - "What is peculiar to humans, compared with plants and animals, is a rational principle in the soul."
      - "So the human function is activity of the soul that follows or implies a rational principle, and the good human life is doing this well."
    hint: "It goes from familiar cases, to the question about humans, to what is peculiar to humans, to the conclusion."
    explanation: |
      The argument moves from examples to a claim about humans. A critic can reject the second step (why should a kind of thing have a function at all, unless something designed it?). This is the premise Sartre rejects for humans.

  - type: mcq
    id: accident
    title: "Essential or accidental?"
    prompt: |
      According to Aristotle, a property is **essential** if it belongs to a thing as the kind of thing it is, and **accidental** if the thing could lose it and remain itself. (The *Stanford Encyclopedia* uses pallor in a man as an accidental property.) Socrates is pale in summer and tanned in autumn. Which pair is classified correctly?
    options:
      - text: "Being pale is accidental; being rational is essential to a human, on Aristotle's account."
        correct: true
        feedback: |
          Yes. Skin tone changes while Socrates remains Socrates. Rationality, on Aristotle's account, is what makes a human a human.
      - text: "Being pale is essential, because Socrates had it when he was observed."
        feedback: |
          Having a property at a moment does not make it essential. The test is whether he could lose it and still be the same kind of thing.
      - text: "Nothing is essential; all properties are accidental."
        feedback: |
          That is a position some modern thinkers take, but it is not Aristotle's. For him the essence is the form that makes a thing what it is.
    explanation: |
      The essence/accident test is what lets a human nature be more than a list of facts about a population.

  - type: text
    id: aquinas
    title: "Aquinas: essence and existence come apart"
    body: |
      Thomas Aquinas (c. 1225-1274), a Christian theologian, took over Aristotle's vocabulary. According to the *Stanford Encyclopedia*, he calls a human being "the rational animal" among the kinds of creature. He added a new question. Besides *what* a thing is (its essence), there is *that* it is (its act of existing, Latin *esse*).

      In *On Being and Essence* he argues, in essence, that you can understand what a human is, or what a phoenix is, without yet knowing whether any such thing exists. If knowing the essence did not tell you about existence, the two are distinct. This holds, he says, for every creature. Only in God, who is not a creature, are essence and existence the same: according to Aquinas, God's perfect simplicity excludes any composition of the two.

      For Aquinas, then, a human nature is given. God conceives it, so human essence precedes human existence, just as for the paper-knife. Scholars still debate where exactly in the text he establishes the distinction, and whether it rests on philosophy or on theology.

  - type: mcq
    id: aquinas-q
    title: "What the distinction shows"
    prompt: |
      According to Aquinas in *On Being and Essence*, why are essence and existence distinct in a creature?
    options:
      - text: "Because one can grasp what a human is (its essence) without that grasp telling one whether any human exists."
        correct: true
        feedback: |
          Yes. If the definition contained existence, defining a thing would prove it exists, which is not so for a phoenix.
      - text: "Because humans are not made of matter."
        feedback: |
          Aquinas holds the opposite: a human is a compound of matter and form. The distinction is about essence and existing, not about matter.
      - text: "Because God is not real in the same sense as a creature."
        feedback: |
          Aquinas says the reverse: God is the one being whose essence just is existence. The distinction is about creatures.
    explanation: |
      Layer: what Aquinas argued is fact (about the text); whether the argument works, and whether God's essence is existence, is a commitment and a live debate.

  - type: text
    id: objection
    title: "An objection to a given human nature"
    body: |
      Humans differ widely in culture, body, temperament and belief. If everyone is different, what could a shared essence be? A frequently cited biological version comes from the evolutionary biologist Ernst Mayr (1904-2005). He contrasted **typological thinking**, which treats each species as defined by a fixed type or essence, with **population thinking**, which treats a species as a varying population. Historians of biology dispute how fair Mayr's picture of the earlier tradition is, and some philosophers argue that typological methods still have benefits in biology.

      A defender of a given nature has a reply. Aristotle and Aquinas did not claim that all humans are alike in every trait. Essential properties are few (reason, on their account), and everything else, including skin, temperament and culture, is accidental. On this view variation is no objection, because it lives in the accidents.

  - type: mcq
    id: objection-q
    title: "Does variation refute a nature?"
    prompt: |
      A critic says: "Humans vary in height, culture and belief, so there is no human nature." According to the reply above, what is the most direct answer from a defender of Aristotle's view?
    options:
      - text: "Variation in accidental traits is compatible with a shared essential trait such as reason; the critic must show that the essential trait itself varies."
        correct: true
        feedback: |
          Yes. The reply separates what differs (accidents) from what defines the kind (essence). The live question then becomes whether any trait is both universal and defining.
      - text: "Humans do not really vary; the differences are illusions."
        feedback: |
          Nobody in this debate says that. The reply accepts variation and places it in accidents.
      - text: "Variation proves that humans were designed individually."
        feedback: |
          That is a different claim, and not one that Aristotle or Aquinas makes from variation.
    explanation: |
      Layer: that humans vary is established fact. Whether a defining shared trait exists is live debate (biology, anthropology, philosophy), and which answer one prefers also depends on commitments.

  - type: text
    id: sartre
    title: "Sartre: existence precedes essence"
    image:
      src: img/sartre.webp
      alt: "Photograph of Jean-Paul Sartre in 1967, an older man with round glasses"
      caption: "Jean-Paul Sartre (1905-1980), photographed in Venice in 1967; his lecture Existentialism Is a Humanism helped make 'existentialism' a household word."
      credit: "User:T1980, CC BY 3.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Jean_Paul_Sartre_1967_(enhanced).jpg"
    body: |
      Jean-Paul Sartre (1905-1980) gave the lecture *Existentialism Is a Humanism* in Paris towards the end of 1945; it was published in French in 1946. Its argument starts from the knife.

      A paper-knife, he says, is made by an artisan who had a conception of it and a technique of production, and who knew what it was for. So its essence, the formulae and qualities that make it producible and give it its purpose, comes before its existence. Traditional religious views, Sartre says, picture God as a supernal artisan who conceives man in the same way, so human essence precedes human existence as well.

      Sartre is an atheist here. If there is no God, there is no one to have conceived us. Then at least one being has existence before essence: a being that exists before any conception of it. He writes that this being is man.

      > "man first of all exists, encounters himself, surges up in the world – and defines himself afterwards."

      Hence the slogan **existence precedes essence**, and the conclusion that "there is no human nature, because there is no God to have a conception of it." (Philip Mairet's English translation.)

  - type: mcq
    id: sartre-q
    title: "The knife and the person"
    prompt: |
      According to Sartre's lecture, what is the difference between the paper-knife and a human being?
    options:
      - text: "The knife is conceived by an artisan before it exists, so its essence comes first; no one conceives a human in advance, so a human exists first and defines himself afterwards."
        correct: true
        feedback: |
          Yes. The contrast is the order of essence and existence, and it depends on the premise that no one conceives us.
      - text: "The knife has a purpose and a human is useless."
        feedback: |
          Sartre does not call humans useless. He says a human has no purpose assigned in advance, and so makes his own.
      - text: "The knife exists and a human does not."
        feedback: |
          Sartre is not denying that humans exist. He is saying what comes first: the fact of existing, or a defining conception.
    explanation: |
      The whole contrast rests on one premise: that a conception of the human, if it exists, must come from a conceiver.

  - type: mcq
    id: premise
    title: "Which premise would a critic reject?"
    prompt: |
      Sartre's reasoning can be set out as: P1, an essence given in advance needs a conceiver (as the knife needs an artisan). P2, there is no God to conceive humans. C, so humans have no given essence. A critic wants to resist C. Which replies are available? Select all that apply.
    multiple: true
    options:
      - text: "Reject P2: according to Aquinas and other theists, there is a God who conceives human nature."
        correct: true
        feedback: |
          Yes. This is the reply from faith, and it keeps P1 and the validity. It rests on a metaphysical commitment, not on a neutral fact.
      - text: "Reject P1: according to some naturalists, a stable kind can arise from evolution with no conceiver, so a shared nature is not a designed essence."
        correct: true
        feedback: |
          Yes. This reply keeps P2 and denies that a conceiver is needed. Whether the result deserves the word "essence" is itself debated.
      - text: "Reject the validity: P1 and P2 together cannot lead to C."
        feedback: |
          The step is valid. If a given essence needs a conceiver and there is none, there is no given essence. A critic must attack a premise, not the logic.
    explanation: |
      The validity check is separate from the truth check. The argument is valid; its soundness turns on P1 and P2, and a thoughtful person can reject either one for a stated reason.

  - type: mcq
    id: agree-split
    title: "Where they agree and where they split"
    prompt: |
      Which statements about Aquinas and Sartre are correct? Select all that apply.
    multiple: true
    options:
      - text: "Both agree that a made knife has its essence (its conception) before it exists."
        correct: true
        feedback: |
          Yes. The knife is common ground.
      - text: "They split on whether a human being is conceived in advance by anyone."
        correct: true
        feedback: |
          Yes. Aquinas says God conceives human nature; Sartre, who assumes no God, says no one does.
      - text: "Sartre denies that humans exist, and Aquinas affirms it."
        feedback: |
          Both affirm that humans exist. The disagreement is about whether there is a given essence.
      - text: "Aquinas denies that humans differ from one another."
        feedback: |
          Aquinas places individual differences in what is accidental, not in the essence; he does not deny them.
    explanation: |
      Layer: both positions are documented fact. Which premise about God one holds is a commitment.

  - type: text
    id: freedom
    title: "Freedom and responsibility"
    body: |
      If there is no given nature, what follows? According to the lecture, a person "is nothing else but that which he makes of himself". Sartre says this is a source of freedom and of weight. Man is "condemned to be free", he writes: condemned because he did not create himself, yet free, and responsible for everything he does once he is thrown into the world. No human nature and no God's commands can serve as an excuse.

      He also says there is a **human universality of condition**: being born, working, living among others, dying. Historical situations vary, but a purpose chosen in one age can be understood in another. Universality, he says, is "not something given; it is being perpetually made".

      In *Being and Nothingness* (1943) Sartre called one way to dodge this freedom **bad faith** (French *mauvaise foi*): a kind of self-deception. According to the *Stanford Encyclopedia*, it arises when a person affirms only one side of what he is, either only his given facts or only his freedom. Someone who says "I can't help it; it is just my nature" about a choice is, on Sartre's view, hiding from freedom.

  - type: mcq
    id: nature-condition
    title: "A common misreading"
    prompt: |
      A student says: "If Sartre denies human nature, he must say that humans have nothing in common and can understand no one else." According to the lecture, is that right?
    options:
      - text: "No. He denies a universal essence but affirms a universal human condition, and says any purpose can be understood by others."
        correct: true
        feedback: |
          Yes. Condition (being born, working, living among others, dying) is shared. What he denies is a defining nature fixed in advance.
      - text: "Yes. Sartre says all values are private and cannot be shared."
        feedback: |
          He says the opposite: in choosing for himself a person in a sense chooses for all, and any purpose can be understood by other people.
      - text: "Yes. Sartre says humans are all identical."
        feedback: |
          Sartre denies a fixed essence and stresses that each person makes himself; he does not say people are identical.
    explanation: |
      The distinction between nature (given, defining) and condition (shared limits of situation) is the one many readers miss.

  - type: text
    id: replies
    title: "How different readers reply"
    body: |
      A **believer** in the Thomist tradition can accept Sartre's logic and reject his second premise: God does conceive human nature, so there is a given essence, and an ethics built on it, called natural law. According to the *Stanford Encyclopedia*, Aquinas treats the basic goods that human reason grasps as "the outline of human nature".

      A **naturalist** (someone who holds that nature is all there is) has two paths. One accepts Sartre's lesson that no designer fixes our purpose, and says humans find or make their own. The other holds that biology gives us a shared structure (capacities for language, reasoning, bonding) that is real without a conceiver. Whether that structure counts as a "nature" in Aristotle's sense, or only as a statistical regularity in a varying population, is open.

      Each side can claim to have taken the facts seriously. They part ways on a premise, not on data.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Sort this claim: "Humans have a given nature because God conceives them." Which layer is it?
    options:
      - text: "A faith or metaphysical commitment: it depends on a premise about God that evidence in the lesson does not settle."
        correct: true
        feedback: |
          Yes. It is the premise P2 above, denied by Sartre and affirmed by Aquinas. Neither side presents it as a neutral datum.
      - text: "Established fact, since Aquinas wrote it."
        feedback: |
          That Aquinas wrote it is fact. That it is true is another matter and sits in the commitment layer.
      - text: "Scholarly consensus, since philosophers agree."
        feedback: |
          Philosophers do not agree; the question divides believers, atheists and agnostics.
    explanation: |
      Keeping the layers apart lets each reader judge the argument by their own standards: who said what (fact), whether the reasoning holds (debate), and what one takes on faith (commitment).

  - type: text
    id: summary
    body: |
      **Next:** Sartre rested his view on the claim that there is no God. What if the claim goes further, and says life has no meaning at all? The next lesson follows Nietzsche's "God is dead" and the worry called nihilism.
