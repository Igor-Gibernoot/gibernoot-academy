outroTitle: Level 24 in one picture
outro: |
  Nihilism asks what is left when ultimate meaning is doubted. Replies part at named premises: the believer rejects P2, Sartre says meaning is made, Camus lives inside the clash, and Beauvoir and Nagel refine his step. The ancient schools offer calm by three routes (sorting desires, judging only what is up to us, suspending judgement), and the question of death splits Epicurus from the deprivation account that underlies the transhumanist programme. Where thoughtful people part ways: whether P2 holds, whether the silence of the world is final, and whether death is a given or an evil to defeat. This level does not say which way to live is best.
