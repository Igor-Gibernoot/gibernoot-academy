id: ch24-map
title: "Content Map: Choose a Way to Live?"
kind: map
name: Level 24, Choose a Way to Live? (nihilism, existentialism, the absurd, Stoicism, Epicureanism, skepticism, humanism, pragmatism, transhumanism)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the level on meaning and ways to live, from memory, one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (two schools swapped, a thinker given the rival's answer, a route to calm turned around), and every wrong pick comes with a reason.

  Everything is taught according to the thinkers named in each box; which way to live is better is left open. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: nihilism
    title: Nihilism
    row: 1
    col: 2
    body: |
      **Nihilism** is the worry that nothing has ultimate value. It has separate kinds: **existential** (no objective meaning in life), **moral** (no moral facts), **epistemological** (no knowledge) and **political**. In *The Gay Science* (1882), **Nietzsche** has a madman announce that God is dead, meaning that **belief in the Christian God has become unbelievable**. With P1 = the values rested on God and P2 = that belief has collapsed, the conclusion C is that the **values lose their ground**.
    decoys:
      - body: |
          **Nihilism** is the worry that nothing has ultimate value. It has separate kinds: **existential** (no moral facts), **moral** (no objective meaning in life), **epistemological** (no knowledge) and **political**. In *The Gay Science* (1882), **Nietzsche** has a madman announce that God is dead, meaning that **belief in the Christian God has become unbelievable**. With P1 = the values rested on God and P2 = that belief has collapsed, the conclusion C is that the **values lose their ground**.
        feedback: |
          Two kinds are swapped. Existential nihilism says life has no objective meaning or purpose; moral nihilism says there are no moral facts. One can hold either without the other.
      - body: |
          **Nihilism** is the worry that nothing has ultimate value. It has separate kinds: **existential** (no objective meaning in life), **moral** (no moral facts), **epistemological** (no knowledge) and **political**. In *The Gay Science* (1882), **Nietzsche** has a madman announce that God is dead, meaning that **atheism has been proved by science**. With P1 = the values rested on God and P2 = that belief has collapsed, the conclusion C is that the **values lose their ground**.
        feedback: |
          Nietzsche's madman does not claim a proof. The point is that belief in the Christian God has become unbelievable, and that Europe has not yet noticed what follows for the values built on it.
    explanation: |
      The root of the map. Every later box is a reply to the worry in P1, P2, C: reject a premise, or accept it and answer the conclusion.

  - id: sartre
    title: Sartre
    row: 2
    col: 1
    body: |
      According to **Sartre** (1905 to 1980), in the lecture *Existentialism Is a Humanism* (late 1945 or 1946, sources differ), a paper-knife has its **essence before its existence**, because an artisan conceives it first. A person is the reverse: **existence comes before essence**. She first exists and then defines herself by what she makes of herself, so there is **no human nature, because there is no God to have a conception of it**.
    decoys:
      - body: |
          According to **Sartre** (1905 to 1980), in the lecture *Existentialism Is a Humanism* (late 1945 or 1946, sources differ), a paper-knife has its **essence before its existence**, because an artisan conceives it first. A person is the same: **essence comes before existence**. She is first given a nature and then lives it out, so there is **a human nature, because God had a conception of it**.
        feedback: |
          That is the position Sartre argues against (the view of Aquinas, for whom God conceives the human essence). Sartre keeps the knife but reverses the order for persons.
      - body: |
          According to **Sartre** (1905 to 1980), in the lecture *Existentialism Is a Humanism* (late 1945 or 1946, sources differ), a paper-knife has its **existence before its essence**, because it is found lying around. A person is the reverse: **essence comes before existence**. She first has a nature and then makes herself exist, so there is **no human nature, because there is no God to have a conception of it**.
        feedback: |
          The knife is the model of essence first: someone conceives it, then makes it. Persons are the contrast. The reversed order also does not match the conclusion, which needs existence first.
    explanation: |
      Nonbelievers' first reply to the nihilism box: accept P2, reject the step to C. Meaning is made, not found.

  - id: believer
    title: The believer's departure
    row: 2
    col: 2
    body: |
      A believer rejects **P2** of the nihilism argument: according to theists, **meaning is rooted in God**, and a tradition may name the doubt itself (Ecclesiastes). **Kierkegaard** (*Fear and Trembling*, 1843, under the pseudonym Johannes de silentio) shows faith looking absurd to an outsider, as Abraham's does. Defenders read it as **faith as a passion**, not as a conclusion reason has proved.
    decoys:
      - body: |
          A believer **accepts P2** of the nihilism argument and rejects the step to C: according to theists, **meaning is made by the free person**, and a tradition may name the doubt itself (Ecclesiastes). **Kierkegaard** (*Fear and Trembling*, 1843, under the pseudonym Johannes de silentio) shows faith looking absurd to an outsider, as Abraham's does. Defenders read it as **faith as a passion**, not as a conclusion reason has proved.
        feedback: |
          Accepting P2 and rejecting C is the nonbeliever's route (Sartre's, for one). The believer's characteristic move is to reject P2: belief in God has not collapsed, and meaning rests on God.
      - body: |
          A believer rejects **P2** of the nihilism argument: according to theists, **meaning is rooted in God**, and a tradition may name the doubt itself (Ecclesiastes). **Kierkegaard** (*Fear and Trembling*, 1843, under the pseudonym Johannes de silentio) shows faith looking absurd to an outsider, as Abraham's does. Defenders read it as **a conclusion that reason has proved**, so that the outsider's doubt is simply a mistake.
        feedback: |
          Kierkegaard's defenders read faith as a passion, not as a proof. That is exactly why Camus counts it as a leap, and why defenders say the charge misses.
    explanation: |
      The believer's departure point. A believer who rejects P2 (or, against Camus, the claim that the world's silence is final) can still share the nonbeliever's worry while answering it differently.

  - id: camus
    title: Camus and the absurd
    row: 2
    col: 3
    body: |
      According to **Camus** (*The Myth of Sisyphus*, 1942), the **absurd** lives in neither the world alone nor us alone but in **the clash between our demand for meaning and the silence of the world**. He refuses physical suicide and the **leap** (which he calls philosophical suicide), and answers with **revolt, freedom and passion**. The essay ends: "One must imagine Sisyphus happy".
    decoys:
      - body: |
          According to **Camus** (*The Myth of Sisyphus*, 1942), the **absurd** lives in **the world alone**, which is meaningless whatever we feel. He refuses physical suicide but accepts the **leap** as the honest way out, and answers with **revolt, freedom and passion**. The essay ends: "One must imagine Sisyphus happy".
        feedback: |
          Camus places the absurd in the relation: the demand for meaning against the world's silence. He rejects the leap as philosophical suicide, because it escapes the clash by giving up lucid thought.
      - body: |
          According to **Camus** (*The Myth of Sisyphus*, 1942), the **absurd** lives in neither the world alone nor us alone but in **the clash between our demand for meaning and the silence of the world**. He accepts the **leap** to a meaning beyond reason, rejects physical suicide, and answers with **resignation, hope and faith**. The essay ends: "One must imagine Sisyphus happy".
        feedback: |
          Hope and faith are what Camus refuses. His three consequences are revolt, freedom and passion: stay inside the clash and live it fully, without an appeal beyond it.
    explanation: |
      A second nonbeliever reply, and the one that does not claim the silence is cured: it keeps the clash alive. Whether that step to "happy" follows is the question of the guided proof.

  - id: beauvoir
    title: Beauvoir and Nagel
    row: 3
    col: 1
    body: |
      According to **Beauvoir** (*The Ethics of Ambiguity*, 1947), freedom is not secured alone: it needs the **freedom of others**. According to **Nagel** ("The Absurd", 1971), the absurd is **inside us**: the clash between how seriously we take our lives and our ability to see all of it as arbitrary. His answer is that **irony fits better than defiance**.
    decoys:
      - body: |
          According to **Beauvoir** (*The Ethics of Ambiguity*, 1947), freedom can be secured alone, **whatever happens to others**. According to **Nagel** ("The Absurd", 1971), the absurd is **inside us**: the clash between how seriously we take our lives and our ability to see all of it as arbitrary. His answer is that **irony fits better than defiance**.
        feedback: |
          Beauvoir argues the opposite: a person's freedom needs the freedom of others, so it cannot be won entirely alone. This is what a lone hero's revolt would need to add.
      - body: |
          According to **Beauvoir** (*The Ethics of Ambiguity*, 1947), freedom is not secured alone: it needs the **freedom of others**. According to **Nagel** ("The Absurd", 1971), the absurd lies **between us and the silent world**. His answer is that **defiance fits better than irony**.
        feedback: |
          That is Camus's framing and answer. Nagel locates the absurd inside us and finds defiance to be making too much of it, so he recommends irony.
    explanation: |
      Two refinements of the Sisyphus step: freedom needs others (Beauvoir), and the absurd may be a feature of our own double view of ourselves (Nagel).

  - id: humanism
    title: Humanism
    row: 3
    col: 2
    body: |
      **Humanism** puts human dignity, reason and responsibility at the centre. Renaissance humanists taught the ***studia humanitatis***: grammar, rhetoric, history, poetry and moral philosophy. According to **Kant** (1784), the Enlightenment motto is ***sapere aude***, in one translation "Have courage to use your own reason!": use your own understanding. Humanists **share** dignity, reason and flourishing but **split on the source of dignity**: secular humanists say it needs no source beyond the human, religious humanists say it rests on God.
    decoys:
      - body: |
          **Humanism** puts human dignity, reason and responsibility at the centre. Renaissance humanists taught the ***studia humanitatis***: grammar, rhetoric, history, poetry and moral philosophy. According to **Kant** (1784), the Enlightenment motto is ***sapere aude***, in one translation "Have courage to use your own reason!": use your own understanding. Humanists **share** dignity, reason and flourishing but **split on the source of dignity**: secular humanists say it rests on God, religious humanists say it needs no source beyond the human.
        feedback: |
          The two sides are swapped. Secular humanists hold that dignity and morality need no source beyond humanity; religious humanists (for example Christian ones) ground dignity in God.
      - body: |
          **Humanism** puts human dignity, reason and responsibility at the centre. Renaissance humanists taught the ***studia humanitatis***: grammar, rhetoric, history, poetry and moral philosophy. According to **Kant** (1784), the Enlightenment motto is ***sapere aude***, in one translation "Have courage to use your own reason!": **follow the guidance of another**. Humanists **share** dignity, reason and flourishing but **split on the source of dignity**: secular humanists say it needs no source beyond the human, religious humanists say it rests on God.
        feedback: |
          Kant's motto is the opposite: have the courage to use your own understanding without guidance from another. The one thing needed, he says, is freedom to use reason publicly.
    explanation: |
      A way to live that keeps meaning while changing its source or its centre. It leans on Sartre's and Beauvoir's themes (freedom, responsibility) and splits from the believer over where dignity comes from.

  - id: pragmatism
    title: Pragmatism
    row: 3
    col: 3
    body: |
      According to **Peirce** ("How to Make Our Ideas Clear", 1878), the meaning of an idea is its **conceivable practical effects**. According to **James** (*Pragmatism*, 1907), the true is whatever **proves itself good in the way of belief**, for definite reasons, which does not mean that any comforting belief is true. In "The Will to Believe", an option is **genuine** when it is **live, forced and momentous**, and if it cannot be settled on intellectual grounds, **our passional nature may decide it**.
    decoys:
      - body: |
          According to **Peirce** ("How to Make Our Ideas Clear", 1878), the meaning of an idea is its **conceivable practical effects**. According to **James** (*Pragmatism*, 1907), the true is **any belief that comforts the believer**. In "The Will to Believe", an option is **genuine** when it is **live, forced and momentous**, and if it cannot be settled on intellectual grounds, **our passional nature may decide it**.
        feedback: |
          James's formula is "proves itself good in the way of belief, for definite assignable reasons", and the Stanford Encyclopedia stresses that it is not "whatever comforts". Russell's Santa Claus objection targets exactly this misreading.
      - body: |
          According to **Peirce** ("How to Make Our Ideas Clear", 1878), the meaning of an idea is its **conceivable practical effects**. According to **James** (*Pragmatism*, 1907), the true is whatever **proves itself good in the way of belief**, for definite reasons. In "The Will to Believe", an option is **genuine** when it is **live, avoidable and momentous**, and **our passional nature may decide any question**, even one evidence can settle.
        feedback: |
          Two slips. A genuine option is forced, not avoidable: you cannot escape choosing. And the passional nature may decide only options that cannot be settled on intellectual grounds, not questions evidence can settle.
    explanation: |
      Where the believer's departure meets a rule: when evidence cannot decide a live, forced, momentous option, James says belief may be a legitimate choice. Critics ask whether that licenses wishful thinking.

  - id: stoic
    title: Stoicism
    row: 4
    col: 1
    body: |
      According to **Epictetus**, what is up to us is our **opinions, pursuits, desires and aversions**, and not up to us are the **body, property and reputation**. The Stoics hold that **only virtue is good**; health and wealth are **preferred indifferents**. Our disturbance comes from our **judgments** about things, and the goal, ***apatheia***, is **freedom from passions** (false value judgments), **not from all feeling**.
    decoys:
      - body: |
          According to **Epictetus**, what is up to us is our **body, property and reputation**, and not up to us are the **opinions, pursuits, desires and aversions**. The Stoics hold that **only virtue is good**; health and wealth are **preferred indifferents**. Our disturbance comes from our **judgments** about things, and the goal, ***apatheia***, is **freedom from passions** (false value judgments), **not from all feeling**.
        feedback: |
          The lists are swapped. For Epictetus our own judgments and actions are up to us, while body, property and reputation depend on others and on chance.
      - body: |
          According to **Epictetus**, what is up to us is our **opinions, pursuits, desires and aversions**, and not up to us are the **body, property and reputation**. The Stoics hold that **health and wealth are goods**, as important as virtue. Our disturbance comes from our **judgments** about things, and the goal, ***apatheia***, is **feeling nothing at all**.
        feedback: |
          Two slips. For the Stoics only virtue is good, and health and wealth are indifferents (preferred, not goods). And apatheia is freedom from passions that rest on false judgments, not from every feeling: the sage has good feelings.
    explanation: |
      Calm by control: sort what is up to us from what is not, and judge only the first. It follows from the root worry by changing where the good lies.

  - id: epicurean
    title: Epicureanism
    row: 4
    col: 2
    body: |
      According to **Epicurus** (341 to 270 BCE), the best life is **freedom from bodily pain and mental disturbance** (*ataraxia*), not the most feasts. Desires are **natural and necessary** (food, shelter), **natural but unnecessary** (a fine meal) and **empty** (fame, great wealth): meet the first, drop the third. About death: **when we exist, death is not here, and when death is here, we do not exist**, so it is nothing to us.
    decoys:
      - body: |
          According to **Epicurus** (341 to 270 BCE), the best life is **the most intense pleasure at every moment**, feasts included. Desires are **natural and necessary** (food, shelter), **natural but unnecessary** (a fine meal) and **empty** (fame, great wealth): meet the first, drop the third. About death: **when we exist, death is not here, and when death is here, we do not exist**, so it is nothing to us.
        feedback: |
          That is the popular picture of "Epicurean". Epicurus counted the settled state of freedom from pain and worry as the highest pleasure and advised a simple life.
      - body: |
          According to **Epicurus** (341 to 270 BCE), the best life is **freedom from bodily pain and mental disturbance** (*ataraxia*), not the most feasts. Desires are **natural and necessary** (fame, great wealth), **natural but unnecessary** (a fine meal) and **empty** (food, shelter): meet the first, drop the third. About death: **when we exist, death is not here, and when death is here, we do not exist**, so it is nothing to us.
        feedback: |
          The examples of necessary and empty desires are swapped. Food and shelter are natural and necessary; fame and great wealth are empty.
    explanation: |
      Calm by understanding nature and sorting desires. Its death argument is the pivot to the link boxes below.

  - id: skeptic
    title: Pyrrhonian skepticism
    row: 4
    col: 3
    body: |
      According to **Sextus Empiricus**, **dogmatists** claim to have found the truth, **Academics** claim it cannot be grasped, and **Pyrrhonists** keep inquiring and suspend judgement. Equal opposed arguments lead to ***epoché*** (suspension of judgement), and epoché is followed by ***ataraxia***. **Agrippa's five modes** (disagreement, regress, relativity, hypothesis, circularity) push any claim into a dead end. **Hume** kept a **mitigated** skepticism.
    decoys:
      - body: |
          According to **Sextus Empiricus**, **dogmatists** claim to have found the truth, **Pyrrhonists** claim it cannot be grasped, and **Academics** keep inquiring and suspend judgement. Equal opposed arguments lead to ***epoché*** (suspension of judgement), and epoché is followed by ***ataraxia***. **Agrippa's five modes** (disagreement, regress, relativity, hypothesis, circularity) push any claim into a dead end. **Hume** kept a **mitigated** skepticism.
        feedback: |
          Academics and Pyrrhonists are swapped. In Sextus's scheme the Academics make the negative claim that truth is inapprehensible, while Pyrrhonists keep inquiring.
      - body: |
          According to **Sextus Empiricus**, **dogmatists** claim to have found the truth, **Academics** claim it cannot be grasped, and **Pyrrhonists** keep inquiring and suspend judgement. Equal opposed arguments lead to ***ataraxia***, and calm is followed by ***epoché***. **Agrippa's five modes** (disagreement, regress, relativity, hypothesis, circularity) push any claim into a dead end. **Hume** kept a **mitigated** skepticism.
        feedback: |
          The order is reversed. Suspension of judgement comes first, and the calm follows it.
    explanation: |
      Calm by giving up beliefs: with none to defend, none can be disturbed. Hume found that extreme form hard to live and kept a milder one.

  - id: calm
    title: Three routes to calm
    row: 5
    col: 1
    span: 3
    body: |
      The three schools aim at **calm of mind** but take different routes. **Epicureans**: understand nature and sort the desires, so that fear and empty wants fall away. **Stoics**: judge only what is up to us. **Pyrrhonists**: suspend judgement, so no belief is left to be disturbed. They differ on **whether calm needs some beliefs**.
    decoys:
      - body: |
          The three schools aim at **calm of mind** but take different routes. **Epicureans**: judge only what is up to us. **Stoics**: understand nature and sort the desires, so that fear and empty wants fall away. **Pyrrhonists**: suspend judgement, so no belief is left to be disturbed. They differ on **whether calm needs some beliefs**.
        feedback: |
          The first two routes are swapped. Sorting desires and understanding nature is the Epicurean path; the dichotomy of control, judging only what is up to us, is the Stoic one.
      - body: |
          The three schools aim at **calm of mind** but take different routes. **Epicureans**: understand nature and sort the desires, so that fear and empty wants fall away. **Stoics**: judge only what is up to us. **Pyrrhonists**: hold firm beliefs about nature, so no doubt is left to disturb them. They all agree that **calm needs firm beliefs**.
        feedback: |
          Pyrrhonists go the other way: they suspend judgement. So the schools do not all agree on this point, and the difference over whether calm needs some beliefs is where they part.
    explanation: |
      A link box: the same goal, three routes, one point of disagreement.

  - id: death
    title: Epicurus and Nagel on death
    row: 6
    col: 2
    body: |
      According to **Epicurus**, good and bad lie in sensation and death ends sensation, so **death is nothing to us**. According to **Nagel** ("Death", 1970), as the *deprivation account* is usually told, death is bad because it **takes away the goods the person would have had**, which needs no pain. **Lucretius** adds a **symmetry** argument (we do not mind the time before birth); critics reply the two are **not alike**.
    decoys:
      - body: |
          According to **Epicurus**, death is bad because it **takes away the goods the person would have had**. According to **Nagel** ("Death", 1970), good and bad lie in sensation and death ends sensation, so **death is nothing to us**. **Lucretius** adds a **symmetry** argument (we do not mind the time before birth); critics reply the two are **not alike**.
        feedback: |
          The attributions are swapped. Epicurus says death is nothing to us; the deprivation account, as Nagel is usually read, says death harms by depriving.
      - body: |
          According to **Epicurus**, good and bad lie in sensation and death ends sensation, so **death is nothing to us**. According to **Nagel** ("Death", 1970), death is bad only because of the **pain and fear** that come with dying. **Lucretius** adds a **symmetry** argument (we do not mind the time before birth); critics reply the two are **not alike**.
        feedback: |
          The deprivation account says the opposite: death is bad because of the goods it removes, and it needs no pain, so even a painless death can harm.
    explanation: |
      A link box: the deprivation view is the hinge for the last box, since if death is a loss, defeating it becomes a goal.

  - id: transhuman
    title: Transhumanism
    row: 6
    col: 3
    body: |
      According to **Bostrom** ("Transhumanist Values", 2005), anti-ageing medicine aims at a longer **healthspan**. The routes are anti-ageing research, **cryonics** (revival not demonstrated) and **mind uploading** (does not exist today). Whether an upload is you depends on the view of the person: under **psychological continuity** (Locke, Parfit) it may be, under **animalism** (Olson) it is not.
    decoys:
      - body: |
          According to **Bostrom** ("Transhumanist Values", 2005), anti-ageing medicine aims at a longer **healthspan**. The routes are anti-ageing research, **cryonics** (revival demonstrated) and **mind uploading** (routine today). Whether an upload is you depends on the view of the person: under **psychological continuity** (Locke, Parfit) it may be, under **animalism** (Olson) it is not.
        feedback: |
          Neither claim holds. Cryonics is practised but revival has not been demonstrated, and uploading does not exist today, only plans and partial models.
      - body: |
          According to **Bostrom** ("Transhumanist Values", 2005), anti-ageing medicine aims at a longer **healthspan**. The routes are anti-ageing research, **cryonics** (revival not demonstrated) and **mind uploading** (does not exist today). Whether an upload is you depends on the view of the person: under **animalism** (Locke, Parfit) it may be, under **psychological continuity** (Olson) it is not.
        feedback: |
          The views are swapped. Psychological continuity (Locke, Parfit) follows memory, character and intentions, so an upload may qualify; animalism (Olson) says we are organisms, so a computer copy is not you.
    explanation: |
      The modern end of the trail: the old question of how to face death becomes a technological programme. Whether death is an evil to defeat or a given is the commitment where people part.

