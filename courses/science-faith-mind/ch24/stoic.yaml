id: ch24-stoic
title: "Stoicism"
kind: concept
own: |
  The setting: **Stoicism** is a school of ancient philosophy that treats how we live as a skill. Told *according to* its sources, it asks which things are up to us, and what a good life looks like once we see that.
  - **Who.** Zeno of Citium founded it in Athens around 300 BCE, teaching in a painted porch (*stoa poikile*, hence "Stoic"). Three later voices carry it to us: Epictetus (c. 55 to c. 135 CE, a former slave, recorded by his student Arrian), Seneca (died 65 CE, adviser to Nero) and Marcus Aurelius (emperor 161 to 180 CE, whose private notebook we call the *Meditations*).
  - **The dichotomy of control.** According to Epictetus, some things are up to us and some are not. Up to us: our {{ judgments, pursuits, desires and aversions }}, in short our own actions. Not up to us: our body, property, reputation and office. The Stoic advice is to stake our peace on the first group only. For things that are partly ours, such as a journey, Seneca's habit is to expect success "unless something interferes".
  - **Impressions and assent.** An *impression* is how a thing first appears to us. *Assent* is our yes to it. According to Epictetus, people are disturbed not by things but by the {{ judgments they form about things }}, and the judgment is the part we can change.
  - **Virtue is the only good.** According to the Stoics, only virtue (a good character, acting well) is good. Health, wealth and reputation are *indifferents*: they do not make a life good or bad. Some are *preferred* (health, wealth) and a wise person normally chooses them, but not at the cost of virtue. A *passion*, for the Stoics, is an excessive impulse resting on a false value judgment, such as treating an indifferent as truly bad. The goal, *apatheia*, is {{ freedom from such passions, not from all feeling }}, since the Stoics keep good feelings (*eupatheiai*) toward real goods.
  - **Replies to the charges of coldness and passivity.** Stoics answer that the target is false judgment, not feeling, and that accepting what is not up to us goes with acting well in our role, including duties to others. Critics reply that the line between "up to us" and "not" is blurry and that the ideal may ask too much.
  - **Modern echo.** Albert Ellis and Aaron Beck cited Stoic thinkers as forerunners of cognitive therapy. Some commentators say the {{ technique of examining judgments }} was kept while the Stoic view of human nature and virtue was not.
  - **Where thoughtful people part ways.** Fact: who the Stoics were, what the texts say, and that Ellis and Beck cited them. Live debate: how far the dichotomy holds, whether Stoic acceptance is fatalism, and how much of CBT is truly Stoic. Commitment: whether virtue is the only good, and whether the universe is ordered by reason, as the Stoics held.

cards:
  - type: text
    id: hook
    title: "Same jam, two drivers"
    body: |
      Two drivers sit in the same traffic jam, the same car length apart. Neither can move. One is red in the face, shouting at the dashboard. The other listens to the radio and replans the meeting.

      The jam is identical for both. So what differs? Perhaps the first has more at stake. But suppose they have exactly the same appointment, the same deadline and the same boss.

      This lesson follows one old answer, from the philosophers called Stoics. According to them, what differs is not the jam but what each driver *does with the jam in the mind*. We will see their claim, their reasons, the strongest objections and where thoughtful people part ways. We do not judge who is right.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Two people suffer the same loss, say a missed promotion. One is calm after a week, the other still angry after a year. Before any theory: what is the best first explanation?
    options:
      - text: "The loss itself differs, because no two people can truly lose the same thing."
        feedback: |
          Sometimes true, but the question fixed the loss. It is also not the Stoic answer, which looks inside the reaction.
      - text: "How each person judges the loss, meaning what they take it to say about their worth and their future."
        correct: true
        feedback: |
          This is the Stoic answer, and it is the first half of the lesson. Whether it is the whole story is a live debate, as we will see.
      - text: "One person simply has a stronger will and hides the feeling."
        feedback: |
          Hiding a feeling is not the Stoic ideal. According to the Stoics, the aim is to change the judgment that produces the feeling, not to hold it in.
      - text: "Calmness is a matter of luck and cannot be learned."
        feedback: |
          The Stoics held the opposite: that calm can be trained, like a skill. Whether training works as much as they claimed is debated.
    explanation: |
      Layer: that people react differently to the same event is fact. How far the reaction is a judgment we control is live debate. Stoicism is one answer, and not the only one.

  - type: text
    id: zeno
    title: "A school named after a porch"
    image:
      src: img/zeno.webp
      alt: "Marble portrait bust of an older bearded man, traditionally identified as Zeno of Citium"
      caption: "A marble bust in the Farnese collection (Naples), traditionally identified as Zeno of Citium (c. 334 to c. 262 BCE), who founded the Stoic school."
      credit: "Yair-haklai, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Zeno_of_Citium_bust,_Farnese_collection_(Naples).jpg"
    body: |
      According to the Stanford Encyclopedia of Philosophy, Zeno of Citium (a city on Cyprus) founded the school in Athens around 300 BCE. Reference works give his dates as about 334 to 262 BCE, and some sources differ by a year. The first Stoics met in a porch in the Agora decorated with paintings, the *stoa poikile* ("painted porch"), and the name Stoic comes from it. Britannica adds that his many writings survive only in fragments.

      According to the Stoics themselves, philosophy has three parts: logic, physics (the study of nature) and ethics. They saw the three as one system, and they pictured it as a living being. The part we care about here is ethics, the study of how to live.

  - type: mcq
    id: name
    title: "Why 'Stoic'?"
    prompt: |
      The word *Stoic* comes from the Greek *stoa*. According to the Stanford Encyclopedia of Philosophy, what is the origin of the school's name?
    options:
      - text: "The porch in Athens (the painted porch, *stoa poikile*) where the first members met."
        correct: true
        feedback: |
          Yes. The name is about the meeting place, not about enduring pain.
      - text: "A Greek word for patient endurance of suffering."
        feedback: |
          That is the modern English meaning of "stoic", stiff upper lip. The school took its name from a building, and the philosophy is wider than endurance.
      - text: "The name of Zeno's teacher."
        feedback: |
          The school is named after a place, not a teacher.
    explanation: |
      The English word "stoic" has drifted from the school's name. The school is the subject of this lesson, not the habit of grim endurance.

  - type: text
    id: three
    title: "Three voices from Rome"
    image:
      - src: img/epictetus.webp
        alt: "Engraved portrait of the philosopher Epictetus, a bearded man in a robe"
        caption: "Epictetus (c. 55 to c. 135 CE), in an engraving by Henri Bonnart made about 1700, long after his death."
        credit: "Henri Bonnart, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Epictetus_-_Henri_Bonnart_engraving_c._1700.png"
      - src: img/marcus-aurelius.webp
        beside: true
        alt: "Marble head of the Roman emperor Marcus Aurelius with curly hair and beard"
        caption: "Marcus Aurelius (121 to 180 CE), Roman emperor from 161, in a marble head of the second century CE."
        credit: "Jebulon, CC0, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Head_Marcus_Aurelius_archmus_Heraklion.jpg"
    body: |
      Most Stoic writing from the Greek founders is lost. The texts we read come from the Roman period, from three very different lives.

      **Epictetus** (c. 55 to c. 135 CE), according to the Internet Encyclopedia of Philosophy, was born in Phrygia, came to Rome as the slave of a wealthy freedman, studied under Musonius Rufus and was later freed. The emperor Domitian banished philosophers from Rome (sources give 89 or 93 CE), and Epictetus taught at Nicopolis in Greece. He wrote nothing himself: his student Arrian recorded the *Discourses* and the *Handbook* (*Enchiridion*), though some scholars doubt that the words are verbatim.

      **Seneca** (born c. 4 BCE in Cordoba, died 65 CE) wrote the *Letters to Lucilius*, 124 surviving letters in 20 books. He advised the young Nero, and after a failed conspiracy Nero sentenced him to death. He admits in his writings that he falls short of the life he describes.

      **Marcus Aurelius** (121 to 180 CE) was Roman emperor from 161. His *Meditations* is a private notebook, probably written on campaign, and in the text's own form it is addressed to himself. A slave, an adviser and an emperor held the same philosophy.

  - type: mcq
    id: who
    title: "Who left what?"
    prompt: |
      According to the reference works, which of the three Roman Stoics left a private notebook written to himself, probably on military campaign?
    options:
      - text: "Marcus Aurelius, the emperor."
        correct: true
        feedback: |
          Yes. The *Meditations* reads as notes to himself, with no set order.
      - text: "Epictetus, the former slave."
        feedback: |
          Epictetus taught aloud and wrote nothing. His student Arrian recorded the *Discourses* and the *Handbook*.
      - text: "Seneca, the adviser to Nero."
        feedback: |
          Seneca wrote letters and essays for readers, such as the *Letters to Lucilius*.
    explanation: |
      Why it matters: the Stoics are often quoted as if they were writing slogans. Epictetus spoke to students, Seneca wrote to a friend, and Marcus wrote to himself.

  - type: text
    id: control
    title: "What is up to us?"
    body: |
      The *Handbook* of Epictetus opens with a sorting. In Elizabeth Carter's translation:

      > "Some things are in our control and others not."

      Things in our control are, in her words, "opinion, pursuit, desire, aversion, and, in a word, whatever are our own actions". Things not in our control are "body, property, reputation, command", and whatever are not our own actions.

      Here *aversion* means the pull to avoid something. According to Epictetus, this is the **dichotomy of control** (a *dichotomy* is a split into two). The advice that follows is to stake our peace on the first group only. If I tie my calm to my reputation, anyone who gossips holds my calm in their hands.

  - type: mcq
    id: sort
    title: "Sort the examples"
    prompt: |
      According to the dichotomy of control in Epictetus's *Handbook*, which of these are *up to us*? Select all that apply.
    multiple: true
    options:
      - text: "My judgment about whether a delay is a disaster."
        correct: true
        feedback: |
          Yes: judgments are the first item on his list.
      - text: "Whether I choose to act honestly in a negotiation."
        correct: true
        feedback: |
          Yes: our own actions and choices are up to us.
      - text: "Whether the other side accepts my offer."
        feedback: |
          Their decision is theirs. I control my offer, not their answer.
      - text: "What people think of me afterwards."
        feedback: |
          Reputation is on the list of things not in our control. Others form that judgment.
      - text: "Whether the traffic moves in the next ten minutes."
        feedback: |
          The traffic, like the weather, is outside the first group.
    explanation: |
      The pattern: what is ours is the inner act of judging and choosing. What others do, and how things turn out, is not wholly ours.

  - type: mcq
    id: partial
    title: "Partly up to us"
    prompt: |
      A student studies hard for an exam. Her effort seems up to her, but the result depends on the exam and on luck. The Internet Encyclopedia of Philosophy notes that Seneca compares a traveller who sets out on a voyage and should expect to arrive "unless something interferes". Which reading fits the dichotomy of control?
    options:
      - text: "Put the effort in the first group and the outcome in the second, so she aims at doing her best and holds the result loosely."
        correct: true
        feedback: |
          This is how Stoic writers apply it, in the spirit of Seneca's voyage: act fully, and keep in view that the outcome can be blocked.
      - text: "Since the result is not fully hers, she should not bother to study."
        feedback: |
          That drops the first half. According to the Stoics, her effort is up to her, and acting well is the point.
      - text: "The dichotomy is useless here, because everything is either fully up to us or not at all."
        feedback: |
          The dichotomy is a tool for sorting the parts of a situation, not whole situations. A critic may still say that the line is blurry, which is a fair objection and is taken up below.
    explanation: |
      Layer: the Stoic reading is what the texts recommend (fact). Whether a clean line between effort and outcome exists is live debate.

  - type: text
    id: assent
    title: "Impressions and assent"
    body: |
      Why should judgments be up to us? According to the Stoics, a thing first arrives as an **impression**: how it appears to us ("this delay is terrible"). We then give or withhold **assent**, our inner yes to the impression. The Stanford Encyclopedia of Philosophy says that for the Stoics, assent is up to us, and that our character depends on how we assent.

      Epictetus puts the point in the *Handbook*, in Carter's translation:

      > "Men are disturbed, not by things, but by the principles and notions which they form concerning things."

      So the first reaction, a flash of anger, is an impression and not yet a choice. The step we can train is what we do next: accept it as a true report of the world, or examine it.

  - type: mcq
    id: apply
    title: "Back to the jam"
    prompt: |
      Two drivers share the same traffic jam. Driver A thinks "this is a catastrophe and someone is doing it to me". Driver B thinks "this is a delay that I can plan around". According to Epictetus's view that people are disturbed by their judgments of things, what explains their different moods?
    options:
      - text: "The judgment each driver gives assent to, since the jam is the same for both."
        correct: true
        feedback: |
          Yes, that is the Stoic claim. It applies to the part of the reaction that rests on a judgment.
      - text: "The jam is worse for A than for B."
        feedback: |
          The case says the jam is the same. The Stoic claim is that the difference lies in assent.
      - text: "B has no feelings about being late."
        feedback: |
          Not the Stoic claim. Their ideal is not the absence of feeling. B may still be annoyed, but no longer treats it as a catastrophe.
    explanation: |
      A critic may reply that some pain, such as grief or illness, is not only a judgment. We return to that in the objections. The Stoic reply there is Seneca's distinction between an involuntary first shock and the assent that follows.

  - type: text
    id: virtue
    title: "Only virtue is good"
    body: |
      If peace rests on judgment, which judgments are the right ones? According to the Stanford Encyclopedia of Philosophy, the Stoics held that **only virtue is good**. Virtue here means a good character, acting well and wisely. Health, wealth and reputation are **indifferents**: they neither benefit nor harm a person's life as a whole.

      This does not mean they are all treated alike. According to the Stoics (as the Internet Encyclopedia of Philosophy describes it), some indifferents are **preferred** (health, education) and some **dispreferred** (sickness, poverty). A wise person normally picks the preferred ones, unless doing so would cost virtue. So the Stoic still wants to be healthy, but does not count health as part of a good life.

      The reason for the doctrine follows from the first step. If the good lay in things we do not control, our happiness would depend on luck. If the good is virtue, it lies in what is up to us.

  - type: mcq
    id: indiff
    title: "Preferred, not good"
    prompt: |
      According to the Stoics, a person has a chance to take a well-paid job by lying in an interview. What does the doctrine of preferred indifferents imply?
    options:
      - text: "Wealth is preferred, but virtue is the only good, so she should not lie to get it."
        correct: true
        feedback: |
          Yes. A preferred indifferent is chosen only when it does not compromise virtue.
      - text: "Wealth is a good, so she should take whatever route gets it."
        feedback: |
          That is the view the Stoics reject. For them wealth is not a good.
      - text: "Wealth is dispreferred, so she should refuse any job."
        feedback: |
          Wealth is preferred, not dispreferred. The Stoic is not an ascetic by doctrine.
    explanation: |
      Layer: this is what the Stoic texts say (fact). Whether virtue is the *only* good is a faith or metaphysical commitment. Aristotle, for instance, held that some external goods help a flourishing life.

  - type: text
    id: cold
    title: "Objection: is it cold?"
    body: |
      The first objection is that Stoicism asks us to be stone. The Stoic goal is called *apatheia*, the ancestor of "apathy". Does it mean feeling nothing?

      According to the Internet Encyclopedia of Philosophy, *apatheia* is "freedom from passion", but a Stoic *passion* is an excessive impulse resting on a false value judgment, such as treating an indifferent as truly bad. It does not mean raw feeling. The Stanford Encyclopedia adds that the ideal person still has "good feelings" (*eupatheiai*) toward real goods: for example rational joy in virtue, and a rational wish to act well. By their account, pain has no healthy counterpart.

      A critic can still ask whether grief for a child is really a false judgment. According to Seneca's *On Anger* (as scholars such as Richard Sorabji describe it), the first shock is an involuntary first movement that is not yet a passion, and the passion begins only when we assent to the impression. The critic may find that too neat. This is where the lesson leaves the question open.

  - type: mcq
    id: apatheia
    title: "What apatheia means"
    prompt: |
      According to scholarly accounts of Stoicism, which statement about *apatheia* is closest?
    options:
      - text: "Freedom from passions, meaning excessive impulses based on false value judgments, while keeping good feelings toward real goods."
        correct: true
        feedback: |
          Yes, as the Stoic sources and reference works put it.
      - text: "A numb state in which a person feels nothing at all."
        feedback: |
          This is the English meaning of "apathy". It is the common misreading of the school.
      - text: "Public silence about private feelings."
        feedback: |
          Stoic texts discuss feelings openly. The target is false judgment, not display.
    explanation: |
      Why the misreading survives: "stoic" and "apathy" came into English with meanings that dropped the technical Greek sense.

  - type: text
    id: passive
    title: "Objection: is it passive?"
    body: |
      The second objection says that if we accept what is not up to us, we accept injustice and do nothing. The Stoics held that the universe is ordered by reason and that events follow causes, so critics call it fatalism.

      The Internet Encyclopedia of Philosophy reports Epictetus's image of a dog tied to a moving cart: the dog can resist and be dragged, or go along willingly. Epictetus also writes, in Carter's translation:

      > "Don't demand that things happen as you wish, but wish that they happen as they do happen, and you will go on well."

      In the same text he compares life to an actor's part: your business is "to act well the character assigned you".

      On the other side, the Stoic reply is that the role is not passive. According to the Stoic account described in the Internet Encyclopedia of Philosophy, humans are social animals, concern widens from family to all humanity, and acting well toward others is central to virtue. The best-known Roman Stoic was an emperor with a very active life. Critics answer that serious social change needs anger and hope, which the Stoic line may discourage. Medieval Christians, according to the Stanford Encyclopedia, felt it necessary to reject what they called Stoic fatalism.

  - type: mcq
    id: passive-q
    title: "A reply to the charge"
    prompt: |
      A critic says: "If only my judgments are up to me, a Stoic will never fight injustice." Which reply is closest to how Stoic sources answer?
    options:
      - text: "Acting well, including toward others, is part of virtue and is up to us. Acceptance concerns the outcome and the past, not our duty to act."
        correct: true
        feedback: |
          Yes. This is the reply from the accounts of Stoic social duty. A critic may still say it gives little reason to expect change.
      - text: "Nothing can be done about injustice, so a Stoic ignores it."
        feedback: |
          That is the charge restated. The Stoic texts treat justice as one of the virtues.
      - text: "The Stoics deny that injustice exists."
        feedback: |
          They do not. They hold that injustice is a failure of virtue.
    explanation: |
      Two views stay on the table: the Stoic view that acting well is enough as an aim, and the critic's view that a movement needs hope about outcomes.

  - type: text
    id: cbt
    title: "A modern echo, with limits"
    body: |
      Cognitive behavioural therapy (CBT) treats distress as partly produced by habitual judgments, which a person can examine and change. According to a review of the sources (a 2019 article by Robertson and Codd, and a 2024 article), Albert Ellis, who founded rational emotive behavior therapy, drew on Epictetus and Marcus Aurelius, and Aaron Beck, who developed cognitive therapy, cited Marcus Aurelius in 1976 and, with colleagues, named Zeno, Chrysippus, Seneca, Epictetus and Marcus Aurelius as origins in 1979.

      Two limits are worth keeping in view. First, the link is a historical claim that therapists cited the Stoics, not a claim that the Stoic goal, virtue as the only good, is part of the therapy. According to some commentators, CBT kept the technique of reasoning about judgments but not the Stoic view of human nature. Second, whether a therapy works is an empirical question for trials, and this lesson does not report results. Some commentators also doubt the scientific status of Ellis's version.

  - type: mcq
    id: cbt-q
    title: "A fair claim about CBT"
    prompt: |
      Which statement about Stoicism and CBT fits what the sources support?
    options:
      - text: "Founders of cognitive therapy cited Stoic thinkers as forerunners of the idea that judgments shape distress; whether CBT is Stoic in its goals is a separate and debated question."
        correct: true
        feedback: |
          Yes: a historical citation is established, while the question of shared goals is open.
      - text: "CBT is simply ancient Stoicism, so the Stoic claim about virtue has been proved by clinical trials."
        feedback: |
          Trials test whether a technique helps, not whether virtue is the only good. That is a philosophical commitment.
      - text: "CBT has nothing to do with Stoicism."
        feedback: |
          Ellis and Beck cited Stoic authors, so a connection is documented.
    explanation: |
      Layers: the citations are fact. The overlap in technique is live debate. Virtue as the only good is a commitment.

  - type: text
    id: parting
    title: "Where views part"
    body: |
      Many traditions answer the same question: how to live well when much is out of our hands? We name three in passing.

      The Epicurean school (the next lesson) agrees that peace of mind is the aim, but holds that pleasure, rightly understood, is the good, and that virtue serves it. Camus (the lesson on Absurdism) accepts neither a cosmic order to adapt to nor a leap: he asks us to stay in revolt against the silence of the world. Religious traditions, such as Christians who hold that God's providence orders events, may agree with accepting what is out of our hands, but ground it in trust in God rather than in a rational cosmos, and may disagree that virtue alone makes us happy.

      Where the paths part: whether virtue is the only good (a commitment), whether the universe is ordered by reason (a commitment), and how clean the line between "up to us" and "not" really is (live debate).

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Match the claim to its layer. "Only virtue is good, and the universe is ordered by reason."
    options:
      - text: "A faith or metaphysical commitment, held by Stoics and rejected or reshaped by others."
        correct: true
        feedback: |
          Yes. It can be argued for, but no experiment decides it.
      - text: "Established fact, because the texts say it."
        feedback: |
          That the texts say it is fact. Whether it is true is a different question.
      - text: "Scholarly consensus, because most philosophers agree."
        feedback: |
          There is no such consensus. Aristotelians, Epicureans, religious thinkers and others differ.
    explanation: |
      The method of the course: fact (what the Stoics wrote) first, then debate (how to read it), then commitment (whether to adopt it).

  - type: text
    id: summary
    body: |
      **Next:** a school that also seeks calm, but starts from pleasure. If the Stoics say only virtue is good, what did Epicurus say, and why did he claim that fear of death and of the gods is the thing to remove?
