id: ch24-epicurean
title: "Epicureanism and Hedonism"
kind: concept
own: |
  The setting: **Epicureanism** is a school of ancient philosophy that answers one question: what is a good life, and what stands in its way? Told *according to* its sources, it says that pleasure is the good, and then redefines pleasure so that it looks very different from a feast.
  - **Who.** Epicurus (341 to 270 BCE) founded the school in Athens, named the Garden after the property he bought there. His surviving letters and the *Principal Doctrines* are preserved in Book 10 of Diogenes Laertius, *Lives of Eminent Philosophers*. The Roman poet Lucretius (died around the mid-50s BCE) set the physics out in the poem *On the Nature of Things*.
  - **Hedonism.** *Hedonism* is the view that pleasure is the only thing good in itself, and pain the only thing bad in itself. According to Epicurus, the best life is the one with {{ freedom from bodily pain and mental disturbance }}, not the one with the most feasts. The Stoics, by contrast, say that only virtue is good.
  - **Three kinds of desire.** According to Epicurus, desires are {{ natural and necessary (food, shelter), natural but unnecessary (a fine meal), and empty (fame, great wealth) }}. The advice is to meet the first, enjoy the second without needing it, and drop the third.
  - **Two kinds of pleasure.** *Kinetic* pleasure is a process, such as eating while hungry. *Katastematic* pleasure is a settled state, such as being free of pain and worry (*ataraxia*, calm of mind). According to the sources, Epicurus counted the settled state as the highest; scholars disagree on how the two relate.
  - **The four-part remedy** (*tetrapharmakos*), as the Epicureans summed it up: do not fear the gods, do not worry about death, the good is easy to get, and the terrible is easy to endure.
  - **Death.** According to Epicurus, good and bad lie in sensation, and death is the end of sensation. So: {{ when we exist, death is not here, and when death is here, we do not exist }}, and death is nothing to us. Nagel replies that death can harm by *depriving* us of the goods we would have had. Lucretius adds a symmetry argument: we do not mind the time before our birth, so why mind the time after death? Critics reply that the two are not alike, since a life can be cut short but cannot start earlier.
  - **Physics for peace of mind.** Epicurean physics says the world is atoms and void, with an occasional random swerve (*clinamen*). Its gods are blessed and do not meddle in human affairs. The point, according to Epicureans, is to {{ remove the fear of gods and death }}.
  - **Friendship and quiet.** According to Epicurus, friendship is among the greatest goods for a good life, and he advised avoiding politics where possible.
  - **Objections.** Critics charge that this is a "swine" ethics. Epicurus replies that wise pleasure needs prudence, honour and justice. Nozick's *experience machine* (a device that gives any experience you choose) is the modern test: if you would refuse it, something besides pleasure matters.
  - **Where thoughtful people part ways.** Fact: who Epicurus and Lucretius were, which texts survive, what the arguments say. Live debate: how to read kinetic and katastematic pleasure, whether the death argument works, whether the Garden retreated from politics. Commitment: whether pleasure is the only good, and whether the gods stand apart from the world.

cards:
  - type: text
    id: hook
    title: "A feast or a quiet garden?"
    body: |
      Two friends are choosing how to live. One says: "I want the most pleasure I can get. Good food, good wine, good company, every night if possible." The other says: "I want the least pain I can manage. A small house, a few friends, a garden, no debts, no enemies."

      Both say they want to be happy, and both say pleasure matters. But the plans differ, and sometimes they clash: the feast brings a headache and a debt.

      This lesson follows a school that took the question seriously. According to Epicurus, pleasure is the good, and yet he advised a simple life. We will see what he meant, his arguments (including one about death), the strongest objections and where thoughtful people part ways. We do not judge who is right.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      When you say you want pleasure, which of these do you most plausibly want, at the deepest level?
    options:
      - text: "The most intense sensations, one after another, for as long as possible."
        feedback: |
          Many people start here, and some philosophers defend a version of it. But it has a problem: intense pleasures often bring pain later (the headache, the debt). We will see that Epicurus rejects this reading.
      - text: "A life without pain and worry, in which the ordinary pleasures can be enjoyed calmly."
        correct: true
        feedback: |
          According to Epicurus, this is the right reading. Whether it matches what people really want is open, but it is the claim of the lesson.
      - text: "Success, status and admiration."
        feedback: |
          These are pleasant for many people, but according to Epicurus they are empty desires: they promise security and do not deliver it.
      - text: "Nothing in particular: pleasure is not what people want."
        feedback: |
          That is a rival view (some philosophers deny that pleasure is what we want). Epicurus assumes the opposite, so it is not his answer.
    explanation: |
      Layer: that people seek pleasure and avoid pain is a plain observation. What pleasure is, and whether it is the only good, is debated.

  - type: text
    id: epicurus
    title: "A school in a garden"
    image:
      src: img/epicurus.webp
      alt: "Marble bust of Epicurus, a bearded man with a thoughtful expression"
      caption: "A Roman marble copy, now in the British Museum, of a lost Greek portrait of Epicurus (341 to 270 BCE), who founded the Garden in Athens."
      credit: "ChrisO, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Epicurus_bust.jpg"
    body: |
      According to the Stanford Encyclopedia of Philosophy, Epicurus lived from 341 to 270 BCE, was raised on the island of Samos and died in Athens at about 70. He bought a property in Athens known as the Garden, and the school took its name from it. According to Diogenes Laertius, friends came to him from all parts and lived with him in the garden, and his circle included a slave named Mys. English Wikipedia, citing a modern study, adds that the Garden welcomed many female students. The details of who joined and in what role come from later sources and are debated.

      Epicurus wrote a great deal, but little survives. According to the Stanford Encyclopedia, the main texts are the *Letter to Herodotus* (on physics), the *Letter to Menoeceus* (on ethics), the *Letter to Pythocles* (on the heavens), the *Principal Doctrines* and the *Vatican Sayings*, and Diogenes Laertius preserves most of them in Book 10 of his *Lives of Eminent Philosophers*. The Roman poet Lucretius presents the physics in the long poem *On the Nature of Things* (*De rerum natura*, six books). The Stanford Encyclopedia dates him roughly from the mid-90s to the mid-50s BCE and says his dates are uncertain.

  - type: mcq
    id: texts
    title: "How do we know?"
    prompt: |
      According to the reference works, how do we know most of what Epicurus taught?
    options:
      - text: "Through his short letters and doctrines preserved by Diogenes Laertius, and through the long poem of his Roman follower Lucretius."
        correct: true
        feedback: |
          Yes. Most of his own books are lost. We read the survivors and a faithful, but later, poet.
      - text: "Through a large library of his books that survives in full."
        feedback: |
          Epicurus wrote a great deal, but only letters, sayings and fragments survive.
      - text: "Mainly through his Stoic rivals, who left detailed accounts of his ideas."
        feedback: |
          Rivals such as Cicero wrote about him, and their accounts are used with care because they were hostile. The core sources are his own surviving texts and Lucretius.
    explanation: |
      Layer: what survives is fact. How faithful Lucretius is, and how to fill gaps, is scholarly work.

  - type: text
    id: hedonism
    title: "What hedonism claims"
    body: |
      *Hedonism* (from the Greek *hedone*, pleasure) comes in two kinds, according to the Stanford Encyclopedia. *Psychological hedonism* is a claim about motives: only pleasure and pain move us. *Ethical* (or evaluative) hedonism is a claim about value: all and only pleasure is good in itself, and all and only pain is bad in itself. "Good in itself" means good as an end, not only as a means to something else. Money is good as a means; the pleasure it buys is, for the hedonist, good in itself.

      Epicurus is an ethical hedonist. According to the *Letter to Menoeceus* (Hicks translation), "the end of all our actions is to be free from pain and fear". He did not value every pleasure. The same letter says "not all pleasure is worthy of choice", and that we choose by "sober reasoning".

      Compare the Stoics (the lesson Stoicism). According to them, only virtue is good, and health and comfort are indifferent. According to Epicurus, pleasure is the good, and virtue matters because it makes a pleasant life possible. The two schools agree on a calm mind and disagree on what makes a life good.

  - type: mcq
    id: stoic-vs
    title: "Epicurus or the Stoics?"
    prompt: |
      Someone says: "A good life is one of virtue, whether or not it is pleasant." Which school does that fit best, and why?
    options:
      - text: "The Stoics: according to them, only virtue is good, and pleasure is an indifferent."
        correct: true
        feedback: |
          Yes. The Stoics may allow that pleasure is preferred in some cases, but they deny that it makes a life good.
      - text: "The Epicureans: according to them, pleasure is a mere detail beside virtue."
        feedback: |
          The opposite. According to Epicurus, pleasure is the end, and virtue is valued for what it does for a pleasant life.
      - text: "Both, because both say a calm mind is the aim."
        feedback: |
          They share the aim of calm, but the question is what makes a life good. They give different answers, which is the point of the comparison.
    explanation: |
      Layer: that the schools hold these views is fact. Which view is right is a commitment about what is good.

  - type: text
    id: desires
    title: "Sorting your wants"
    body: |
      If pleasure is the good, we need to know which desires to follow. According to the *Letter to Menoeceus*, desires divide into those that are natural and those that are "groundless". Natural desires divide again into those necessary for happiness, freedom of the body from discomfort or life itself, and those that are natural only. According to the Stanford Encyclopedia, the three kinds are:

      | Kind | Example | Advice |
      |---|---|---|
      | Natural and necessary | food, shelter, friendship | meet them |
      | Natural but unnecessary | a fine meal, sweet scents | enjoy them, do not need them |
      | Empty | great wealth, fame, immortality | drop them |

      Epicurus calls the third kind empty because, according to the Stanford Encyclopedia, it cannot give the security it promises. No amount of fame is enough, so the desire never ends. Note that the classification is Epicurus's own, and later writers sometimes put friendship in the necessary group and sometimes elsewhere. We follow the table above.

  - type: mcq
    id: sort
    title: "Which kind of desire?"
    prompt: |
      According to Epicurus, how would you classify the desire for a marble statue of yourself in the town square?
    options:
      - text: "Empty: it chases fame, which cannot give the security it promises."
        correct: true
        feedback: |
          Yes. The Stanford Encyclopedia names fame in the form of statues as an example.
      - text: "Natural and necessary: everyone needs to be remembered."
        feedback: |
          Food and shelter are necessary, but being remembered with a statue is not needed for survival or calm.
      - text: "Natural but unnecessary: it is a pleasant luxury, like a fine meal."
        feedback: |
          A fine meal pleasure can be enjoyed and let go. The statue is tied to a desire that never fills (more fame), which is why it counts as empty.
    explanation: |
      The test, according to Epicurus: does satisfying the desire bring lasting calm, or does it only create new wants?

  - type: text
    id: kinds
    title: "Two kinds of pleasure"
    body: |
      Epicurus also distinguishes two kinds of pleasure. The terms *kinetic* (from the Greek for motion) and *katastematic* (a settled state) are the standard scholarly labels. A *kinetic* pleasure is a process: eating while hungry, drinking while thirsty, the movement from lack to filling. A *katastematic* pleasure is a stable state: being fed, free of pain, undisturbed. The goal of that second kind of pleasure is *ataraxia*, calm of mind, together with *aponia*, absence of bodily pain.

      According to Epicurus's *Principal Doctrines* III (Hicks translation), "the magnitude of pleasure reaches its limit in the removal of all pain." That is, once pain is gone, pleasure cannot be raised further; it can only be varied.

      Two things to keep separate. First, according to scholars, the evidence for the two-kinds distinction comes largely from Cicero's *On Ends*, written by a critic, and a few scholars doubt it. Second, experts agree that Epicurus saw the settled state as the highest good but disagree about how to understand the relation between the two kinds. We do not settle it. The fair summary: according to the sources, the calm state is the target, and processes are worth having when they do not disturb it.

  - type: mcq
    id: kinds-q
    title: "Process or state?"
    prompt: |
      According to the standard reading of Epicurus, which of these is a *katastematic* pleasure?
    options:
      - text: "The settled state of being fed, free of pain and untroubled."
        correct: true
        feedback: |
          Yes. It is a stable state, and the highest pleasure on this reading.
      - text: "The enjoyment of eating while still hungry."
        feedback: |
          That is the textbook kinetic pleasure: a process of filling a lack.
      - text: "A thrilling night out."
        feedback: |
          Thrills are processes. They can be pleasant, but on this reading they are not the highest pleasure and may disturb calm.
    explanation: |
      Layer: the labels are scholarly, and the exact relation of the two kinds is live debate.

  - type: text
    id: tetra
    title: "A four-part remedy"
    body: |
      The Epicureans summed their advice in four short lines, called the *tetrapharmakos*, "the four-part remedy". The word is a medical image: a drug made of four ingredients. According to a reference summary, the first four of the *Principal Doctrines* contain the four lines, and the papyrus that gives the four-line version comes from the Epicurean Philodemus. Sources differ on whether Epicurus himself or later followers shaped the short form.

      The four lines, in essence: do not fear the gods; do not worry about death; the good is easy to get; the terrible is easy to endure. The first two remove fears. The third says the natural and necessary desires are cheap to satisfy. The fourth says pain, according to Epicurus's *Principal Doctrines* IV, is either mild and long or sharp and short, so it does not last long at its worst.

  - type: mcq
    id: tetra-q
    title: "Which line removes which trouble?"
    prompt: |
      According to the four-part remedy, which line deals with the worry that we will lack what we need for a good life?
    options:
      - text: "The good is easy to get."
        correct: true
        feedback: |
          Yes: the natural and necessary desires are cheap to meet, so we are not doomed to want.
      - text: "Do not fear the gods."
        feedback: |
          That line is about fear of divine punishment, not about scarcity.
      - text: "Do not worry about death."
        feedback: |
          That line is about fear of ending, not about getting what we need.
    explanation: |
      The remedy has two lines against fear and two against two ways of being unhappy: wanting too much and fearing pain.

  - type: text
    id: death
    title: "Death is nothing to us"
    body: |
      The best known Epicurean argument is about death. According to the *Letter to Menoeceus* (Hicks translation), "death, therefore, the most awful of evils, is nothing to us, seeing that, when we are, death is not come, and, when death is come, we are not." Here is a reconstruction, following the Stanford Encyclopedia of Philosophy's account:

      **P1.** Only experiences are good or bad for us (good and bad lie in sensation).
      **P2.** Death is the end of experience, so being dead is not an experience.
      **C.** So death is neither good nor bad for the one who dies, and there is nothing to fear.

      The argument is valid: if P1 and P2 are true, C follows. The question is whether P1 and P2 are true. The Stanford Encyclopedia notes that the argument fits being dead better than dying, since dying can hurt.

  - type: mcq
    id: death-q
    title: "Which premise would a critic reject?"
    prompt: |
      Some critics say: "A person who dies at 30 has lost decades of friends, work and joy, even though they never feel the loss." Which premise of the argument does this challenge, and how?
    options:
      - text: "P1: it says some things can be bad for us without being felt, such as losing the goods we would have had."
        correct: true
        feedback: |
          Yes. This is the deprivation view, which Thomas Nagel defended in "Death" (1970). It keeps P2 and rejects P1.
      - text: "P2: it says people continue to have experiences after death."
        feedback: |
          That is the reply of a believer in an afterlife, and it is a different objection. The deprivation reply accepts that death ends experience.
      - text: "The validity of the argument: C does not follow from P1 and P2."
        feedback: |
          If P1 and P2 are granted, C follows. The weak point is whether P1 is true.
    explanation: |
      Layer: the logic is fact. P1 is live debate. Whether there is an afterlife (which would deny P2) is a commitment.

  - type: text
    id: symmetry
    title: "Before birth, after death"
    image:
      src: img/nagel.webp
      alt: "Portrait photograph of the philosopher Thomas Nagel"
      caption: "Thomas Nagel (born 1937), American philosopher who argued in 1970 that death is bad because it deprives us of goods."
      credit: "Nagelt, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Nagel_(cropped).jpg"
    body: |
      Lucretius adds a *symmetry argument*, according to the Stanford Encyclopedia. We do not mind the long time before our birth, so there is nothing to mind in the equally long time after death. Replies, according to the same source: birth begins a good life while death ends it, so the two are not alike; we rationally care more about our future than our past (a bias argued by Derek Parfit); and Nagel replied that a person could have lived longer but could not have been born much earlier, though he admitted that this depends on assumptions about origins that are questionable.

      Two views, then. According to Epicureans, fear of death is a mistake, and calm follows. According to Nagel and other deprivationists, death is bad when it takes away goods, and the fear is not a mistake. Both agree that death does not hurt after it happens; they differ on whether harm requires experience.

  - type: mcq
    id: symmetry-q
    title: "The best reply"
    prompt: |
      According to the Stanford Encyclopedia, which is a standard reply to Lucretius's symmetry argument?
    options:
      - text: "Birth starts a good life while death ends it, and we rationally care more about our future than our past."
        correct: true
        feedback: |
          Yes. The two periods of nonexistence are not alike for the person who has a stake in the future.
      - text: "We do mind the time before our birth, as much as the time after death."
        feedback: |
          Most people do not, so this reply fails the premise. The better reply grants this and denies the symmetry.
      - text: "Nonexistence is painful for the one who does not exist."
        feedback: |
          Epicurus and Lucretius would agree this is false (nothing is felt). The reply accepts that and argues that harm can still occur.
    explanation: |
      The argument is open. SEP calls one reading of it weak and grants a kernel of truth in another. We do not settle it here.

  - type: text
    id: physics
    title: "Atoms, swerves and quiet gods"
    body: |
      Why does an ethics school teach physics? According to the Stanford Encyclopedia, Epicurus's system was designed to hang together and serve its ethical aims. He regarded the fear of death and of divine punishment as the main cause of human anxiety, and physics was meant to remove them.

      The physics, according to the Stanford Encyclopedia and Lucretius: the world is made of atoms (small indivisible particles) moving in void (empty space). An occasional random sideways *swerve* of an atom, called the *clinamen*, keeps atoms from falling in parallel lines and lets them collide, and some sources say it makes room for human freedom. (Its exact role is debated; for Lucretius we have the only surviving source of it.) According to the Stanford Encyclopedia of Philosophy, book 3 of Lucretius's poem argues that the soul is mortal, which supports the death argument.

      The gods, according to the Stanford Encyclopedia, exist but are blessed and unconcerned with human affairs. Many ancient sources place them in the spaces between worlds (the *intermundia*). So there is nothing to fear from them, and nothing to bargain for. Scholars debate whether the gods are literal beings or ideals of happiness. For believers who hold that God governs the world and answers prayer, this view is a sharp disagreement, and that disagreement is a commitment, not a fact.

  - type: mcq
    id: physics-q
    title: "What is the physics for?"
    prompt: |
      According to Epicurean writers, why does the physics matter for the good life?
    options:
      - text: "It removes the fear of the gods and of death, the main sources of anxiety."
        correct: true
        feedback: |
          Yes. The study of nature serves calm of mind.
      - text: "It is interesting in itself and has nothing to do with how to live."
        feedback: |
          The school held the opposite: the physics is meant to serve the ethics.
      - text: "It proves that pleasure is the only good."
        feedback: |
          Atoms do not decide what is good. The physics clears away fears; the claim that pleasure is the good is a separate commitment.
    explanation: |
      Layer: that Epicurus taught atomism is fact. Whether atomism supports his ethics is a debate.

  - type: text
    id: friends
    title: "Friends, simple living and retreat"
    body: |
      According to the Stanford Encyclopedia, Epicurus placed an extremely high value on friendship and encouraged Epicureans to form communities. He wrote, according to that source, that "friendship goes dancing round the world", and held that the wise person would die for a friend rather than betray him.

      The same encyclopedia says Epicurus advised avoiding politics where possible. The Greek slogan *lathe biosas*, usually translated "live unnoticed", is attributed to him by Plutarch, a later and hostile critic, so we treat it as secondary. Scholars disagree on how far he meant a retreat from public life: some read it as a withdrawal from the crowd, others say he had a distinctive political philosophy of his own.

      Put together: a few good friends, simple food, a garden, no ambition. According to Epicurus, that is what the calm life looks like. A critic might say it is a way to avoid duty; a defender would say it is a way to avoid the things that make people miserable.

  - type: mcq
    id: friends-q
    title: "What would a fair reader say?"
    prompt: |
      A student says: "Epicurus told people to live for pleasure, so he would approve a life of nightly feasts." Which reply is fair to the sources?
    options:
      - text: "No: the *Letter to Menoeceus* says it does not mean the pleasures of the prodigal, and favours simple living, friends and sober reasoning."
        correct: true
        feedback: |
          Yes. According to the letter, a pleasant life is not an unbroken succession of drinking bouts, but sober reasoning about what to choose and avoid.
      - text: "Yes: pleasure is the good, so more pleasure is always better."
        feedback: |
          That is a different kind of hedonism. According to Epicurus, once pain is removed, pleasure is only varied, and feasts bring pain later.
      - text: "No: Epicurus did not care about pleasure at all."
        feedback: |
          He did: pleasure is the end. The question is what pleasure is.
    explanation: |
      Layer: what the texts say is fact. Whether this is a good way to live is a commitment.

  - type: text
    id: objections
    title: "Three objections"
    image:
      src: img/mill.webp
      alt: "Oil portrait of John Stuart Mill"
      caption: "John Stuart Mill (1806 to 1873), painted by G. F. Watts; in Utilitarianism (1863) he argued that pleasures differ in quality as well as quantity."
      credit: "George Frederic Watts, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Stuart_Mill_G_F_Watts.jpg"
    body: |
      **The swine objection.** A critic says that a philosophy of pleasure fits only pigs. According to the Stanford Encyclopedia, Mill reports that Thomas Carlyle called hedonism a "doctrine worthy only of swine" (the phrase is Carlyle's, as Mill reports it), and Plato's *Philebus* says a life of pleasure alone would be the life of an oyster, not of a person. Mill answered that pleasures differ in quality. An Epicurean reply is simpler: the pleasure meant is calm, which needs prudence, honour and justice. According to the Stanford Encyclopedia, prudence is the chief virtue for Epicurus, and the other virtues depend on it.

      **The experience machine.** Robert Nozick, in *Anarchy, State, and Utopia* (1974), asked whether you would plug into a machine that gives any experience you choose. If pleasure were the only good, you should. According to the Stanford Encyclopedia, Nozick concluded that something matters to us besides experience. A hedonist can bite the bullet or say the plan is a bad way to get lasting calm.

      **Pleasure and virtue.** If virtue is only a means to pleasure, would a hedonist cheat when no one is watching? According to the Stanford Encyclopedia, Epicurus ties a pleasant life to living prudently, honourably and justly. Whether that tie holds in every case, including when no one is watching, is what critics press.

  - type: mcq
    id: objections-q
    title: "What does the machine test?"
    prompt: |
      Nozick's experience machine is meant as a test of which claim?
    options:
      - text: "Ethical hedonism: the claim that pleasant experience is the only thing good in itself."
        correct: true
        feedback: |
          Yes. If most people would decline the machine, then something besides experience matters to them.
      - text: "The claim that atoms exist."
        feedback: |
          The machine is about what is good, not about physics.
      - text: "The claim that death is nothing to us."
        feedback: |
          That is the topic of another argument. The machine tests the view that experience is all that counts.
    explanation: |
      Layer: that Nozick proposed it is fact. Whether people's refusal shows hedonism is false is debated.

  - type: text
    id: compare
    title: "Where views part"
    body: |
      Epicureans, Stoics and religious traditions all ask how to live well when we cannot control events. We name three contrasts.

      The Stoics, according to their sources, say that only virtue is good and that the universe is ordered by reason. The Epicureans say pleasure, as calm, is the good and that the universe is atoms with no purpose. Religious traditions differ among themselves. Many hold that God cares about human life, and that fear of God is not to be removed but is part of the way to live well, which Epicurus's view of the gods denies. Others (some strands of Buddhism, for example) also value calm, and the comparison is left for the lesson on Buddhist traditions.

      The layers: what each school and tradition holds is fact. How to read the pleasure and death arguments is live debate. Whether pleasure is the good, whether the gods are as Epicurus says, and whether death is nothing to us are commitments.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Match the claim to its layer. "Pleasure is the only thing good in itself."
    options:
      - text: "A commitment about value, held by hedonists and rejected by others."
        correct: true
        feedback: |
          Yes. It can be argued for and against (the machine, the swine objection), but no experiment decides it.
      - text: "Established fact, because people seek pleasure."
        feedback: |
          That people seek pleasure is observation. Whether pleasure is the only good is a claim about value.
      - text: "Scholarly consensus, because most philosophers agree."
        feedback: |
          Many philosophers disagree: Stoics, Aristotelians, religious thinkers and others.
    explanation: |
      The method of the course: fact (what the school said) first, then debate (how to read it), then commitment (whether to adopt it).

  - type: text
    id: summary
    body: |
      **Next:** Epicurus and the Stoics ask how to live with what we cannot control. Another family asks a different question: what should we do with what we can? The lesson Humanism, Secular and Religious turns to humanism, secular and religious, which puts the human being and human flourishing at the centre.
