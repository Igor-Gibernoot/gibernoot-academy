id: ch24-skeptic
title: "Skepticism and the Examined Life"
kind: concept
own: |
  The setting: **skepticism** is the practice of questioning what we are sure of. Told *according to* the ancient sources, it comes in several forms that differ on one point: whether doubt ends in "I cannot know" or in "I keep looking".
  - **The examined life.** According to Plato's *Apology* (Socrates, 469 to 399 BCE), Socrates told the jury that {{ the unexamined life is not worth living for a human being }}. According to the same text, his wisdom is small and honest: {{ what he does not know he does not think he knows }}.
  - **Pyrrhonism.** According to the Stanford Encyclopedia, Pyrrho (about 365 or 360 to about 275 or 270 BCE) left no writings, and the school was later developed. Its method is **epoché** (suspension of judgement: neither yes nor no), and its aim is **ataraxia** (freedom from worry):
  $$\begin{aligned}\text{equal opposed arguments}&\Rightarrow\text{epoché}\\ &\Rightarrow\text{ataraxia}\end{aligned}$$
  - **Three kinds of inquirer.** According to Sextus Empiricus, dogmatists claim to have found the truth, Academics claim it cannot be grasped, and Pyrrhonists {{ keep inquiring and suspend judgement }}. Sextus himself calls the school "Zetetic" (inquiring) and "Ephectic" (suspending).
  - **The five modes of Agrippa.** According to the Stanford Encyclopedia, they are disagreement, regress, relativity, hypothesis and circularity. Together they push any claim into one of three dead ends: {{ endless regress, circular support, or an unsupported assumption }}.
  - **The reply to "you cannot act".** The charge (*apraxia*) says that without beliefs a skeptic could not act. According to Sextus, the skeptic follows appearances as a practical guide, through {{ nature, the compulsion of feelings, custom and tradition, and the arts one has learned }}.
  - **Hume's middle path.** According to Hume (*Enquiry*, 1748), extreme Pyrrhonism cannot be kept up in daily life, and the lasting form is **mitigated skepticism**: {{ lower our confidence and limit the scope of our inquiries }}.
  - **Three routes to calm.** Epicureans, according to their texts: understand nature and sort desires, so fear and empty wants fall away. Stoics: judge only what is up to us. Pyrrhonists: suspend judgement, so no belief is left to be disturbed. They share the goal and differ on whether calm needs *some* beliefs.
  - **Where thoughtful people part ways.** Fact: who wrote what, and what the schools claimed. Live debate: how far Pyrrhonists really lacked all belief, and how much Pyrrho taught himself. Commitment: whether doubt is a relief or a loss.

cards:
  - type: text
    id: hook
    title: "Something you are sure of"
    body: |
      Pick one thing you are completely sure of. Maybe that the sun will rise tomorrow, or that your closest friend is honest, or that your deepest conviction about God (yes, no or maybe) is right.

      Now ask what it would take to make you doubt it. A friend's disagreement? A good argument you cannot answer? A clever person who has the opposite view and is just as sure?

      Doubt feels like a burden, a loss of footing. Yet some ancient philosophers said the opposite: that giving up the certainty is what brings peace. This lesson follows two ideas about doubt, the **examined life** of Socrates and the **suspension of judgement** of the Pyrrhonists. As always, we learn what each side holds and why, and we do not decide who is right.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      In everyday speech, a "skeptic" is someone who doubts a particular claim, such as a miracle or a health trend. In the ancient schools of philosophy, what do you think a skeptic mostly was?
    options:
      - text: "Someone who suspended judgement on questions of how things really are, and who kept inquiring."
        correct: true
        feedback: |
          Yes, according to Sextus Empiricus. His school was called "Zetetic" (inquiring) and "Ephectic" (suspending). The ancient skeptic was not mainly a debunker of one claim but someone who held back from settling the deep questions.
      - text: "Someone who was certain that nothing can be known."
        feedback: |
          This is a tempting reading, but according to Sextus it describes the Academics, a different group. "Nothing can be known" is itself a strong claim, and the Pyrrhonists avoided making it.
      - text: "Someone who rejected all religion."
        feedback: |
          Skepticism, as a method, is not atheism. The ancient skeptics suspended judgement on the gods as on everything else, and a person can doubt out of reverence as well as out of disbelief.
    explanation: |
      Layer: the names and the school's own account are fact. How far the ancient skeptics lived without any belief is live debate, which we meet later.

  - type: text
    id: socrates
    title: "Socrates: examine, and admit what you do not know"
    image:
      src: img/socrates.webp
      alt: "Marble head of Socrates with a bald crown and a thick beard, in the Louvre"
      caption: "A Roman marble portrait of Socrates (469 to 399 BCE), dated to about 75 to 125 CE, which the Louvre catalogue links to a lost bronze by Lysippos, so it shows a later artist's idea of his face."
      credit: "Copy of Lysippos (?), CC BY 2.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Socrates_statue_at_the_Louvre,_8_April_2013_(cropped).jpg"
    body: |
      Socrates (469 to 399 BCE) wrote nothing. According to the Stanford Encyclopedia, we know him mainly through Plato and Xenophon, and also through Aristophanes, and the sources do not always agree. Plato's *Apology* is his account of the speech Socrates gave at his trial in 399 BCE, where he was charged with irreverence toward the gods of Athens and with corrupting the young.

      According to the *Apology* and the Stanford Encyclopedia, his friend Chaerephon reported an oracle at Delphi, and Socrates took it as a mission to examine others. Questioning a man with a reputation for wisdom, he concluded (Fowler's translation, 21d) that he was wiser than that man in one small thing: "what I do not know I do not think I know either."

      After the guilty verdict, he refuses to stop questioning people. According to the *Apology*, he says that talking every day about virtue, and examining himself and others, is the greatest good for a person, and "the unexamined life is not worth living" (38a). The Stanford Encyclopedia renders it "the unexamined life is not worth living for a human being."

  - type: mcq
    id: socrates-two
    title: "Two readings of the examined life"
    prompt: |
      According to the *Apology*, Socrates calls the unexamined life not worth living. A critic and a defender read this differently. Which pair states them fairly?
    options:
      - text: "A critic: the claim is too harsh, since many people live good lives without philosophy. A defender: it says a life lived on unchecked beliefs risks missing what matters, so checking them is part of living well."
        correct: true
        feedback: |
          Yes. Both can be steelmanned. The critic points to good lives without argument. The defender reads "examined" widely, as caring whether one's beliefs and values hold up, not as holding a degree in philosophy.
      - text: "A critic: Socrates says everyone must become a professional philosopher. A defender: he says philosophers are better than other people."
        feedback: |
          Neither is in the text. Socrates's claim in the *Apology* concerns what makes a life worth living for a human being.
      - text: "A critic: Socrates proves that nothing can be known. A defender: he proves that everything can be known."
        feedback: |
          He does neither. His claim, according to the *Apology*, is a modest one: he does not think he knows what he does not know.
    explanation: |
      Layer: the wording and where it occurs are fact (but Plato may have shaped his Socrates, which is the "Socratic problem"). How demanding the ideal is, is live debate. Whether examination really makes a life better is a commitment.

  - type: text
    id: pyrrho
    title: "Pyrrho: hold back, and be calm"
    body: |
      Pyrrho of Elis lived, according to the Stanford Encyclopedia, from about 365 or 360 to about 275 or 270 BCE (the dates are estimates). He wrote nothing, and what we know comes mainly from his pupil Timon. According to the same source, he allegedly joined Alexander the Great's expedition to India, and Diogenes Laertius says he met the Indian Gymnosophists ("naked wise men") there. Scholars debate how much that shaped him.

      The school named after him, **Pyrrhonism**, rests on two Greek words. **Epoché** is suspension of judgement: on a question where the arguments on both sides seem equal in force, you neither affirm nor deny. **Ataraxia** is freedom from worry. According to the Stanford Encyclopedia, Timon described the result for skeptics as first speechlessness, then freedom from worry.

      The thought is that much of our distress comes from believing that things are really good or really bad. If you hold back on that belief, there is less to be disturbed. Note that this is an account of how the school saw it, not a proof that it works.

      The fullest surviving account is the *Outlines of Pyrrhonism* by Sextus Empiricus, a later Pyrrhonist writer. Diogenes Laertius also gives an account, in his *Lives of Eminent Philosophers*, book 9.

  - type: text
    id: three-kinds
    title: "Three kinds of inquirer"
    body: |
      At the start of the *Outlines*, according to Sextus, people who investigate something may end in one of three ways. They may claim to have **found** it. They may declare it cannot be **grasped**. Or they may **keep inquiring**.

      Sextus assigns the first to the dogmatists (he names Aristotle and Epicurus as examples), the second to the Academics (he names Cleitomachus and Carneades), and the third to the Pyrrhonists, the skeptics proper. According to the Stanford Encyclopedia, the Academic Carneades offered the "persuasive" (*pithanon*) as a guide in place of a certain truth.

      The Pyrrhonists had a reason to avoid the Academic line. "Nothing can be grasped" is itself a claim about everything, and so it is a belief. A true Pyrrhonist, according to Sextus, withholds even that, which keeps the search open.

  - type: mcq
    id: kinds-mcq
    title: "Who says what?"
    prompt: |
      Someone says: "I do not claim the truth about whether the soul survives death can be found, and I do not claim it cannot be found. I keep looking, and meanwhile I withhold judgement." According to Sextus, which position is this?
    options:
      - text: "Pyrrhonist suspension of judgement."
        correct: true
        feedback: |
          Yes. They neither claim to have found the answer nor claim it cannot be found. They keep inquiring.
      - text: "Academic skepticism."
        feedback: |
          According to Sextus, the Academics hold that the truth cannot be grasped. That is a claim, which the speaker here does not make.
      - text: "Dogmatism."
        feedback: |
          Dogmatists claim to have found the truth. Here nothing is claimed as found.
      - text: "Atheism."
        feedback: |
          Atheism denies that there is a god. The speaker suspends judgement on a different question, and does not deny anything.
    explanation: |
      Layer: the three-way sorting is Sextus's own, so it is a view of one school about its rivals. Whether the Academics deserve the label is debated, since Sextus is not a neutral reporter.

  - type: text
    id: agrippa
    title: "How do you suspend? The five modes"
    body: |
      Why should arguments on both sides come out equal? The skeptics built tools to produce that result. According to the Stanford Encyclopedia, Aenesidemus is credited with the **ten modes**, arguments from differences: among animals, among humans, among senses, among customs and others. If different kinds of animals perceive the same thing differently, which of them perceives it as it is?

      A later, shorter set is the **five modes of Agrippa**: disagreement (*diaphonia*), regress (*eis apeiron ekballonta*), relativity (*pros ti*), hypothesis and circularity (*ton diallelon*). Diogenes Laertius reports them in book 9, sections 88 and 89.

      Here is one worked example. Take the claim "my memory of yesterday is reliable." Why? Because it matched what my friend said. Why trust my friend? Because she was right before. How do I know she was right before? Because my memory says so. The chain has come back to its start. According to the modes, any answer ends in one of three places: it goes on forever (regress), it loops (circularity), or it stops at something merely assumed (hypothesis).

  - type: mcq
    id: modes-mcq
    title: "Which mode is it?"
    prompt: |
      A skeptic is asked to justify a belief. She replies: "You will say I believe X because of Y. If so, then I believe Y because of Z, and Z because of something further, and so on without end." Which of Agrippa's five modes is she using?
    options:
      - text: "Regress."
        correct: true
        feedback: |
          Yes. Each reason needs a further reason, and the demand never ends.
      - text: "Circularity."
        feedback: |
          Circularity would be a chain that loops back to X. Here the chain just keeps going.
      - text: "Disagreement."
        feedback: |
          Disagreement points to wise people who disagree about the matter. No one is mentioned here.
      - text: "Relativity."
        feedback: |
          Relativity says that how a thing appears depends on the viewer or its situation. This is about the structure of reasons.
    explanation: |
      Layer: the names are fact. Whether the modes really succeed is live debate. Defenders of foundationalism hold that some beliefs need no further reason, and so stop the regress, which the skeptic calls the mode of hypothesis.

  - type: text
    id: apraxia
    title: "Can you live without beliefs?"
    body: |
      The strongest objection from ancient rivals was practical. According to the Stanford Encyclopedia, it is called the **apraxia charge** (*apraxia* means inaction): without beliefs, a skeptic could not act. To eat you must believe the bread is food. To cross a road you must believe the car is coming.

      The skeptics, according to Sextus, had a reply. They do not deny that things appear to them a certain way. The bread tastes good, and the skeptic does not deny that. What they suspend is judgement on how things are *in themselves*. According to Sextus, appearances are the practical criterion, the guide to action.

      The Stanford Encyclopedia lists the **fourfold** way that appearances guide a life: the guidance of nature (we perceive and think), the compulsion of the feelings (hunger makes us eat), the handing down of customs and laws, and the instruction in the arts we have learned. Thirst, for instance, forces assent, and the skeptic drinks.

  - type: mcq
    id: apraxia-mcq
    title: "What guides the skeptic's action?"
    prompt: |
      According to Sextus, how can a Pyrrhonist act at all, having suspended judgement on how things really are?
    options:
      - text: "By following how things appear, through nature, the feelings, custom and learned skills, without claiming that the appearances show reality."
        correct: true
        feedback: |
          Yes. The skeptic keeps the appearance ("this seems sweet") and withholds only the claim about what is behind it.
      - text: "By secretly holding firm beliefs and hiding them."
        feedback: |
          That is the critic's suspicion, which we take up next. It is not Sextus's own account, which says the skeptic simply does not assert them.
      - text: "By acting at random, since no reason is available."
        feedback: |
          Random action would also fail, as the skeptic would starve. Sextus says action follows appearances, custom and need, which are not random.
    explanation: |
      Layer: the fourfold account is documented. Whether it really avoids belief is live debate, and the next card gives the critic.

  - type: text
    id: critics
    title: "Does it work? Two views"
    body: |
      Critics say that "follow appearances" smuggles belief back in. If I say "it seems the road is clear" and then step out, I act as if I believe it. Scholars read the school in two ways. On a strict reading, the Pyrrhonist lacks all beliefs, and the objection bites. On a milder reading, only strong claims about how things are in themselves are suspended, and then the objection loses much of its force. We name the two readings as ours, and do not attribute the labels to a source.

      A second critic says the aim itself is doubtful. Is a life of suspended judgement a better life, or only a quieter one? Defenders reply that calm is exactly what the school promised, and that it was offered as a way to live, so the test is whether it works for those who try it, and not whether it satisfies the argument.

      Both sides can be stated fairly. The critic asks for a theory that explains action. The defender offers a practice and invites us to try it.

  - type: text
    id: hume
    title: "Hume's middle path"
    body: |
      David Hume (1711 to 1776) knew these ancient debates. In his *Enquiry concerning Human Understanding* (1748), according to the Stanford Encyclopedia, he discusses an extreme Pyrrhonian skepticism and rejects it as harmful and psychologically impossible to sustain. What he endorses is **mitigated** (or "Academic") skepticism, which recommends lowering our degrees of confidence and limiting the scope of our inquiries.

      Notice how this changes the picture. For Hume the point of doubt is not calm. It is modesty: hold beliefs with confidence in proportion to the evidence, and avoid questions that go beyond what human reason can reach. Whether such a limit is wise, or only a pause before the deeper questions, is for each reader to weigh.

  - type: mcq
    id: hume-mcq
    title: "Hume versus Pyrrho"
    prompt: |
      According to Hume (1748), what should a thoughtful person take from skepticism?
    options:
      - text: "Reduce confidence in proportion to the evidence, and limit inquiries to what human understanding can reach, because extreme skepticism cannot be sustained in daily life."
        correct: true
        feedback: |
          Yes, this is mitigated skepticism, in the Stanford Encyclopedia's account.
      - text: "Suspend judgement on everything, to reach calm."
        feedback: |
          That is the Pyrrhonist aim, which Hume rejects as harmful and psychologically impossible to sustain.
      - text: "Trust one's first impressions and doubt nothing."
        feedback: |
          Hume asks for a lowering of confidence, not a refusal to doubt. This is closer to the dogmatist, who claims to have found the truth.
    explanation: |
      Layer: what Hume wrote is fact. Whether mitigated skepticism is a stable position or only a moderate form of the same doubt is live debate.

  - type: text
    id: routes
    title: "Three routes to calm"
    body: |
      This course has now met three ancient answers to how to be at peace. They share a goal, **ataraxia**, and they differ on the route.

      | School | Where distress comes from | The route |
      |---|---|---|
      | Epicureans | fear of gods and death, and empty desires | study nature, sort desires |
      | Stoics | false judgements about what matters | judge only what is up to us |
      | Pyrrhonists | strong beliefs about how things are | suspend judgement |

      Each is told here according to its own texts. A Stoic would ask the skeptic: is suspending *everything* possible, and is it not itself a decision about what to value? A Pyrrhonist would ask the Stoic: on what ground do you know that only your judgements are up to you? The Epicurean would ask both for evidence that peace comes from thought and not from a quiet life with friends.

  - type: mcq
    id: routes-mcq
    title: "Which route?"
    prompt: |
      Someone says: "Do not seek to know what the gods or the universe are really like. Hold back, and you will find nothing worth getting upset about." Which ancient school does this best describe?
    options:
      - text: "Pyrrhonism."
        correct: true
        feedback: |
          Yes: it removes distress by suspending judgement rather than by building a view of nature.
      - text: "Epicureanism."
        feedback: |
          Epicureans, according to their texts, studied nature to remove fear, so they *do* seek to know what the universe is like.
      - text: "Stoicism."
        feedback: |
          Stoics hold that some judgements are right and others false, and they aim to correct them, not to suspend them all.
    explanation: |
      Layer: the contrast comes from the schools' own accounts. Whether calm is better won by belief or by its absence is a commitment.

  - type: mcq
    id: layers
    title: "Which layer is the claim?"
    prompt: |
      Label each claim: (1) established fact, (2) live debate, (3) commitment. Which claim belongs to layer 2, live debate?
    options:
      - text: "Whether Pyrrhonists lived without any belief at all, or only without strong beliefs about how things are in themselves."
        correct: true
        feedback: |
          Yes. Scholars read the school both ways, so it is a live debate.
      - text: "That Plato's *Apology* reports Socrates saying the unexamined life is not worth living for a human being."
        feedback: |
          That is a documented fact about a text (layer 1), whatever one thinks of the saying.
      - text: "That a life of suspended judgement is better than a life of firm conviction."
        feedback: |
          That is a value commitment (layer 3). Evidence can inform it, but it is not settled by data.
    explanation: |
      Skepticism is a good test of the three layers. The history is fact, how to read the school is debate, and whether doubt brings peace is a commitment about what a good life is.

  - type: text
    id: summary
    body: |
      **Back to the hook.** The thing you were sure of: Socrates would ask you to examine it, and to admit what you do not know. A Pyrrhonist would ask you to hold back if the arguments are equal. Hume would ask you to match your confidence to the evidence. They disagree on whether doubt should end in peace, in modesty or in an ongoing search.

      **What stays open:** whether doubt is a relief or a loss, whether suspension of judgement is truly possible, and whether calm needs beliefs.

      **Next:** the lesson Pragmatism and Process turns to views that judge ideas by what they do, and that see reality as made of change rather than of fixed things.
