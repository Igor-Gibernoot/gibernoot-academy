id: ch24-humanism
title: "Humanism, Secular and Religious"
kind: concept
own: |
  The setting: **humanism** is a family of views that put the human being, with dignity, reason and responsibility, at the centre of thought and ethics. Told *according to* its own documents and historians, it has a Renaissance form, an Enlightenment form, a secular form and several religious forms, and they do not agree on where dignity comes from.
  - **Renaissance humanism.** According to historians, it began in Italy as a programme of education, the *studia humanitatis*: {{ grammar, rhetoric, history, poetry and moral philosophy }}, read through the classical authors. Petrarch (1304 to 1374) is often called its father. Pico della Mirandola (1463 to 1494) wrote, in 1486, a speech later titled *Oration on the Dignity of Man*. Erasmus (died 1536) was its leading scholar in northern Europe, and a Christian.
  - **Enlightenment humanism.** According to Kant, in *What Is Enlightenment?* (1784), the motto is {{ *sapere aude*, "dare to know": use your own understanding without guidance from another }}, and the one thing needed is the freedom to use reason publicly. Critics note that the "universal man" of the era left out many people by gender and race.
  - **Secular humanism.** According to Humanists International's 2022 declaration, humanists affirm "the worth and dignity of the individual", hold that morality needs "no source outside of humanity", and say that "science provides the means, human values must define the ends". The Humanist Manifestos (1933, 1973, 2003) are earlier statements, and the first one called humanism a religion without a supernatural base.
  - **Religious humanisms.** *Christian humanism*: according to Maritain, in *Integral Humanism* (1936), a humanism centred on God is {{ integral, while a humanism centred on man alone is partial }}. *Islamic humanism*: according to Arkoun and Kraemer, scholars of the Buyid age (10th century) such as Miskawayh studied the human being through philosophy and literature, inside a Muslim culture. *Humanistic Judaism* (Sherwin Wine, from 1963) is nontheistic and keeps Jewish culture.
  - **What they share, and the split.** All affirm {{ human dignity, the use of reason, and an ethics aimed at human flourishing }}. They split on the source of dignity: according to secular humanists, it needs no source beyond the human; according to religious humanists, it rests on God.
  - **Objections.** Believers ask: if dignity comes from nothing beyond us, what grounds it? Secular humanists reply that dignity can rest on shared human capacities and needs. According to Foucault, in *The Order of Things* (1966), "man" as an object of knowledge is a recent invention that could be erased "like a face drawn in sand at the edge of the sea"; defenders reply that a historical origin does not remove the claim to respect.
  - **Where thoughtful people part ways.** Fact: who wrote which text, and what the declarations say. Live debate: whether Renaissance humanism was secular, and whether "Islamic humanism" is the right label. Commitment: whether dignity needs God, and whether the human should be the centre at all.

cards:
  - type: text
    id: hook
    title: "No God in the room"
    body: |
      Picture a funeral where nobody mentions God. A friend speaks about the life: the kindness, the stubbornness, the people she helped. Then picture a school whose rule is that every child counts, with no appeal to any scripture.

      Many people find this moving and complete. Others feel something is missing. Both groups ask the same question: can people be good, and find meaning, when the human being is at the centre?

      This lesson follows an answer called **humanism**. We trace where it began, how it split into secular and religious forms, what its documents say, and what its critics reply. As in the whole course, we do not decide who is right. We learn what each side holds and why.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Before any history, what do you think the word "humanism" most plausibly means?
    options:
      - text: "Putting the human being, with dignity and reason, at the centre of thought and ethics."
        correct: true
        feedback: |
          That is the common core. The rest of the lesson shows that people fill it in very differently.
      - text: "The claim that there is no God."
        feedback: |
          This is the most common mix-up. Some humanists are atheists, but others are devout believers. We will meet both, and the definition does not settle the question of God.
      - text: "Kindness to others, as opposed to cruelty."
        feedback: |
          Every ethic recommends kindness. Humanism is a claim about what stands at the centre and what grounds ethics, not only about being nice.
      - text: "The study of the human body."
        feedback: |
          That is anatomy. The word shares its root with Latin *humanitas*, which meant the qualities of a cultured human being.
    explanation: |
      Layer: the word's root is a fact of language. What goes at the centre, and why, is what the schools dispute.

  - type: text
    id: renaissance
    title: "Where the word starts: the Renaissance"
    image:
      src: img/pico.webp
      alt: "Painted portrait of Pico della Mirandola, a young man with long hair in dark clothing"
      caption: "A later painted portrait of Giovanni Pico della Mirandola (1463 to 1494), who wrote the speech now called the Oration on the Dignity of Man."
      credit: "Unknown author (French art), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Ch%C3%A2teau_de_Beauregard_-_Giovanni_Pico_della_Mirandola.jpg"
    body: |
      According to historians, Renaissance humanism began in Italy in the 14th century as an educational reform, not as a rival to religion. Its programme was the *studia humanitatis* ("studies of humanity"): grammar, rhetoric, history, poetry and moral philosophy, learned from the writers of ancient Greece and Rome. Petrarch (1304 to 1374) is often called its father. According to the Wikipedia article on the movement, he urged the study of pagan antiquity as a way to preserve Christianity. Britannica says he argued for continuity between classical culture and the Christian message.

      Pico della Mirandola (1463 to 1494) is the best-known voice on dignity. According to the Stanford Encyclopedia of Philosophy, he wrote a speech in 1486 to open a public debate on his 900 theses. He never delivered it, and others gave it the title *Oration on the Dignity of Man* later. Its opening has the Creator tell Adam that he alone may shape himself into what he wants to be. Many readers take this as a celebration of human freedom.

  - type: mcq
    id: pico-two
    title: "Two readings of Pico"
    prompt: |
      Pico's speech opens with the Creator telling Adam that he may shape himself into what he wants to be. According to the Stanford Encyclopedia, how do scholars read this?
    options:
      - text: "Many read it as a celebration of human freedom and dignity, while the encyclopedia stresses that Pico's own goal was for people to rise towards the angels and unite with God."
        correct: true
        feedback: |
          Yes. Both readings are on the table: the speech has been taken as a manifesto of human freedom, and Pico himself aimed at union with God. Which reading captures the text better is a scholarly debate.
      - text: "As a plain argument that God does not exist, so humans must make themselves."
        feedback: |
          The speech itself opens with a Creator addressing Adam, so it is framed inside a religious picture. Reading it as an argument for atheism goes beyond the text.
      - text: "As a medical essay on the human body."
        feedback: |
          The speech is about human nature and the pursuit of knowledge, not medicine.
    explanation: |
      Layer: that the speech exists, its date and its opening are fact. Whether it is a manifesto of secular dignity or of a religious ascent is live scholarly debate.

  - type: mcq
    id: studia
    title: "What was in the curriculum?"
    prompt: |
      According to historians of the Renaissance, which subjects made up the *studia humanitatis*?
    options:
      - text: "Grammar, rhetoric, history, poetry and moral philosophy."
        correct: true
        feedback: |
          Yes. It was a literary and moral education, read through the classics, and it did not include natural science or theology.
      - text: "Physics, astronomy, medicine and law."
        feedback: |
          These belonged to other faculties. The humanist programme was about language, history and ethics.
      - text: "Theology, logic and metaphysics only."
        feedback: |
          These were the heart of the medieval university course. Humanists turned to language and moral life, though many were also pious.
    explanation: |
      Layer: the list is documented history. How secular the movement was is debated, since most humanists were believing Christians.

  - type: text
    id: enlightenment
    title: "The Enlightenment form: dare to know"
    image:
      src: img/kant.webp
      alt: "Portrait of Immanuel Kant in middle age"
      caption: "Immanuel Kant (1724 to 1804) answered, in 1784, the question of what enlightenment is."
      credit: "Unknown, possibly Elisabeth von Stägemann (Anton Graff school), Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Immanuel_Kant_portrait_c1790.jpg"
    body: |
      In the 18th century the emphasis moved from classical learning to reason as the way to judge everything. According to Wikipedia's article on humanism, thinkers such as Spinoza, d'Holbach and Diderot proposed rationality as a replacement for deism, a step further from religion than the Renaissance humanists had gone.

      The best-known statement is Kant's essay *An Answer to the Question: What Is Enlightenment?* (1784). According to Kant, enlightenment is a person's release from self-imposed tutelage, meaning the inability to use one's understanding without another's guidance. The cause is not lack of intelligence but lack of resolve and courage. His motto is *sapere aude*, "dare to know". According to Kant, the one thing needed is freedom, the freedom to use reason publicly in all matters.

      Critics add a warning, also in the Wikipedia article: the "universal man" of this humanism excluded many people by gender and race. So the ideal was wider than its practice.

  - type: mcq
    id: kant
    title: "What does Kant require?"
    prompt: |
      According to Kant (1784), what is the main thing needed for a public to become enlightened?
    options:
      - text: "Freedom, above all the freedom to use reason publicly."
        correct: true
        feedback: |
          Yes. He expects the process to be slow, but freedom to argue in public is its condition.
      - text: "A strong ruler who tells people what to think for their own good."
        feedback: |
          That is exactly the guidance he calls tutelage. Enlightenment is leaving it behind.
      - text: "The abolition of all religion."
        feedback: |
          Kant's essay is about who decides what you believe, not a programme to abolish religion. Believers and nonbelievers both took part in this humanism.
    explanation: |
      Layer: what Kant wrote is fact. Whether his idea of reason is neutral or itself a commitment is debated.

  - type: text
    id: secular
    title: "The secular form: written declarations"
    body: |
      *Secular humanism* is humanism without appeal to gods. It has written statements, so we can read what it holds. According to Wikipedia's article on the Humanist Manifesto, the first Manifesto (1933), by Roy Wood Sellars and Raymond Bragg, had 34 signers including John Dewey, and presented humanism as a new religion to replace those based on supernatural revelation. A second (1973, with Paul Kurtz and Edwin Wilson as authors) was called necessary because the first now seemed "far too optimistic" after Nazism and the war. A third, *Humanism and Its Aspirations* (2003), is shorter. According to the same article, it says that knowledge comes from observation and rational analysis, that ethics arise from human need tested by experience, and that meaning comes from serving humane ideals.

      The international body, Humanists International, traces its central text to an Amsterdam Declaration of 1952. Its 2022 declaration, adopted in Glasgow, says: "We affirm the worth and dignity of the individual", and "We accept that morality is inherent to the human condition", "needing no source outside of humanity". On method it says: "science provides the means, human values must define the ends". It also says that "our particular opinions are not based on revelations fixed for all time".

  - type: mcq
    id: manifesto-one
    title: "A surprise in 1933"
    prompt: |
      According to the summary of Humanist Manifesto I (1933), how did it describe humanism?
    options:
      - text: "As a new kind of religion, meant to replace religions that rest on supernatural revelation."
        correct: true
        feedback: |
          Yes. The authors came out of religious humanism and used the word "religion". Later secular humanists mostly dropped it, and the 1933 and 2003 texts show how much the vocabulary changed.
      - text: "As the opposite of all religion, with no place for a religious tone."
        feedback: |
          That describes later secular humanism more than this text. In 1933 many signers saw humanism as a religion without gods.
      - text: "As a branch of Christian theology."
        feedback: |
          It was written as an alternative to religions based on revelation, so it was not presented as theology.
    explanation: |
      Layer: that the text says this is fact. Whether a creed with no gods deserves the word "religion" is a live debate about definitions.

  - type: text
    id: religious
    title: "Religious humanisms"
    image:
      src: img/erasmus.webp
      alt: "Painted portrait of Erasmus of Rotterdam in a dark cap, writing"
      caption: "Desiderius Erasmus (died 1536), portrayed by Hans Holbein the Younger, was a leading humanist scholar and a Christian."
      credit: "Hans Holbein the Younger, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Hans_Holbein_d._J._-_Erasmus_-_Louvre.jpg"
    body: |
      Humanism is not always godless. **Christian humanism** is a modern label for blending classical learning with Christian thought. According to the Stanford Encyclopedia of Philosophy, Erasmus fits it: his name became synonymous with humanism in his lifetime, he published the *Praise of Folly* (1511) and the first Greek New Testament to reach the market (1516), and he described a "philosophy of Christ" open to anyone, not only trained theologians. In the 20th century Jacques Maritain's *Integral Humanism* (1936) argued that Renaissance humanism was centred on man alone, and that a humanism centred on God is the integral one.

      **Islamic humanism** is a scholars' label, and it is debated. According to Mohammed Arkoun, whose 1970 thesis studied the philosopher Miskawayh, a tenth-century Arab humanism existed. According to Joel Kraemer's *Humanism in the Renaissance of Islam* (1986), the Buyid age in Baghdad had a philosophical humanism that treated the heritage of antiquity as an educational ideal, and a literary one beside it. Some scholars prefer the word "Arab" to "Islamic" for it.

      **Humanistic Judaism**, according to the account of its movement, was founded by Rabbi Sherwin Wine in 1963. It is nontheistic: it keeps Jewish holidays and rites of passage as culture and history, without prayers to a god. So it sits on the border, with Jewish identity but a secular outlook.

  - type: mcq
    id: sort
    title: "Who says what?"
    prompt: |
      Two humanists. One quotes a declaration that morality needs "no source outside of humanity". The other follows Maritain, who held that a humanism centred on God is the integral one. Which pair of labels fits, and why do they disagree?
    options:
      - text: "Secular humanist and Christian humanist. They agree that human dignity matters and disagree on whether it needs a source beyond the human."
        correct: true
        feedback: |
          Yes. The shared word hides a split over the grounding of dignity.
      - text: "Humanist and anti-humanist. One cares about people and the other does not."
        feedback: |
          Both care about people. The anti-humanist view (we meet it below) is a different claim, about the idea of "man" itself.
      - text: "Both secular, since any humanism rejects religion."
        feedback: |
          Erasmus and Maritain are Christian humanists. A definition that excludes them would not match the history of the word.
    explanation: |
      Layer: that these views are held is fact. Whether dignity needs God is a metaphysical commitment, and neither side proves it.

  - type: text
    id: share-split
    title: "What they share, and where they split"
    body: |
      Put the forms side by side. They share a core: the human being matters, reason is a tool we should use, and ethics aims at human flourishing. Pico, Kant, the 2022 declaration and Maritain each say something along these lines.

      They split on the **source of dignity**. According to the secular declaration, morality is inherent to the human condition and needs nothing beyond it. According to Maritain, a humanism that stops at man alone is partial; the integral one is centred on God. According to Humanistic Judaism, dignity can be affirmed with Jewish culture and without a god. So three questions separate them: where does dignity come from, how far can reason go alone, and what, if anything, stands above the human.

      A fair reading says both sides want the same thing in practice (people treated as ends, not tools) and give different foundations.

  - type: mcq
    id: split
    title: "Spot the real disagreement"
    prompt: |
      A secular humanist and a Christian humanist both say a prisoner must be treated with dignity. Where do they actually disagree?
    options:
      - text: "On what grounds that dignity: human nature and shared needs, or a relation to God."
        correct: true
        feedback: |
          Yes. The practical conclusion is shared, and the foundation differs.
      - text: "On whether the prisoner deserves dignity at all."
        feedback: |
          By the setup, both say yes. Treating this as the disagreement invents a conflict the humanists do not have.
      - text: "On whether reason is of any use in ethics."
        feedback: |
          Both use reason. Erasmus and Maritain are among the thinkers who combine reason and faith.
    explanation: |
      Layer: the agreement on practice is fact for these two positions. The disagreement on the source is a commitment on each side.

  - type: text
    id: objections
    title: "Two objections and replies"
    body: |
      **From believers.** According to Maritain and other Christian thinkers, a humanism that rests on man alone cannot say why a human being should have worth: if we are one animal among others, what grounds the claim that each person is owed respect? The secular reply is that dignity can rest on capacities and needs that people share (to feel pain, to plan a life, to reason), and that a ground does not have to be outside humanity to be real. The believer may answer that such a ground makes dignity depend on capacities, and some humans have fewer. The debate between the two is about what could ground worth at all.

      **From anti-humanists.** According to Michel Foucault, in *The Order of Things* (1966), "man" as an object of knowledge appears within European culture only since the 16th century, a recent invention. He says that if the ground of that way of thinking gave way, man would be erased, "like a face drawn in sand at the edge of the sea". Defenders of humanism reply that an idea can have a recent history and still be right to hold, as with abolition of slavery. The question left open is whether "the human" is a timeless centre or one historical way of thinking.

  - type: mcq
    id: foucault
    title: "What does Foucault claim?"
    prompt: |
      According to Foucault in *The Order of Things*, what is the claim behind the "face drawn in sand" image?
    options:
      - text: "That the modern idea of 'man' as a subject and object of knowledge is a historical product, which could vanish."
        correct: true
        feedback: |
          Yes. He is describing a historical shape of thought, not saying that people should be treated badly.
      - text: "That human beings should be ignored in ethics."
        feedback: |
          He writes about an idea of "man" in the human sciences, not about a recommendation to be cruel. Critics and defenders both discuss this point.
      - text: "That Renaissance humanism was invented by Petrarch."
        feedback: |
          Foucault's claim is about the modern figure of man in knowledge, dated by him to the end of the 18th century and after, not about Petrarch.
    explanation: |
      Layer: that he wrote this is fact. Whether the thesis is right is live scholarly debate.

  - type: text
    id: layers
    title: "Three layers"
    body: |
      **Established fact.** Who wrote which text and when: Petrarch (1304 to 1374), Pico's speech (1486), Kant's essay (1784), the Manifestos (1933, 1973, 2003), Maritain's *Integral Humanism* (1936), Humanists International's 2022 declaration. What those texts say.

      **Scholarly consensus or live debate.** Whether Renaissance humanism was secular or Christian at heart, how to read Pico's Adam, whether "Islamic humanism" is the right label for the Buyid age, whether a creed with no gods can be a religion, whether the Enlightenment ideal can be separated from its exclusions.

      **Faith or metaphysical commitment.** Whether human dignity needs a source beyond the human, and whether the human being should be the centre at all. Reasons can be given on each side. Neither proves its case from the facts alone.

  - type: text
    id: summary
    body: |
      **Next:** Skepticism and the Examined Life. Humanists trust human reason. A different school asks how far that trust is justified: Pyrrho, Socrates and the idea that suspending judgement can bring peace.
