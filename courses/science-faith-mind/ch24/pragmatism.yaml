id: ch24-pragmatism
title: "Pragmatism and Process"
kind: concept
own: |
  The setting: **pragmatism** is an American school of philosophy that judges ideas by their practical effects, and **process philosophy** holds that reality is made of events, not fixed things. Told *according to* the thinkers named, with a rule for each.
  - **The pragmatic maxim.** According to Peirce (1839 to 1914), in "How to Make Our Ideas Clear" (1878), the meaning of an idea is the practical effects we conceive it to have:
  $$\begin{aligned}\text{meaning}&=\text{conceivable}\\&\quad\text{practical effects}\end{aligned}$$
  Two ideas with the same effects in every conceivable case do not differ in meaning.
  - **James on truth.** According to William James (1842 to 1910), in *Pragmatism* (1907), a belief is true when it {{ proves itself good in the way of belief, for definite assignable reasons }}. According to the Stanford Encyclopedia, this does not mean that any comforting belief is true. Russell's objection: it seems to make "Santa Claus exists" true for those whom it comforts.
  - **Dewey on inquiry.** According to Dewey (1859 to 1952), inquiry begins with {{ a problem, an unsettled situation }}, and aims at the "controlled or directed transformation of an indeterminate situation".
  - **The Will to Believe.** According to James (1896), an option is **genuine** when it is live (a real possibility for you), forced (no way to avoid choosing) and momentous (high stakes):
  $$\text{genuine} = \text{live}\ \wedge\ \text{forced}\ \wedge\ \text{momentous}$$
  His claim is that {{ if a genuine option cannot be settled on intellectual grounds, our passional nature may decide it }}. James later said "the right to believe" would have been a better title.
  - **Process.** According to Whitehead (1861 to 1947), in *Process and Reality* (1929), the basic units are **actual occasions** (momentary events of experience), not unchanging substances. The world is {{ a becoming of events }}, not a stock of fixed things.
  - **Process theology.** According to Hartshorne (1897 to 2000), Whitehead and Cobb (1925 to 2024), God is **dipolar** (has an abstract, unchanging pole and a concrete, changing one) and acts by {{ persuasion rather than coercion }}. On evil, God is "the fellow-sufferer who understands" (Whitehead).
  - **The classical reply.** According to classical theists such as Aquinas, God is impassible (not moved by creatures) and fully omnipotent, so this view makes God too small. Process theists answer that love includes sharing others' sorrows.
  - **Where thoughtful people part ways.** Fact: who wrote what and when. Live debate: whether usefulness can ever be a mark of truth, and whether the Will to Believe licenses wishful thinking. Commitment: whether God is all-powerful or persuasive.

cards:
  - type: text
    id: hook
    title: "A difference that makes no difference"
    body: |
      Two friends argue about whether a certain idea is true. After an hour, a third friend asks: "Suppose you are right. What would be different in anyone's life, in anything anyone could ever see, do or feel? And what if the other one is right?" The two look at each other. Nothing at all would differ.

      Is the argument then real, with a true answer that nobody can reach? Or is it empty, a fight over words? This question drove a group of American thinkers in the late nineteenth century, the **pragmatists**. Their answer shaped how many people think about science, religion and truth.

      This lesson follows two connected ideas: **pragmatism**, which tests ideas by their consequences, and **process philosophy**, which says that reality is change and not fixed things. As always, we learn what each side holds and why, and we do not decide who is right.

  - type: mcq
    id: guess
    title: "Guess first"
    prompt: |
      Two people disagree about an idea, and nothing in anyone's experience or actions would differ whichever is right. What do you think a pragmatist would say about that disagreement?
    options:
      - text: "The disagreement is probably not about anything real: the two ideas do not differ in meaning."
        correct: true
        feedback: |
          Yes, this is the pragmatist move, according to Peirce. If two ideas have the same conceivable practical effects, they do not differ in meaning. Whether the move is right is debated, and we meet the objections below.
      - text: "One side must still be right, because truth does not depend on what we can see or do."
        feedback: |
          Many philosophers hold this (realists about truth, for example), and it is a serious position. But it is the rival of the pragmatist answer, not the pragmatist answer.
      - text: "Whoever feels more comfortable with the idea is right."
        feedback: |
          This is the common caricature of pragmatism, and the Stanford Encyclopedia says James did not hold it. We test it in a few cards.
    explanation: |
      Layer: the pragmatist claim is a philosophical position (layer 2, live debate). Whether it is correct is partly a commitment about what meaning and truth are.

  - type: text
    id: peirce
    title: "Peirce: what is an idea for?"
    body: |
      Charles Sanders Peirce (1839 to 1914), an American logician and scientist, wrote the founding text. According to the *Popular Science Monthly* (January 1878), in the essay "How to Make Our Ideas Clear" he stated what is now called the **pragmatic maxim**:

      > "Consider what effects, which might conceivably have practical bearings, we conceive the object of our conception to have."

      In essence, the whole meaning of an idea is the sum of its conceivable practical effects. In the same essay, according to Wikisource's text, he asks us to imagine a diamond crystallized in the midst of soft cotton and burned up before anything could test its hardness. Would it be false to call that diamond soft? He concludes that the question is about how best to arrange our facts, not about a fact that nobody could ever find.

      The maxim is a tool for sorting questions. If an answer would change what we could observe or do, the question has content. If no answer would change anything, the maxim says the question is a verbal one.

  - type: mcq
    id: peirce-mcq
    title: "Apply the maxim"
    prompt: |
      According to Peirce's maxim, which of these two ideas about a table has a meaning that differs from "the table is solid"?
    options:
      - text: "\"The table will pass through my hand if I push it hard.\" It predicts something different I could test."
        correct: true
        feedback: |
          Yes. The two ideas have different conceivable effects (my hand stops, or my hand passes), so by the maxim they differ in meaning.
      - text: "\"The table is solid, but invisible spirits hold it together in a way that changes nothing anyone could ever detect.\""
        feedback: |
          According to the maxim, the added clause has no extra practical effect, so it adds nothing to the meaning. Critics reply that such a claim may still be true, or matter for other reasons (a believer may hold that the clause matters for what the table is). That is the live debate over the maxim.
    explanation: |
      Layer: the maxim and its wording are fact about the text. Whether every meaningful claim must have testable effects is live debate: critics say the maxim risks ruling out ideas that matter, such as claims about other minds, the past, or God.

  - type: text
    id: james
    title: "James: truth as what works"
    image:
      src: img/james.webp
      alt: "Portrait photograph of the philosopher William James, around 1907"
      caption: "William James (1842 to 1910) in a photograph of about 1907 by Alice Boughton; his book Pragmatism appeared the same year."
      credit: "Alice Boughton, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:William_James_by_Alice_M._Boughton,_c._1907,_platinum_print,_from_the_National_Portrait_Gallery_-_NPG-NPG_87_37James-000001_(cropped).jpg"
    body: |
      William James (1842 to 1910), born in New York City, was a psychologist and philosopher at Harvard. He took Peirce's maxim and applied it to the idea of truth. In *Pragmatism: A New Name for Some Old Ways of Thinking* (1907), according to the Stanford Encyclopedia, he wrote:

      > "The true is the name of whatever proves itself to be good in the way of belief, and good, too, for definite assignable reasons."

      According to the Stanford Encyclopedia's account of James, truth is a kind of good, like health: true beliefs are those we can rely on to carry us forward without unpleasant surprises. A map is true, in this view, if it gets you where you are going.

  - type: mcq
    id: james-mcq
    title: "What James did not say"
    prompt: |
      A reader summarizes James as: "Whatever feels good to believe is true." According to the Stanford Encyclopedia, what is wrong with this summary?
    options:
      - text: "James tied truth to what proves itself good for definite assignable reasons, which includes fitting the rest of our experience and our other vital needs, not only comfort."
        correct: true
        feedback: |
          Yes. A belief that comforts but clashes with experience and with other benefits does not prove itself good over time. The Stanford Encyclopedia says James was not claiming that any belief that brings comfort is true.
      - text: "James held that truth has nothing to do with usefulness."
        feedback: |
          He held the opposite: usefulness in experience is central to his account. The summary is wrong because it shrinks usefulness to momentary comfort.
      - text: "James held that beliefs are true only if a majority accepts them."
        feedback: |
          Truth in James's account is tested in individual and shared experience over time, not by vote.
    explanation: |
      Layer: the quotation and the Stanford Encyclopedia's reading are documented. Whether James's theory really escapes the caricature is live debate, which is the next card.

  - type: text
    id: russell
    title: "Two views: the objection and the reply"
    body: |
      **The objection.** According to the Stanford Encyclopedia, Bertrand Russell argued that James's view commits him to the truth of "Santa Claus exists". If a belief is true when it works, and belief in Santa Claus makes children happy, then it seems to be true, even though no such person exists.

      **The reply.** The Stanford Encyclopedia calls this unfair. It says James would hold only that the happiness a belief brings is relevant to its truth, and that the belief would be "wholly true" only if it did not clash with other vital benefits. A belief in Santa Claus clashes with what the child later learns.

      Which view is right is live debate. Defenders of the objection say that "works" is too loose a test, because false beliefs can work for a while. Defenders of James say that over a long run and across all our needs, a false belief tends to fail.

  - type: text
    id: dewey
    title: "Dewey: inquiry as problem solving"
    body: |
      John Dewey (1859 to 1952), another leading pragmatist, turned the idea into a theory of how we think. According to the Stanford Encyclopedia, in *Logic: The Theory of Inquiry* (1938) he describes inquiry as beginning with a problem, an unsettled situation, and aiming at the "controlled or directed transformation of an indeterminate situation".

      On this view, knowing is not a mirror held up to the world. It is a way of dealing with trouble: we meet a puzzle, form a suggestion, test it, and arrive at a settled situation. The Stanford Encyclopedia says Dewey saw the same pattern in an animal looking for food, in a person solving a practical problem, and in science.

  - type: mcq
    id: dewey-mcq
    title: "Where does inquiry start?"
    prompt: |
      According to Dewey, where does inquiry begin?
    options:
      - text: "In a problematic, unsettled situation that we want to settle."
        correct: true
        feedback: |
          Yes. Inquiry is triggered by trouble, and its goal is a transformed, settled situation.
      - text: "In a set of certain first principles from which everything else is deduced."
        feedback: |
          That is the picture of the older rationalist tradition, which Dewey opposed. For him, inquiry starts from a problem, not from certainties.
      - text: "In the wish to believe something comforting."
        feedback: |
          Dewey's inquiry begins from a real difficulty and is tested by whether it settles it, not by comfort.
    explanation: |
      Layer: the attribution is documented. Whether all knowledge fits the problem-solving pattern (pure mathematics, for instance) is live debate.

  - type: text
    id: will
    title: "The Will to Believe: religion as a test case"
    body: |
      Religion is where James applied his ideas most boldly. His lecture "The Will to Believe" (1896, first printed in *The New World* in June of that year) was given to the philosophical clubs of Yale and Brown. According to the text, a **live** hypothesis is one that "appeals as a real possibility to him to whom it is proposed". An option is **forced** when there is no way to avoid choosing: a complete either-or. It is **momentous** when the stakes are high, as with a chance that may not come again. A **genuine** option is live, forced and momentous.

      His claim, according to the text:

      > "Our passional nature not only lawfully may, but must, decide an option between propositions, whenever it is a genuine option that cannot by its nature be decided on intellectual grounds."

      "Passional nature" means our feelings, wishes and temperament. According to the Stanford Encyclopedia, James later said the lecture would have been better named "the right to believe": he did not hold that we can believe at will, only that in certain cases we may. The case he stresses is one where a fact cannot come at all unless a preliminary faith exists in its coming, as in a friendship or a shared effort.

  - type: mcq
    id: will-mcq
    title: "Is the option genuine?"
    prompt: |
      Using James's three marks (live, forced, momentous), which case is a genuine option for a person who finds the idea of a God a real possibility?
    options:
      - text: "Whether to live as though God exists or as though God does not, when evidence is unlikely to settle the matter before life is over."
        correct: true
        feedback: |
          Yes, in James's account: it is live (a real possibility for this person), forced (any way of living takes one side in practice, and suspension also has a practical effect) and momentous (it shapes a whole life).
      - text: "Whether to believe that a coin that has not yet been flipped will land heads."
        feedback: |
          Not momentous, and the evidence can settle it by flipping. James's argument does not license belief here.
      - text: "Whether to believe a claim the person finds absurd, and that has no bearing on any choice."
        feedback: |
          Not live (it is no real possibility for this person) and not forced. James's argument needs all three marks.
    explanation: |
      Layer: the three marks are in the text (layer 1). Whether the religious question is forced and unsettleable is a commitment: many critics hold that evidence can still bear on it, and that suspending judgement is a real alternative.

  - type: text
    id: will-views
    title: "Two views on the Will to Believe"
    body: |
      **A critic's view.** The lecture seems to say that we may believe what we wish. Critics hold that this opens the door to wishful thinking: if our feelings may decide, then a believer in any claim could use the same permission. They add that evidence for or against religious claims may exist even if it is not decisive, so the option may not be unsettleable.

      **A defender's view.** According to the Stanford Encyclopedia, James meant a narrow right, limited to genuine options that evidence cannot settle, and he drew the line carefully: the right does not extend to trivial or dead options. In his text, he adds that telling someone to wait for evidence is itself a choice with its own risk of missing the truth.

      Where they part ways: whether the religious question is of the right kind (genuine and not settleable), and whether risking error is better or worse than risking missing a truth. Those are commitments about how to weigh two risks.

  - type: text
    id: whitehead
    title: "Why process? Whitehead's change of picture"
    image:
      src: img/whitehead.webp
      alt: "Black and white photograph of the philosopher Alfred North Whitehead"
      caption: "Alfred North Whitehead (1861 to 1947), whose book Process and Reality (1929) is the root of process philosophy and process theology."
      credit: "Wellcome Collection, CC BY 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Alfred_North_Whitehead._Photograph._Wellcome_V0027330_(cropped).jpg"
    body: |
      A second family of ideas starts from a different question: what is the world made of? The long tradition since Aristotle, according to the Stanford Encyclopedia, takes **substances** as basic: things that persist and have properties, such as a stone or a person. **Process philosophy** opposes this "substance metaphysics" and holds that becoming and occurrence are basic.

      Alfred North Whitehead (1861 to 1947), according to the Stanford Encyclopedia, developed this in *Process and Reality* (1929), which grew out of his 1927 to 1928 Gifford Lectures in Edinburgh. His basic units are **actual occasions**: momentary events of experience that arise by taking in what came before and then become part of what comes after. A stone, on this view, is a long, steady stream of such events.

      The motive is partly physical and partly personal. Process thinkers argue that a world of events fits physics (where things are fields and interactions) and our own experience (a flow, not a still frame) better than a world of lumps. Critics reply that something must persist for change to be change of something. That dispute is live.

  - type: mcq
    id: process-mcq
    title: "Substance or process?"
    prompt: |
      According to Whitehead, what is a stone?
    options:
      - text: "A long, steady stream of actual occasions (events) that inherit from each other."
        correct: true
        feedback: |
          Yes. On the process view, persistence is a pattern of events that keep the same character, not a bare lump that stays the same.
      - text: "An unchanging substance to which events merely happen."
        feedback: |
          This is the substance picture that process philosophy rejects. For Whitehead, there is no bare substance under the events.
      - text: "An illusion that has no reality."
        feedback: |
          Whitehead does not deny that stones exist. He re-describes what a stone is: a pattern of events, not a thing that stays the same without change.
    explanation: |
      Layer: the attribution is documented. Whether events or things are more basic is a metaphysical commitment (layer 3) that both camps defend with argument.

  - type: text
    id: theology
    title: "Process theology: God who persuades"
    body: |
      Charles Hartshorne (1897 to 2000), a philosopher of religion, adopted and expanded Whitehead's ideas. According to the Stanford Encyclopedia, he and Whitehead are the chief figures of **process theism**, and John B. Cobb Jr. (1925 to 2024), a theologian at Claremont, became its best-known advocate.

      Two features stand out. First, God is **dipolar**. According to Whitehead, God has a primordial nature (which supplies each occasion with an initial aim) and a consequent nature (God's response to the world, which receives and preserves what happens). Hartshorne's version, according to the Stanford Encyclopedia, attributes to God the good features of both poles of contrasts like permanence and change.

      Second, God's power is persuasion. According to the Stanford Encyclopedia, process theists summarize it as the claim that God "acts by persuasion rather than by coercion". On their metaphysics, no actual entity can unilaterally determine another's decision. According to Cobb, coercion is a last resort and reflects powerlessness in the ways that matter most, as a parent knows.

  - type: mcq
    id: evil-mcq
    title: "Power and the problem of evil"
    prompt: |
      In the lesson Theodicies and Their Critics, the problem of evil asks how an all-powerful, all-good God allows suffering. According to process theists, how does their view answer it?
    options:
      - text: "God is as powerful as it is possible to be given the partial freedom and power of creatures, so God does not unilaterally prevent every evil, and shares in the suffering."
        correct: true
        feedback: |
          Yes. According to the Stanford Encyclopedia, process theists make God's power persuasive, not coercive, and Whitehead calls God "the fellow-sufferer who understands". The answer changes the idea of power instead of explaining why a coercive God allows evil.
      - text: "God is all-powerful but chooses to permit evil for a greater good."
        feedback: |
          That is a classical theodicy (the free-will or soul-making replies in the lesson Theodicies and Their Critics), not the process answer. Process theists reject the premise that God has coercive control.
      - text: "Evil does not exist, so there is nothing to explain."
        feedback: |
          Process theists do not deny evil. They count it as real, and tie it to the real risk of a world where creatures are genuinely free.
    explanation: |
      Layer: the attribution is documented. Whether the answer works is live debate, which is the next card.

  - type: text
    id: reply
    title: "Two views: classical theists reply"
    body: |
      **Classical theists object.** According to the Stanford Encyclopedia, the classical view holds that God is impassible (not moved by creatures, without suffering) and omnipotent. Aquinas, on this view, holds that only God creates from nothing, and that God can do anything that is logically possible. For a classical theist, a God who can only persuade falls short of the greatness that worship needs. Process theists make the mirror charge: in the summary the Stanford Encyclopedia gives from Inbody, the complaint against the classical view is "Your God is too big".

      **Process theists answer.** According to the same entry, they say divine love includes sensitivity to others' joys and sorrows, and that coercive omnipotence is incoherent or morally worse. Hartshorne argued that the traditional concept of omnipotence "was not coherent enough to be false".

      A third view: according to the Stanford Encyclopedia, William Alston, Hartshorne's student at Chicago, accepted real relations in God but kept timelessness, immutability and non-corporeality, and affirmed creation from nothing. The same entry says that keeping contingency in God while keeping him timeless is problematic, because an eternal "now" has lost its moorings with experience.

  - type: mcq
    id: layers
    title: "Which layer is the claim?"
    prompt: |
      Label each claim: (1) established fact, (2) live debate, (3) commitment. Which claim belongs to layer 3, commitment?
    options:
      - text: "That God acts only by persuasion and not by coercion."
        correct: true
        feedback: |
          Yes. It is a metaphysical and religious commitment about God, which process theists hold and classical theists reject.
      - text: "That Peirce stated the pragmatic maxim in an 1878 essay."
        feedback: |
          That is a documented fact about a text (layer 1).
      - text: "Whether James's theory of truth can avoid the Santa Claus objection."
        feedback: |
          That is a live debate among philosophers (layer 2), argued with texts and examples.
    explanation: |
      Pragmatism and process sit at all three layers. The history is fact. Whether usefulness marks truth is debate. Whether God persuades or commands is a commitment.

  - type: text
    id: summary
    body: |
      **Back to the hook.** The two friends and their idle idea: according to Peirce, if two ideas have no different conceivable effects, they do not differ in meaning, and the quarrel is verbal. According to realists, there may still be a fact that nobody can reach. According to James, truth and belief are tied to how well a belief works for definite reasons, with Russell's Santa Claus objection as the standing challenge. According to Whitehead, the world is a becoming of events, and according to Hartshorne and Cobb, God works by persuasion.

      **What stays open:** whether usefulness can ever mark truth, whether the Will to Believe licenses wishful thinking, whether events or things are basic, and whether a God of persuasion is more or less than the classical God.

      **Next:** the lesson Transhumanism: Escaping Death by Technology asks what happens when science, not faith, promises to defeat death.
