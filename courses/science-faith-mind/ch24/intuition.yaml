id: ch24-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: philosophies of life answer how to live when no ready-made meaning is handed to us. Each view below is told *according to* its thinker; none is declared the winner.
  - **Sartre: making and being.** According to Sartre, a made thing such as a paper-knife has its essence (what it is for) fixed by its maker before it exists, but a person has no maker with a conception, so she exists first and defines herself afterwards:
    $$\text{knife: essence}\to\text{existence}$$
    {{ $$\text{person: existence}\to\text{essence}$$ }}
  - **Stoics: what is up to us.** According to Epictetus, our judgments, pursuits, desires and aversions are up to us; body, property and reputation are not. For the Stoics only virtue is good, and health and wealth are *preferred indifferents*: a wise person normally chooses them but they do not make a life good or bad.
  - **Epicurus: desires and death.** Desires are natural and necessary (food, shelter), natural but unnecessary (a fine meal) or empty (fame). Death is the end of sensation, and good and bad lie in sensation, so death is nothing to us. Nagel replies that death harms by taking goods away:
    {{ $$\begin{aligned}\text{badness of death}&=\text{value of}\\&\quad\text{the life it removes}\end{aligned}$$ }}
  - **Camus: the absurd.** Let $D$ = our demand for meaning and $S$ = the silence of the world, which gives no answer we can find. According to Camus they make the absurd, which he meets with revolt (refusing suicide and the leap), freedom and passion:
    {{ $$\begin{aligned}D+S&\Rightarrow\text{the absurd}\\&\Rightarrow\text{revolt}+\text{freedom}\\&\qquad+\text{passion}\end{aligned}$$ }}
  - **Nietzsche: the diagnosis.** Let P1 = our highest values rested on belief in God, P2 = that belief has become unbelievable, and C = the values lose their ground. According to Nietzsche:
    {{ $$\text{P1}\wedge\text{P2}\Rightarrow\text{C}$$ }}
    A believer rejects P2; a nonbeliever may keep P2 and reject the step to C.
  - **Pyrrhonists: the road to calm.** According to Sextus Empiricus, arguments of equal weight on both sides lead to *epoché* (suspending judgement), and then *ataraxia* (freedom from worry) follows:
    {{ $$\begin{aligned}\text{equal opposed arguments}&\Rightarrow\text{epoché}\\ &\Rightarrow\text{ataraxia}\end{aligned}$$ }}
  - **James: a genuine option.** According to James, an option is genuine when it is live (a real possibility for you), forced (no way to avoid choosing) and momentous (high stakes). Only then may our passional nature decide what the evidence cannot.
    $$\text{genuine}=\text{live}\wedge\text{forced}\wedge\text{momentous}$$

cards:
  - type: text
    id: welcome
    title: "Quick recall: ways to live"
    body: |
      This round **derives nothing**. It is for fast recall of the level's main ideas: **Sartre's knife and person**, the **Stoic questions**, **Epicurus on desire and death**, **Camus's absurd**, **Nietzsche's diagnosis**, the **Pyrrhonist road to calm**, and **James's genuine option**.

      Three kinds of card: **mnemonics and distinctions**, **build cards** for the main chains, and **applied cards that give you a case only**: you choose the school yourself. Guessing is fine: a wrong guess is shown with its reason. Views are told *according to* their thinkers, none declared the winner.

  - type: mcq
    id: sartre-mnemonic
    title: "Knife and person"
    prompt: |
      A paper-knife is made by an artisan who first has a conception of it and a purpose for it. According to Sartre, what is the order for the knife, and what is it for a human being?
    options:
      - text: 'Knife: essence before existence. Person: existence before essence, since no maker has a conception of her.'
        correct: true
      - text: 'Knife: existence before essence. Person: essence before existence, since each person is born with a fixed nature.'
        feedback: |
          This reverses both. The artisan's concept comes before the knife exists. Sartre denies the fixed human nature, since, according to him, there is no God to have a conception of it.
      - text: 'Both come essence first, because everything has a purpose.'
        feedback: |
          Sartre agrees about the knife, but the whole point of the lecture is that the person is the exception: she first exists, then defines herself by what she makes of herself.
    shuffle: false
    hint: 'Who has the concept in each case: an artisan, or nobody?'
    explanation: |
      Mnemonic: **knife: purpose first; person: exist first**. Aquinas shares the knife picture for humans, since God conceives the human essence, which is where he and Sartre split. Whether a creator conceives us is a commitment, not a fact.

  - type: build
    id: existence-build
    title: "The order for a person"
    prompt: |
      In Sartre's lecture a person first appears in the world, and then makes herself what she is. Build the order, using the arrow for "comes before".
    prefix: '\text{person:}'
    tiles: ['\text{existence}', '\text{essence}', '\to']
    answers:
      - ['\text{existence}', '\to', '\text{essence}']
    wrong:
      - answer: ['\text{essence}', '\to', '\text{existence}']
        feedback: |
          This is the order for the knife, where the maker's concept comes first. A person has no such maker in Sartre's view.
    hint: 'She exists, and then defines herself.'
    explanation: |
      Mnemonic: **exist, then define**. Sartre still affirms a shared human *condition* (being born, working, dying, living among others), which he says is not given but perpetually made.

  - type: mcq
    id: stoic-three
    title: "Three Stoic questions"
    prompt: |
      Match each Stoic question to its answer: (1) What is up to us? (2) What is only preferred? (3) What is the only good?
    options:
      - text: '(1) Our own judgments, pursuits, desires and aversions. (2) Health, wealth and reputation, which are indifferents a wise person normally chooses. (3) Virtue.'
        correct: true
      - text: '(1) Our health, property and reputation. (2) Virtue. (3) Pleasure.'
        feedback: |
          Health, property and reputation are exactly what Epictetus says is not up to us. For the Stoics virtue is the only good, and pleasure is Epicurus' answer.
      - text: '(1) Whatever happens to us. (2) Virtue. (3) Health and wealth, since they make life go well.'
        feedback: |
          Events are mostly not up to us. And the Stoics call health and wealth *indifferents*: they do not make a life good or bad, though some are preferred.
    shuffle: false
    hint: 'Inside the mind and action; outside but sensible to choose; the one real good.'
    explanation: |
      Mnemonic: **ours, preferred, good: judgments, health and wealth, virtue**. The Stoic goal, *apatheia*, is freedom from passions (false value judgments), not from all feeling, since good feelings (*eupatheiai*) remain.

  - type: mcq
    id: calm-routes
    title: "Three routes to calm"
    prompt: |
      Epicureans, Stoics and Pyrrhonists all aim at calm of mind. Which pairing of school and route is right?
    options:
      - text: 'Epicureans: sort desires and understand nature, so fear and empty wants fall away. Stoics: judge only what is up to us. Pyrrhonists: suspend judgement, so no belief is left to be disturbed.'
        correct: true
      - text: 'Epicureans: suspend judgement. Stoics: sort desires. Pyrrhonists: judge only what is up to us.'
        feedback: |
          Scrambled. Suspension of judgement (*epoché*) is the Pyrrhonist method, and the dichotomy of control is the Stoic one.
      - text: 'All three say calm needs strong beliefs about the world, and differ only in which ones.'
        feedback: |
          Pyrrhonists aim at calm by suspending judgement, so they claim no belief on such questions. Whether any calm needs *some* beliefs is where the schools differ.
    shuffle: false
    hint: 'Sort and understand; judge only what is ours; suspend.'
    explanation: |
      Mnemonic: **sort, own, suspend**. Same goal, three roads; which is right is a live debate.

  - type: mcq
    id: epicurus-desires
    title: "Three kinds of desire"
    prompt: |
      According to Epicurus, which pairing of desire and kind is right, and what should one do with each?
    options:
      - text: 'Food and shelter: natural and necessary, so meet them. A fine meal: natural but unnecessary, so enjoy it without needing it. Fame: empty, so drop it.'
        correct: true
      - text: 'Food and shelter: empty, so drop them. A fine meal: natural and necessary. Fame: natural but unnecessary.'
        feedback: |
          Scrambled. Food and shelter are the plainest natural and necessary desires, and fame is Epicurus' example of an empty one.
      - text: 'All pleasures are to be chased equally, since pleasure is the good.'
        feedback: |
          Epicurus says that not every pleasure is worth choosing, and that sober reasoning sorts the desires. The best life is calm of mind and freedom from bodily pain, not the most feasts.
    shuffle: false
    hint: 'Necessary, nice but optional, empty.'
    explanation: |
      Mnemonic: **meet, enjoy, drop**. The lesson's wording for the third kind is "empty"; Epicurus' text says "groundless".

  - type: order
    id: death-order
    title: "Epicurus on death"
    prompt: |
      Put the Epicurean argument that death is nothing to us in order.
    steps:
      - 'Everything good and bad lies in sensation.'
      - 'Death is the end of sensation.'
      - 'When we exist, death is not here; when death is here, we do not exist.'
      - 'So death is nothing to us.'
    hint: 'Start with where good and bad are said to lie.'
    explanation: |
      Mnemonic: **sensation, end of sensation, never together, so nothing**. Nagel's reply is that death harms by depriving us of goods, with no sensation needed. Whether the argument works is debated.

  - type: build
    id: deprivation-build
    title: "The deprivation account"
    prompt: |
      Nagel (1970) says death can harm a person even if she feels nothing at the time. Build what the badness of death is, on this account.
    prefix: '\text{badness of death}='
    tiles: ['\text{value of the life it removes}', '\text{pain felt at dying}', '\text{length of the life}']
    answers:
      - ['\text{value of the life it removes}']
    wrong:
      - answer: ['\text{pain felt at dying}']
        feedback: |
          If death felt like nothing it would then be harmless, which is Epicurus' view. The deprivation account says the harm is the goods taken away, with no pain needed.
      - answer: ['\text{length of the life}']
        feedback: |
          The account counts the value lost, not the years lived. A short life full of promise loses more than a long one with little left to gain.
    hint: 'Think of what a person would have had.'
    explanation: |
      Mnemonic: **bad for what it takes**. Lucretius' symmetry reply asks why we mind the time after death and not the time before birth; critics say the two are not alike.

  - type: build
    id: absurd-build
    title: "How the absurd arises"
    prompt: |
      Let $D$ = our demand for meaning and $S$ = the silence of the world, which gives no answer we can find. According to Camus, together they make something. Build it.
    prefix: 'D+S\Rightarrow'
    tiles: ['\text{the absurd}', '\text{revolt}', '\text{despair}']
    answers:
      - ['\text{the absurd}']
    wrong:
      - answer: ['\text{revolt}']
        feedback: |
          Revolt is Camus's response to the absurd, not what the clash is called.
      - answer: ['\text{despair}']
        feedback: |
          Camus wants to avoid despair. The clash itself is the absurd, and it lives in the relation between us and the world, not in either alone.
    hint: 'Name for the clash of demand and silence.'
    explanation: |
      Mnemonic: **demand plus silence is the absurd**. It lives in the relation, not in the world alone or in us alone.

  - type: build
    id: revolt-build
    title: "What follows from the absurd"
    prompt: |
      According to Camus, the absurd leads to three consequences: refusing both escapes, having no eternal meaning to obey, and living as fully as possible. Build them.
    prefix: '\text{absurd}\Rightarrow'
    tiles: ['\text{revolt}', '\text{freedom}', '\text{passion}', '+', '+', '\text{hope}']
    answers:
      - ['\text{revolt}', '+', '\text{freedom}', '+', '\text{passion}']
      - ['\text{revolt}', '+', '\text{passion}', '+', '\text{freedom}']
      - ['\text{freedom}', '+', '\text{revolt}', '+', '\text{passion}']
      - ['\text{freedom}', '+', '\text{passion}', '+', '\text{revolt}']
      - ['\text{passion}', '+', '\text{revolt}', '+', '\text{freedom}']
      - ['\text{passion}', '+', '\text{freedom}', '+', '\text{revolt}']
    wrong:
      - answer: ['\text{revolt}', '+', '\text{freedom}', '+', '\text{hope}']
        feedback: |
          Hope for a meaning beyond reason is what Camus calls the leap, one of the two exits he refuses. The third consequence is passion.
    hint: 'Refuse, free, full.'
    explanation: |
      Mnemonic: **refuse, free, full**. The two refused exits are physical suicide, which removes the one who asks, and the leap, which Camus calls philosophical suicide because it gives up lucid thought.

  - type: mcq
    id: nietzsche-chain
    title: "God is dead, in three lines"
    prompt: |
      In *The Gay Science* a madman says God is dead and we have killed him. Let P1 = our highest values rested on belief in God, P2 = that belief has become unbelievable, C = the values lose their ground. What does the passage say, and which line does a believer reject?
    options:
      - text: 'It diagnoses P1 and P2 and draws C, without claiming atheism is proved. A believer rejects P2.'
        correct: true
      - text: 'It proves that God does not exist. A believer rejects C.'
        feedback: |
          According to Nietzsche scholars the passage is a diagnosis of what has happened to belief, not a proof. And a believer who thinks meaning rests on God denies that belief has collapsed, which is P2.
      - text: 'It celebrates the freedom of life without values. A believer rejects P1.'
        feedback: |
          Nietzsche describes the loss as a crisis, which he calls nihilism: the highest values devalue themselves. Believers who hold P1 (values rest on God) simply deny P2.
    shuffle: false
    hint: 'A diagnosis, not a proof. Which line says belief has collapsed?'
    explanation: |
      Mnemonic: **P1 and P2, so C; diagnosis, not proof**. Nonbelievers may keep P2 and reject the step to C, with Sartre (values are made), or with naturalists who hold that worth can be found.

  - type: build
    id: nietzsche-build
    title: "The chain, built"
    prompt: |
      Write the chain: P1 (values rested on belief in God) and P2 (that belief is unbelievable) together lead to C (the values lose their ground).
    prefix: ''
    tiles: ['\text{P1}', '\text{P2}', '\text{C}', '\wedge', '\Rightarrow', '\vee']
    answers:
      - ['\text{P1}', '\wedge', '\text{P2}', '\Rightarrow', '\text{C}']
      - ['\text{P2}', '\wedge', '\text{P1}', '\Rightarrow', '\text{C}']
    wrong:
      - answer: ['\text{P1}', '\vee', '\text{P2}', '\Rightarrow', '\text{C}']
        feedback: |
          With "or", either line alone would give C. But if values never rested on God (no P1), or if belief has not collapsed (no P2), nothing is lost. Both are needed.
    hint: 'Both premises are needed together.'
    explanation: |
      Mnemonic: **both premises, then the collapse**. This is the lesson's reconstruction of Nietzsche's passage, not his own wording.

  - type: build
    id: pyrrho-build
    title: "The Pyrrhonist chain"
    prompt: |
      According to Sextus Empiricus, when opposed arguments seem of equal weight, the skeptic suspends judgement, and then a calm of mind follows. Build the chain from the opposed arguments.
    prefix: '\text{opposed}\Rightarrow'
    tiles: ['\text{epoché}', '\text{ataraxia}', '\Rightarrow', '\text{dogmatism}']
    answers:
      - ['\text{epoché}', '\Rightarrow', '\text{ataraxia}']
    wrong:
      - answer: ['\text{ataraxia}', '\Rightarrow', '\text{epoché}']
        feedback: |
          Reversed. The Pyrrhonists do not first seek calm and then suspend; suspension comes first, and the calm follows it.
    hint: 'Suspend first. Calm comes after.'
    explanation: |
      Mnemonic: **equal weight, suspend, calm**. *Epoché* is suspension of judgement, *ataraxia* is freedom from worry. Agrippa's five modes (disagreement, regress, relativity, hypothesis, circularity) push any claim to a dead end.

  - type: mcq
    id: maxim-mnemonic
    title: "The pragmatic maxim"
    prompt: |
      According to Peirce, the meaning of an idea is the practical effects we conceive it to have. Two ideas would have the same effects in every conceivable case. What follows?
    options:
      - text: 'They do not differ in meaning, even if the words differ.'
        correct: true
      - text: 'They differ in meaning, since their words differ.'
        feedback: |
          The maxim tests meaning by effects, not wording. Same conceivable effects, same meaning.
      - text: 'Both are true, since an idea with effects works.'
        feedback: |
          The maxim is about the *meaning* of an idea, not about its truth. Truth is James's separate question, and for him it means what proves good in the way of belief, not any comforting idea.
    shuffle: false
    hint: 'Meaning is read off the conceivable effects.'
    explanation: |
      Mnemonic: **same effects, same meaning**. Peirce's own example compares a diamond left in soft cotton until it is needed with a diamond that is never scratched.

  - type: build
    id: genuine-build
    title: "James's genuine option"
    prompt: |
      According to James, an option is genuine when it is live (a real possibility for you), forced (you cannot avoid choosing) and momentous (high stakes). Build the condition.
    prefix: '\text{genuine}='
    tiles: ['\text{live}', '\text{forced}', '\text{momentous}', '\wedge', '\wedge', '\vee', '\vee']
    answers:
      - ['\text{live}', '\wedge', '\text{forced}', '\wedge', '\text{momentous}']
      - ['\text{live}', '\wedge', '\text{momentous}', '\wedge', '\text{forced}']
      - ['\text{forced}', '\wedge', '\text{live}', '\wedge', '\text{momentous}']
      - ['\text{forced}', '\wedge', '\text{momentous}', '\wedge', '\text{live}']
      - ['\text{momentous}', '\wedge', '\text{live}', '\wedge', '\text{forced}']
      - ['\text{momentous}', '\wedge', '\text{forced}', '\wedge', '\text{live}']
    wrong:
      - answer: ['\text{live}', '\vee', '\text{forced}', '\vee', '\text{momentous}']
        feedback: |
          "Or" would make almost every choice genuine. James asks for all three at once: a real possibility, no way to avoid choosing, high stakes.
    hint: 'All three together.'
    explanation: |
      Mnemonic: **live, forced, momentous**. According to James, only then, and only if the evidence cannot settle it, may our passional nature decide. He later said "the right to believe" would have been a better title.

  - type: mcq
    id: believer-check
    title: "Which premise does a believer reject?"
    prompt: |
      Match each argument to the premise or step a believer would typically reject.
    options:
      - text: 'Nietzsche: P2, that belief in God has collapsed. Camus: P1, that the silence of the world is final. Epicurus on death: that good and bad lie only in sensation.'
        correct: true
      - text: 'Nietzsche: P1, that values rested on God. Camus: the step that revolt is lucid. Epicurus on death: that death ends sensation.'
        feedback: |
          Many believers accept P1 and deny P2. For Camus, a believer rejects that the silence is final. And a believer may even hold that death ends sensation, since the objection is to the claim that nothing else counts.
      - text: 'Nietzsche: the step to C. Camus: the demand for meaning. Epicurus on death: that death is the end of sensation.'
        feedback: |
          These are the replies of nonbelievers or of deprivationists, not the believer's typical move. The believer's lever is that meaning is anchored in something beyond the world.
    shuffle: false
    hint: 'The believer questions whether the world is silent and whether belief has collapsed.'
    explanation: |
      Mnemonic: **believer: not collapsed, not silent**. For Epicurus' argument it is the assumption that only sensation matters, which a deprivationist, believer or not, rejects. Where these views part is a matter of commitment, not fact.

  - type: mcq
    id: apply-desires
    title: "A raise and a rent"
    prompt: |
      Mira lists what she wants this year: (a) a room to sleep in and regular meals, (b) a trip abroad that she would enjoy but could do without, (c) to be admired by everyone in her field. Using Epicurus' sorting, which reading is best?
    options:
      - text: '(a) natural and necessary, so meet it; (b) natural but unnecessary, so enjoy it without needing it; (c) empty, so drop it.'
        correct: true
      - text: '(a) empty; (b) natural and necessary; (c) natural but unnecessary.'
        feedback: |
          A room and meals are the plainest necessities, and being admired by everyone is the typical empty desire: it has no natural limit.
      - text: 'All three are empty, since pleasure is only freedom from pain.'
        feedback: |
          Epicurus did not tell us to drop everything. He sorts desires, and the necessary ones are to be met.
    shuffle: false
    hint: 'Ask whether each want has a natural limit and whether life or calm needs it.'
    explanation: |
      Only the sorting is needed, with no formula. A school's advice is a family of replies to the case, here the three kinds of desire.

  - type: mcq
    id: apply-job-1
    title: "A lost job: first replies"
    prompt: |
      Leo has just lost his job. Two friends reply.
      (A) "The firm's decision was not up to you. Your next move is: what you will do with your savings, and how you will carry yourself now."
      (B) "Meet the necessary needs first, rent and food. Drop the wish to look successful to others. Enjoy a simple evening with friends tonight."
      Which sentence is best matched by the **Stoic** reading, and which by the **Epicurean**?
    options:
      - text: 'Stoic: (A). Epicurean: (B).'
        correct: true
      - text: 'Stoic: (B). Epicurean: (A).'
        feedback: |
          Swapped. (A) sorts what is up to him from what is not: the Stoic dichotomy. (B) sorts desires into necessary and empty, and values friendship: the Epicurean route.
      - text: 'Both are Stoic, since both give advice.'
        feedback: |
          Both give advice, but the sorting differs. (A) divides what is and is not up to him. (B) divides desires by kind.
    shuffle: false
    hint: 'One sorts events by control, the other sorts wants by kind.'
    explanation: |
      (A) is the dichotomy of control: the firm's decision is not up to Leo, but his response is. (B) is the three kinds of desire plus Epicurean friendship. Both aim at calm and differ on the road.

  - type: mcq
    id: apply-job-2
    title: "A lost job: other replies"
    prompt: |
      Leo, still without work, hears two other replies.
      (C) "Every article says the job market is bad, and every other says it is fine. I'll stop claiming either, keep applying as the situation seems to ask, and not fret over it."
      (D) "I wanted a life with a place in it, and the economy gives no answer to that demand. I refuse to give up and I refuse to pretend. I will live this stretch fully, aware it may mean nothing."
      Which sentence is best matched by the **Pyrrhonist** reading, and which by the **Camusian**?
    options:
      - text: 'Pyrrhonist: (C). Camusian: (D).'
        correct: true
      - text: 'Pyrrhonist: (D). Camusian: (C).'
        feedback: |
          Swapped. (C) suspends judgement between equal opposed claims and follows appearances for action. (D) names a demand met by silence, and refuses both escapes.
      - text: 'Both are Pyrrhonist, since both withhold a final answer.'
        feedback: |
          (D) does not suspend judgement: it states a clash, refuses the exits and chooses to live fully, which is revolt. (C) is the one that suspends.
    shuffle: false
    hint: 'One suspends and carries on by appearances; the other keeps a demand alive and defies the silence.'
    explanation: |
      (C) is *epoché* followed by calm, acting by appearances, as Sextus allowed. (D) is demand plus silence, then revolt, freedom and passion. A believer would reject the silence in (D), and a Stoic would say the same of (C) that it leaves too many judgements open.

  - type: text
    id: summary
    body: |
      **Next:** the content map of the level: rebuild, box by box, how the ways to live fit together among look-alike decoys.
