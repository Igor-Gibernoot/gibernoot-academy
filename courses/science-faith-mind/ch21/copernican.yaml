id: ch21-copernican
title: "The Copernican Principle and Our Place"
kind: concept
own: |
  The setting: a thinker (or an astronomer) asks whether the place and time from which we observe the universe are special or ordinary. This is a question about where we stand, and it must be kept apart from what that place means.
  - **The Copernican principle (mediocrity).** According to Copernicus's 1543 book, the Earth is one planet among others circling the Sun. Later astronomers moved us further out: the Sun lies far from the centre of the Milky Way (Shapley, 1918), and the Milky Way is one galaxy among many (Hubble, 1923). Cosmologists keep the idea as a working assumption, not a proven fact: our position is not privileged, so we should not expect to be at a special place or time.
  - **Gott's rule (1993).** Suppose a thing has existed for a time $t_\text{past}$ when we meet it, and our moment of meeting is a uniformly random point in its whole life $T$. Write $f = t_\text{past}/T$ for the fraction already elapsed. Then the future lasts
    {{ $$\frac{t_\text{future}}{t_\text{past}} = \frac{1-f}{f}$$ }}
    and with confidence $c$ (a number between 0 and 1, such as $0.95$) it lies in the interval
    $$\frac{1-c}{1+c}\,t_\text{past} \;\le\; t_\text{future} \;\le\; \frac{1+c}{1-c}\,t_\text{past}$$
    which at $c = 0.95$ means from $t_\text{past}/39$ to $39\,t_\text{past}$. The share of meeting moments for which the interval holds is
    {{ $$P(\text{interval holds}) = c$$ }}
    but only if the moment really is uniformly random. Critics (Buch, Caves) reject the rule where we know a time scale (a human lifespan) or the moment was not random.
  - **Observation selection.** Carter (1973, published 1974) pointed out that observers can only find themselves where and when observers can exist, so our location is privileged to the extent of being compatible with our existence. Mediocrity concerns where we stand, while selection concerns {{ the conditions needed for observers to exist }}: the two do not contradict each other, and the Rare Earth hypothesis of Ward and Brownlee (2000) is a claim about conditions, not about position.
  - **Position is not meaning.** According to Sagan, the Pale Blue Dot photograph (Voyager 1, 1990) shows Earth as a mote of dust, and he drew humility from it; according to Gonzalez and Richards (2004), Earth's place is privileged for discovery, and they draw purpose. Where Earth stands (fact or live debate) does not by itself decide whether life has purpose (commitment layer).

cards:
  - type: text
    id: hook
    title: "Ordinary, or special?"
    body: |
      Before any history, a guess, and guessing is the point. Imagine you could list every planet in the universe that carries life. Would you expect ours to be a typical entry on that list, or an unusual one: unusually old, unusually stable, unusually placed?

      This lesson follows one idea, that we should not assume our own place is special, from its roots in astronomy to a rule that tries to predict the future from the past, and then asks what the idea can and cannot tell us about meaning. Each claim is taught according to someone, and the places where thoughtful people part ways are named.

  - type: mcq
    id: guess
    title: "Guess: how would you bet?"
    prompt: |
      Without any theory, which bet seems most natural for the place from which we observe the universe (our planet, our star, our moment in cosmic history)?
    options:
      - text: "It is probably one of many fairly ordinary places, since there are very many to choose from."
        correct: true
        feedback: |
          This is the Copernican bet. With a huge number of places, a randomly chosen one is most likely unremarkable, so it is a sensible default until something shows otherwise.
      - text: "It is probably the single most special place, since we are here to ask."
        feedback: |
          This is tempting, and part of it will return as observation selection: observers can only be where observers can exist. But being here shows that conditions allow observers, not that this place is the best or only one.
      - text: "There is no way to bet at all."
        feedback: |
          A bet is possible, and the lesson shows how far it can go. The question is whether the bet's assumptions hold.
    explanation: |
      Keep the guess. The idea that we should not assume our position is special is a default, a starting bet, and the lesson tests what it can support and where it fails.

  - type: text
    id: copernicus
    title: "Copernicus: Earth as one planet"
    image:
      src: img/copernicus.webp
      alt: "Painted portrait of Nicolaus Copernicus in dark clothes, from a panel in Toruń"
      caption: "Nicolaus Copernicus (1473 to 1543), a canon who spent most of his working life in Frombork, saw his main book printed in the year of his death."
      credit: "Unknown author, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Nikolaus_Kopernikus.jpg"
    body: |
      According to the standard histories, Nicolaus Copernicus published *De revolutionibus orbium coelestium* ("on the revolutions of the heavenly spheres") in 1543, the year he died. In it the Earth is a planet that circles the Sun and spins on its axis, instead of resting at the centre. Earlier thinkers had proposed Sun-centred ideas, and Copernicus did not solve every problem of the older Earth-centred system, but the book is the usual starting point of the story.

      The idea later grew into a wider habit called the **Copernican principle**, or the **principle of mediocrity**: do not assume that the place from which we observe is privileged. In cosmology it is a working assumption, not a proven fact, and many tests of the standard cosmological model can be read as tests of it. This lesson calls the habit "mediocrity" and asks what it supports.

  - type: order
    id: retreats
    title: "The long retreat from the centre"
    prompt: |
      Put these steps in the order in which astronomers made them, each moving us further from a special place.
    steps:
      - "Copernicus (1543): the Earth is one planet circling the Sun, not the centre of everything."
      - "Shapley (1918): the Sun is far from the centre of the Milky Way, found from the distribution of globular clusters (dense balls of stars)."
      - "Hubble (1923): a variable star in the Andromeda nebula shows it lies far outside the Milky Way, so the Milky Way is one galaxy among many."
    hint: "Each step enlarges the picture: first the Earth, then the Sun's place in its own galaxy, then the galaxy among galaxies."
    explanation: |
      The pattern is the same three times. Earth is a planet (1543), the Sun is an ordinary star far from the centre of the Milky Way (Shapley, 1918, who put the centre farther than modern values, about 27,000 light-years), and the Milky Way is one of very many galaxies (Hubble's Cepheid, 1923, announced in 1924 to 1925). Each step is a fact of observation, and each made the earlier special place look less special.

  - type: mcq
    id: what-claim
    title: "What the principle does and does not say"
    prompt: |
      According to cosmologists, which is the best statement of the Copernican principle?
    options:
      - text: "We should not assume that our position (in space or time) is privileged."
        correct: true
        feedback: |
          Yes. It is a working assumption about where we stand: absent evidence, treat our place as one of many possible places.
      - text: "Earth is ordinary in every respect, including its conditions for life."
        feedback: |
          This stretches the idea much too far. The principle concerns position. Whether Earth's conditions are common is a different question, the one the Rare Earth hypothesis (Ward and Brownlee, 2000) addresses.
      - text: "Humans are unimportant."
        feedback: |
          Importance and meaning are not what the principle measures. That belongs to the layer of faith or philosophical commitment.
      - text: "The universe has a centre, and it is far from us."
        feedback: |
          Cosmologists assume the opposite, a universe with no special centre (homogeneous and isotropic on large scales). The principle is about having no privileged place.
    explanation: |
      Mediocrity is a rule about position: do not assume you are somewhere special. It is not a claim about life, mind or meaning, and keeping that boundary clear is the main skill of the lesson.

  - type: text
    id: gott-hook
    title: "A prediction from mediocrity alone"
    body: |
      Mediocrity can be turned into a calculation about time. According to the astrophysicist J. Richard Gott, in 1969 he visited the Berlin Wall. The wall was then eight years old. Gott reasoned that there was nothing special about his visit, so he was equally likely to arrive at any moment of the wall's life, and he told a friend that it would, with 50 per cent likelihood, last more than two and two-thirds years but less than 24.

      In 1993 he published the general argument in *Nature* ("Implications of the Copernican principle for our future prospects"). Guess first: with no theory of the wall's politics at all, how long should you expect a thing that is eight years old to last in total?

  - type: mcq
    id: gott-guess
    title: "Guess: from the age alone"
    prompt: |
      A structure has stood for 8 years. You know nothing else about it, and you are visiting at a random moment of its whole life. Which forecast of its remaining life is most reasonable?
    options:
      - text: "Somewhere between a fraction of its present age and a multiple of it, with the middle of the range near its present age."
        correct: true
        feedback: |
          Yes. If your moment is a random point of its life, then you are as likely to be in the first half as the second, so the future is typically comparable to the past, with a long tail on either side.
      - text: "Exactly 8 more years, because it should live twice as long as it has so far."
        feedback: |
          A single number is too sharp. A random moment could be near the start (then the future is long) or near the end (then it is short). Only a range can be defended.
      - text: "At least 100 more years, because anything that survives long is stable."
        feedback: |
          This builds in knowledge the visitor does not have. With only the age to go on, nothing favours a century over a decade.
      - text: "Nothing at all can be said without knowing why it exists."
        feedback: |
          Knowing the reasons would help, and critics use that point later. But a statement about a range of outcomes is still possible from the age alone, if the random-moment premise holds.
    explanation: |
      The age alone gives a range, not a number. The widget next shows exactly what range, and how confidently.

  - type: widget
    id: gott-widget
    title: "Slide now along the timeline"
    widget: gott-interval
    config:
      span: 100
      unit: "years"
      f: 0.3
      cSlider: true
    body: |
      The timeline is the whole life of a thing, 100 years long, with a **now** marker you can drag (the green or red mark is the true end). The bar after now is the forecast interval from the age alone. Drag now early and late, and move the confidence $c$ slider. Watch when the true end falls outside the bar.

  - type: mcq
    id: widget-read
    title: "When does the forecast fail?"
    prompt: |
      A thing's total life is $T$. The forecast at 95% confidence is built from its age when you meet it. If your meeting moment is a uniformly random point of its life, for which meeting moments does the forecast miss the true future?
    options:
      - text: "Only in the first 2.5% and last 2.5% of its life."
        correct: true
        feedback: |
          Yes. The forecast covers the middle 95% of possible moments and misses the two ends, 2.5% each. Meeting it extremely early or extremely late is what breaks the forecast.
      - text: "Whenever you meet it in the second half of its life."
        feedback: |
          That is 50% of the moments, and the forecast does not fail there: late in life the future is shorter than the past, but the lower factor covers it.
      - text: "Whenever it ends within the next 8 years."
        feedback: |
          The forecast depends on the fraction of life elapsed, not on a fixed number of years.
      - text: "Never, because the interval is so wide."
        feedback: |
          The interval is wide, but it is built to cover 95% of cases, not all of them. The remaining 5% is the price of confidence below 100%.
    explanation: |
      The forecast is a statement about the share of meeting moments, not about any single case.

  - type: text
    id: gott-derive
    title: "Where the factors come from"
    body: |
      Name the age at the moment you meet the thing $t_\text{past}$, its whole life $T$, and the fraction of life already elapsed
      $$f = \frac{t_\text{past}}{T}.$$
      The premise of the argument is that $f$ is equally likely to be any number between 0 and 1. The remaining time is $t_\text{future} = T - t_\text{past}$, so the ratio of future to past is
      $$\frac{t_\text{future}}{t_\text{past}} = \frac{1-f}{f}.$$
      To be $c$-confident, keep the middle share $c$ of possible values and drop $\tfrac{1-c}{2}$ at each end, so
      $$\frac{1-c}{2} \le f \le \frac{1+c}{2}.$$
      At the lower end the ratio is $\frac{1-c}{1+c}$, and at the upper end it is $\frac{1+c}{1-c}$. So with confidence $c$,
      $$\frac{1-c}{1+c}\,t_\text{past} \le t_\text{future} \le \frac{1+c}{1-c}\,t_\text{past}.$$
      For $c = 0.95$ the factors are $\tfrac{1}{39}$ and $39$. For $c = 0.5$ they are $\tfrac13$ and $3$, the numbers behind Gott's remark at the wall.

  - type: build
    id: gott-build
    title: "Build the upper limit"
    prompt: |
      With confidence $c$ and age $t_\text{past}$, build the **upper** end of the forecast for the future duration.
    prefix: 't_\text{future} \le'
    tiles: ['t_\text{past}', '\frac{1+c}{1-c}', '\frac{1-c}{1+c}', 'c']
    answers:
      - ['t_\text{past}', '\frac{1+c}{1-c}']
      - ['\frac{1+c}{1-c}', 't_\text{past}']
    wrong:
      - answer: ['t_\text{past}', '\frac{1-c}{1+c}']
        feedback: |
          That factor is below 1 (at 95% it is $\tfrac1{39}$) and gives the **lower** end. The upper end uses its reciprocal.
      - answer: ['t_\text{past}', 'c']
        feedback: |
          $c$ is the confidence, a number between 0 and 1, not a scale factor. The factors come from the ends of the middle share $c$ of the fraction $f$.
    hint: "The upper end of the future comes from the smallest $f$: little of the life elapsed."
    explanation: |
      The smallest allowed $f$ is $\tfrac{1-c}{2}$, which makes the future as long as possible relative to the past: $\frac{1-f}{f} = \frac{1+c}{1-c}$.

  - type: text
    id: wall-worked
    title: "Worked example: the wall in 1969"
    body: |
      Recall the rule: with confidence $c$ and age $t_\text{past}$ when you meet the thing,
      $$\frac{1-c}{1+c}\,t_\text{past} \le t_\text{future} \le \frac{1+c}{1-c}\,t_\text{past}.$$
      The wall was $t_\text{past} = 8$ years old in 1969. At $c = 0.5$ the factors are $\tfrac13$ and $3$, giving
      $$\tfrac13 \cdot 8 \approx 2.7 \qquad\text{and}\qquad 3 \cdot 8 = 24$$
      years, as Gott said. At $c = 0.95$ the factors are $\tfrac1{39}$ and $39$, so
      $$\tfrac{8}{39} \approx 0.2 \qquad\text{and}\qquad 39\cdot 8 = 312$$
      years. The wall was built in August 1961 and the border opened on 9 November 1989, so from the 1969 visit it lasted another $1989 - 1969 = 20$ years, inside both ranges. One hit shows little, since the rule makes a claim about the share of cases covered. That share is next.

  - type: numeric
    id: gott-numeric
    title: "A long-running show"
    prompt: |
      A theatre show has been running for 12 years when you buy a ticket. Assume your visit is at a uniformly random moment of the show's whole run. At **50%** confidence, what is the **upper** end of the range for the number of years it will keep running? Give the number of years.
    answer: 36
    tolerance: 0.01
    wrong:
      - value: 4
        feedback: "That is the lower end of the 50% range, $12/3$. The upper end uses the reciprocal factor, 3."
      - value: 24
        feedback: "That applies the wall's numbers (age 8). Here the age is 12 and the factor at 50% is 3, so $3\\cdot 12$."
      - value: 468
        feedback: "That is the 95% upper end, $39\\cdot 12$. The question asks for 50% confidence, where the factor is $3$."
    hint: "Keep the middle half of the possible meeting moments. Which smallest fraction of the show's run could you be at?"
    explanation: |
      At 50% the middle half of the moments is $\tfrac14 \le f \le \tfrac34$. The smallest $f=\tfrac14$ gives $\frac{1-f}{f}=3$, so the future is at most $3\cdot 12 = 36$ years, with lower end $12/3 = 4$ years.

  - type: widget
    id: coverage-widget
    title: "Does the 95% really cover 95%?"
    widget: gott-interval
    config:
      timeline: false
      readouts: false
      fSlider: false
      monteCarlo: true
      draws: 1000
    body: |
      Each click draws 1000 random meeting moments and checks whether the 95% forecast covers the true future. Click several times and watch the share covered.

  - type: mcq
    id: coverage-read
    title: "What does the coverage show?"
    prompt: |
      The simulation draws meeting moments uniformly at random. The share covered tends to 95%. What does this show?
    options:
      - text: "If the meeting moment really is uniform, the rule works as promised. It does not show that real meeting moments are uniform."
        correct: true
        feedback: |
          Yes. The simulation puts the premise in by construction, so the 95% is the premise's consequence. Whether a real visit to a real wall is a random moment is a question about the world, which no simulation can answer.
      - text: "The rule is true about real things, because 95% of simulated cases are covered."
        feedback: |
          That is circular: the simulation draws the moments uniformly, so it cannot test whether real moments are uniform.
      - text: "Gott's rule is false, since 5% of the cases fail."
        feedback: |
          A 95% claim predicts that 5% fail. Failure in 5% of cases is the claim, not a refutation.
      - text: "The confidence level has to be above 99% to be meaningful."
        feedback: |
          Any $c$ works. A higher $c$ only means a wider interval ($c = 0.99$ gives $\tfrac1{199}$ to $199$).
    explanation: |
      The guarantee is conditional: given the random-moment premise, coverage tends to $c$. Everything else is the question of whether the premise fits the case.

  - type: mcq
    id: premise-critic
    title: "Which objections do critics raise?"
    prompt: |
      According to critics of Gott's rule (among them Buch and Caves), which of these are real objections? Select all that apply.
    multiple: true
    options:
      - text: "We often know a time scale, such as a human lifespan, so ignoring it throws away information."
        correct: true
        feedback: |
          Yes. Caves concludes the rule should be used only for things with no identifiable time scale. A 90-year-old person is not predicted to live up to 3,500 more years.
      - text: "Our moment of observation may be selected, not random: we may meet the thing because it is at a notable stage."
        correct: true
        feedback: |
          Yes. If we tend to look at things at particular stages, $f$ is not uniform, and the coverage guarantee fails.
      - text: "Different ways of defining the thing (a nation, a dynasty, a regime) give different ages and so different forecasts."
        correct: true
        feedback: |
          Yes. This is the reference class problem: the age that goes into the rule depends on what we choose to count as the thing.
      - text: "The arithmetic fails: $39$ is not the right factor for 95%."
        feedback: |
          The arithmetic is right, as the derivation shows ($\tfrac{1+c}{1-c} = 39$ at 0.95). The disputes concern the premises, not the algebra.
      - text: "A probability cannot be assigned to a single case, so the rule says nothing."
        feedback: |
          The rule makes a claim about the share of cases covered, which the simulation exhibits. Defenders such as Kierland and Monton argue that the core idea, that a longer age makes a longer future more likely, survives in many settings.
    explanation: |
      The dispute is about the premises (uniform moment, no further information, a natural reference class), a live debate among philosophers and physicists. Defenders say the rule is a sensible default when nothing else is known; critics say it is hard to know when that holds.

  - type: text
    id: carter
    title: "Observation selection: Carter"
    image:
      src: "img/carter.webp"
      alt: "Small portrait photograph of Brandon Carter"
      caption: "Brandon Carter (born 1942), the Australian-born theoretical physicist who named the anthropic principle in his 1973 Cracow talk."
      credit: "Cortesía del propio Brandon Carter, CC BY-SA 1.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:BrandonCarter.jpg"
    body: |
      Mediocrity has a counterweight. Brandon Carter gave a talk in Cracow in September 1973, at a symposium honouring Copernicus's 500th birthday (published 1974). According to his own wording, our location in the universe is necessarily privileged to the extent of being compatible with our existence as observers.

      The idea is called **observation selection**: observers can only look from places and times where observers can exist. A fisherman whose net has two-inch holes will never find fish smaller than two inches. Our sample of "where life exists" has exactly one entry, and it is selected by the fact that we are in it.

  - type: mcq
    id: selection-read
    title: "Selection or specialness?"
    prompt: |
      We find ourselves on a planet where life, and observers, exist. What may we conclude from the fact that we are observing from here?
    options:
      - text: "Conditions here allow observers. That alone does not show that such conditions are common or rare elsewhere."
        correct: true
        feedback: |
          Yes. Our existence guarantees compatibility with observers, whatever the real frequency of such places. A sample of one, selected by our own existence, cannot tell common from rare.
      - text: "Life must be common, since it arose on the one planet we know."
        feedback: |
          If life were rare, we would still find ourselves on a planet where it arose, since only such planets contain observers. One selected case does not tell the frequency.
      - text: "Life must be rare, since we are lucky to be here."
        feedback: |
          Same slip in the other direction. A lucky outcome looks surprising only if we forget that unlucky outcomes have no observers to be surprised.
      - text: "The universe was made for observers."
        feedback: |
          That is a commitment, not a consequence. Carter's principle says nothing about purpose: it is a fact of sampling.
    explanation: |
      Selection explains why we find ourselves in a hospitable place, and it protects against over-reading that fact in either direction.

  - type: text
    id: rare-earth
    title: "Typical position, atypical conditions"
    body: |
      The Rare Earth hypothesis, put forward by Peter Ward and Donald Brownlee in their 2000 book *Rare Earth: Why Complex Life Is Uncommon in the Universe*, argues that microbial life may be common but complex animal life needs a rare set of conditions. Reviews were mixed: some of the factors the authors identified have been challenged since, and reviewers say the question remains open.

      Notice what the claim says and does not say. Our place in the galaxy can be unremarkable while the conditions on our planet are rare. Mediocrity governs position, Rare Earth concerns conditions for complex life. The Fermi lesson (the missing aliens) used the same split. A critic of Rare Earth replies that it takes one example, ourselves, and gives it a pattern.

  - type: mcq
    id: misuse
    title: "Position versus conditions"
    prompt: |
      An astronomer says: "The Sun is an ordinary star in an ordinary galaxy, so by the Copernican principle, life with complex animals must be common." What is the best reply?
    options:
      - text: "The principle concerns where we stand. Whether the conditions for complex life are common is a separate question that needs its own evidence."
        correct: true
        feedback: |
          Yes. An ordinary address does not make the conditions common. A planet can sit in a typical place and still have unusual properties.
      - text: "The principle is false, so the argument fails."
        feedback: |
          It is a working assumption, not a falsehood, and the argument's flaw is something else: it moves from position to conditions.
      - text: "The argument is right, because Rare Earth is disproved."
        feedback: |
          Rare Earth is not disproved. Its conditions have been challenged in parts, and the question is open.
      - text: "The argument is right, because we are alive."
        feedback: |
          Our existence is a selected sample of one (observation selection) and does not tell how common life is.
    explanation: |
      The slip is to carry a verdict about position over to a verdict about conditions. Each needs its own evidence: telescopes for position, biology and planetary science for conditions.

  - type: text
    id: dot
    title: "Earth as a pale blue dot"
    image:
      src: img/pale-blue-dot.webp
      alt: "A square image of dark space crossed by brown scattered-light bands, with a tiny pale blue dot of Earth in one band"
      caption: "Voyager 1 took this picture on 14 February 1990 from about 6 billion kilometres from the Sun, when Earth filled only 0.12 of a pixel; this is a 2020 reprocessing of the same frame."
      credit: "NASA/JPL-Caltech, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Pale_Blue_Dot_from_Voyager_1_-_PIA23645.png"
    body: |
      According to Carl Sagan, who proposed the picture, the image dramatised the Copernican lesson. In his 1994 book *Pale Blue Dot* he wrote that everything humans have done took place "on a mote of dust suspended in a sunbeam", and asked readers to consider that dot again.

      Sagan drew **humility** from it: our place is small and we are one of many possible worlds. According to Guillermo Gonzalez and Jay Richards, who wrote *The Privileged Planet* (2004) and belong to the intelligent design movement, the facts point the other way: they argue that the places best for life are also the best for observing the universe, and read this as purpose. Critics reply that the correlation is no more than selection predicts (we observe from where observers can be), and that the book's claims cannot be supported.

      Each side sees the same photograph and the same sky. They part ways at the commitment layer: what a place means is not read off from where it is.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      Label the claim "Because Earth is a small dot among countless worlds, human life has no purpose." Which statement is most accurate?
    options:
      - text: "It moves from a fact about position (Earth's size and place) to a verdict on meaning, which the fact alone does not settle."
        correct: true
        feedback: |
          Yes. Position is established fact or live debate. Purpose is a commitment, and different traditions and philosophers answer it differently, some finding meaning in smallness, others in being the world that can ask.
      - text: "It is established science, because the photograph proves it."
        feedback: |
          The photograph shows size and place. It cannot show purpose either way. Treating a commitment as science is exactly the slip the course warns about.
      - text: "It is refuted, because Earth is the centre of the universe."
        feedback: |
          Earth is not the centre. The error lies in the step from position to meaning, not in the position.
      - text: "It is meaningless, because nobody can talk about purpose."
        feedback: |
          Many traditions and philosophers do, and the question is old. The point is only that the argument needs more than a fact about position.
    explanation: |
      The same observation of a small Earth can support humility, wonder, a sense of rare opportunity, or indifference, depending on commitments. A faith that places humans at the centre of meaning does not need Earth at the centre of space, and an atheism that finds no purpose does not follow from Earth's position either.

  - type: text
    id: summary
    body: |
      **Next:** the Level 21 Traps lesson tests these ideas with fast questions, each built on a common misconception: mediocrity of place read as mediocrity of conditions, the Gott rule applied without checking the premise, and selection mistaken for design.
