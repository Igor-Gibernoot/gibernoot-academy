id: ch21-biosignatures
title: "The Search for Life"
kind: concept
own: |
  The setting: the search for life beyond Earth in four places (Mars, the ocean moons Europa and Enceladus, and planets around other stars), and the logic of what would count as proof. A **biosignature** is a substance, structure or pattern that could be made by life.
  - **Mars has given ambiguous clues, never proof.** The 1976 Viking landers measured gas given off by soil with food added (a chemistry-or-biology result, with no organic molecules found); the 1996 claim for the meteorite ALH84001 rested on four lines of evidence that were each later explained without life; the 2025 report on the Perseverance rock Cheyava Falls calls its features a potential biosignature, and, as of November 2026, the sample is still on Mars.
  - **Ocean worlds are habitable places, not yet inhabited ones.** According to Cassini data, Enceladus sprays an ocean into space; according to magnetic data from Galileo, Europa probably has one. The mission Europa Clipper (arrival 2030) is built to judge habitability, not to detect life.
  - **A transit measures sizes.** When a planet of radius $R_p$ crosses the face of a star of radius $R_\star$, the starlight dims by the fraction
    {{ $$\delta=\left(\frac{R_p}{R_\star}\right)^2$$ }}
    and the thin ring of atmosphere around the planet, of height $h$, adds only
    {{ $$\Delta\delta\approx\frac{2R_p\,h}{R_\star^{2}}$$ }}
    so for an Earth-sized planet and a Sun-sized star $\delta\approx84$ parts per million and a 100 km atmosphere adds about 2.6 parts per million.
  - **A gas is a biosignature only with its alternatives ruled out.** According to Lovelock (1965), oxygen and methane together are a sign of life because each destroys the other, so something must keep making both. A single gas such as dimethyl sulfide (DMS) is weaker: for K2-18 b (a planet about 120 light-years away) the 2025 claim was about 3 sigma, other teams found insufficient evidence, and as of November 2026 it is not confirmed.
  - **Evidence is a ladder, and odds multiply.** Each independent clue multiplies the odds on life by its likelihood ratio, so a low starting point needs several strong, independent clues:
    {{ $$\begin{aligned}\text{posterior odds}&=\text{LR}_1\cdot\text{LR}_2\cdot\text{prior odds},\\ \text{LR}_k&=\frac{P(E_k\mid\text{life})}{P(E_k\mid\text{no life})}\end{aligned}$$ }}
    where $E_1$ and $E_2$ are two independent observations, LR a likelihood ratio, and the prior odds are $P(\text{life})/P(\text{no life})$ before the data.
  - **Why it matters for the Great Filter.** According to Hanson, an independent second start of life, for instance on Mars, would suggest the early steps are easy and so the filter more likely lies ahead of us; a Mars life that shares our ancestry (rocks do travel between the planets) would not show that.
  - **Where people part ways.** Layers: the data, the missions and the chemistry are fact; whether any current signal counts as evidence of life is live debate; whether life elsewhere would mean anything for purpose or God is faith or commitment.

cards:
  - type: text
    id: hook
    title: "What would convince you?"
    body: |
      Before any theory, a thought experiment, and guessing is part of this lesson. Suppose a robot sends back a measurement from another world and the headline reads "Signs of life found". What would the measurement have to be before a careful scientist, who does not want to be fooled, would say "yes, that is life"?

      Hold on to your answer. Over the next cards we meet four real cases: a robot on Mars in 1976, a rock from Mars found in Antarctica, a rover in a Martian river delta, and a planet 120 light-years away. Each came close to a headline, and each shows a different way an exciting clue can fall short.

  - type: mcq
    id: guess
    title: "Guess: the strongest sign"
    prompt: |
      Guessing is the point here. Which of these single discoveries would be the hardest to explain without life?
    options:
      - text: "A gas on a distant planet that, on Earth, only living things are known to make."
        feedback: |
          This is tempting, and it is how many headlines read. But "known to make on Earth" is not "cannot be made anywhere". Chemistry on other worlds may have routes we have not studied, and we will see cases where a gas first called a sign of life was later argued to have other sources.
      - text: "Several independent clues, from different instruments, that all fit life and that no known chemistry explains together."
        correct: true
        feedback: |
          Yes. Each clue alone has a non-living explanation, but a non-living story that explains all of them together, with no strain, is hard to find. This is the idea of a ladder of evidence that the lesson builds.
      - text: "A photograph of a shape that looks like a tiny fossil."
        feedback: |
          Shapes are the most easily fooled clue. Minerals can grow in rounded, rod-like and branching forms, and we will meet a case where tiny shapes in a rock were read as fossils and then explained without life.
      - text: "A single strong reading, repeated many times on the same instrument."
        feedback: |
          Repeating the same instrument checks that the machine is steady, not that the reading means life. If the instrument is misleading in the same way each time, repetition only repeats the mistake.
    explanation: |
      The cards ahead are built around this idea: one clue is rarely enough, and what matters is how many independent clues agree and how well the non-living explanations have been ruled out.

  - type: text
    id: viking
    title: "Mars, 1976: three experiments"
    body: |
      According to NASA's mission record, the lander **Viking 1** touched down on Mars on 20 July 1976 and **Viking 2** on 3 September 1976. Each carried three small life-detection experiments, which we can think of as three ways of asking the soil "are you alive?". In the *labeled release* experiment (Gilbert Levin), soil was fed a nutrient broth with radioactive carbon-14 in it, and the air above was watched for radioactive gas, which living microbes would breathe out. In the *gas exchange* experiment (Vance Oyama), soil was wetted and the gases in the chamber were measured for oxygen and carbon dioxide. In the *pyrolytic release* experiment (Norman Horowitz), soil was exposed to labeled carbon dioxide and carbon monoxide, then heated to see whether any carbon had been taken up.

      The labeled release test gave a positive result on both landers: gas appeared after the food was added, and soil that had been heated first gave less or none, as living things would. But a fourth instrument, a gas chromatograph and mass spectrometer led by Klaus Biemann, found no significant organic (carbon-chain) molecules in the soil, and life as we know it is built from them.

  - type: mcq
    id: viking-q
    title: "A positive test and an empty chemical search"
    prompt: |
      On Mars in 1976 the labeled release experiment gave gas after food was added (a result that looked like life), while a separate instrument found no organic molecules in the same kind of soil. According to most astrobiologists, what is the best way to read this?
    options:
      - text: "The soil probably holds a strong chemical oxidant that breaks down the food without any life, and a later lander (Phoenix, 2008) did find perchlorate salts in the soil."
        correct: true
        feedback: |
          Yes. This is the majority view: a reactive soil chemistry can mimic part of a biological test. Perchlorate is part of the story, though not all of it: some papers argue it is too weak an oxidant for the labeled release result, and others find that perchlorate hit by ultraviolet light makes a stronger one.
      - text: "The absence of organics proves that the positive result was an instrument error."
        feedback: |
          Not quite. The heated-soil controls behaved the way chemistry or biology would, so a simple error is unlikely. Also, heating soil that holds perchlorate can destroy organic molecules, so the empty search does not prove they were absent.
      - text: "The positive result proves life, since a chemical search can miss it."
        feedback: |
          This is the reading of Levin and Straat, who argue that no proposed non-living chemistry fits all the labeled release data. It is a live, minority position. But "a positive test" and "a proof" differ: the other instrument and the later perchlorate finding give the test a rival explanation, and a rival that is still standing blocks a proof.
      - text: "Because the experiments disagree, nothing can ever be concluded about Mars."
        feedback: |
          Disagreement tells us what to measure next, not that nothing can be said. Later missions, such as the 2008 Phoenix lander that found perchlorate, supplied exactly the kind of information that narrows the question.
    explanation: |
      Viking is the textbook case of an ambiguous result: a signal consistent with life, a missing companion signal, and a non-living explanation that became better known afterwards. As of 2026 the case is still argued, with new reanalyses of the old data appearing, though the majority view is that the experiments were inconclusive or negative.

  - type: text
    id: alh
    title: "A rock from Mars, 1996"
    body: |
      In December 1984 an American team collecting meteorites in the Allan Hills of Antarctica found a rock that was later shown to have come from Mars; it is catalogued as **ALH84001**. It crystallised about four billion years ago, was blasted off Mars about 17 million years ago, and fell on Antarctica about 13,000 years ago.

      In August 1996 a NASA team led by David McKay and Everett Gibson published in the journal *Science* a paper titled, in essence, "Search for past life on Mars: possible relic biogenic activity in a Martian meteorite". It rested on four lines of evidence: small globules of carbonate minerals, organic molecules called polycyclic aromatic hydrocarbons concentrated in them, tiny crystals of the iron oxide magnetite that resembled those made by bacteria, and rod-like shapes a few tens of nanometres across that looked like fossil microbes. The claim made world news.

  - type: mcq
    id: alh-q
    title: "Four clues that fail one by one"
    prompt: |
      Each of the four lines of evidence for fossil life in ALH84001 was later given a non-living explanation: the organic molecules are also found in meteorites and comets, magnetite and carbonate globules like these were made in the laboratory without life (2001), and the shapes are smaller than known cells. A 2022 study concluded that the organics came from hot water reacting with rock on early Mars. The authors of the 1996 paper still defend their work. What general lesson fits this case best?
    options:
      - text: "Clues that are each explainable without life do not add up to a strong case unless the explanations also fail together, and here a single non-living history (hot water and rock) could explain the lot."
        correct: true
        feedback: |
          Yes. Four weak clues are not four independent strong ones. If one process can account for all of them, they are really one clue counted four times.
      - text: "Scientists should never announce a possible biosignature."
        feedback: |
          That is the wrong lesson. Even critics credit the 1996 announcement with reviving Mars exploration. The lesson is about the strength of the evidence and how it is worded, not about silence.
      - text: "Since the authors still defend the claim, the question is exactly 50-50."
        feedback: |
          How firmly someone holds a claim is not evidence for it. The consensus in the field is that there is no convincing evidence of Martian life in this meteorite, while the authors remain a minority dissent.
      - text: "A rock from Mars can never carry evidence of life."
        feedback: |
          Nothing in the case says so. A future sample with clearer evidence, found with its geological setting recorded, could settle matters; this one was a lump of rock with no record of where on Mars it came from.
    explanation: |
      The rock also teaches something else. Mars rock reaches Earth: ALH84001 is one of many Martian meteorites. Keep that in mind for the last cards, because it bears on whether life found on Mars would be a separate start or a relative of ours.

  - type: text
    id: perseverance
    title: "Jezero crater, 2024 and 2025"
    image:
      src: img/cheyava-falls.webp
      alt: "A close-up of a pale, layered rock on Mars with two small red circles and labels marking one leopard spot and one grain of the mineral olivine."
      caption: "The rock nicknamed Cheyava Falls, photographed by the rover Perseverance: its pale 'leopard spots' have dark rims, where chemical reactions left two iron minerals."
      credit: "NASA, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:1-PIA26368-Perseverance_Finds_a_Rock_with_Leopard_Spots-annotated.png"
    body: |
      The rover **Perseverance** landed in Jezero crater in February 2021, a place chosen because it once held a lake fed by a river. In July 2024 it examined a rock nicknamed **Cheyava Falls**, in a formation called Bright Angel on the edge of an old river valley, and drilled a core from it, labelled **Sapphire Canyon**. The rock is a fine-grained sediment rich in organic carbon, sulfur, rust-like oxidised iron and phosphorus, marked with pale spots with dark rims, called "leopard spots".

      On 10 September 2025 NASA and a team led by Joel Hurowitz (Stony Brook University) reported in *Nature* that the dark rims hold two iron minerals, vivianite (an iron phosphate) and greigite (an iron sulfide). On Earth such minerals often form when microbes feed on organic matter in mud, so NASA called the find a **potential biosignature**: something that may have a biological origin but needs more study. The team also says non-living routes exist, such as high temperature, acid conditions, or binding by organic molecules, though the rock shows no sign of heat or acid, which makes them less likely. NASA's project scientist said they cannot be ruled out.

  - type: mcq
    id: perseverance-q
    title: "What does a potential biosignature need next?"
    prompt: |
      The Sapphire Canyon core from Mars holds minerals that on Earth often come from microbes, and NASA calls the find a potential biosignature. As of November 2026 the core is stored on Mars. According to the researchers' own account, what is the logical next step toward deciding between life and non-living chemistry?
    options:
      - text: "Test the non-living explanations directly, with laboratory instruments that can only be used on Earth, on the returned core."
        correct: true
        feedback: |
          Yes. Hurowitz has said the ultimate tests need the core in Earth laboratories. Congress funded no money for the Mars Sample Return programme in early 2026 and NASA is exploring other options, so how and when that happens is open; China's Tianwen-3 mission is aiming to return its own Mars samples by about 2031.
      - text: "Announce that life has been found, since the minerals match what microbes make on Earth."
        feedback: |
          A match to what life makes is not a proof that life made it. The point of "potential" is that rival explanations are less likely, not removed.
      - text: "Drop the claim, since the rover cannot be sure."
        feedback: |
          Certainty is not the standard for a clue. A potential biosignature is a result worth following up because the easy explanations look weak, and the way to follow up is more testing, not silence.
      - text: "Measure the same rock again with the same instruments on the rover."
        feedback: |
          The rover's instruments have already given the data in question. Repeating them checks the readings, but the open question is which process made the minerals, and that needs different kinds of tests.
    explanation: |
      Notice how this case differs from Viking and from ALH84001: here the rock sits in a known setting and several instruments agree about what it contains. It is still one rock and one set of clues, and the key tests wait for a laboratory.

  - type: text
    id: oceans
    title: "Ocean worlds: Enceladus and Europa"
    image:
      src: img/enceladus-plumes.webp
      alt: "A dark, icy moon seen in a Cassini image, with fine jets of ice spraying into space from long fractures near its south pole."
      caption: "Plumes of water ice spraying from the 'tiger stripes' near the south pole of Saturn's moon Enceladus, imaged by the spacecraft Cassini."
      credit: "NASA/JPL/SSI, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Enceladus_geysers_June_2009.jpg"
    body: |
      Life needs liquid water, and some of the best places in the solar system for it are not warm planets but icy moons. Saturn's moon **Enceladus** sprays a plume of water vapour and ice grains into space from cracks near its south pole. The spacecraft Cassini, which reached Saturn in 2004 and ended its mission on 15 September 2017, found the plumes in 2005 and later flew through them; it found hydrogen, which NASA linked to hot-water chemistry on the sea floor, and in 2023 a team led by Frank Postberg reported in *Nature* that Cassini's older data showed sodium phosphates in ice grains, so phosphorus, an element life needs, seems to be there in quantity.

      Jupiter's moon **Europa** is less direct. In 2000 a team led by Margaret Kivelson reported in *Science* that Jupiter's magnetic field induces a secondary field at Europa, as a salty ocean would, though other scientists then said the evidence was indirect. Hints of plumes there are debated. NASA's mission **Europa Clipper** launched on 14 October 2024 and is due to reach Jupiter on 11 April 2030, with about 49 flybys of Europa to follow. NASA stresses that it is not a life-detection mission: its aim is to judge whether Europa could support life.

  - type: mcq
    id: oceans-q
    title: "Habitable is not inhabited"
    prompt: |
      Enceladus throws part of its ocean into space, so a passing spacecraft can sample it, while Europa Clipper is built to judge whether Europa could support life, not to detect life. Which statement is the right reading of these facts?
    options:
      - text: "A place can have the ingredients for life (liquid water, an energy source, phosphorus) without any life in it; showing habitability is a separate and earlier question than showing presence."
        correct: true
        feedback: |
          Yes. Habitable means able to support life. Whether life actually uses the chance is the question a later mission would have to ask with different instruments.
      - text: "If an ocean has the ingredients for life, life must be there."
        feedback: |
          This treats ingredients as proof. Nobody knows how likely it is that life starts where the ingredients are present. That unknown number is the heart of the Drake equation and the Great Filter.
      - text: "Since plumes reach space, ocean life would be easy to see from Earth with a telescope."
        feedback: |
          Plumes make sampling easier for a spacecraft that flies through them, but from Earth a plume of ice and vapour is far too faint to tell us about microbes. A close flyby with mass spectrometers is the realistic way.
      - text: "An ocean moon cannot be habitable because it receives little sunlight."
        feedback: |
          Sunlight is one energy source, not the only one. Hydrogen from sea-floor chemistry, as Cassini found for Enceladus, can feed life in the dark, as it does around hot vents on Earth's sea floor.
    explanation: |
      This is the "which question am I answering?" habit that the rest of the lesson uses: is the place suitable, is something there, and is it alive.

  - type: text
    id: transit
    title: "Reading a planet's air from 120 light-years"
    body: |
      Most planets we can study are too far and too faint to photograph. Instead, astronomers use the **transit method**: when a planet passes in front of its star, it blocks a little of the starlight, and some of the light that grazes its atmosphere passes through the gas. Each gas absorbs particular colours of starlight, so the colours that dim a little more during the transit are a fingerprint of the gases. This is **transmission spectroscopy**, and the space telescope JWST, launched on 25 December 2021, is the best instrument for it.

      The sizes decide how big the signal is. If a planet of radius $R_p$ crosses a star of radius $R_\star$, the planet's dark disc covers a fraction
      $$\delta=\left(\frac{R_p}{R_\star}\right)^2$$
      of the star's disc, since both areas are proportional to the radius squared and the factor $\pi$ cancels. The thin ring of atmosphere, of height $h$ above the planet's edge, adds a ring of area about $2\pi R_p h$, so
      $$\Delta\delta\approx\frac{2R_p\,h}{R_\star^{2}}.$$

  - type: numeric
    id: depth
    title: "How big is the dip?"
    prompt: |
      An Earth-sized planet (radius $R_p=6371$ km) crosses a Sun-sized star (radius $R_\star=695{,}700$ km). By what fraction does the starlight dip, in **parts per million** (millionths of the star's light)? Give the nearest whole number.
    answer: 84
    tolerance: 1
    answerText: '84 parts per million'
    wrong:
      - { value: 9.16, feedback: "That is the ratio of the radii, $R_p/R_\\star$. The dip is the ratio of the areas, which is that ratio squared." }
      - { value: 8400, feedback: "A fraction of $8.4\\times10^{-5}$ is $84$ parts per million, not $8400$: a million times $8.4\\times10^{-5}$ is $84$." }
    hint: |
      The fraction of the disc blocked is the ratio of two areas, so it is the ratio of the radii squared. Multiply the fraction by one million.
    explanation: |
      The radius ratio is
      $$\frac{R_p}{R_\star}=\frac{6371}{695{,}700}=0.00916.$$
      Squaring gives
      $$\delta=(0.00916)^2=8.4\times10^{-5},$$
      which is $84$ parts per million. An atmosphere 100 km thick adds only
      $$\Delta\delta\approx\frac{2\cdot6371\cdot100}{695{,}700^{2}}=2.6\times10^{-6},$$
      about $2.6$ parts per million. That is the scale of signal JWST must find and separate from noise, which is why a claim about a gas in an atmosphere has to be backed by careful statistics.

  - type: text
    id: k218
    title: "K2-18 b and a smelly gas"
    body: |
      **K2-18 b** is a planet about 120 light-years away, in the constellation Leo (sources give about 110 to 124 light-years), around a small red dwarf star. It is about 8.6 times the mass of Earth and 2.6 times its radius, so it is bigger than Earth and smaller than Neptune. Some astronomers, among them Nikku Madhusudhan of the University of Cambridge, suggest it could be a "Hycean" world: a hydrogen-rich atmosphere over a water ocean. That model is itself debated, and the ocean may be too hot for life.

      In September 2023 his team reported from JWST's near-infrared instruments clear methane and carbon dioxide, and a weak hint of **dimethyl sulfide** (DMS), at about 2 sigma. On Earth, as far as scientists know, DMS is made by life, mainly by marine plankton, and it contributes to the smell of the sea. "Sigma" measures how far a signal is from noise: 2 sigma means a roughly one in twenty chance of a fluke. In April 2025 the team, now using JWST's mid-infrared instrument, reported DMS or the related dimethyl disulfide at about 3 sigma, roughly a three-in-a-thousand chance of a fluke. They said explicitly that they were not claiming to have found life, and that a standard discovery level (5 sigma) would need much more observing time.

  - type: mcq
    id: k218-q
    title: "How the claim was challenged"
    prompt: |
      Other teams re-analysed the K2-18 b data. A joint analysis of all JWST instruments (Piaulet-Ghorayeb and colleagues, published in 2025) found insufficient evidence for DMS; a re-reduction of the 2023 data (Schmidt and colleagues, December 2025) kept methane at about 4 sigma but found no significant evidence for carbon dioxide or DMS; and the original team's own 2026 revision says DMS is the only gas that consistently fits better, but not a confirmed detection. As of November 2026, what is the fair summary?
    options:
      - text: "A hint of a gas that on Earth is made by life, but with weak statistics that depend on how the data are processed, not confirmed, and with non-living sources for the gas also proposed."
        correct: true
        feedback: |
          Yes. It is a live debate, not a discovery and not a refutation. Even the strongest believers in the signal say it is not confirmed, and critics point to possible non-living sources: DMS has been found on a comet and made in the laboratory.
      - text: "Life on K2-18 b has been discovered, and the critics are denying the data."
        feedback: |
          The team itself did not claim life, and its own 2026 text says the result is not a confirmed detection. Critics disagree about how strong the statistics are, not about whether life would be interesting.
      - text: "The claim has been disproved: the planet has no DMS."
        feedback: |
          The critics found insufficient evidence for DMS in the existing data, which is not the same as showing it is absent. The data cannot tell yet, and more observing time is the way to find out.
      - text: "Since two teams disagree, the truth is in the middle: a bit of life."
        feedback: |
          Averaging two views is not how evidence works. The disagreement is about whether the signal is real, and the answer is either the gas is there or it is not; more data, not a compromise, decides.
    explanation: |
      This is the pattern from Viking and ALH84001 again, in a new place: one clue, an unsettled signal, a non-living explanation still standing. The difference is that the quantity at stake (how many sigma, how many instruments, how many sources of the gas) is now stated openly.

  - type: text
    id: gases
    title: "Gases together, and false alarms"
    body: |
      Which gases would be the best sign? In 1965 the chemist James Lovelock proposed in *Nature* (Joshua Lederberg made a related proposal in *Nature* in the same year) that a whole atmosphere out of chemical balance could reveal life. Earth is the example: its air holds oxygen (about 21 per cent) and methane (about 1.5 parts per million) together, though they react and destroy each other, so something must keep making both. A planet with only one of them is easier to explain without life; a planet with both is hard.

      Even so, false alarms happen. In September 2020 a team led by Jane Greaves reported phosphine, a gas that on Earth is mostly made by life and industry, in the clouds of Venus. Several teams challenged the result, arguing that the line seen was more probably sulfur dioxide or noise, and in November 2020 the authors told the journal of an error in the original processing of the radio-telescope data, so the journal cautioned readers about the quoted amounts. The case shows how thin a single line in a spectrum can be.

  - type: mcq
    id: gases-q
    title: "Why oxygen and methane together?"
    prompt: |
      According to Lovelock (1965), why is the pair of oxygen and methane in one atmosphere a stronger sign of life than oxygen alone or methane alone?
    options:
      - text: "They react with each other and would vanish quickly, so both being present means something is continuously making both; an atmosphere out of chemical balance needs a source of energy."
        correct: true
        feedback: |
          Yes. It is the disequilibrium, not either gas, that carries the information. Abiotic ways of making each gas separately exist, but keeping the pair together is hard.
      - text: "Oxygen and methane are the two gases that all living things breathe."
        feedback: |
          Many organisms live without oxygen, and many do not use methane. The argument is about the pair being chemically incompatible, not about what organisms need.
      - text: "They are the two most common gases in space, so finding them proves nothing."
        feedback: |
          The argument is not about how common either gas is; it is about the pair being impossible to keep together without a source. A single gas can have non-living sources, which is why one gas alone is weaker evidence.
      - text: "Oxygen cannot be made without life, so oxygen alone is already proof."
        feedback: |
          Oxygen can also be made without life, for instance when ultraviolet light splits water vapour or carbon dioxide, so a planet with oxygen alone could be a false alarm. Reviews call this the main non-living false positive for oxygen.
    explanation: |
      A strong biosignature makes a claim about a whole system: what is present, what should have destroyed it, and what could have made it without life. The weaker the second and third parts, the weaker the claim.

  - type: text
    id: ladder
    title: "A ladder of evidence"
    body: |
      Recall the odds form of Bayes' rule: for a hypothesis $H_1$ (life) against $H_2$ (no life), and evidence $E$,
      $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}.$$
      The first factor on the right is the likelihood ratio of $E$, how much likelier the evidence is if there is life than if there is not. For independent clues, the ratios multiply. A clue that is explainable by non-living chemistry has a likelihood ratio near 1, so it moves the odds little.

      This is the thought behind a scale NASA scientists proposed in 2021 (Green and colleagues, in *Nature*): the *Confidence of Life Detection* scale, seven levels from a first possible signal up to independent confirmation, built so that a claim has to climb them one by one. The old saying that extraordinary claims need extraordinary evidence, made famous by Carl Sagan, is the same logic: the lower the starting odds, the more the ladder must multiply.

  - type: numeric
    id: odds
    title: "Two independent clues"
    prompt: |
      A toy example, with invented numbers. Before any data, suppose you give the odds of life on a given world as 1 to 100 against, that is, $\frac{P(\text{life})}{P(\text{no life})}=\frac{1}{100}$. A first clue is 5 times as likely if there is life as if there is not. A second clue, independent of the first and from a different instrument, is also 5 times as likely if life. What are the odds on life now, as a number (a fraction such as $\tfrac14$ is 0.25)?
    answer: 0.25
    tolerance: 0.001
    answerText: '1 to 4 (0.25)'
    wrong:
      - { value: 0.05, feedback: "That uses one clue only: $5\\times\\frac{1}{100}=\\frac{1}{20}$. The second independent clue multiplies the odds by 5 again." }
      - { value: 0.01, feedback: "That is the odds before any data. Both clues should have raised them." }
    hint: |
      Independent likelihood ratios multiply, and the result multiplies the starting odds.
    explanation: |
      Multiply the starting odds by each likelihood ratio:
      $$\frac{1}{100}\cdot5\cdot5=\frac{25}{100}=\frac14.$$
      Two clues of 5 have raised the odds 25-fold, to 1 to 4 against, still not even. A third would make them 5 to 4 in favour. If the two clues were not independent (say, both come from the same instrument or the same chemistry), the second would add almost nothing, which is the trap of ALH84001.

  - type: mcq
    id: ladder-q
    title: "Which new observation helps most?"
    prompt: |
      A team has a 3-sigma hint of a gas that on Earth is made by life, seen with one JWST instrument. Which of the next steps would raise the odds on life the most if it came out in favour?
    options:
      - text: "A second, independent observation with another instrument that also fits, plus a calculation showing that no non-living process makes enough of the gas."
        correct: true
        feedback: |
          Yes. An independent clue multiplies the odds, and ruling out the non-living sources lowers the chance of the gas without life, which makes the likelihood ratio larger.
      - text: "Re-running the same analysis on the same data with a slightly different method."
        feedback: |
          This uses the same data again. It is a good check on the processing, but it adds no new independent evidence, so the odds on life do not move much.
      - text: "Writing a press release so that more scientists look at the claim."
        feedback: |
          Attention is not evidence. More people examining the claim can help find errors, but the odds change only when new data or new calculations do.
      - text: "Repeating the claim at higher confidence by choosing a more favourable model."
        feedback: |
          Choosing the model that favours the claim is the opposite of a test: the 2025 critics' main complaint about the statistics was exactly that the result depended on analysis choices.
    explanation: |
      The ladder asks two things of each step: is it independent of the rungs below, and does it remove a non-living explanation. A step that does neither is a rung of paper.

  - type: mcq
    id: filter-q
    title: "Back to the Great Filter"
    prompt: |
      Recall from the lesson on the Fermi paradox: the Great Filter (Hanson, 1998) is a very improbable step on the way from dead matter to lasting, expanding life; if the start of life is easy, the filter more likely lies ahead of us. Suppose a future mission found life in the soil of Mars. According to Hanson's reasoning, what would settle whether it suggests that the start of life is easy?
    options:
      - text: "Whether it began on Mars separately from life on Earth, or is related to it (for instance through rocks thrown from one planet to the other)."
        correct: true
        feedback: |
          Yes. If it started independently, life began twice in one solar system, which suggests it is easy and moves the filter ahead. If it shares ancestry with us, it is one origin that spread, and the rarity of that origin is untouched. Mars rocks do reach Earth, as ALH84001 shows, so the question is real; comparing the biochemistry (does it use our genetic code?) is the test.
      - text: "Nothing: any life on another world means that the filter lies ahead."
        feedback: |
          Only an independent origin carries that message. A single origin that spread by meteorites would not say whether starting life is easy or hard.
      - text: "Whether the life on Mars is intelligent."
        feedback: |
          Simple microbes are enough for the argument. The point is about how hard the first step is, not about how far evolution went.
      - text: "Nothing: finding life on Mars would show that the filter is behind us."
        feedback: |
          It is the other way round. If the early steps are easy, then the hard step, if there is one, must come later, which means ahead of us. That is why the independence of the origin is what counts.
    explanation: |
      This is why a shared or separate origin matters more than the mere presence of life. Layered: the biochemical comparison would be fact, how to weigh a single second origin is debate, and what it means for us is a matter of outlook.

  - type: mcq
    id: layers
    title: "Three layers"
    prompt: |
      Sort the claim. "As of November 2026 the dimethyl sulfide on K2-18 b is a hint of life, but not a confirmed detection" mixes three kinds of statement. Which is the layer-three (faith or commitment) statement among the following?
    options:
      - text: "If life exists elsewhere, it shows that the universe is meaningless or, to others, that it is full of purpose."
        correct: true
        feedback: |
          Yes. Whether a discovery of alien life supports or undermines a religion, or purpose, is a matter of what one brings to it. Believers, atheists and agnostics have all argued both ways, and the data cannot choose among them.
      - text: "JWST observed K2-18 b and the gas fingerprint it reports is at about 3 sigma."
        feedback: |
          That is established fact about what was measured and claimed. It records what was observed and how it was reported, not what it means.
      - text: "Other teams find that the statistics do not support the claim."
        feedback: |
          That is a live scientific debate: a disagreement about how to analyse data, which more data can settle.
      - text: "DMS has been made in laboratory experiments without any life."
        feedback: |
          That is established fact (laboratory work and observations of a comet), though whether it explains the amount on K2-18 b is part of the debate.
    explanation: |
      Facts, debate and commitment are kept apart so that no one passes a layer-three belief off as layer one, in either direction.

  - type: text
    id: summary
    body: |
      **Next:** the guided problem *Estimating Civilisations with Uncertainty* returns to the Drake equation: with the seven factors you met, each known only within a wide range, how do you carry the uncertainty through to the number of civilisations, and what does the result say about the silence?
