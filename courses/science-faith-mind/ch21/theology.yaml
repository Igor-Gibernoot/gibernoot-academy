id: ch21-theology
title: "Aliens and Theology"
kind: concept
own: |
  The setting: suppose that intelligent minds exist elsewhere in the universe (this lesson does not say they do). It asks what the major religious traditions have written, or would say, about that case, and where thoughtful people part ways.
  - **The question is old.** According to historians of the debate, a plurality of inhabited worlds was argued by Nicholas of Cusa (*De docta ignorantia*, 1440), Giordano Bruno (1584), Fontenelle (1686) and Kant (1755), long before any telescope could test it; Aquinas, by contrast, argued that there is one world, because the order of creatures is one.
  - **Christianity's sharpest point is the incarnation.** Christians hold that God the Son became human in Jesus. Let $A$ = "intelligent life exists elsewhere" and $B$ = "salvation depends on one incarnation that is unique and cannot reach other minds". The argument that aliens refute Christianity needs both:
    {{ $$A \wedge B \;\Rightarrow\; \text{conflict with Christian doctrine}$$ }}
    and defenders reject $B$ in several ways: other minds were never fallen, the reply of {{ unfallen worlds }} (Lewis's fictional Malacandra; Funes's suggestion), they are redeemed separately, or the one incarnation suffices for all, as Ted Peters argues. Aquinas himself held that a divine person could assume another human nature.
  - **Other traditions open different doors.** According to the Qur'an (42:29), God dispersed living beings through the heavens and the earth; some Muslim scholars read this as life elsewhere, others as earthly creatures. Jewish sources differ: Crescas found nothing against other worlds, and Horowitz allowed inhabited worlds unlike ours. Hindu and Buddhist texts speak of countless universes and realms of beings. Latter-day Saint scripture speaks of worlds without number. The Raelian movement places aliens at the origin of life on Earth.
  - **Creation and human significance.** The Copernican worry says that if humans are not the only minds, they are less special. The tension between science's general laws and a claim that one particular event matters for all is called {{ the scandal of particularity }}; the reply runs the other way: a particular event can still matter without making Earth the only home of minds.
  - **Three layers.** Fact: what each tradition's texts and thinkers wrote. Debate: how to reconcile those texts with the existence of other minds. Commitment: whether discovery would matter for faith at all.

cards:
  - type: text
    id: hook
    title: "If we were not alone"
    body: |
      Before any history, a guess, and guessing is part of this lesson. Suppose tomorrow astronomers prove, beyond reasonable doubt, that intelligent minds live on a planet around another star. They think, build and ask the questions we ask.

      Some people expect religions to crack. Others expect shrugs. Who is right depends on what each tradition actually teaches, and that varies a great deal. The cards ahead follow the question from its early history through Christianity, Islam, Judaism, Hindu and Buddhist traditions, Mormonism and the Raelians, always in the form "according to this thinker or text", never as a verdict on what is true.

  - type: mcq
    id: guess
    title: "Guess: what makes it hard"
    prompt: |
      Which feature of a religious tradition would make the discovery of other minds hardest to accommodate?
    options:
      - text: "A central claim that one particular event on Earth was decisive for all creatures that need saving."
        correct: true
        feedback: |
          Yes, that is the usual worry. If something unique and unrepeatable happened on Earth for the sake of everyone who needs it, the question arises of what that means for minds that were never on Earth. Whether it really causes trouble is what the lesson examines.
      - text: "A belief that the universe is very large."
        feedback: |
          Size alone causes little trouble. Several traditions describe vast or countless worlds, as the cards will show.
      - text: "A belief in prayer."
        feedback: |
          Prayer is a practice that other minds could share or not. It does not by itself tie the tradition to Earth.
      - text: "A belief that God created the stars."
        feedback: |
          A creator of the stars is the easy case: other minds would be more of the same creation. The harder cases involve events and roles tied to one place.
    explanation: |
      Keep the guess: claims about one decisive event are the ones most affected. The lesson tests it on Christianity, where the claim is the incarnation, and then on traditions with other starting points.

  - type: text
    id: old
    title: "An old question, before telescopes"
    image:
      - src: img/cusa.webp
        alt: "Painted portrait of Nicholas of Cusa in a red cardinal's cap and robe"
        caption: "Nicholas of Cusa (1401 to 1464), a cardinal, wrote in 1440 that the earth is a star among stars and that other stellar regions may have inhabitants."
        credit: "Master of the Life of the Virgin, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Nicholas_of_Cusa.jpg"
      - src: img/bruno.webp
        alt: "Engraved portrait of Giordano Bruno in a hooded Dominican habit"
        caption: "Giordano Bruno (1548 to 1600) argued in 1584 for an infinite universe whose stars are suns with their own inhabited worlds."
        credit: "Mentzel, Johann Georg, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Giordano_Bruno_-_Mentzel_(cropped).jpg"
        beside: true
    body: |
      The question did not wait for modern astronomy. According to reference accounts, the cardinal Nicholas of Cusa wrote in *De docta ignorantia* (1440) that the earth is a star like other stars and not the centre of the universe, and that the inhabitants of other stars, of whatever kind, cannot be compared with ours because we have no standard to judge them. He was a high church official, and his writings were not condemned as heretical.

      Giordano Bruno went further in *De l'infinito, universo et mondi* (1584): according to the standard accounts, he held that the universe is infinite, that the stars are suns with planets of their own, and that those worlds have animals and inhabitants. He was burned at the stake in Rome on 17 February 1600. Historians disagree about the reason. Some say his trial centred on theology, such as the Trinity and the divinity of Christ, and weighed his views on plural worlds less than the popular story suggests; others hold that the worlds mattered more.

  - type: text
    id: old-two
    title: "Fontenelle and Kant"
    image:
      - src: img/fontenelle.webp
        alt: "Painted portrait of Bernard le Bovier de Fontenelle in a wig and dark coat"
        caption: "Bernard le Bovier de Fontenelle (1657 to 1757) made plural worlds a fashionable subject for general readers in 1686."
        credit: "Nicolas de Largillière, Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Fontenelle.jpg"
      - src: img/kant.webp
        alt: "Painted portrait of Immanuel Kant, around 1790"
        caption: "Immanuel Kant (1724 to 1804) published his account of the heavens anonymously in 1755."
        credit: "Unknown, possibly Elisabeth von Stägemann (Anton Graff school), Public domain, via Wikimedia Commons"
        link: "https://commons.wikimedia.org/wiki/File:Immanuel_Kant_portrait_c1790.jpg"
        beside: true
    body: |
      In 1686 the French writer Bernard le Bovier de Fontenelle published *Entretiens sur la pluralité des mondes* (conversations on the plurality of worlds). According to the encyclopedia accounts it is the most influential early work on the subject: it explained the Copernican picture of the heavens and argued that other worlds are likely inhabited. In 1755 the young Immanuel Kant published *Universal Natural History and Theory of the Heavens* anonymously. Besides his account of how the solar system formed, he argued in essence that the planets are inhabited, and that thinking beings on the more distant ones may be more perfect than we are.

      Michael Crowe's history of the debate (1986) covers the period from 1750 to 1900 and stresses that these writers' views on other worlds were often closely tied to their religious beliefs. That is why the rest of the lesson reads each tradition on its own terms.

  - type: order
    id: timeline
    title: "Put the history in order"
    prompt: |
      Put these in the order in which they appeared.
    steps:
      - "Nicholas of Cusa, De docta ignorantia (1440)."
      - "Giordano Bruno, De l'infinito, universo et mondi (1584)."
      - "Fontenelle, Entretiens sur la pluralité des mondes (1686)."
      - "Kant, Universal Natural History and Theory of the Heavens (1755)."
      - "C. S. Lewis, Out of the Silent Planet (1938)."
      - "Father José Funes's interview in the Vatican newspaper L'Osservatore Romano (2008)."
    hint: "The first four are early modern; the last two come from the twentieth century and the twenty-first."
    explanation: |
      The debate runs from a cardinal in 1440, through the early modern writers, to a novelist in 1938 and a Vatican astronomer in 2008. The last two matter for the Christian question, which is next.

  - type: text
    id: aquinas
    title: "Aquinas: one world, but another human nature possible"
    image:
      src: img/aquinas.webp
      alt: Painted portrait of Thomas Aquinas in a black and white Dominican habit on a gold background, by Carlo Crivelli
      caption: Thomas Aquinas (1225-1274), an Italian Dominican friar and theologian, in a panel Carlo Crivelli painted in 1476 (National Gallery, London); his Summa Theologiae shaped how Christian thinkers later reasoned about creation.
      credit: "Carlo Crivelli, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Thomas_Aquinas_by_Carlo_Crivelli.png"
    body: |
      Christian thinkers could not avoid Thomas Aquinas. Two passages of his *Summa Theologiae* bear on the question, and they answer different questions.

      In the first part, question 47, article 3, he asks whether there is only one world, and he answers yes. His reason is the unity of order: the creatures that come from God are ordered to one another and to God, so, he argues, they all belong to one world. He adds that a multitude of material worlds has no natural limit, so it cannot be what God aims at. Notice what is and is not said. He argues about a world as an ordered whole, and he adds a point from the physics of his day: any other earth would fall toward the central one.

      In the third part, question 3, article 7, he asks whether one divine person can assume two human natures. According to the article, the answer is yes: the divine person, beyond the human nature already assumed, can assume another distinct human nature. In that case, he says, the person would be called one man having two human natures, because of the unity of the person. That is a statement about what God can do, not a claim that it happens.

  - type: mcq
    id: aquinas-q
    title: "What do the two passages say?"
    prompt: |
      A reader says: "Aquinas ruled out other inhabited worlds, so his theology has no room for a second incarnation." According to the two passages, what is the fairest correction?
    options:
      - text: "In one passage he argues for a single world on grounds of order; in the other he says a divine person could assume another human nature. The two do not simply cancel, and neither is about modern astronomy."
        correct: true
        feedback: |
          Yes. The first is a claim about the unity of creation, argued from his physics and metaphysics. The second is a claim about divine power and possibility. A modern reader can accept the second while questioning the first.
      - text: "He said aliens exist and were redeemed by Christ."
        feedback: |
          He says neither. The passages discuss one world and the possibility of another human nature, not extraterrestrials as we now understand them.
      - text: "He denied that God could do more than one incarnation."
        feedback: |
          The opposite. In the third part, question 3, article 7, he says a divine person can assume another distinct human nature.
      - text: "He wrote nothing relevant to the question."
        feedback: |
          Both passages are cited in discussions of the topic, which is why they are read here, with their limits.
    explanation: |
      The point of reading Aquinas with care: the first passage fits poorly with many worlds, the second leaves the door open on God's side. Later thinkers use him on both sides.

  - type: text
    id: christ
    title: "Christianity: once, or many times?"
    body: |
      Christians hold that, according to the Gospels and the creeds, God the Son became human in Jesus of Nazareth. Hence the question that people raise about other minds: did this happen once, for everyone, or would it happen on other worlds as well?

      The fiction writer and Christian apologist C. S. Lewis explored a third idea in *Out of the Silent Planet* (1938). In the story, a Cambridge philologist is taken to Malacandra (Mars), whose intelligent species live without the rebellion that, in the story, marred Earth, which is called Thulcandra, the silent planet, because its ruling spirit has become "bent" and been cut off. Each world in the story has a ruling spirit called an Oyarsa, who answers to Maleldil, the ruler of all. The point for the theology: another world may never have fallen.

      Father José Gabriel Funes, a Jesuit and then director of the Vatican Observatory (2006 to 2015), said in an interview in L'Osservatore Romano in May 2008, reported under a headline that English media rendered as "The extraterrestrial is my brother", that alien life would not contradict the faith, that we cannot limit God's creative freedom, and that other beings might not need redemption since they might have remained in friendship with their creator. It was his personal view, not an official Vatican statement.

  - type: text
    id: christ-views
    title: "Steelmanning one incarnation and many"
    body: |
      Here are the two best-known positions, each in the form its defenders would accept.

      **One incarnation suffices.** According to Ted Peters, whose chapter "One Incarnation or Many?" appears in the collection *Astrotheology* (2018), the incarnation is a single event in terrestrial history that is valid for the redemption of creation as a whole. The strength of the view is that it keeps the Gospel's particular story and asks no repetition. Its difficulty is how a single event reaches minds that never heard of it.

      **Many incarnations.** According to a line of work including that of Alexei Nesteruk, one can hypothesise that the incarnation takes place for each inhabited world. The strength is that it meets other minds where they live and matches Aquinas's point that a divine person can assume another human nature. Its difficulty is the Christian emphasis on Jesus as the unique, unrepeatable event, which Funes, as reported, also affirmed. The Vatican Observatory's own materials treat the question of baptising an alien as a trap, in a book (2014) by Guy Consolmagno and Paul Mueller titled *Would You Baptize an Extraterrestrial?*, where Consolmagno answered, in essence, that he would only if the alien asked.

  - type: mcq
    id: redemption
    title: "Do other minds need redeeming?"
    prompt: |
      Christian thinkers give three main replies to "would other minds need redemption?". Which reply says that another world might never have gone wrong, so it has nothing to be redeemed from?
    options:
      - text: "The unfallen-world reply (Lewis in fiction; Funes, as reported, in the interview)."
        correct: true
        feedback: |
          Yes. If sin entered the story on Earth, other worlds need not share it. The objection is that the sin, or the brokenness of creation, may be a feature of any created minds, which the next replies take seriously.
      - text: "The one-incarnation reply, where the event on Earth is enough for all."
        feedback: |
          That reply grants that others may need redemption and says the Earth event reaches them. It does not deny the need.
      - text: "The many-incarnations reply, where each inhabited world has its own."
        feedback: |
          This reply, too, supposes a need for redemption in each world, met locally.
      - text: "None of the replies; all say that other minds do not exist."
        feedback: |
          These are replies to the case in which they do exist. The view that they do not is a separate position about the facts.
    explanation: |
      Three replies: other worlds are unfallen, they are redeemed in their own way, or one incarnation suffices for all. None is established Christian doctrine; they are options in a debate, and each has defenders and objectors.

  - type: text
    id: islam
    title: "Islam: a verse and two readings"
    body: |
      According to the Qur'an, chapter 42 (Ash-Shura), verse 29, in the Clear Quran translation by Mustafa Khattab: among God's signs is the creation of the heavens and the earth, and all living beings He dispersed throughout both; and He is capable of bringing them all together whenever He wills.

      Two readings. The first takes "throughout both" literally: according to Muhammad Asad's note, as reported, the phrase "the heavens and the earth" denotes the universe, so life may be scattered in some form among the heavenly bodies. Abdullah Yusuf Ali also cited the verse for life on other worlds. The second reading takes the living beings to be earthly creatures: the classical commentary of the Jalalayn, as reported, reads them as creatures that move on the earth, and the modern scholar Herbert Eisenstein, as reported, reads the word as animals in general. Besides the verse, reference accounts mention that Imam Muhammad al-Baqir (676 to 733) spoke of thousands upon thousands of worlds created by God, and Fakhr al-Din al-Razi (1149 to 1209) argued for a thousand thousand worlds beyond this one.

  - type: text
    id: judaism
    title: "Judaism: sources that differ"
    body: |
      According to Rabbi Benjamin Blech and other Jewish writers, a line in the Talmud (Avodah Zarah 3b) says that God travels through 18,000 worlds. Some read it as other physical worlds, others as spiritual worlds, and the sources say plainly that the question is open.

      Hasdai Crescas (about 1340 to 1410) wrote in *Or Hashem* that nothing in Jewish teaching rules out other worlds, according to these accounts, and he used the Talmudic line as support. Pinchas Eliyahu Horowitz, in *Sefer HaBrit*, argued from Isaiah 45:18 that worlds were made to be inhabited, and held that their inhabitants would not resemble earthly life, as sea creatures do not resemble land ones. A modern voice reported by Blech, the Lubavitcher Rebbe, replied to a scientist that to assert there is no life beyond Earth is to limit the Creator. Blech's own caution is that we simply do not know what such beings would be, whether they would be created in God's image, or whether they would have free will.

  - type: text
    id: eastern
    title: "Hindu and Buddhist traditions: many worlds from the start"
    body: |
      According to Hindu scripture, as the encyclopedia summaries cite them, the Bhagavata Purana speaks of innumerable universes, each wrapped in its own layers, drifting like specks of dust, the Yoga Vasishtha of countless worlds floating in space like waves in an ocean, and the Brahma Vaivarta Purana of universes each with its own Brahma, Vishnu and Shiva. Each universe also has fourteen lokas, realms of beings above and below. For these texts the issue is not whether there are other worlds, but how to read them: as places among the stars, or as layers of one cosmos.

      Buddhist teaching likewise describes many world systems and thirty-one planes of existence, from hells and animals through humans and gods to formless states. According to the monk K. Sri Dhammananda, in *What Buddhists Believe*, the Buddha taught that other forms of life exist in other parts of the universe, and modern science has yet to confirm these world systems. According to Jay McDaniel, a Whiteheadian process theologian, Buddhists have described multiple world systems, some of which are visible galaxies and others immaterial realms in other dimensions, which is his reading rather than a quotation from a scripture. So for both traditions, beings beyond Earth are no surprise, but whether they match what a telescope might find is a question for interpreters.

  - type: text
    id: mormon-raelian
    title: "Mormons and Raelians"
    body: |
      According to Latter-day Saint scripture, in the Book of Moses, chapter 1, verse 33, God says that He created worlds without number, and in Doctrine and Covenants 76:24 the inhabitants of those worlds are described as sons and daughters of God through Jesus. Church leaders such as Spencer W. Kimball and Neal A. Maxwell wrote that there are other inhabited worlds. The reference accounts add that specifics, such as Brigham Young's speculation that the Sun and Moon are inhabited, are not doctrine.

      The Raelian movement reverses the question. According to its founder Claude Vorilhon, known as Raël, extraterrestrials called Elohim contacted him on 13 December 1973 and told him that they created life on Earth, including humans, about 25,000 years ago by genetic engineering. Adherents hold that the religions' prophets, among them Jesus, the Buddha and Muhammad, were sent by the Elohim. Scholars' views differ in tone: sociologist Susan Palmer notes the movement is widely mocked, and, according to a reference account, non-members often read Raël's claims as a deliberate invention. As with any claim in this lesson, what counts is what would test it: documents and independent evidence, which this lesson does not claim to have.

  - type: text
    id: table
    title: "The traditions in one table"
    body: |
      This table keeps to what each tradition's texts and thinkers say, and each cell says "according to" in the sense above.

      | Tradition | The question it raises | A reply given |
      |---|---|---|
      | Christianity | Was the incarnation once, or on each world? Do other minds need redeeming? | Unfallen worlds (Lewis, Funes); one incarnation for all (Peters); many incarnations (Nesteruk) |
      | Islam | Does Qur'an 42:29 speak of life in the heavens? | Yes (Asad, Yusuf Ali); no, earthly creatures (Jalalayn, Eisenstein) |
      | Judaism | Do the 18,000 worlds mean other physical worlds? | Possibly (Crescas, Horowitz); the sources say we do not know (Blech) |
      | Hindu and Buddhist | Are the many universes and realms places among the stars? | Some say partly (McDaniel, as a reading); others read them as realms of rebirth or layers of one cosmos |
      | Latter-day Saints | Which worlds are inhabited, and how? | Worlds without number and sons and daughters of God (scripture); specifics are not doctrine |
      | Raelians | What if aliens made us? | The Elohim created life on Earth (according to Raël); tests would need independent evidence |

  - type: mcq
    id: tradition-q
    title: "Which tradition, which text?"
    prompt: |
      Which pairing of tradition and source is correct, according to the accounts in this lesson?
    options:
      - text: "Latter-day Saints: the Book of Moses says God created worlds without number."
        correct: true
        feedback: |
          Yes, Moses 1:33. Note what it does not say: it does not say how those worlds are inhabited or whether their inhabitants share our history.
      - text: "Islam: the Qur'an (42:29) says that other planets have intelligent people."
        feedback: |
          Too strong. The verse says living beings were dispersed through the heavens and the earth; whether that means life on other worlds is exactly what the commentators dispute.
      - text: "Judaism: the Talmud says God made 18,000 inhabited planets."
        feedback: |
          Too strong. The Talmudic line (Avodah Zarah 3b) speaks of God travelling through 18,000 worlds, and readers disagree on whether they are physical.
      - text: "Christianity: Aquinas wrote that aliens exist."
        feedback: |
          He did not. He argued for one world and said that a divine person could assume another human nature.
    explanation: |
      The pattern in these wrong answers: a text that is open to an interpretation is read as a statement of fact. Each tradition's own scholars keep the two apart.

  - type: text
    id: creation
    title: "Creation and human significance"
    body: |
      Suppose other minds exist. Does that make humans less special? There are two ways to see it.

      **The Copernican worry.** Since Copernicus, the earth moved from the centre to one planet among others. If minds are common too, then humans seem less central still. According to critics of religion, a faith that tells a story centred on one species on one planet would then look provincial.

      **The reply from particularity.** According to John Polkinghorne, as reported in the theological literature on the question, science works through general laws, while theology concerns events with a unique character, such as the life, death and resurrection of Jesus. The name for this tension is the scandal of particularity: a single event is claimed to matter for all. Peters, as reported, replies that Christianity would not be shattered by contact with extraterrestrial beings. Funes, as reported, replied in a different register, that denying other minds would limit God's creative freedom. So one side holds that significance depends on being alone, the other that it does not: a gift to one person does not mean that no one else is loved.

      Both are positions about value. A fact about the number of minds does not decide between them, which is why the next lesson, The Copernican Principle and Our Place, looks at the scientific side: what the principle of mediocrity says and what it does not.

  - type: mcq
    id: copernican-q
    title: "Where the disagreement sits"
    prompt: |
      A critic says: "If minds are common, Earth's story cannot be special, so the Christian claim fails." A defender says: "Particular events can matter without being unique in number." What does their disagreement turn on?
    options:
      - text: "Whether significance depends on being the only instance, which is a question of value and doctrine, not of astronomy."
        correct: true
        feedback: |
          Yes. They can agree on all the facts about other minds and still disagree about whether a particular event, such as the incarnation, loses meaning if others exist.
      - text: "Whether extraterrestrial life has been detected."
        feedback: |
          Both speak of the case in which it exists. The disagreement stays when the facts are granted.
      - text: "Whether Copernicus was right about the sun."
        feedback: |
          Both accept it. The issue is what follows from it for human significance.
      - text: "Whether the universe is large."
        feedback: |
          Size is common ground. What differs is what, if anything, it implies about significance.
    explanation: |
      Separating a question of fact from a question of value is the main skill of the lesson.

  - type: text
    id: argument
    title: "An argument to test"
    body: |
      Here is a compact version of an argument you may meet.

      **P1.** If intelligent aliens exist, they are in need of salvation.
      **P2.** Christian salvation is available only through a single incarnation that took place on Earth and cannot reach other minds.
      **P3.** Intelligent aliens exist.
      **C.** So, Christianity is false.

      Read it as a guided proof, with the validity step separate from the truth of the premises: if P1 to P3 were all true, would C follow? The next card asks which premise each side would reject.

  - type: mcq
    id: premise
    title: "Which premise would a critic of the argument reject?"
    multiple: true
    prompt: |
      An argument runs: P1 "If intelligent aliens exist, they need salvation"; P2 "salvation comes only through a single incarnation on Earth that cannot reach other minds"; P3 "aliens exist"; so Christianity is false. Which responses reject a premise that a thoughtful Christian might actually challenge? Select all that apply.
    options:
      - text: "Reject P1: other worlds may be unfallen, as in Lewis's story, so they need no redemption."
        correct: true
        feedback: |
          Yes. This is the unfallen-world reply: if sin did not enter there, P1 fails.
      - text: "Reject P2: one incarnation might suffice for all, as in Peters's proposal, or there may be incarnations on other worlds, as in the proposal discussed by Nesteruk."
        correct: true
        feedback: |
          Yes. P2 says the one event cannot reach others, which the one-for-all reply denies; and the many-incarnations reply denies that it is only one.
      - text: "Reject P3 as a settled fact: no aliens have been found."
        feedback: |
          True, but it does not meet the argument: the argument is conditional on aliens existing. This lesson, like the argument, supposes they do.
      - text: "Reject that the conclusion would follow even if all three premises were true."
        feedback: |
          Not a good response here. If P1, P2 and P3 were all true, a conflict with the doctrine described in P2 would follow, so the step is valid. The real work is in the truth of P1 and P2, and the conclusion, strictly, is about that version of the doctrine.
    explanation: |
      The argument is valid only as far as P1 and P2 are true. Each side attacks one: unfallen worlds or a wider reach of the incarnation. Neither is proved; they are live positions.

  - type: order
    id: argument-order
    title: "Order the reply"
    prompt: |
      Put in order a reply to the argument above, in the unfallen-world style.
    steps:
      - "Grant the conditional: if there are other minds and they are in need of salvation, the single event on Earth must reach them."
      - "Observe that the argument needs P1, that other minds need salvation."
      - "Note that Christian doctrine ties the need for salvation to a fall that began on Earth."
      - "Suggest that other worlds may be unfallen, as Lewis imagined, so P1 may be false."
      - "Conclude that the argument does not show Christianity false, only that it needs P1."
    hint: "Start by granting what the argument says, then find the premise to challenge."
    explanation: |
      A good reply grants what it can, finds the exact premise at issue, and says what would follow. It is not a proof that other minds are unfallen; it is a way to show P1 is not forced.

  - type: mcq
    id: who
    title: "Who argued what?"
    prompt: |
      Which pairing of person and position is accurate, according to this lesson?
    options:
      - text: "Funes: alien life would not contradict the faith, and such beings might not need redemption."
        correct: true
        feedback: |
          Yes, as reported from his 2008 interview, and as a personal view, not an official Vatican statement.
      - text: "Bruno: he was burned for arguing that other worlds are inhabited, which all historians agree on."
        feedback: |
          Historians disagree. Some think his trial turned more on theological charges than on the plurality of worlds.
      - text: "Crescas: he held that other worlds must be inhabited by Jews."
        feedback: |
          No. According to the accounts, he found nothing in Jewish sources against life on other worlds; the idea that they would be Jewish is not his.
      - text: "Peters: Christianity needs one incarnation per inhabited planet."
        feedback: |
          Reversed. Peters, as reported, holds that a single incarnation suffices.
    explanation: |
      The usual slip in this topic is to blur what a thinker allowed with what he claimed. Always check the verb.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      The course keeps three layers apart. Which statement belongs to the layer of **established fact**?
    options:
      - text: "In 1440 Nicholas of Cusa wrote that the inhabitants of other stars cannot be compared with ours, and in 2008 Funes said alien life would not contradict the faith."
        correct: true
        feedback: |
          Yes. What these thinkers wrote or said is documented.
      - text: "One incarnation is enough for the redemption of all minds."
        feedback: |
          A position in live debate among theologians; Peters holds it, others reject it.
      - text: "The discovery of other minds would be irrelevant to a believer."
        feedback: |
          A commitment: some believers would say it matters a great deal, others not at all.
      - text: "Qur'an 42:29 speaks of life on other planets."
        feedback: |
          A disputed reading, belonging to debate, not a settled fact.
    explanation: |
      What was written is fact; how to reconcile it is debate; whether it matters for faith is a commitment.

  - type: text
    id: summary
    body: |
      **Next:** If minds elsewhere would not by themselves refute any tradition, what does astronomy actually say about our place? The next lesson, The Copernican Principle and Our Place, asks what the principle of mediocrity claims, why people disagree about it, and what an observer can and cannot infer from being here.
