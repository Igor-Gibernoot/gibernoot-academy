id: ch21-traps
title: Traps
kind: traps

cards:
  - type: text
    id: welcome
    title: "Trap round: aliens and the cosmic perspective"
    body: |
      Fast round. Each question hides a **tempting shortcut** about this level: the Drake equation and what to do with its guessed inputs, the Fermi question and its Great Filter, the search for biosignatures, unidentified aerial phenomena (UAP), what other minds might mean for theology, and the Copernican principle with its Gott rule. Every shortcut is a *useful idea turned too far*.

      Nothing here asks you to believe or reject anything. Answers are given *according to* someone (an author, an official report, a tradition), and the feedback keeps the three layers apart: **established fact** (data, dates, documents), **scholarly debate** (say which), and **faith or metaphysical commitment**. A *sigma* is a measure of how surprising a result would be if only chance acted; 3 sigma is a weak hint, 5 sigma is the usual bar for a discovery.

  - type: numeric
    id: trap-l-small
    title: "A short-lived civilisation"
    prompt: |
      The Drake equation counts the signalling civilisations alive now as $N = R_*\, f_p\, n_e\, f_l\, f_i\, f_c\, L$, where $L$ is the number of years a civilisation keeps signalling. In a toy case the product of the six factors before $L$ equals $0.002$ per year, so with $L = 10^4$ years we get $N = 20$. A friend says: "Cutting $L$ to a hundred years only trims $N$ a little, since there are so many other factors." What is $N$ for $L = 100$ years?
    answer: 0.2
    tolerance: 0.001
    answerText: '0.2'
    wrong:
      - value: 2000
        feedback: |
          That is the value for $L = 10^6$, a hundred times longer, not shorter. Here $L$ falls by a factor of $100$.
      - value: 19.8
        feedback: |
          That subtracts $100$ from $10^4$ years inside the product but keeps $N$ almost unchanged. $N$ is proportional to $L$: it falls by the same factor as $L$.
    hint: |
      $N$ is the six-factor product times $L$, so $N$ is proportional to $L$.
    explanation: |
      $$N = 0.002 \times 100 = 0.2$$
      Dividing $L$ by $100$ divides $N$ by $100$, so the expected number of civilisations alive now falls below one. This is why, according to the Drake lesson, $L$ is the factor that can swing the answer most, and why a guess about how long civilisations last is a guess about the future.

  - type: mcq
    id: trap-median
    title: "The middle number"
    prompt: |
      A script draws each Drake factor at random from a wide plausible range (each spread evenly over powers of ten) 20000 times. The middle result (the median) of $N$ is about $1.7$, yet about 46% of the draws give $N < 1$. A reader says: "So the best estimate is that about two civilisations are out there." What is the best reply?
    options:
      - text: "The output is a spread over many orders of magnitude, not one number. Nearly half the draws give fewer than one civilisation, and the middle value hides a range from about $10^{-3}$ to $10^{4}$ for the central 90%."
        correct: true
        feedback: |
          Yes. A single central value says where the pile of outcomes sits, not how wide the pile is. The honest statement is the distribution, and with it a substantial chance of an empty galaxy besides.
      - text: "The reader is right: the median is the most reliable estimate, so we should expect two."
        feedback: |
          The median is a fair summary of where the middle lies, but the plausible values here range over many powers of ten. Expecting "about two" would claim a precision the inputs do not support.
      - text: "The script is wrong: $N$ can never be less than one, since we exist."
        feedback: |
          $N$ counts civilisations *other than us* signalling now in the galaxy (or the number in a stated region), so a value under one is a legitimate outcome. Our own existence says nothing about how many others share the galaxy now.
      - text: "The range makes the equation meaningless."
        feedback: |
          A wide range is a result: it shows which factor (here the lifetime $L$) carries the most uncertainty and where new data would help most. Meaningless would be hiding the range.
    explanation: |
      Layers: the arithmetic of the draws is established; the input ranges are course choices drawn from the lesson's guesses (live debate for most factors). Read the result as a distribution, not a number.

  - type: mcq
    id: trap-dissolve
    title: "Did they prove we are alone?"
    prompt: |
      A headline reads: "Oxford study proves we are alone in the galaxy." The study is Sandberg, Drexler and Ord (2018), "Dissolving the Fermi Paradox". According to the authors, what did it argue?
    options:
      - text: "That Drake-style point estimates treat uncertain factors as known; propagating the uncertainty as distributions gives a substantial probability that no other civilisation exists in the galaxy, so the silence is less puzzling. It is a statement about our uncertainty, not a proof."
        correct: true
        feedback: |
          Yes. The paper dissolves the paradox by showing that silence is a likely outcome given what we do not know. Critics add that it rests on the chosen distributions, which are themselves uncertain.
      - text: "That the Drake equation is mathematically false."
        feedback: |
          The equation is a correct decomposition. The paper's complaint is about plugging single guessed values into it, not about the algebra.
      - text: "That a Great Filter lies ahead of us, so our future is bleak."
        feedback: |
          The authors argue the opposite: they say pessimism about our survival drawn from the Fermi paradox is unfounded, since the silence can be explained by early rare steps or plain uncertainty.
      - text: "That aliens certainly exist but cannot be detected."
        feedback: |
          That would be one of the old answers to the paradox, not this paper's. The authors say there may well be no one else, with real probability.
    explanation: |
      Layers: the paper is a published argument (established that it says this); whether its input distributions are fair is live debate; whether we are alone is open.

  - type: mcq
    id: trap-hart
    title: "They are not here, so they do not exist"
    prompt: |
      Michael Hart (1975) argued that, since no extraterrestrials are visibly on Earth, probably none exist in the galaxy. A reader says: "This is the Fermi paradox's answer, settled." According to the Fermi lesson and Hart's critics (Sagan and Newman replied in 1981), what is the best response?
    options:
      - text: "Hart's argument has a hidden premise, that civilisations would spread across the galaxy and be visible; deny it (they stay home, are short-lived, hide, or never arise) and the conclusion no longer follows. It is one reading among several, not the settled answer."
        correct: true
        feedback: |
          Yes. It is an argument with premises to be questioned: that a civilisation exists, that it spreads, and that the spread would be visible. Each family of replies denies one of them.
      - text: "Hart proved aliens cannot travel between stars."
        feedback: |
          Hart rejected the physical explanation (travel is infeasible), arguing that travel would be possible; his conclusion is that no one is out there, not that travel is impossible.
      - text: "Fermi himself published this argument in 1950."
        feedback: |
          Fermi's contribution is a remembered lunch question, not a paper. Hart's article appeared in 1975, after Fermi's death in 1954.
      - text: "Hart's argument is irrelevant since the galaxy is too young."
        feedback: |
          The argument leans on the opposite: the galaxy is old (the oldest stars about 13 billion years), so a spreading civilisation would have had time. Whether that premise holds is what the debate is about.
    explanation: |
      Treating a tension as a proof is the trap. The silence is a puzzle among premises, and a thoughtful person may drop a different one.

  - type: numeric
    id: trap-crossing
    title: "Too big to cross?"
    prompt: |
      A skeptic says: "The galaxy is far too big for anyone to cross, so nobody could have spread through it." Take a galaxy about $10^5$ light-years across and a probe travelling at $0.1$ of the speed of light (so it covers $0.1$ light-year per year). How many million years does one crossing take? The oldest stars are about $13$ billion years old.
    answer: 1
    tolerance: 0.01
    answerText: '1 million years'
    wrong:
      - value: 1000000
        feedback: |
          That is the number of years, $10^6$; the question asks for millions of years, so it is $1$.
      - value: 10
        feedback: |
          That divides by $0.01$. A speed of $0.1$ light-year per year means each year gains $0.1$ light-year, so $10^5 / 0.1 = 10^6$ years.
    hint: |
      Time equals distance over speed: $10^5$ light-years divided by $0.1$ light-year per year.
    explanation: |
      $$\frac{10^5\ \text{ly}}{0.1\ \text{ly/yr}} = 10^6\ \text{yr}$$
      One crossing takes about a million years, a thousandth of the galaxy's roughly $10^{10}$-year age, so a $1$-billion-year head start allows a thousand crossings. Size alone does not block the spread; a better reply to Hart would deny the will or the ability, not the distance.

  - type: mcq
    id: trap-mars
    title: "Life on Mars: good news?"
    prompt: |
      Suppose rocks on Mars showed a second, independent origin of life. A friend says: "Wonderful, and nothing to worry about." According to Robin Hanson's Great Filter reasoning (1998), which reply is closest?
    options:
      - text: "If life starts easily, the very unlikely step that explains the silence is less likely to be the origin of life, so it is more likely to lie later (including ahead of us). On this reasoning a second origin would be sobering news, though not proof of doom."
        correct: true
        feedback: |
          Yes. The reasoning shifts probability between candidate filters. It depends on the origin being independent: life that came from Earth (or that Earth's life came from) would show nothing about how easily life starts.
      - text: "A second origin proves the filter is behind us."
        feedback: |
          The opposite direction. A second origin shows that the first step is not the hard one, so the filter is more likely later.
      - text: "Any life found on Mars changes the odds of a filter equally."
        feedback: |
          Only a separate origin counts. Martian rocks and Earth have exchanged material, so shared ancestry is possible, and then the find says little about how easy it is to start life.
      - text: "Hanson showed that finding life anywhere means civilisations are common."
        feedback: |
          Finding simple life says nothing directly about civilisations, and the reasoning itself is a live debate with critics who question its use of anthropic logic.
    explanation: |
      Layers: the Great Filter idea is a published argument; whether the inference "easy life, therefore worse for us" holds is debated; any claim about the future is a probability, not a fact.

  - type: mcq
    id: trap-k218
    title: "Life found on K2-18 b?"
    prompt: |
      A headline says: "Alien life found on the planet K2-18 b." The planet is a world about 120 light-years away, and the Webb telescope team reported hints of dimethyl sulfide (DMS), a gas made on Earth mostly by living things. What is the most accurate statement as of late 2026?
    options:
      - text: "A hint at about 3 sigma was reported, not a confirmed detection; other teams' reanalyses found weaker or no significant signal, and non-living ways to make the gas have been proposed. The discovering team itself did not claim to have found life."
        correct: true
        feedback: |
          Yes. A 3 sigma result is a suggestion that needs more observing time (about 5 sigma is the usual bar), and a gas made by life on Earth is only a *possible* biosignature elsewhere.
      - text: "Life was confirmed: DMS can only come from living things."
        feedback: |
          Neither claim holds. Detection is not confirmed, and the claim that only life makes DMS is the thing in question: abiotic routes have been proposed.
      - text: "The planet was shown to be lifeless."
        feedback: |
          The signal is disputed, not excluded, and absence of a detection is not a proof of absence. The status is open.
      - text: "DMS is a certain sign of an alien civilisation."
        feedback: |
          Even if made by life, DMS would point to microbes, not to technology or intelligence.
    explanation: |
      Layers: the data and their statistical strength are established; how to read them is live debate; "life there" is not a finding. Detection, interpretation and conclusion are three separate steps.

  - type: numeric
    id: trap-odds
    title: "Two hints at once"
    prompt: |
      In a toy case, the prior odds of life on a planet are $1$ to $100$. Two independent clues each favour life over no life by a likelihood ratio of $5$ (each clue is $5$ times as likely if life is there as if not). Odds multiply by the likelihood ratio for each clue. What is the posterior probability of life, in percent? Round to a whole percent.
    answer: 20
    tolerance: 0.5
    answerText: '20%'
    wrong:
      - value: 25
        feedback: |
          $1/4$ is the posterior *odds* ($1$ to $4$), not the probability. Probability is odds over (odds plus one): $0.25/1.25$.
      - value: 5
        feedback: |
          That multiplies the prior odds $1/100$ by one clue only ($1/20$, about $5\%$). Two clues multiply twice.
    hint: |
      Posterior odds are $\tfrac{1}{100}\times 5 \times 5$; then convert odds to probability.
    explanation: |
      $$\text{odds} = \frac{1}{100}\times 5\times 5 = \frac14$$
      $$P = \frac{1/4}{1 + 1/4} = 0.2$$
      Two modest clues raise a 1% prior to 20%, still four times as likely against as for. The same arithmetic warns against two traps: counting dependent clues as independent, and forgetting the prior.

  - type: numeric
    id: trap-bluebook
    title: "How many were unexplained?"
    prompt: |
      Project Blue Book, the US Air Force study of UFO reports (1952-1969), received 12618 reports, of which 701 remained "unidentified". A writer says: "A large share stayed unexplained, so something extraordinary is flying." What percentage of the reports stayed unidentified? Round to one decimal.
    answer: 5.6
    tolerance: 0.05
    answerText: '5.6%'
    wrong:
      - value: 0.056
        feedback: |
          That is the fraction, $701/12618 \approx 0.056$; the question asks for a percentage, so multiply by $100$.
      - value: 94.4
        feedback: |
          That is the share that *was* explained or identified. The question asks for the unexplained share.
    hint: |
      Divide 701 by 12618 and multiply by 100.
    explanation: |
      $$\frac{701}{12618} \approx 0.056 = 5.6\%$$
      About one report in eighteen stayed unidentified. *Unidentified* means too little information or no match found, and it is a statement about the data. It is not a finding about what the object was; many such cases had poor data.

  - type: numeric
    id: trap-lr-bound
    title: "A generous bound on the evidence"
    prompt: |
      Suppose an unidentified report is at most $1/0.056 \approx 18$ times as likely to be left unexplained if aliens are visiting as if they are not (a generous upper bound, since $5.6\%$ of reports go unexplained even under ordinary causes). Take prior odds of a visit of $10^{-6}$. Posterior odds $=$ prior odds $\times$ likelihood ratio. Give the posterior odds in units of $10^{-5}$ (so $1.8\times10^{-5}$ is $1.8$).
    answer: 1.8
    tolerance: 0.05
    answerText: '1.8'
    wrong:
      - value: 18
        feedback: |
          That is the likelihood ratio on its own. Odds multiply: $10^{-6}\times 18 = 1.8\times 10^{-5}$.
      - value: 0.18
        feedback: |
          That slips a power of ten. $10^{-6}\times18 = 18\times10^{-6} = 1.8\times10^{-5}$, so $1.8$ in these units.
    hint: |
      Multiply $10^{-6}$ by $18$ and write it as a multiple of $10^{-5}$.
    explanation: |
      $$10^{-6}\times 18 = 1.8\times 10^{-5}$$
      Even with a generous likelihood ratio, a tiny prior stays tiny. The way out is better evidence (more sensors, calibrated data), not more cases of poor data, and a person with a higher prior would arrive at a different, still modest, posterior. The prior is a judgment, and the lesson shows how the answer moves with it.

  - type: mcq
    id: trap-odni
    title: "The government admits it?"
    prompt: |
      In June 2021 the US Director of National Intelligence published a Preliminary Assessment of 144 UAP reports, of which one was explained with high confidence (a large deflating balloon). A commentator says: "The government admits the rest are not of this world." What is the best reply?
    options:
      - text: "The report says the rest remain unexplained, largely because the data are limited. It reports no evidence of a foreign programme or breakthrough technology either, and a senior official said there was no clear indication of a non-terrestrial explanation. Unexplained is not extraterrestrial."
        correct: true
        feedback: |
          Yes. The honest reading separates *unexplained for lack of data* from *explained by an extraordinary cause*. The report names five likely categories of explanation (clutter, natural phenomena, government or industry programmes, foreign systems, other) and says it cannot yet assign most reports.
      - text: "The report concluded that all 143 other reports were aircraft of a foreign adversary."
        feedback: |
          The report had no data supporting a foreign programme; the cases stay unexplained.
      - text: "The report proved that all the objects were hoaxes."
        feedback: |
          No such proof is in it. Some reports in this category may have ordinary causes, but the report did not resolve them.
      - text: "The report is meaningless because 144 is too few."
        feedback: |
          The sample is small, which limits conclusions, but the report's main message is that the data are the limit, not that nothing can be learned.
    explanation: |
      Layers: the counts and the wording of the assessment are documented; what explains the unresolved cases is debate and open; "extraterrestrial" would be an extraordinary claim needing extraordinary standards of evidence.

  - type: mcq
    id: trap-funes
    title: "What the Vatican says"
    prompt: |
      A blog writes: "In 2008 the Vatican's astronomer announced that the Church teaches that aliens do not need Christ." According to the reports of his interview in *L'Osservatore Romano* (May 2008), what is the best correction?
    options:
      - text: "Father José Gabriel Funes, then director of the Vatican Observatory, said that believing in extraterrestrial life does not contradict faith, that one cannot limit God's creative freedom, and that such beings might not have fallen into sin or need redemption. His comments were personal views, not an official teaching."
        correct: true
        feedback: |
          Yes. A thoughtful speaker's possibility ("might") became a doctrinal announcement in the headline. Other Catholic theologians, such as Peters, argue that one incarnation could suffice, while others argue for many.
      - text: "Funes said that aliens certainly exist and have been baptised."
        feedback: |
          Neither claim is in his interview. The baptism question is tied to a colleague's later book, where the answer was "only if they asked".
      - text: "The Church condemns belief in extraterrestrial life."
        feedback: |
          There is no such official condemnation. Funes's point was that belief in aliens is not opposed to faith, and the Church has no official doctrine on the question.
      - text: "Funes spoke for the Pope in an official statement."
        feedback: |
          The sources describe his comments as his personal views and not an official Vatican statement.
    explanation: |
      Layers: the interview and its date are documented; how far a view is representative is a question about the tradition; whether incarnation or redemption extends to other worlds is a theological position, not a finding.

  - type: mcq
    id: trap-argument
    title: "Aliens versus Christianity?"
    prompt: |
      An argument reads: P1 other-world minds would need salvation; P2 salvation comes only through a single incarnation on Earth; P3 other minds exist; so C: Christianity would be false. A reader says: "The argument shows that discovering aliens would end Christianity." According to the lesson on aliens and theology, which reply is best?
    options:
      - text: "The argument is valid but each premise can be rejected: P1 by the idea of unfallen worlds (Lewis's fiction, Funes), P2 by the view that one incarnation can serve all (Peters) or that there may be many (Nesteruk). Whether the conclusion follows depends on which premise a believer holds."
        correct: true
        feedback: |
          Yes. Validity is one thing, truth of the premises another, and the traditions that discuss the question hold different premises. P3 itself is an open empirical question.
      - text: "The argument is invalid because premises about God cannot be used in an argument."
        feedback: |
          Premises about God can be used; the question is whether a critic accepts them. The form is valid: if all three premises are true, the conclusion follows.
      - text: "All religions agree that discovering aliens would end them."
        feedback: |
          The traditions surveyed (Judaism, Islam, Hindu and Buddhist cosmologies and others) include texts that speak of many worlds or beings, and their authors answer in different ways.
      - text: "The argument is sound, since P3 will be shown to be true soon."
        feedback: |
          P3 is not established; the search so far has found no confirmed life. Soundness needs all premises true.
    explanation: |
      Guided-proof habit: check validity separately from truth, then ask which premise each tradition would reject, and why.

  - type: mcq
    id: trap-ordinary
    title: "Not special, so not selected?"
    prompt: |
      A reader says: "The Copernican principle says our place is not special, so the fact that Earth suits life must be luck we should not have needed, and the principle is proven by astronomy." Which statement is best?
    options:
      - text: "The Copernican principle is a working assumption, supported by each retreat from the centre (Copernicus 1543, Shapley 1918, Hubble 1923), not a proof. And observation selection (Carter 1973) reminds us that observers can only find themselves where observers can exist, so some 'specialness' in conditions is expected without breaking the principle about place."
        correct: true
        feedback: |
          Yes. The principle is about position (we should not assume a privileged place), while the conditions needed for observers are a separate matter; the two are easily mixed.
      - text: "The principle has been proven false by the existence of life."
        feedback: |
          Life's existence on Earth does not conflict with the principle; it tells us the conditions were met here, which observation selection predicts for any observer.
      - text: "Copernicus proved the principle with his model in 1543."
        feedback: |
          Copernicus moved the Sun to the centre, which was a retreat from Earth-centred ideas; modern versions of the principle are broader and are still assumptions to test.
      - text: "Selection effects mean we can learn nothing about the universe."
        feedback: |
          They mean we must correct for them. Careful reasoning about which sample we are in is a method, not a reason to stop.
    explanation: |
      Layers: the dates are established; the principle is a methodological assumption; what it implies for other life is debated.

  - type: numeric
    id: trap-gott
    title: "How long will the show run?"
    prompt: |
      Gott's rule: if you arrive at a random moment in the life of something that has lasted a time $t_\text{past}$, then with 50% confidence its future lasts between $t_\text{past}/3$ and $3\,t_\text{past}$. You step into a theatre show that has been running for $12$ years. What is the upper end of the 50% interval for how many more years it will run?
    answer: 36
    tolerance: 0.1
    answerText: '36 years'
    wrong:
      - value: 4
        feedback: |
          That is the lower end ($12/3$). The question asks for the upper end.
      - value: 48
        feedback: |
          That adds the 12 past years to 36, giving the total lifetime, $12 + 36 = 48$. The question asks for the future time only, $3\times12 = 36$.
    hint: |
      The upper end is three times the past.
    explanation: |
      $$t_\text{future} \in \left[\tfrac{12}{3},\ 3\times12\right] = [4,\ 36]\ \text{years}$$
      Half the time, you land in the middle half of the show's life, so the future lies between a third and three times the past. The rule gives an interval at a stated confidence, never a single date, and it applies only where there is no known time scale that makes your moment special (a show with a fixed season, for instance).

  - type: mcq
    id: trap-wall
    title: "The wall fell on time?"
    prompt: |
      In 1969 J. Richard Gott visited the Berlin Wall, then eight years old, and reasoned that his visit was a random moment in its life. His 50% interval for its remaining life ran from about 2.7 to 24 years. The border opened on 9 November 1989, twenty years later. A reader says: "That one success proves the rule works; a single miss would have refuted it." What is the best reply?
    options:
      - text: "Twenty years falls inside the interval, but a single case cannot test a probability statement. A 50% interval should miss half the time, and a 95% interval about 1 time in 20. Testing the rule needs many cases, and critics (Caves) argue it fails where there is an identifiable time scale."
        correct: true
        feedback: |
          Yes. Coverage is a property of a rule over many uses, shown by the Monte Carlo run in the lesson. One hit or one miss tells little, and the rule's reach is limited.
      - text: "The rule predicted exactly 20 years, so it is precise."
        feedback: |
          It gave an interval from about 2.7 to 24 years, not a point; the result happened to fall inside it.
      - text: "The wall fell outside the interval, so the rule failed."
        feedback: |
          Twenty years is between 2.7 and 24, so it fell inside.
      - text: "Gott's visit was not random, so the rule is meaningless."
        feedback: |
          The assumption is that the visit is a random moment, which is the premise a critic should examine; it does not make the rule meaningless, only conditional on that premise.
    explanation: |
      Layers: the dates and Gott's numbers are documented; the rule's power in general is live debate; a probability rule is judged by its coverage over many cases.

  - type: text
    id: summary
    title: "What you now own"
    body: |
      **The shortcuts to drop**, with the lesson where each is taken apart:

      | Trap | Lesson |
      |---|---|
      | A big or small $N$ proves aliens or solitude; the median is the answer; $L$ hardly matters | The Drake Equation; Guided problem: Estimating Civilisations with Uncertainty |
      | Silence proves nobody is out there (Hart); the galaxy is too big to cross | The Fermi Paradox |
      | Life on Mars is plainly good news; a hint of a gas is life | The Fermi Paradox; The Search for Life |
      | Unexplained means extraterrestrial; the government admitted it | Unidentified Aerial Phenomena |
      | Aliens would end a religion; the Vatican announced a doctrine | Aliens and Theology |
      | The Copernican principle is proven; one case tests the Gott rule | The Copernican Principle and Our Place |

      **The habit.** Before accepting a claim about life beyond Earth, ask: according to whom, is the number an output of assumed inputs, is it unexplained or explained, how strong is the evidence in sigma, and which layer is it (fact, debate or commitment).

      **Next:** a quick-recall round on the level's main ideas, with mnemonics, distinctions and a small worked example.
