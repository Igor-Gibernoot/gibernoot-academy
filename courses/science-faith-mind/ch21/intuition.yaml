id: ch21-intuition
title: Quick Recall
kind: intuition
own: |
  The setting: the search for life and intelligence beyond Earth, and the question of what its silence, or its signals, would tell us. Every item below is a way to weigh evidence or an estimate, not a verdict on whether anyone is out there.
  - **The Drake equation.** $N$ is the number of civilisations in the Milky Way that send out signals we could detect now: stars born per year $R_*$, then the fractions with planets $f_p$, with habitable planets per star $n_e$, where life starts $f_l$, intelligence appears $f_i$, and detectable technology $f_c$, times the years $L$ a civilisation keeps signalling:
    {{ $$N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L$$ }}
    Births per year times lifetime, so $N\propto L$: cut $L$ by 10 and $N$ falls by 10.
  - **Point estimate versus distribution.** A single value for each factor hides how little we know. Giving each factor a range and drawing many samples shows the spread of $N$: a median below 1 and a wide interval are compatible with an empty galaxy, so silence is less surprising than the point estimate suggests.
  - **The Fermi question and the Great Filter.** If the galaxy is old and a civilisation could spread across it in about $10^6$ years (crossing $10^5$ light-years at $0.1c$), where is everybody? Some step from dead matter to lasting, visible life is very unlikely: the *Great Filter*. If it lies behind us, we are rare; if it lies ahead, our own future is the risky part, so finding an independent second origin of life would be bad news.
  - **Detection, interpretation, conclusion.** A search result passes three separate stages: a feature is *detected*, it is *interpreted* against ordinary causes, and only then does a conclusion with a stated confidence follow. A strong detection can have a weak interpretation.
  - **Unexplained is not extraterrestrial.** Of 12,618 reports in Project Blue Book, 701 stayed unidentified, a share of about 5.6%. That bounds how much a case can favour a visitor at most, since ordinary causes already leave that much unexplained. Odds update by multiplication:
    {{ $$\frac{P(H\mid E)}{P(\text{not-}H\mid E)}=\text{LR}\cdot\frac{P(H)}{P(\text{not-}H)}$$ }}
    where $H$ is a hypothesis and $\text{LR}$ (the likelihood ratio) is how much likelier the evidence $E$ is if $H$ is true than if it is false.
  - **The Copernican principle and Gott's rule.** If we meet something at a uniformly random moment of its life, its future $t_\text{future}$ compared with its past $t_\text{past}$ lies, with confidence $c$, in
    {{ $$\frac{1-c}{1+c}\,t_\text{past}\le t_\text{future}\le\frac{1+c}{1-c}\,t_\text{past}$$ }}
    that is from $\tfrac13$ to $3$ times the past at 50%, and from $\tfrac1{39}$ to $39$ at 95%. Position (are we typical?) is not conditions (what observers need) and not meaning (what it implies for purpose).
  - **Aliens and theology.** Traditions answer differently on whether other minds would need salvation: unfallen worlds, one incarnation for all, or many. What follows depends on premises of faith, and the course names which one a critic rejects.
  - **Three layers.** Established: data, dates, counts. Debated: how to weigh them, which estimates to trust. Faith: what the findings would mean for God and purpose.

cards:
  - type: text
    id: welcome
    title: "Quick recall: life beyond Earth"
    body: |
      This round **derives nothing**. It is for fast recall of the level's seven main ideas: the **Drake equation**, **point estimates versus distributions**, the **Fermi question and the Great Filter**, the **search for life** (detection, interpretation, conclusion), **unidentified aerial phenomena**, **aliens and theology**, and the **Copernican principle with Gott's rule**.

      Three kinds of card: **mnemonics and distinctions**, **build cards** for the three formulas, and **numeric cards that give you data only**: you choose the method yourself. Guessing is fine: a wrong guess is shown with its reason.

  - type: mcq
    id: drake-shape
    title: "The Drake equation in one sentence"
    prompt: |
      The Drake equation estimates $N$, the number of civilisations in the Milky Way sending detectable signals now. Which sentence describes its shape?
    options:
      - text: 'A rate times a lifetime: the births of detectable civilisations per year (stars born, cut down by a chain of fractions) multiplied by the years each one keeps signalling.'
        correct: true
      - text: 'A sum of the chances of each step, since every step must be possible.'
        feedback: |
          The steps are not alternatives. Each fraction keeps only part of what the previous one left, so the factors multiply, and any one of them near zero drives the whole product near zero.
      - text: 'A probability that at least one civilisation exists, so it can never exceed 1.'
        feedback: |
          $N$ is an expected number of civilisations, not a probability. It can be $0.002$ or $10^8$, depending on the guesses.
    shuffle: false
    hint: 'Think of a bath filling: an inflow per year and how long water stays in.'
    explanation: |
      Mnemonic: **births per year times lifetime**. With a steady rate of births, the number alive now is the rate times how long each one lasts.

  - type: mcq
    id: point-dist
    title: "Point estimate or distribution"
    prompt: |
      One researcher plugs a single best guess into each Drake factor and gets $N=20$. Another gives each factor a plausible range, draws many samples and finds a median $N$ below 1, with a wide interval that includes both 0.001 and 1000. What is the main lesson of the second method?
    options:
      - text: 'A single value for each factor hides how uncertain we are, and with honest ranges a galaxy with no other civilisation is not surprising.'
        correct: true
      - text: 'The second method proves that we are alone.'
        feedback: |
          It does not. A wide interval still contains large values. It shows that the evidence we have (silence) fits with a probable empty galaxy, not that the galaxy is empty.
      - text: 'The first method is wrong because $N=20$ is arithmetically impossible.'
        feedback: |
          The arithmetic is fine. The trouble is the false precision: one value for a factor spanning many orders of magnitude.
    shuffle: false
    hint: 'Ask what each method says about how much we know.'
    explanation: |
      Mnemonic: **a number hides the spread**. Silence from the sky is less of a paradox once the uncertainty is carried through the product.

  - type: mcq
    id: three-p
    title: "Position, conditions, meaning"
    prompt: |
      Three claims about Earth: (a) "Earth is a typical planet at a typical place and time"; (b) "Earth has the rare conditions needed for complex life"; (c) "So life has no purpose" or "So life has a purpose". Which pairing names what each claim is about?
    options:
      - text: '(a) position (mediocrity), (b) conditions (selection), (c) meaning (commitment).'
        correct: true
      - text: '(a) meaning, (b) position, (c) conditions.'
        feedback: |
          Typicality says where we stand, not what it means. Mixing these is how a measurement of position gets read as a verdict on purpose.
      - text: '(a) and (b) contradict each other, so one of them must be false.'
        feedback: |
          They do not. We can stand at an ordinary place and time while the conditions that let observers exist are rare. One concerns location, the other what observers need.
    shuffle: false
    hint: 'Where, what is needed, what it implies.'
    explanation: |
      Mnemonic: **where, what, so what**. The Rare Earth hypothesis is a claim about conditions, the Copernican principle about position, and purpose is a commitment of faith or philosophy.

  - type: mcq
    id: unexplained
    title: "Unexplained or extraterrestrial"
    prompt: |
      An investigation of thousands of aerial reports leaves a few percent unidentified: nobody could say what they were. Which conclusion follows?
    options:
      - text: 'Only that the data were not enough to explain them. Extraterrestrial visitors would need positive evidence for themselves, not just the absence of an ordinary explanation.'
        correct: true
      - text: 'They are extraterrestrial, since every ordinary cause was ruled out.'
        feedback: |
          Ordinary causes were not ruled out, only left unconfirmed, often because the report was thin. Not knowing is a fact about us, not about the object.
      - text: 'They are certainly hoaxes or errors, since nothing else is possible.'
        feedback: |
          That is the mirror mistake. A report may also stay unexplained because the data are poor, and that proves nothing in either direction.
    shuffle: false
    hint: 'A gap in an explanation is not a piece of evidence for one particular answer.'
    explanation: |
      Mnemonic: **unknown is not alien**. The honest label is "unidentified", with the cause left open.

  - type: order
    id: three-stages
    title: "Detection, interpretation, conclusion"
    prompt: |
      A telescope records a faint gas line in the spectrum of a distant planet that some think could be produced by life. Put the stages of weighing it in order.
    steps:
      - "Detection: is the line really there, at what statistical strength, and is it repeatable?"
      - "Interpretation: which gas is it, and can non-living chemistry make it?"
      - "Conclusion: how likely is life, given the prior odds and the evidence, with the confidence stated?"
    hint: 'First the signal, then what it could be, and last what we believe.'
    explanation: |
      Mnemonic: **is it there, what is it, what follows**. A claim can fail at any stage: a weak detection, an ambiguous interpretation, or an overreaching conclusion.

  - type: mcq
    id: filter
    title: "The Great Filter, behind or ahead"
    prompt: |
      The *Great Filter* is a step from dead matter to lasting, visible life that is very unlikely. Suppose we found a second, independent origin of life on Mars. What would this change in the argument?
    options:
      - text: 'It would suggest the filter is not the origin of life, so it lies later, perhaps ahead of us: worrying news for our own future.'
        correct: true
      - text: 'It would prove aliens are visiting Earth.'
        feedback: |
          Life on a neighbouring planet says nothing about visitors. It changes only our estimate of how hard the first steps are.
      - text: 'It would prove that we are the only intelligent species.'
        feedback: |
          It points the other way. Easy origins mean the rarity must be somewhere else, and it does not settle where.
    shuffle: false
    hint: 'If beginnings are easy, where is the hard step?'
    explanation: |
      Mnemonic: **easy start, hard later**. If the filter is behind us we are rare and lucky; if it is ahead, our own survival is at stake. Whether this inference holds is debated.

  - type: mcq
    id: scaling
    title: "Scaling check on the lifetime"
    prompt: |
      In the Drake equation all factors but the lifetime $L$ of a signalling civilisation are held fixed. How does $N$ change if $L$ doubles?
    options:
      - text: '$N$ doubles: it is proportional to $L$.'
        correct: true
      - text: '$N$ grows by a factor of 4.'
        feedback: |
          $L$ appears once, to the first power. A square would need $L$ to appear twice.
      - text: '$N$ halves, since longer-lived civilisations are rarer.'
        feedback: |
          Rarity of births is in the other factors. A longer lifetime at the same birth rate means more civilisations alive at once.
    shuffle: false
    hint: 'A rate times a lifetime.'
    explanation: |
      Scaling check: $N\propto L$. That is why $L$ dominates the spread of the estimate: its plausible range is the widest.

  - type: mcq
    id: gott-factors
    title: "Gott's factors"
    prompt: |
      A thing is met at a uniformly random moment of its whole life. Having existed for a time $t_\text{past}$, its future $t_\text{future}$ is estimated to lie in a range of multiples of $t_\text{past}$. Which are the factors at 50% confidence and at 95% confidence?
    options:
      - text: 'From $\tfrac13$ to $3$ times the past at 50%, and from $\tfrac1{39}$ to $39$ times the past at 95%.'
        correct: true
      - text: 'From $\tfrac12$ to $2$ times the past at 50%, and from $\tfrac1{20}$ to $20$ at 95%.'
        feedback: |
          Those come from halving the probability instead of using the odds. At 50% the two ends are the middle half of the fraction of life elapsed, $\tfrac14$ to $\tfrac34$, which give factors $\tfrac13$ and $3$.
      - text: 'From $0$ to $2$ times the past at 50%, and from $0$ to $39$ at 95%.'
        feedback: |
          The interval is two-sided: we could be at the very start, but it is also unlikely that we are in the first sliver of the life.
    shuffle: false
    hint: 'The elapsed fraction $f$ gives future over past $(1-f)/f$; at 50%, $f$ runs from $\tfrac14$ to $\tfrac34$.'
    explanation: |
      Mnemonic: **one third and three, one over thirty-nine and thirty-nine**. The interval holds for the share of meeting moments equal to the confidence, only if the moment really is random.

  - type: build
    id: drake-build
    title: "Build the Drake equation"
    prompt: |
      Let $N$ be the number of civilisations in the Milky Way sending detectable signals now. Build the Drake equation by multiplying, in order: stars born per year $R_*$, fraction of stars with planets $f_p$, habitable planets per such star $n_e$, fraction where life starts $f_l$, where intelligence appears $f_i$, where detectable technology appears $f_c$, and finally the years $L$ it keeps signalling.
    prefix: 'N='
    tiles: ['R_*', 'f_p', 'n_e', 'f_l', 'f_i', 'f_c', 'L', '\tfrac{1}{L}']
    answers:
      - ['R_*', 'f_p', 'n_e', 'f_l', 'f_i', 'f_c', 'L']
    wrong:
      - answer: ['R_*', 'f_p', 'n_e', 'f_l', 'f_i', 'f_c', '\tfrac{1}{L}']
        feedback: |
          Dividing by $L$ would make longer-lived civilisations rarer. The lifetime multiplies: more years means more civilisations alive at once.
    hint: 'All seven tiles, each used once, joined by multiplication.'
    explanation: |
      $$N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L$$
      A rate of births filtered by six fractions, times a lifetime.

  - type: build
    id: gott-build
    title: "Build the upper end of Gott's interval"
    prompt: |
      With confidence $c$ (a number between 0 and 1), Gott's rule bounds the future $t_\text{future}$ of something that has lasted $t_\text{past}$. Build the **upper** bound.
    prefix: 't_\text{future}\le'
    tiles: ['\frac{1+c}{1-c}', '\frac{1-c}{1+c}', 't_\text{past}', 'c']
    answers:
      - ['\frac{1+c}{1-c}', 't_\text{past}']
    wrong:
      - answer: ['\frac{1-c}{1+c}', 't_\text{past}']
        feedback: |
          That is the **lower** bound (for $c=0.95$, $t_\text{past}/39$). The upper bound is the reciprocal factor, $39\,t_\text{past}$.
      - answer: ['c', 't_\text{past}']
        feedback: |
          Confidence $c$ is a probability, not a multiplier of time. It enters only through $\frac{1+c}{1-c}$.
    hint: 'At $c=0.95$ the upper factor is 39.'
    explanation: |
      $$\frac{1-c}{1+c}\,t_\text{past}\le t_\text{future}\le\frac{1+c}{1-c}\,t_\text{past}$$
      At $c=0.5$ the factors are $\tfrac13$ and $3$; at $c=0.95$ they are $\tfrac1{39}$ and $39$.

  - type: build
    id: odds-build
    title: "Build Bayes' rule in odds form"
    prompt: |
      A hypothesis $H$ has prior odds (before the evidence $E$) of $P(H)/P(\text{not-}H)$. The likelihood ratio $\text{LR}$ says how much likelier $E$ is if $H$ is true than if it is false. Build the posterior odds.
    prefix: '\text{posterior odds}='
    tiles: ['\text{LR}', '\cdot', '\text{prior odds}', '+']
    answers:
      - ['\text{LR}', '\cdot', '\text{prior odds}']
      - ['\text{prior odds}', '\cdot', '\text{LR}']
    wrong:
      - answer: ['\text{LR}', '+', '\text{prior odds}']
        feedback: |
          Odds update by multiplication: evidence that is 4 times likelier under $H$ multiplies the odds by 4, whatever they were.
    hint: 'Each independent clue multiplies the odds.'
    explanation: |
      $$\frac{P(H\mid E)}{P(\text{not-}H\mid E)}=\text{LR}\cdot\frac{P(H)}{P(\text{not-}H)}$$
      Odds of $a{:}b$ correspond to the probability $a/(a+b)$.

  - type: numeric
    id: gott-num
    title: "An institution's future"
    prompt: |
      A museum has been open for 20 years, and you visit at a moment that is not special in its life. At 50% confidence, what is the **latest** number of years it will stay open from now (the upper end of the range)?
    answer: 60
    tolerance: 0.01
    answerText: '60 years'
    wrong:
      - { value: 40, feedback: 'That doubles the past, which is not the 50% factor. Use the factor for the middle half of the life.' }
      - { value: 6.67, feedback: 'That is the **lower** end of the range, the past divided by 3.' }
    hint: 'Scaling test: the range is a pair of multiples of the past, and the 50% multiples are neat.'
    explanation: |
      The elapsed fraction of the life is between $\tfrac14$ and $\tfrac34$ with 50% chance. The future is then between $20\cdot\tfrac13\approx6.7$ and $20\cdot3=60$ years.

  - type: numeric
    id: odds-num
    title: "Two clues"
    prompt: |
      Before looking at the evidence, a hypothesis is judged 1 to 50 against. Two independent clues each turn out 4 times likelier if the hypothesis is true than if it is false. What is its probability now, in percent?
    answer: 24.2
    tolerance: 0.3
    answerText: '24.2%'
    wrong:
      - { value: 32, feedback: 'That is the posterior odds written as a percent. Odds of $a{:}b$ are a probability $a/(a+b)$.' }
    hint: 'Think odds, not probabilities: the family of rules that multiply. Convert back at the end.'
    explanation: |
      Each clue multiplies the odds by 4, so $\tfrac1{50}\cdot4\cdot4=\tfrac{16}{50}=0.32$, that is odds of $16{:}50$ for. The probability is $\tfrac{16}{16+50}=\tfrac{16}{66}\approx24.2\%$.

  - type: numeric
    id: share-num
    title: "The unexplained share"
    prompt: |
      The US Air Force's Project Blue Book (1952 to 1969) investigated 12,618 reports of aerial objects, and 701 of them stayed unidentified. What percent of the reports is that? Give one decimal place.
    answer: 5.6
    tolerance: 0.05
    answerText: '5.6%'
    wrong:
      - { value: 56, feedback: 'That is off by a factor of 10: 701 is much smaller than a tenth of 12,618.' }
      - { value: 94.4, feedback: 'That is the share that was **identified**. The question asks for the unidentified share.' }
    hint: 'A share is a part over the whole.'
    explanation: |
      $701/12618\approx0.0556$, about 5.6%. This is also why an unexplained case can favour a visitor by only a limited amount: ordinary causes already leave about 1 in 18 reports unexplained.

  - type: numeric
    id: cross-num
    title: "Crossing the galaxy"
    prompt: |
      A probe travels at one tenth of the speed of light ($0.1c$) and has to cross the Milky Way, about $10^5$ light-years across. How many **millions of years** does the trip take?
    answer: 1
    tolerance: 0.01
    answerText: '1 million years (10^6 yr)'
    wrong:
      - { value: 0.1, feedback: 'That multiplies by the speed instead of dividing. Slower travel takes longer.' }
      - { value: 10, feedback: 'That would be $10^5$ light-years at $0.01c$.' }
    hint: 'A light-year is the distance light covers in a year, so at the speed of light the trip would take 10^5 years.'
    explanation: |
      Time is distance over speed. Light takes $10^5$ years; at a tenth of that speed it takes ten times as long, $10^6$ years. The Milky Way is about $10^{10}$ years old, so there would be time for a thousand such crossings.

  - type: numeric
    id: cut-l
    title: "Cut the lifetime"
    prompt: |
      A Drake-style estimate with signalling lifetime $L=10{,}000$ years gives $N=20$ civilisations now. Keeping every other factor the same, what does it give if civilisations signal for only $L=1000$ years?
    answer: 2
    tolerance: 0.01
    answerText: '2'
    wrong:
      - { value: 0.2, feedback: 'That cuts $N$ by 100, but $L$ fell by a factor of 10 only.' }
      - { value: 19, feedback: 'That subtracts as if $L$ were added. The lifetime multiplies.' }
    hint: 'Scaling test: how does $N$ depend on $L$ when everything else is fixed?'
    explanation: |
      $N$ is proportional to $L$, so dividing $L$ by 10 divides $N$ by 10: $20/10=2$.

  - type: mcq
    id: layers
    title: "Sort the claims"
    prompt: |
      Mark every claim that is a **debate among scholars** (how to weigh the evidence), not an established fact and not a faith commitment.
    multiple: true
    options:
      - text: 'Whether the Great Filter lies behind us or ahead of us.'
        correct: true
      - text: 'How much weight a Gott-style estimate deserves when we already know a lifespan.'
        correct: true
      - text: 'Project Blue Book logged 12,618 reports and left 701 unidentified.'
        feedback: |
          A count from the Air Force's own record is established fact. What the unidentified ones mean is the debate.
      - text: 'Any other civilisation, if found, must have been created by God.'
        feedback: |
          That is a commitment of faith (or its denial), not a scholarly weighing of data.
    hint: 'Counts are layer 1, how to weigh them is layer 2, claims about God and purpose are layer 3.'
    explanation: |
      Mnemonic: **record, reading, commitment**. Passing a faith claim off as fact, or a fact off as faith, is the slip the course keeps warning about, in either direction.

  - type: text
    id: summary
    body: |
      **Next:** the content map of this level, where you rebuild, box by box, how the Drake equation, the Fermi paradox, the search for life, unidentified aerial phenomena, aliens and theology, and the Copernican principle fit together.
