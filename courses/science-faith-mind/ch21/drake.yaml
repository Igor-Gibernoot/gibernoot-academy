id: ch21-drake
title: "The Drake Equation"
kind: concept
own: |
  The setting: the Milky Way, our galaxy of a few hundred billion stars, and the question of how many civilisations in it send out signals that we could detect now. Let $N$ be that number.
  - **The Drake equation** (Frank Drake, 1961) splits the question into seven factors and multiplies them:
    {{ $$N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L$$ }}
    Here $R_*$ is the rate of star formation (stars born per year), $f_p$ the fraction of stars with planets, $n_e$ the number of planets per such star that could support life, $f_l$ the fraction of those where life starts, $f_i$ the fraction of those where intelligence appears, $f_c$ the fraction of those that make detectable signals, and $L$ the number of years such a civilisation keeps signalling.
  - **Why it is a product.** The first six factors give the number of new signalling civilisations per year; each year's newcomers stay for $L$ years, so
    {{ $$N=(\text{births per year})\times L$$ }}
    which is why doubling $L$ doubles $N$, just as doubling any other factor does.
  - **What is known and what is guessed.** According to observation, $R_*$ (about one to a few stars a year) and $f_p$ (at least about one planet per star on average) are constrained, and $n_e$ partly (about 22% of Sun-like stars host an Earth-size planet in the habitable zone). The factors $f_l$, $f_i$, $f_c$ and $L$ rest on a single known case, Earth, and are guesses.
  - **Spread of the answer.** With pessimistic inputs ($N\approx2\times10^{-8}$) and optimistic ones ($N\approx1.5\times10^{8}$) the results differ by
    {{ $$\log_{10}\frac{N_{\text{opt}}}{N_{\text{pess}}}\approx16\ \text{orders of magnitude}$$ }}
    because the guessed factors multiply: the equation organises ignorance, it does not remove it.
  - **Where people part ways.** Layer by layer: the star and planet figures are fact; whether life, intelligence and lasting technology are likely is live debate (the optimist's $f_l\approx1$, the Rare Earth view that complex life is uncommon); whether a populated or an empty universe fits a purpose is faith or commitment, and the equation cannot decide it.

cards:
  - type: mcq
    id: hook
    title: "Guess: how crowded is the galaxy?"
    prompt: |
      Before any theory, guess. Our galaxy, the Milky Way, holds hundreds of billions of stars. Scientists have tried to estimate how many civilisations in it send out signals we could pick up today. Which describes what careful, honest estimates look like?
    options:
      - text: "They spread from far below one civilisation to millions or more, depending on assumptions nobody can yet check."
        correct: true
        feedback: |
          Yes. The spread is the main finding. This lesson builds the tool that produces it and shows why the number is so slippery.
      - text: "They agree on a small number, around ten."
        feedback: |
          Tempting, because a short answer sounds scientific. But careful people disagree by many powers of ten. Drake's own later figure, according to the SETI Institute, was 10,000, with one new society a year and ten-thousand-year lifetimes; others get less than one.
      - text: "They agree on a huge number, about one per few stars, because the galaxy is so big."
        feedback: |
          Size alone does not decide it. A huge number of stars multiplies a chance, and if that chance is tiny enough the product is still small. How small it is, is exactly what is unknown.
      - text: "Science has shown that there are none."
        feedback: |
          No search so far has found a signal, but a search of a small part of the sky is not a proof of absence. Whether we are alone is open.
    explanation: |
      Keep your guess in mind. By the end you will see what makes the answer slide across more than ten orders of magnitude, and what that does and does not mean.

  - type: text
    id: origins
    title: "A meeting at Green Bank"
    image:
      src: img/drake.webp
      alt: "Frank Drake, an elderly man with white hair and glasses, speaking at a lectern in a university auditorium."
      caption: "Frank Drake (1930-2022) speaking at Cornell University in 2017; he was educated at Cornell and Harvard and worked at the Green Bank observatory when he wrote the equation."
      credit: "Amalex5, CC BY-SA 4.0, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Frank_Drake_at_Cornell,_October_2017_(cropped_2).jpg"
    body: |
      In April 1960 the radio astronomer **Frank Drake** (1930-2022), then at the National Radio Astronomy Observatory in Green Bank, West Virginia, pointed an 85-foot radio telescope at two nearby Sun-like stars, Tau Ceti and Epsilon Eridani, listening at the wavelength of 21 centimetres. It was Project Ozma, usually called the first modern search for radio signals from other civilisations. It was partly inspired by a 1959 paper in the journal *Nature* by Giuseppe Cocconi and Philip Morrison. After about 150 hours of listening over some months it found no confirmed signal.

      In November 1961 the Space Science Board of the US National Academy of Sciences, through its staff member J. Peter Pearman, asked a small group to meet at Green Bank. About ten people came, among them the biochemist Melvin Calvin, the physicist Philip Morrison, the dolphin researcher John Lilly and a young Carl Sagan. They called themselves the Order of the Dolphin, after Lilly's talk on dolphin communication. Drake needed an agenda. He wrote down the quantities one would need to know to estimate how many societies might be signalling, and the list became the equation that carries his name.

      According to Drake's own account, the point was not a firm answer. At the time, he said, essentially none of the seven factors was known except the rate at which stars form. The equation was a way to organise the discussion.

  - type: text
    id: equation
    title: "The equation"
    body: |
      Here is the equation. Let $N$ be the number of civilisations in the Milky Way that send out signals we could detect now:
      $$N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L.$$
      It reads as a chain of filters. A factor named $f$ with a subscript is a **fraction**, a number between 0 and 1 that keeps part of what the previous factors left. $R_*$ counts stars being born, and each fraction then cuts them down: to stars with planets, to planets that could support life, to those where life starts, to those where intelligence appears, to those that make technology whose signals can be detected. The last factor, $L$, is not a fraction but a duration. The next three cards define each symbol.

  - type: text
    id: stars
    title: "The star and planet factors"
    body: |
      **$R_*$ is the rate of star formation**: new stars born in the Milky Way per year. Drake took about one a year. Recent estimates, according to NASA and ESA work cited in standard references, are roughly one to three stars a year; the galaxy turns about $1.65\pm0.19$ solar masses of gas into stars each year (Licquia and Newman, 2015).

      **$f_p$ is the fraction of stars that have planets.** In 2012 Arnaud Cassan and colleagues, using gravitational microlensing (a star's gravity briefly magnifying a background star), reported in *Nature* that on average there is at least one planet per star in the Milky Way. By September 2025 NASA's Exoplanet Archive counted 6,000 confirmed planets outside our solar system. So $f_p$ is close to 1.

      **$n_e$ is the average number of planets per planet-bearing star that could support life.** This one depends on what "could support life" means. A common reading is a rocky planet of about Earth's size in the habitable zone, where light could keep water liquid. In 2013 Erik Petigura, Andrew Howard and Geoffrey Marcy used data from the Kepler space telescope and estimated that about 22% (give or take 8%) of Sun-like stars have an Earth-size planet in that zone. So $n_e$ is perhaps a few tenths, or more with a looser definition.

  - type: text
    id: life
    title: "The life and intelligence factors"
    body: |
      **$f_l$ is the fraction of habitable planets on which life actually starts.** **$f_i$ is the fraction of those on which intelligent life appears.** Nobody has seen life beyond Earth, so each is a single data point: here, life began, and (on one planet, after billions of years) intelligence followed.

      Two readings of that one point are possible, and both are fair. According to optimists, life began early on Earth, almost as soon as conditions allowed, which suggests that starting is easy; Drake's original table put $f_l = 1$. According to the Rare Earth view of the paleontologist Peter Ward and the astronomer Donald Brownlee (2000), microbes may be common but complex life, which needed a long chain of lucky conditions, may be very uncommon. Both read the same fact (life on Earth) and part ways over what it says about other planets. A single sample cannot tell a rule from a fluke.

  - type: text
    id: tech
    title: "The technology and lifetime factors"
    body: |
      **$f_c$ is the fraction of intelligent civilisations that develop technology releasing detectable signs of themselves into space**, such as radio signals. Not every intelligence need do so: a species of divers, or one that prefers silence, would not.

      **$L$ is the length of time, in years, that such a civilisation keeps releasing detectable signals.** It is not the age of the species; it is how long the signalling lasts. Humanity has been radio-loud for about a century. Whether a society lasts a hundred years, because it destroys itself or switches to quieter technology, or a million, is unknown.

      Why a duration in the equation? The first six factors give how many signalling societies appear **per year**. Each one stays for $L$ years. A shop that gets 5 new customers an hour and keeps each for 2 hours holds 10 at any moment; $L$ plays the part of the two hours.

  - type: mcq
    id: scaling
    title: "Which factor matters most?"
    prompt: |
      In the Drake equation $N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L$ the number of detectable civilisations $N$ is a product of seven factors. Suppose every factor stays the same except the signalling lifetime $L$, which becomes ten times longer. What happens to $N$?
    options:
      - text: "$N$ becomes ten times larger."
        correct: true
        feedback: |
          Yes. $N$ is proportional to each factor separately, so multiplying one factor by 10 multiplies $N$ by 10. The same holds for any one of the seven.
      - text: "$N$ increases by 10, as a sum would."
        feedback: |
          That would be so if the factors were added. They are multiplied, so a tenfold change in one factor scales the whole product tenfold, however big or small $N$ already is.
      - text: "$N$ becomes $10^{7}$ times larger, one factor of 10 per symbol."
        feedback: |
          Only the factor $L$ changed, so only one factor of 10 enters. The other six factors are unchanged and multiply the result by 1.
      - text: "$N$ does not change, because $L$ is a time and the others are fractions."
        feedback: |
          $L$ is a duration, but it still multiplies the rate of births per year; the product is a pure count. Years per year cancel, as the shop example showed.
    explanation: |
      Every factor has the same leverage on $N$. What differs from factor to factor is how well we know it, which is the next question.

  - type: mcq
    id: observed
    title: "Measured or guessed?"
    prompt: |
      Of the seven factors of the Drake equation, some have been constrained by observation of the sky and some rest on a single known case or on pure guesswork. Which of these two are constrained by observation? Select all that apply.
    multiple: true
    options:
      - text: "$R_*$, the rate of star formation in the Milky Way."
        correct: true
        feedback: |
          Yes: astronomers measure how fast the galaxy forms stars, to within a factor of two or so.
      - text: "$f_p$, the fraction of stars that have planets."
        correct: true
        feedback: |
          Yes: planet surveys, from microlensing to the Kepler telescope, point to about one planet or more per star.
      - text: "$f_l$, the fraction of habitable planets on which life starts."
        feedback: |
          Not constrained by observation: we know of one planet with life and have not examined a second. Searches for life on other worlds are the subject of a later lesson, The Search for Life.
      - text: "$L$, how long a civilisation keeps signalling."
        feedback: |
          Not constrained: the only case we have, ours, is still going and has signalled for about a century. A sample of one still running gives no lifetime.
    explanation: |
      A fair note: $n_e$ sits in between. Kepler data say how common Earth-size planets in the habitable zone are, but whether such a planet really supports life depends on much that we cannot see. Layer by layer: $R_*$ and $f_p$ are established fact; $n_e$ is fact plus debate about the word "habitable"; $f_l$, $f_i$, $f_c$ and $L$ are guesses, where debate begins.

  - type: numeric
    id: ex-stars
    title: "An example: the stars and planets"
    prompt: |
      Let us run the equation once with invented numbers (not measurements). Recall that $N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L$. Take the first three factors: $R_* = 2$ stars per year, $f_p = 0.5$ and $n_e = 0.4$ habitable planets per planet-bearing star. How many stars with planets form per year is $R_*f_p = 1$. How many habitable planets form per year, $R_*\,f_p\,n_e$?
    answer: 0.4
    tolerance: 0.001
    wrong:
      - { value: 1, feedback: "That is $R_*f_p$, the stars with planets per year. Now multiply by $n_e$ as well." }
      - { value: 2.9, feedback: "You added. The factors multiply: each keeps a fraction or a multiple of the previous count." }
    hint: Multiply $1$ by $0.4$.
    explanation: |
      Two stars are born per year; half have planets, so 1 planet-bearing star per year; each such star has on average 0.4 habitable planets, giving $2\times0.5\times0.4=0.4$ habitable planets per year.

  - type: numeric
    id: ex-life
    title: "An example: life and intelligence"
    prompt: |
      With invented numbers (not measurements), the equation is $N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L$ and $R_*f_pn_e = 0.4$ habitable planets form per year. Now take $f_l = 0.1$ (one habitable planet in ten starts life) and $f_i = 0.1$ (one in ten of those develops intelligence). How many planets per year develop intelligent life, $R_*\,f_p\,n_e\,f_l\,f_i$?
    answer: 0.004
    tolerance: 0.0001
    wrong:
      - { value: 0.04, feedback: "That is the count after $f_l$ alone. Multiply by $f_i = 0.1$ too." }
      - { value: 0.4, feedback: "That ignores both filters. Each fraction cuts the number down." }
    hint: Multiply $0.4$ by $0.1$, then by $0.1$ again.
    explanation: |
      $0.4\times0.1=0.04$ planets per year start life, and $0.04\times0.1=0.004$ develop intelligence: about one every 250 years. So far this galaxy would be a slow producer.

  - type: numeric
    id: ex-total
    title: "An example: technology and lifetime"
    prompt: |
      With invented numbers (not measurements), suppose $R_*f_pn_ef_lf_i = 0.004$ intelligent societies appear per year. Take $f_c = 0.5$ (half of them make detectable signals) and $L = 10{,}000$ years. With $N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L$, how many civilisations are signalling at any moment?
    answer: 20
    tolerance: 0.01
    wrong:
      - { value: 0.002, feedback: "That is the rate of signalling societies per year, $0.004\times0.5$. Now multiply by the lifetime $L$ to count how many are on at once." }
      - { value: 40, feedback: "You skipped $f_c$. Only half of the intelligent societies signal." }
    hint: "$0.004\\times0.5=0.002$ per year; each stays for $L$ years."
    explanation: |
      $0.004\times0.5=0.002$ signalling societies are born per year, each stays 10,000 years, so $0.002\times10{,}000=20$ at any moment. With 100 billion stars, that is about one signalling civilisation per five billion stars. A galaxy of 20 civilisations is mostly empty space between them.

  - type: numeric
    id: l-dominates
    title: "Why L matters so much"
    prompt: |
      With invented numbers: signalling societies appear at a rate of $R_*f_pn_ef_lf_if_c = 0.002$ per year, and $N = 0.002\,L$. If a civilisation signals for only $L = 100$ years, then $N = 0.2$. How many are signalling at once if $L = 10^{6}$ years, a million?
    answer: 2000
    tolerance: 1
    wrong:
      - { value: 20, feedback: "That is the value for $L = 10{,}000$. A million years is a hundred times longer." }
      - { value: 0.2, feedback: "That is the value for $L = 100$. Here the lifetime is much longer." }
    hint: Multiply $0.002$ by $10^6$.
    explanation: |
      $0.002\times10^{6}=2000$. The same six other factors give $0.2$ for $L=100$ and $2000$ for $L=10^6$, a factor of $10^{4}$. An expected 0.2 means most of the time none is signalling; 2000 means a crowded sky, and nothing else changed. Whether civilisations last depends on choices and accidents we cannot yet observe, which is why $L$ is both the most important and the least known factor.

  - type: text
    id: ranges
    title: "Two people, two tables"
    body: |
      Two careful people fill in the same equation, one pessimistic, one optimistic. Each choice sits inside what the evidence allows or what the single case of Earth leaves open.

      | Factor | Pessimist | Optimist |
      |---|---|---|
      | $R_*$ (stars per year) | 1 | 3 |
      | $f_p$ | 0.2 | 1 |
      | $n_e$ | 0.1 | 1 |
      | $f_l$ | $10^{-3}$ | 1 |
      | $f_i$ | $10^{-3}$ | 1 |
      | $f_c$ | 0.01 | 0.5 |
      | $L$ (years) | 100 | $10^{8}$ |

      Multiplying each column gives $N_{\text{pess}} = 2\times10^{-8}$ and $N_{\text{opt}} = 1.5\times10^{8}$. The first says that in a galaxy of this kind we are almost certainly the only signalling civilisation, ever. The second says that there are a hundred and fifty million. Notice that the factors we can measure ($R_*$, $f_p$) differ by a factor of 3 or 5 between the two tables, while the guessed ones ($f_l$, $f_i$, $L$) differ by factors of a thousand or a million. The spread comes almost entirely from what we know least.

  - type: numeric
    id: orders
    title: "How many orders of magnitude?"
    prompt: |
      Using the tables, the pessimist gets $N_{\text{pess}} = 2\times10^{-8}$ and the optimist $N_{\text{opt}} = 1.5\times10^{8}$ signalling civilisations in the Milky Way. By how many orders of magnitude (powers of ten) do they differ, that is, what is $\log_{10}(N_{\text{opt}}/N_{\text{pess}})$? Give it to one decimal place.
    answer: 15.9
    tolerance: 0.1
    wrong:
      - { value: 8, feedback: "That is the exponent of the optimist alone. The pessimist's value lies on the other side of 1, at $10^{-8}$, so you add the two distances: $8 + 8$ and a bit more." }
      - { value: 0.1, feedback: "That is not a log of the ratio. Take $\\log_{10}$ of the ratio $7.5\\times10^{15}$." }
    hint: "$\\log_{10}(1.5\\times10^{8}) = 8.18$ and $\\log_{10}(2\\times10^{-8}) = -7.70$; subtract."
    explanation: |
      $\log_{10}(1.5\times10^{8})\approx8.18$ and $\log_{10}(2\times10^{-8})\approx-7.70$, so the difference is $8.18-(-7.70)\approx15.9$. The two answers differ by nearly sixteen powers of ten. Because the factors multiply, their uncertainties add in the exponent: when several factors are each uncertain by a few powers of ten, the product is uncertain by the sum.

  - type: mcq
    id: trap-predict
    title: "Trap: does it predict?"
    prompt: |
      A magazine writes: "The Drake equation predicts that there are about 20 signalling civilisations in our galaxy." In what sense, if any, is that right?
    options:
      - text: "Not in the usual sense: the equation only turns assumed inputs into a number; change the guessed inputs and the 'prediction' changes by powers of ten."
        correct: true
        feedback: |
          Yes. A prediction in science risks failure: a theory says what will be seen, and the observation can contradict it. Here the output simply restates the inputs, and the inputs are largely guesses. Drake himself described it as a way to organise discussion.
      - text: "It is right: the equation was derived from the laws of physics and gives a unique value."
        feedback: |
          Nothing in physics fixes $f_l$, $f_i$, $f_c$ or $L$. The equation is a bookkeeping identity: it says $N$ equals births per year times lifetime, and it splits the births into factors. It is true as accounting, not as a law that chooses the numbers.
      - text: "It is right, because scientists at Green Bank measured all seven factors."
        feedback: |
          At that meeting, according to Drake, essentially none of the factors except the star-formation rate was known. Even today four of the seven are guesses.
      - text: "It is wrong because the equation is false."
        feedback: |
          The equation is not false: it is a correct decomposition. What is weak is not the formula but our knowledge of the factors that go into it.
    explanation: |
      A useful way to say it: the equation does not tell us the number; it tells us what we would have to learn to know the number, and which parts of our ignorance matter most.

  - type: mcq
    id: trap-big
    title: "Trap: a big N proves life?"
    prompt: |
      The optimist's table gives $N = 1.5\times10^{8}$ signalling civilisations. A friend says: "So the equation shows that aliens exist." What is the flaw?
    options:
      - text: "The big number came from optimistic inputs, such as $f_l = 1$ and $L = 10^{8}$ years; if those are wrong the result is wrong. The equation cannot test its own inputs."
        correct: true
        feedback: |
          Yes. A calculation can show what follows from assumptions, not whether the assumptions hold. The pessimist's inputs, equally allowed by the evidence, give $2\times10^{-8}$ from the same equation.
      - text: "A large $N$ is impossible, because the galaxy cannot hold so many civilisations."
        feedback: |
          Space is not the problem: $1.5\times10^{8}$ is a small fraction of the hundreds of billions of stars. The flaw is in what the number rests on, not in whether the galaxy could hold it.
      - text: "$N$ counts civilisations that have already died, not living ones."
        feedback: |
          $N$ as defined counts those signalling now, through the factor $L$. The problem is not the definition but that its inputs are guesses.
      - text: "Nothing is wrong: with such a big number, life certainly exists."
        feedback: |
          The number is only as reliable as the guesses behind it. The same logic with the pessimist's inputs would 'prove' we are alone, and both cannot be right.
    explanation: |
      The mirror error runs the other way: a tiny $N$ does not prove we are alone either. Either figure is a statement of what one set of assumptions implies, and only observation (a signal, or a thorough null result) can test them.

  - type: text
    id: views
    title: "Where thoughtful people part ways"
    body: |
      Three kinds of disagreement hide behind one equation, and it helps to keep them apart.

      **Established fact (layer 1).** Stars form at a rate of one to a few per year; planets are common; Earth-size planets in the habitable zone are not rare. Nobody who has read the surveys disputes these, though the numbers keep being refined.

      **Live debate (layer 2).** Is $f_l$ near 1 or tiny? According to optimists such as Drake's original table, life is a likely outcome wherever chemistry and energy allow it. According to the Rare Earth view of Ward and Brownlee, complex life needs a rare conjunction of conditions. Is $L$ long or short? Some think technological societies are fragile and end themselves quickly; others think a society that survives its first centuries could last for ages or leave signals that outlast it. These are questions that evidence, such as the search for life and for signals, could settle, in principle.

      **Faith or commitment (layer 3).** Does a universe full of life, or one with only us, better fit a purpose behind it? According to some believers a creator's generosity would fill the universe with life; according to others, humanity or this world has a special place; and according to many non-believers neither follows, because purposes cannot be read from a number. The equation is silent here, and a lesson on aliens and theology comes later in this level.

  - type: mcq
    id: parting
    title: "Why do estimates differ?"
    prompt: |
      Two scientists use the same Drake equation and agree on the observed values of $R_*$ and $f_p$, yet one gets $N\approx10^{-8}$ and the other $N\approx10^{8}$. What best explains the gap?
    options:
      - text: "They weigh the guessed factors differently: how often life starts, how often it becomes intelligent and technological, and how long civilisations last."
        correct: true
        feedback: |
          Yes. With the measured factors agreed, the gap comes from $f_l$, $f_i$, $f_c$ and $L$. Each scientist can defend the choices from the one example we have, and the disagreement is about how to read a single case.
      - text: "One of them has made an arithmetic error, because the equation has one correct answer."
        feedback: |
          Both can multiply correctly. The equation fixes how to combine factors, not what values they take, so it has no single answer until the factors are known.
      - text: "One of them rejects the equation as false."
        feedback: |
          Both can accept it fully. It is a decomposition that nobody denies; what differs is the input.
      - text: "One of them ignores the evidence about planets."
        feedback: |
          We said they agree on the observed factors. The planet evidence shrinks the gap only a little: the observed factors differ by a few at most, the guessed ones by many powers of ten.
    explanation: |
      That is a good place to be honest about what has been learned: the equation does not settle the question, but it shows exactly where the question lives.

  - type: text
    id: summary
    body: |
      **Next:** If many civilisations were likely, why have we heard nothing? The Fermi paradox turns that silence into an argument, and the great-filter idea asks which of these factors could be the hard step.
