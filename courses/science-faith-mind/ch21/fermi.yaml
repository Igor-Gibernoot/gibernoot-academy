id: ch21-fermi
title: "The Fermi Paradox"
kind: concept
own: |
  The setting: the Milky Way, a disk of stars about 100,000 light-years across and more than ten billion years old, and the fact that so far no one has detected any sign of another technological civilisation in it.
  - **The paradox is a tension between four premises and one observation.** P1: many stars are billions of years older than the Sun. P2: on some of their planets technological civilisations arose. P3: at least one of them spread across the galaxy, by ships or self-copying probes. P4: a civilisation that spread would leave signs we could see. Observation: we see none. These cannot all be true together, so at least one premise must go:
    {{ Not all of P1, P2, P3, P4 and the observation can be true, so one of P1 to P4 must be false. }}
    It shows a tension, not that no one exists; Hart (1975) and Tipler (1980) drew the strong conclusion, and others, such as Sagan and Newman, replied that absence of evidence is not evidence of absence.
  - **The time-scale.** A wave of colonisation moving at a tenth of the speed of light $c$ crosses the galaxy's width $D\approx10^5$ light-years in
    {{ $$t=\frac{D}{v}=\frac{10^{5}\ \text{light-years}}{0.1\,c}=10^{6}\ \text{years}$$ }}
    which is about a thousandth of a billion years, so a civilisation only a billion years older than us would have had time for a thousand crossings.
  - **The Great Filter** (Robin Hanson, 1998): the path from dead matter to expanding, lasting life must contain at least one very improbable step. The question is where it lies:
    behind us (a rare start of life, or of complex life) or ahead of us (civilisations do not last).
    According to Hanson, finding independent simple life on Mars would suggest the early steps are easy, so the filter would be more likely ahead.
  - **Three families of answers.** They differ in which premise they reject. *We are rare* (Rare Earth, Ward and Brownlee, 2000; a hard step behind us) denies P2. *They do not last or do not spread* (a short signalling lifetime $L$ in the Drake equation $N=R_*f_pn_ef_lf_if_cL$, where $N$ is the number of signalling civilisations now) denies P3. *They are here or near but unseen* (the zoo hypothesis, John Ball, 1973; or "we have searched too little") denies P4.
  - **No signal is weak evidence.** The searches so far have covered a very small part of the space of sky, distance, frequency and signal type (Wright, Kanodia and Lubar, 2018: like a hot tub against the oceans), so the null result $E$ ("no signal found so far") gives a likelihood ratio
    {{ $$\frac{P(E\mid\text{civilisations exist})}{P(E\mid\text{none exist})}\approx1$$ }}
    so $E$ is almost equally likely either way and moves our odds only a little.
  - **Where people part ways.** Layer by layer: the size and age of the galaxy and the absence of detections so far are fact; which premise fails, and whether a filter lies ahead, is live debate; whether the silence points to a lonely universe or to a hidden purpose is faith or commitment.

cards:
  - type: text
    id: hook
    title: "A lunch question"
    image:
      src: img/fermi.webp
      alt: "Portrait of the physicist Enrico Fermi, a man in a dark jacket and tie, looking to one side."
      caption: "Enrico Fermi (1901-1954), Nobel Prize in Physics 1938, photographed between 1943 and 1949; he was at Los Alamos when the lunch story takes place."
      credit: "Department of Energy. Office of Public Affairs, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:Enrico_Fermi_1943-49_(cropped).jpg"
    body: |
      Before any theory, a scene. According to a report written in 1985 by Eric Jones at Los Alamos, which collected the memories of those who were there, the physicist **Enrico Fermi** (1901-1954) was walking to lunch at the Los Alamos laboratory in New Mexico with three colleagues, Edward Teller, Emil Konopinski and Herbert York. The summer of 1950 is the most likely date, though York thought 1951 more probable. On the way they joked about flying saucers. Then, at the table, Fermi asked something like "but where is everybody?" Teller remembered it as "Where is everybody?", York as "Don't you ever wonder where everybody is?" and Konopinski as "But where is everybody?".

      York said everyone understood who "everybody" meant: visitors from other worlds. According to York, Fermi had run through the chances of Earth-like planets, of life, of intelligence and of lasting technology, and concluded that we ought to have been visited long ago and many times over. No one has the exact words or numbers, only these recollections.

  - type: mcq
    id: guess
    title: "Guess: what is surprising?"
    prompt: |
      Guessing is part of this lesson. Our galaxy, the Milky Way, has hundreds of billions of stars, and many of them are billions of years older than the Sun. Fermi's question hints at something puzzling about that. What is the puzzle?
    options:
      - text: "If civilisations are at all common, some would have had a huge head start on us, and yet we see no sign of any."
        correct: true
        feedback: |
          Yes. The age and size of the galaxy are what make the silence strange: a civilisation with even a modest head start would have had a very long time to spread or to make itself known.
      - text: "Aliens must exist, because the galaxy is so big."
        feedback: |
          That is the optimist's guess, but it is not the puzzle. The puzzle is the clash between that guess and what we observe, which is silence.
      - text: "We cannot know how many stars there are."
        feedback: |
          We know the star count reasonably well. The difficulty is with what lives around them, not with the stars.
      - text: "Light takes too long to cross the galaxy for us to talk."
        feedback: |
          True, but that is a difficulty of conversation, not a puzzle. Fermi's point was about time: the galaxy is so old that even slow travel would have had time to spread across it.
    explanation: |
      Keep that guess. The next cards turn the puzzle into a numbered argument, so you can see exactly what each reply to it denies.

  - type: text
    id: names
    title: "Whose paradox is it?"
    body: |
      The name "Fermi paradox" is a little unfair to everyone. What survives of Fermi's remark is a recollection by four men, with no written argument. The argument in print came later. **Michael Hart** (1975, *Quarterly Journal of the Royal Astronomical Society*) asked why there are no extraterrestrials on Earth. He sorted the possible explanations into groups (travel is physically impossible, they choose not to come, they have not had time, they came but we cannot see them), rejected each, and concluded that, according to him, intelligent life does not exist elsewhere in the galaxy. He added that, in his view, the radio search for such messages was probably a waste of time and money.

      **Frank Tipler** (1980, in the same journal, "Extraterrestrial intelligent beings do not exist") strengthened the argument with a specific means of spreading: self-reproducing probes, often called von Neumann probes, machines that land on a planet, build copies of themselves from local material and send them on. Critics replied, among them **Carl Sagan** and **William Newman** (1981), that absence of evidence is not evidence of absence, and that the argument rests on guesses about how others would behave. We will take the argument and its replies seriously, not only the conclusion.

  - type: text
    id: recall
    title: "Recall: the Drake equation"
    body: |
      Recall: the Drake equation counts the civilisations in the Milky Way that send out signals we could detect now:
      $$N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L.$$
      Here $R_*$ is the number of stars born per year, $f_p$ the fraction of stars with planets, $n_e$ the number of life-supporting planets per such star, $f_l$ the fraction of those where life starts, $f_i$ the fraction where intelligence appears, $f_c$ the fraction that make detectable signals, and $L$ the number of years each keeps signalling. Its factors are so uncertain that the answer ranges from far below one to millions or more. The paradox asks what the silence says about that range.

  - type: text
    id: argument
    title: "The paradox as an argument"
    body: |
      Here is the paradox written out, with its premises numbered so that each can be examined.

      **P1.** The galaxy is old, and many stars are billions of years older than the Sun.

      **P2.** On the planets of some of those stars, technological civilisations arose.

      **P3.** At least one of them spread across the galaxy, with ships or self-copying probes, within a time short compared with the stars' ages.

      **P4.** A civilisation that had spread would leave signs we could notice by now: probes, structures, signals.

      **Observation.** We have found no such signs.

      The five statements cannot all be true. That is a **tension**, not a proof: it says that at least one premise is false, but not which. Each family of replies we meet picks one.

  - type: mcq
    id: critic-p2
    title: "Which premise would a critic reject?"
    prompt: |
      A critic says: "Life may be common, but the steps leading to a technological species are so unlikely that perhaps only one planet in the galaxy, ours, ever made it." According to this critic, which of the premises P1 to P4 fails?
      P1: many stars are billions of years older than the Sun. P2: some of their planets produced technological civilisations. P3: at least one civilisation spread across the galaxy. P4: a spread civilisation would leave visible signs.
    options:
      - text: "P2: no other technological civilisation arose."
        correct: true
        feedback: |
          Yes. This reply grants the galaxy's age and the logic of spreading, but says the starting condition is not met. It is the family of "we are rare" answers.
      - text: "P1: the galaxy is not old enough."
        feedback: |
          The critic says nothing against the age of the stars. Their complaint is about how likely a technological species is, and that is P2.
      - text: "P3: civilisations never spread."
        feedback: |
          P3 starts from a civilisation that exists. The critic says none arose, so spreading never comes up.
      - text: "P4: spread civilisations would be invisible."
        feedback: |
          That reply concedes the civilisations exist and spread but hides them. This critic denies that they exist at all.
    explanation: |
      Every reply to the paradox can be filed this way: it keeps some premises and rejects at least one. A reply is judged by how plausible the rejected premise is.

  - type: numeric
    id: crossing
    title: "How long to cross the galaxy?"
    prompt: |
      The galaxy is a disk about 100,000 light-years across. A light-year is the distance light travels in one year, so a ship moving at the speed of light $c$ would take 100,000 years to cross. Suppose a colonisation wave moves at only a tenth of that speed, $0.1\,c$. How many **millions of years** does it take to cross the disk?
    answer: 1
    tolerance: 0.001
    answerText: '1 million years'
    wrong:
      - { value: 0.01, feedback: "That multiplies by $0.1$ the wrong way round: slower travel takes longer, not less time." }
      - { value: 0.1, feedback: "At the full speed $c$ the crossing takes 100,000 years, which is $0.1$ million. A tenth of the speed takes ten times longer, not the same." }
    hint: |
      Time equals distance over speed. At a tenth of the speed, the same distance takes ten times as long as at full speed.
    explanation: |
      At speed $c$ the trip takes $100{,}000$ years, since light covers one light-year each year. At $0.1\,c$ the ship covers only a tenth of a light-year per year, so
      $$t=\frac{10^{5}\ \text{light-years}}{0.1\,c}=10^{6}\ \text{years}.$$
      Stops to build colonies would add time, but even adding thousands of years per hop leaves the total at a few million years.

  - type: numeric
    id: head-start
    title: "A modest head start"
    prompt: |
      The Sun is about 4.6 billion years old, and the oldest stars of the Milky Way are about 13 billion years old. Suppose a civilisation arose on a planet only **one billion years** before ours and set off, spreading across the galaxy at $0.1\,c$ as before, so that one crossing takes one million years. How many crossing-times of the galaxy fit into its head start?
    answer: 1000
    tolerance: 0.001
    answerText: '1000'
    wrong:
      - { value: 1, feedback: "That counts the crossing time of one million years as if it were the whole head start. The head start is a billion years, a thousand times larger." }
    hint: |
      Divide the head start, one billion years, by the time for one crossing, one million years.
    explanation: |
      Dividing the head start by the crossing time gives
      $$\frac{10^{9}\ \text{years}}{10^{6}\ \text{years}}=1000.$$
      So the question is not whether a civilisation had time to spread, but why, if one existed, nothing shows it. That is why a head start of only a billion years, small beside the stars' ages, already makes the silence puzzling.

  - type: mcq
    id: proof
    title: "Does the paradox prove we are alone?"
    prompt: |
      The five statements (P1 to P4 and the observation of no signs) cannot all be true. Hart concluded from this that, according to him, no other technological civilisation exists in the galaxy. What must be added for that conclusion to follow?
    options:
      - text: "That P1, P3 and P4 are true, so that only P2 can fail."
        correct: true
        feedback: |
          Yes. The logic only says that one of the premises fails. To pin it on P2 you must defend the other three: the galaxy is old, spreading would happen, and it would be visible. Hart tried to defend them; his critics said each rests on guesses about other minds.
      - text: "Nothing: the argument is already a proof."
        feedback: |
          It is a valid argument, but validity is only the link between premises and conclusion. Whether the premises are true is a separate matter, and that is where the debate lies.
      - text: "That aliens are too far away to be seen."
        feedback: |
          That would be a way of rejecting P4 or P3, which would defend their existence, not support Hart's conclusion.
      - text: "That Fermi himself believed we are alone."
        feedback: |
          Even if he had, a person's belief does not make a premise true. What York recalls is that Fermi wondered where everybody was, and the question stayed a question.
    explanation: |
      Keep the two steps apart. Validity: the premises and the observation cannot all hold. Truth: which premise we should give up. The Hart argument is valid, and the whole disagreement concerns the second step.

  - type: text
    id: filter
    title: "The Great Filter"
    body: |
      In 1998 the economist **Robin Hanson** (George Mason University) wrote an essay, "The Great Filter - Are We Almost Past It?", that recasts the puzzle. Between dead matter and "explosive", expanding, lasting life there must be some step, or several, that is very improbable, since otherwise the galaxy would be full of the visible results. He called this barrier the **Great Filter**. Pick a plausible chain of steps: the start of life, the first complex cells, intelligence, technology, and a lasting civilisation that spreads. The filter can sit in one or several of them.

      Where it sits changes what the silence means for us. According to Hanson, if the filter lies **behind** us, for instance because the start of life or of complex life is very rare, then we have already passed the hard part and the future is open. If it lies **ahead** of us, for instance because technological civilisations tend to end themselves, then our prospects are poorer. In his words, in essence: the easier the earlier steps turn out to be, the more we should fear for our future.

  - type: mcq
    id: behind-ahead
    title: "Behind us or ahead of us?"
    prompt: |
      A Great Filter is a very improbable step between dead matter and expanding, lasting life. Which of these hypothetical steps would be a filter **behind** us, one that humanity has already passed? Select all that apply.
    multiple: true
    options:
      - text: "The origin of life from non-living chemistry happens extremely rarely."
        correct: true
        feedback: |
          Yes. If life itself is the unlikely step, we are the lucky survivors of it, and nothing in our future need be unlikely.
      - text: "Cells with complex structure arise only after a very unlikely event, and almost never."
        correct: true
        feedback: |
          Yes. Complex life evolved on Earth, so if that was the very rare step, it lies in our past (this is the Rare Earth view).
      - text: "Almost every technological civilisation destroys itself within a few centuries."
        feedback: |
          This is a filter **ahead**: our own technology is only about a century old, so if this step is the barrier, we have not yet passed it. It is the pessimistic reading.
      - text: "Almost every civilisation chooses never to leave its home system."
        feedback: |
          Whether that is a filter at all depends on what we choose and on what is feasible, and we have not yet made the choices that count, so it lies ahead of us if it lies anywhere.
    explanation: |
      This is why people care about the silence beyond curiosity. A lonely galaxy because life is hard is good news for our future; a lonely galaxy because civilisations do not last is not. Both explain the same observation.

  - type: mcq
    id: mars
    title: "What would life on Mars tell us?"
    prompt: |
      Hanson wrote in 1998, when claims of ancient microbes on Mars were in the news. Suppose simple life were found on Mars that clearly started there independently of Earth. According to Hanson's reasoning, what would that suggest about the Great Filter?
    options:
      - text: "That the early steps, from dead matter to simple cells, are easy, so the filter is more likely to lie ahead of us."
        correct: true
        feedback: |
          Yes. Two independent starts in one solar system suggest that the origin of life is easy. If the early steps are easy, they cannot explain the silence, and the hard step is probably one we have yet to face. That is why Hanson called such a find bad news, however exciting.
      - text: "That the filter is behind us, because we are no longer alone."
        feedback: |
          Finding life makes the start of life look easy, which empties the early part of the chain of its power to explain the silence. A filter behind us would need the early steps to be hard.
      - text: "That aliens are certain to exist in the galaxy."
        feedback: |
          Simple microbes on a neighbouring planet say little about intelligence. The logic is about the odds of the early steps, not about certainty.
      - text: "That nothing follows about the filter."
        feedback: |
          Something does follow, though it is not certain: every fact about how easy a step is moves the probability of where the hard step lies. That is the point of the essay.
    explanation: |
      This argument is live debate and nothing more: it depends on the find being independent and on the other steps being as hard as the filter picture assumes. The next lesson looks at what such a find would require.

  - type: text
    id: families
    title: "Three families of replies"
    body: |
      Each reply is stated here as its best defenders would put it, then the strongest worry. Each rejects a different premise.

      **We are rare** (rejects P2). According to the Rare Earth view of Peter Ward and Donald Brownlee (2000), microbes may be common but complex life needs a long chain of lucky conditions. *Worry:* about one Sun-like star in five has an Earth-size planet in its habitable zone, and the galaxy holds a very large number of stars. We have one example, which cannot show whether Earth is typical.

      **They do not last, or do not spread** (rejects P3). According to this view, civilisations may end within centuries, or may be content to stay home, so that none ever spreads far. In Drake's terms, $L$ is short. *Worry:* a civilisation that spreads need only be a single exception, so the claim must hold for every one, at all times.

      **They are here, or near, but unseen** (rejects P4). According to the zoo hypothesis (John Ball, 1973, *Icarus*), advanced civilisations may treat us as a wilderness reserve and keep out of sight. *Worry:* this needs an agreement, or a dominant power, lasting billions of years. The next cards examine these three.

  - type: mcq
    id: zoo
    title: "The weak point of the zoo"
    prompt: |
      According to the zoo hypothesis of John Ball (1973), advanced civilisations know that we exist but deliberately avoid contact, like visitors to a nature reserve. Which feature is the usual objection to it?
    options:
      - text: "It needs every civilisation, over billions of years, to follow the same policy, since one that ignored it would show itself."
        correct: true
        feedback: |
          Yes. Duncan Forgan (2011) argued that this needs one early civilisation to have established lasting control over the whole galaxy, which he judged a low-probability event. The more civilisations there are, the harder it is for all to keep quiet.
      - text: "It contradicts the laws of physics."
        feedback: |
          Nothing in the laws of physics forbids it. The weakness is about the behaviour of many separate civilisations over very long times.
      - text: "It claims no civilisation exists."
        feedback: |
          The opposite: it accepts that civilisations exist and says they hide. It keeps P2 and P3 and rejects P4.
      - text: "It has been disproved by radio searches."
        feedback: |
          The searches have covered a very small part of the possibilities, and a zoo that hides from us would not be found by them anyway. It is hard to test, which is a different problem.
    explanation: |
      Steelman: if hiding is simply good manners, or if the first civilisation was powerful and shaped the rules, a zoo could last. The objection is that many ifs must hold. A view that explains every silence and can be tested by none is not thereby false, only hard to rely on.

  - type: mcq
    id: short-l
    title: "A short signalling lifetime"
    prompt: |
      A critic says: "Technological civilisations last only a few centuries before they destroy themselves or change into something quiet." In the Drake equation, with $L$ the number of years a civilisation keeps signalling, and in the paradox argument, which does this reply mainly attack?
    options:
      - text: "P3, because spreading across the galaxy takes about a million years, far longer than a civilisation that lasts centuries."
        correct: true
        feedback: |
          Yes. With a crossing time of a million years, a society that disappears after a few hundred never gets far. This reply is consistent with many civilisations having existed, one after another.
      - text: "P1, because the galaxy is too young."
        feedback: |
          The galaxy's age is not at issue. Even short-lived civilisations would have had billions of years in which to arise.
      - text: "P2, because no technological civilisation ever arose."
        feedback: |
          The critic grants that they arose and says they ended. That is a claim about their lifetime, not about their existence.
      - text: "Nothing, because lifetime does not matter to spreading."
        feedback: |
          It matters a great deal: a spreading wave needs to keep going for the whole crossing time, which is many times longer than a few centuries.
    explanation: |
      Notice the cost of this reply. It lowers $N$ in the Drake equation, but it also says something about our future, for if it is right, our own civilisation may be short-lived too. That is the "ahead of us" filter.

  - type: text
    id: haystack
    title: "No signal found, or no one there?"
    body: |
      The observation, "we see no signs", may be weaker than it sounds. In 2018 the astronomer **Jason Wright** and colleagues (Shubham Kanodia and Emily Lubar) counted how much of the "cosmic haystack" radio searches have covered. A search is a point in a space with many dimensions: where in the sky, how far, which radio frequency, how strong a signal, how long a listening time, which polarisation, which kind of signal and how often it repeats. They found that the fraction searched is tiny, in their comparison like a large hot tub of water against the volume of Earth's oceans.

      That does not say anyone is out there. It says the null result is a null result about a small sample, and also about radio only. A civilisation that uses lasers or no beacon at all, or is simply far away or quiet, would be missed.

  - type: mcq
    id: null-result
    title: "How much does silence tell us?"
    prompt: |
      Let $E$ be "no signal found so far". Compare $P(E\mid\text{civilisations exist})$ with $P(E\mid\text{none exist})$. Given that the searches so far cover a very small part of the search space, how should the null result change our odds that civilisations exist?
    options:
      - text: "Only a little: both probabilities are close to 1, so their ratio is close to 1."
        correct: true
        feedback: |
          Yes. If the search is small, we would very likely have found nothing even if civilisations were plentiful, so the observation barely separates the two cases. In the odds form of Bayes' rule, the posterior odds stay close to the prior odds.
      - text: "A lot: silence proves that none exist."
        feedback: |
          That would hold only if a signal were certain to be found when someone exists. A small search does not guarantee that, so absence of evidence is only weak evidence of absence.
      - text: "Not at all: silence never counts as evidence."
        feedback: |
          It counts a little, and counts more as the search grows: ruling out loud beacons in every direction would be strong evidence against that kind of civilisation. Silence is evidence, but of limited weight.
      - text: "In favour of aliens: silence is what hiding aliens would do."
        feedback: |
          Hiding is a possibility, but it must be weighed against the chance of simply having missed them or of there being none. It does not turn silence into support.
    explanation: |
      This connects to the rule of the course: the weight of a null result depends on how hard we looked. The honest statement is that the haystack is mostly unsearched, and that the search continues.

  - type: mcq
    id: traps
    title: "Spot the slip"
    prompt: |
      Which of these statements about the Fermi paradox contains a mistake? Select all that apply.
    multiple: true
    options:
      - text: "Fermi proved that we are alone in the galaxy."
        correct: true
        feedback: |
          He proved nothing: what survives is a remembered lunch question. The paradox is a tension between premises, and the lunch story rests on recollections, not on a paper by Fermi.
      - text: "The paradox shows that aliens do not exist, so the Rare Earth answer must be right."
        correct: true
        feedback: |
          The paradox allows at least three families of answers, including that civilisations exist but are short-lived or hidden. Rare Earth is one candidate, not the conclusion.
      - text: "If the Great Filter is behind us, the silence tells us nothing bad about our future."
        feedback: |
          This is correct according to Hanson's reasoning: a hard step already passed is good news for what lies ahead. It is not a mistake.
      - text: "A search of a small part of the radio sky that finds nothing does not prove that no one is out there."
        feedback: |
          This is correct: a small null search is weak evidence, as the haystack count shows. It is not a mistake.
    explanation: |
      Two slips to avoid: treating a tension as a proof, and treating one favourite answer as the only one.

  - type: text
    id: parting
    title: "Where thoughtful people part ways"
    body: |
      Separate the layers. **Established fact:** the galaxy is about 100,000 light-years across, it is billions of years old, and no confirmed sign of other technological civilisations has been found; searches so far have covered a small part of what could be searched. **Live debate:** which premise fails; whether complex life is rare; whether civilisations last; whether the filter lies behind or ahead; how much weight silence carries. Scientists, philosophers and futurists disagree here, and the disagreement is about probabilities and guesses, not about data.

      **Faith or commitment:** whether the silence means a lonely universe, a universe with a hidden order, or one made with us in mind. A believer may find a lonely cosmos fitting or a populated one; a sceptic may find the silence ordinary. These readings are not forced by the argument. The paradox is a good tool for asking which premise you are willing to give up, and why.

  - type: text
    id: summary
    body: |
      **Next:** the paradox is only as good as our knowledge of whether life is common, which brings us to the lesson The Search for Life: what Mars, the ocean under Europa's ice and the atmospheres of distant planets could tell us, and what a real detection of life would have to look like.
