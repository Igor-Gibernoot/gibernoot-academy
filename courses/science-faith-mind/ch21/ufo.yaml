id: ch21-ufo
title: "Unidentified Aerial Phenomena"
kind: concept
own: |
  The setting: reports of strange lights and objects in the sky, studied by official bodies since 1947, and the question of what a careful reader may conclude from them. **UFO** (unidentified flying object) means only "not yet identified"; **UAP** is the newer official term (since 2022, in the United States, "unidentified anomalous phenomena", covering air, sea, space and objects that cross between them).
  - **Most reports are explained, and the rest are mostly "not enough data".** According to the US Air Force's Project Blue Book (1947 to 1969), 701 of 12,618 reports stayed unidentified, a fraction
    {{ $$\frac{701}{12\,618}\approx 5.6\%$$ }}
    and later reviews (the 2021 intelligence assessment of 144 reports, the 2023 NASA study, the 2024 and 2026 reports of the Pentagon office AARO) say the unresolved cases lack good data and that resolved ones were ordinary objects such as balloons, aircraft, drones, birds and satellites.
  - **Unidentified does not mean extraterrestrial.** "Unexplained" is a statement about our data, not about the object. According to AARO, no verifiable evidence of extraterrestrial technology has been found, and according to NASA's study team there is no conclusive evidence of an extraterrestrial origin; according to critics, the best data may be classified and pilots under-report because of stigma. Both are positions on evidence, not facts about the objects.
  - **Explanations come in families:** balloons, aircraft and drones, birds and clutter, satellites and reflected sunlight, sensor artefacts (glare, parallax), atmospheric light, hoaxes, and a remainder of unknown cases.
  - **Evidence in odds form.** For hypotheses $H_1$ (say, an extraterrestrial craft) and $H_2$ (an ordinary cause) and an observation $E$, the posterior odds equal the likelihood ratio times the prior odds:
    {{ $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}$$ }}
    If $E$ is "this case stays unexplained", then $P(E\mid H_2)$ is about the 5.6% above, so even if $H_1$ always left cases unexplained, the likelihood ratio (LR) could not exceed
    {{ $$\text{LR}\le\frac{1}{0.056}\approx 18$$ }}
  - **Extraordinary claims, in this language.** Sagan's saying "extraordinary claims require extraordinary evidence" is the statement that a small prior $P(H_1)/P(H_2)$ needs a large likelihood ratio to reach even odds; defenders reply that the prior is not tiny, since the Drake and Fermi lessons leave life elsewhere open.
  - **What would test the extraterrestrial hypothesis.** Physical samples, several independent calibrated sensors with open data, and measured properties no known craft has; none has yet been published.
  - **Where people part ways.** Layers: the reports, the official studies and their findings are fact; how likely extraterrestrial visits are, and whether classified data would change the picture, is live debate; any meaning for religion or purpose is a commitment, taken up in the next lesson.

cards:
  - type: text
    id: hook
    title: "How many stay unexplained?"
    body: |
      Before any history, a guess, and guessing is part of this lesson. Imagine that for more than twenty years an official office collects every report of a strange object in the sky that people send in: pilots, farmers, police officers, children. Each report is examined by trained staff. Then someone counts how many of them were never explained.

      The cards ahead tell what such offices found, what explanations exist, and what a careful reader may and may not conclude. The lesson treats the subject as the course treats every odd claim: what is claimed, what is documented, what would test it, and what tests found.

  - type: mcq
    id: guess
    title: "Guess: the unexplained share"
    prompt: |
      Between 1947 and 1969 the files of the US Air Force project called Blue Book recorded 12,618 reports of unidentified flying objects. Guess: roughly what share of them stayed unidentified when the project closed?
    options:
      - text: "About half."
        feedback: |
          Tempting, because famous cases are the strange ones. But most reports came from people who saw planets, stars, aircraft, balloons and similar things, and those were identified.
      - text: "About 6 per cent, a few hundred out of thousands."
        correct: true
        feedback: |
          Yes. According to the Air Force's own fact sheet, 701 of 12,618 stayed unidentified, which is about 5.6 per cent.
      - text: "Almost none, under 0.1 per cent."
        feedback: |
          Too low. Some cases had too little information to settle, so a small but real remainder was left, 701 in all.
      - text: "Nearly all of them."
        feedback: |
          The opposite of the record. The public image of the subject is built on the unexplained cases, which makes them look like the rule, but they were the minority.
    explanation: |
      Keep this number: 701 of 12,618 is about 5.6 per cent. Later in the lesson it will matter for how much an "unexplained" label can prove.

  - type: text
    id: terms
    title: "From flying saucers to UAP"
    body: |
      On 24 June 1947 the pilot Kenneth Arnold reported nine shiny objects flying past Mount Rainier in Washington State. According to accounts of the case, he compared their motion to a saucer skipped over water, and press stories turned that into "flying saucers"; Arnold later said the comparison was about motion, not shape. Sources differ on exactly where the phrase first appeared.

      Edward Ruppelt, who headed the Air Force's Blue Book project in the early 1950s, is generally credited with introducing **unidentified flying object (UFO)** as a plainer name, since the objects were of many shapes. Technically it means only "not yet identified". Over time, popular use tied it to alien spacecraft, and, according to reference accounts, negative associations with the word led official bodies, including NASA's study team and the Pentagon, to use **unidentified aerial phenomena (UAP)**. In late 2022 the Pentagon changed the official wording to "unidentified anomalous phenomena", widening the scope from the air to objects at sea, in space and moving between them.

  - type: mcq
    id: terms-q
    title: "What the label claims"
    prompt: |
      A report is filed as a UAP. According to the plain meaning of the term, what does the label itself say about the object?
    options:
      - text: "That nobody has yet identified it from the available data; nothing about where it came from."
        correct: true
        feedback: |
          Yes. The label records a state of our knowledge. It is the same logic as a doctor writing "cause unknown" on a chart: it leaves every cause open, ordinary or exotic.
      - text: "That it is a craft built by a non-human intelligence."
        feedback: |
          That is a hypothesis about the object's origin, which is a further claim. Calling something unidentified does not choose among the hypotheses.
      - text: "That it is a secret aircraft of some government."
        feedback: |
          That is also a hypothesis. Secret aircraft are one candidate explanation, but the label does not assume it.
      - text: "That it is a hoax."
        feedback: |
          A hoax is one explanation among others, not the only one and not assumed. In Allan Hendry's 1979 book on the 1,307 reports he investigated, according to a review by the sceptic Philip Klass, only 8.6 per cent defied his efforts to find ordinary explanations, so most reports had one.
    explanation: |
      The distinction between "unidentified" and "extraterrestrial" is the one most worth keeping through the rest of the lesson.

  - type: text
    id: bluebook
    title: "Official studies, 1947 to 1969"
    image:
      src: img/ufo-1952-graph.webp
      alt: "A black and white Air Force chart of the number of unidentified flying object reports per day from June to September 1952, with a sharp peak in July labelled with a publicized incident at Washington and an Air Force press conference, and smaller labelled magazine articles."
      caption: "Reports per day in summer 1952 rose sharply after publicized incidents and press coverage, a reminder that how many reports arrive depends on attention as well as on the sky."
      credit: "United States Air Force, Public domain, via Wikimedia Commons"
      link: "https://commons.wikimedia.org/wiki/File:1952_UFO_Flap_-_Air_Force_frequency_graph_of_UFO_reports.png"
    body: |
      After Arnold the US Air Force ran a series of studies, Project Sign (from 1947 or 1948, depending on the source), Project Grudge, and then **Project Blue Book**, whose start is dated to 1951 or to March 1952 in different sources and which closed on 17 December 1969. The astronomer J. Allen Hynek served as the Air Force's scientific consultant, and in 1972 published a classification of reports into "close encounters" (a scale from lights in the sky to contact). In January 1953 the CIA convened a panel of scientists, the Robertson Panel, to review the evidence.

      The Air Force's fact sheet says that from 1947 to 1969, 12,618 reports reached Blue Book and 701 remained unidentified. The project is also remembered for a misstep. In March 1966, after mass sightings near Dexter and Hillsdale, Michigan, Hynek said the lights were swamp gas, and the explanation was widely derided; local witnesses and officials, including a Hillsdale police officer, said they did not believe it. Hynek himself later said he could not prove in a court of law that his explanations were the full account. The episode is often told as an example of an explanation offered too fast.

  - type: order
    id: timeline
    title: "Put the early record in order"
    prompt: |
      Put these events in the order in which they happened.
    steps:
      - "Kenneth Arnold reports nine objects near Mount Rainier (1947)."
      - "Project Blue Book begins (1951 or 1952, depending on the source)."
      - "Hynek's swamp-gas remarks about the Michigan sightings (March 1966)."
      - "The Condon Committee delivers its report (1968)."
      - "Project Blue Book is closed (December 1969)."
      - "The US intelligence community publishes its Preliminary Assessment on UAP (2021)."
    hint: "The names run from a pilot's report, through a long Air Force project and a university study, to a modern intelligence report."
    explanation: |
      The Air Force project ran from the early fifties to the end of the sixties, the university committee reported near its end, and the modern intelligence-community assessment came half a century later.

  - type: text
    id: condon
    title: "The Condon report and its critics"
    body: |
      In 1966 the Air Force asked the University of Colorado to review the subject. The committee was led by the physicist Edward Condon, and its report, *Scientific Study of Unidentified Flying Objects*, was delivered in 1968 and published in early 1969. According to the committee, studying UFOs had not added to scientific knowledge, and further extensive study could probably not be justified by the hope of advancing science. A panel of the National Academy of Sciences, asked by the Air Force to review it, concluded in essence that no high priority for UFO investigation was warranted, and the Air Force closed Blue Book in December 1969.

      There was a rival reading. In essence, Hynek said that the report settled nothing, that its introduction was slanted, and that cases it examined had no adequate explanation. Another critic, Thornton Page, argued that the conclusion rested on a small and selected sample. The American Institute of Aeronautics and Astronautics agreed that little of value had been found but did not accept that further study would be worthless.

  - type: mcq
    id: condon-q
    title: "Two readings of one report"
    prompt: |
      According to the Condon Committee, further extensive study of UFO reports was unlikely to advance science. According to critics such as Hynek, some of the studied cases had no adequate explanation. What is the fairest way to relate the two?
    options:
      - text: "They answer different questions: the committee judged whether study would pay off scientifically, the critics pointed to a residue of unexplained cases and judged that a poor reason to stop."
        correct: true
        feedback: |
          Yes. Both can be true of the same cases. An unexplained case shows that data were lacking; whether that is a reason to keep investigating, or a sign that further data will only repeat the pattern, is the point of dispute.
      - text: "One of them must be lying about the cases."
        feedback: |
          Neither claim needs dishonesty. They weigh the same facts differently, as in many scientific disputes.
      - text: "The report proved that every case had an ordinary cause."
        feedback: |
          It did not claim that. Its conclusion concerned the scientific value of continuing, not a proof about each case.
      - text: "The critics' point means the unexplained cases are extraterrestrial."
        feedback: |
          Hynek's point was that the explanations given were inadequate, which is a claim about the quality of the investigation. It does not say what the objects were.
    explanation: |
      This pattern, a residue of unexplained cases and two readings of what it shows, returns in every later study.

  - type: text
    id: modern
    title: "The modern records, 2017 to 2026"
    body: |
      In December 2017 the *New York Times* reported that the Pentagon had funded a small programme on unexplained aircraft sightings, and described Navy video footage the programme had collected. In April 2020 the Department of Defense released three Navy videos (one from November 2004, two from January 2015). The Navy had told a requester in September 2019 that they were authentic but that their release had not been authorised; the Department of Defense said the phenomena they show remain characterised as "unidentified".

      In June 2021 the Office of the Director of National Intelligence published a *Preliminary Assessment* of 144 reports from US government sources (2004 to 2021, mostly Navy). Only one was explained with high confidence, a large deflating balloon; for the other 143 it said the limited high-quality reporting hampered firm conclusions, and that it had no data indicating any foreign programme or breakthrough technology behind them. In July 2022 the Pentagon created the All-domain Anomaly Resolution Office (**AARO**). Its first report on the historical record, in March 2024, found no verifiable evidence that the government or companies had reverse-engineered extraterrestrial technology, and described claims of that kind, including those aired at a July 2023 congressional hearing, as the result of circular reporting from a group of individuals who believe it, despite the lack of evidence. NASA's independent study team, reporting in September 2023 under the astronomer David Spergel, said that the peer-reviewed literature holds no conclusive evidence of an extraterrestrial origin and that it saw no reason to conclude that existing reports have an extraterrestrial source. It said the data were thin, hampered by poor sensor calibration and missing sensor metadata, and that stigma almost certainly leads to fewer reports.

      The latest figures reported at the time of this lesson, in AARO's report for June 2024 to May 2025 (published in 2026): 319 new reports, 114 of them resolved, and every resolved case, including 256 from earlier periods, attributed to ordinary objects such as balloons, satellites, birds, aircraft and drones. Most of the unresolved were set aside for lack of data.

  - type: mcq
    id: authentic
    title: "What 'authentic' means"
    prompt: |
      In 2019 and 2020 the Navy confirmed that three videos circulating online were genuine Navy recordings, and the Pentagon released them as showing "unidentified" phenomena. What does the confirmation establish?
    options:
      - text: "That the footage is real and came from Navy sensors, and that the Navy could not identify the objects from it; it does not say what they were."
        correct: true
        feedback: |
          Yes. "Authentic" is about the recording's origin, and "unidentified" is about the object. Neither says the object is exotic.
      - text: "That the Navy had identified the objects as nonhuman craft."
        feedback: |
          The Pentagon's statement said the opposite: the phenomena remain characterised as unidentified. Reading "authentic" as "explained as alien" confuses a statement about the file with one about the object.
      - text: "That the objects were hoaxes made by the Navy."
        feedback: |
          Confirming that a video is a real Navy recording does not suggest the object was staged. It says only that the data are real data.
      - text: "That the videos had been shown to be fake."
        feedback: |
          Fake footage was not what the Navy said. It authenticated the clips, and the open question is the meaning of what the sensors recorded.
    explanation: |
      Real data and an unknown cause is the usual situation. The next cards turn to the explanations that are tried.

  - type: mcq
    id: odni-q
    title: "A hundred and forty-three"
    prompt: |
      The 2021 intelligence assessment listed 144 reports, explained one with high confidence, and left 143 unresolved, saying limited high-quality data hampered firm conclusions. What is the soundest reading of the 143?
    options:
      - text: "They are cases where the available data do not settle the cause; the report found no sign that they come from a foreign programme or a breakthrough, and it does not say they are of extraterrestrial origin."
        correct: true
        feedback: |
          Yes. That is close to what the document says: most such cases probably remain unidentified because of limited data, and it reports no data indicating a foreign programme or a breakthrough. It does not use the word extraterrestrial at all, so neither "alien" nor "not alien" is a finding of the document.
      - text: "143 of 144 sightings are alien craft."
        feedback: |
          The document makes no such finding. A case being unresolved is not a positive identification of anything.
      - text: "Since only one case was explained, the other 143 can safely be dismissed as errors."
        feedback: |
          Equally unwarranted. Pilots and sensors can be reliable and the cause still undetermined. The right word is "undetermined".
      - text: "The 143 cases show that the sightings all come from China or Russia."
        feedback: |
          The report said it lacked data to indicate that any were part of a foreign programme. A foreign origin is a hypothesis, not a result.
    explanation: |
      The same ambiguity appears everywhere: an unresolved case is a gap in the data, and different readers fill the gap differently.

  - type: text
    id: families
    title: "Families of explanation"
    body: |
      Investigators sort reports into families of explanation. **Balloons** (weather balloons, party balloons, large high-altitude ones), **aircraft and drones**, **birds and clutter** (insects, debris, reflections), **satellites and reflected sunlight** (AARO resolved 44 reports in its latest report as satellite flaring, that is, sunlight reflecting off satellites), **atmospheric and optical effects** (planets, stars, mirages), **sensor artefacts**, **hoaxes**, and finally a remainder with **no explanation yet**.

      Sensor artefacts deserve an example, because one of the famous Navy videos, nicknamed Gimbal, shows an object seeming to rotate. According to the analyst Mick West, the rotation is a camera effect: a bright infrared source such as a jet's engines produces a glare that is fixed to the camera's view, and when the front section of the camera pod rolls to keep the target in view, the glare appears to turn. According to critics of that reading, including at least one person who says he worked on such cameras, the glare explanation has not been shown to account for the whole video. So the Gimbal case holds two readings, a proposed ordinary cause that can be checked against footage and simulations, and a dispute over whether it reproduces the video.

  - type: mcq
    id: families-q
    title: "A test that could fail"
    prompt: |
      Mick West argues that the apparent rotation in the Gimbal video is a glare turning with the camera, not an object rotating. Which feature makes this a good scientific explanation, whether or not it turns out to be right?
    options:
      - text: "It predicts something checkable: a bright infrared source filmed by a similar camera should show a glare that turns when the pod rolls, and this can be checked against footage and simulations."
        correct: true
        feedback: |
          Yes. A good explanation says what else should happen, so that it can fail. A critic can try to reproduce the footage and show the match is poor, which is how the dispute is being carried on.
      - text: "It comes from a sceptic, so it is more likely to be true."
        feedback: |
          Who says it does not decide it. The test does. The same applies to explanations offered by believers.
      - text: "It cannot be checked, so it cannot be wrong."
        feedback: |
          An explanation that cannot be checked is weak, not safe. Being open to checking is the strength here.
      - text: "It explains the object away, which settles the case."
        feedback: |
          A proposed explanation is not yet settled. Critics say it does not fully account for the footage, so the case is open until the test is reproduced or fails.
    explanation: |
      The same standard applies to the rival hypotheses: say what would be seen if you were right.

  - type: text
    id: unknown
    title: "Unexplained is not extraterrestrial"
    body: |
      A tempting argument runs: some reports have no ordinary explanation, so the best explanation is a craft from elsewhere. Written out, it needs a premise that is not supplied by the reports.

      **P1.** Some reports are unexplained after investigation. *(Documented: 701 of 12,618, and 143 of 144.)*
      **P2.** Every ordinary explanation has been ruled out for them. *(A critic rejects this one: the reports lack data, so ordinary causes were not ruled out, only not found. According to AARO and NASA's team, missing data is the main reason.)*
      **P3.** If no ordinary cause fits, the cause is extraterrestrial. *(A critic rejects this too: it skips non-extraterrestrial unknowns, such as a new atmospheric effect, secret technology, or a sensor effect not yet understood.)*

      So the step from P1 to the conclusion fails unless P2 and P3 are earned. A defender replies, fairly, that some cases involve several sensors and trained witnesses, so P2 is stronger there than for a casual report, and that to keep the question open is reasonable.

  - type: numeric
    id: lr-bound
    title: "How much can 'unexplained' prove?"
    prompt: |
      Take the Blue Book figures: about $701/12\,618 \approx 5.6\%$ of reports stayed unexplained, and most reports were ordinary things. Suppose, as generously as possible to the extraterrestrial hypothesis $H_1$, that every extraterrestrial craft report would stay unexplained, so $P(E\mid H_1)=1$ for $E$ = "this report stays unexplained". For the ordinary hypothesis $H_2$, take $P(E\mid H_2)\approx 0.056$. The likelihood ratio is
      $$\frac{P(E\mid H_1)}{P(E\mid H_2)}.$$
      What is its largest value, to the nearest whole number?
    answer: 18
    tolerance: 0.5
    hint: "Divide 1 by 0.056, or 12,618 by 701."
    explanation: |
      $1/0.0556\approx 18$. Observing that a case stays unexplained therefore multiplies the odds on an extraterrestrial craft by at most about eighteen, in this rough model. That is not nothing, but it is small next to the factors that the Drake and Fermi lessons left open, and the model is crude (the unexplained share among ordinary cases is itself an estimate). Better evidence would be a case where an ordinary cause would almost never leave the observation, which is the idea behind several independent sensors.

  - type: text
    id: standards
    title: "Extraordinary claims, extraordinary evidence"
    body: |
      Carl Sagan used the saying "extraordinary claims require extraordinary evidence" in his book *Broca's Brain* (1979) and popularised it. A version with "proof" in place of "evidence" is credited to the sociologist Marcello Truzzi in the mid-1970s, and earlier thinkers had similar ideas: Hume argued in his essay on miracles (1748) that a wise person proportions belief to the evidence, and Laplace wrote that the more extraordinary a fact, the more it needs to be supported by strong proofs.

      In the odds language of the lesson on Bayes' rule, the saying has a precise form. Write $H_1$ for the unusual hypothesis, $H_2$ for the ordinary one and $E$ for the evidence:
      $$\frac{P(H_1\mid E)}{P(H_2\mid E)}=\frac{P(E\mid H_1)}{P(E\mid H_2)}\cdot\frac{P(H_1)}{P(H_2)}.$$
      A small prior odds $P(H_1)/P(H_2)$ must be met by a large likelihood ratio to reach even odds. Defenders of taking UAP seriously reply that the prior is not as tiny as a sceptic says, since the Drake and Fermi lessons leave other minds possible; sceptics reply that visits across interstellar distances need more than a possible Galaxy, and that a prior should also count ordinary but unknown causes. The disagreement is mostly about the prior, which is a judgement, not a measurement.

  - type: widget
    id: widget-odds
    title: "Move the prior and the likelihood ratio"
    widget: odds-updater
    config:
      prior: 1.0e-6
      lr: 18
      presets:
        - { label: "Prior 1e-6, LR 18", prior: 1.0e-6, lr: 18 }
        - { label: "Prior 1e-3, LR 18", prior: 1.0e-3, lr: 18 }
        - { label: "Prior 1e-6, LR 1e6", prior: 1.0e-6, lr: 1.0e6 }
    body: |
      The sliders set two toy numbers, a prior odds on an extraterrestrial craft and the likelihood ratio of an observation. The blue row is the prior, the orange row what the evidence adds, the purple row the posterior; the dashed line is even odds. Neither number is a measurement. Try the three buttons and then drag.
    review: false

  - type: numeric
    id: post-odds
    title: "Posterior odds"
    prompt: |
      For an extraterrestrial hypothesis $H_1$ against an ordinary one $H_2$, a sceptic starts at prior odds $P(H_1)/P(H_2)=10^{-6}$. An observation has likelihood ratio $18$. What are the posterior odds, as a multiple of $10^{-6}$ (answer 18 means $18\times10^{-6}$)?
    answer: 18
    tolerance: 0.5
    hint: "Odds multiply: posterior odds = likelihood ratio times prior odds."
    explanation: |
      $18\times10^{-6}=1.8\times10^{-5}$, still tiny. A defender with prior odds $10^{-3}$ would end at $0.018$, also below one, so with a likelihood ratio of only 18, both stay unconvinced and differ only by the starting point.

  - type: build
    id: odds-build
    title: "Build the odds rule"
    prompt: |
      Assemble Bayes' rule in odds form for two hypotheses $H_1$, $H_2$ and evidence $E$.
    prefix: '\dfrac{P(H_1\mid E)}{P(H_2\mid E)}='
    tiles:
      - '\dfrac{P(E\mid H_1)}{P(E\mid H_2)}'
      - '\dfrac{P(H_1)}{P(H_2)}'
      - '\dfrac{P(E\mid H_2)}{P(E\mid H_1)}'
      - '\dfrac{P(H_2)}{P(H_1)}'
    answers:
      - ['\dfrac{P(E\mid H_1)}{P(E\mid H_2)}', '\dfrac{P(H_1)}{P(H_2)}']
      - ['\dfrac{P(H_1)}{P(H_2)}', '\dfrac{P(E\mid H_1)}{P(E\mid H_2)}']
    wrong:
      - answer: ['\dfrac{P(E\mid H_2)}{P(E\mid H_1)}', '\dfrac{P(H_1)}{P(H_2)}']
        feedback: |
          This inverts the likelihood ratio, so evidence that favours $H_1$ would lower its odds.
      - answer: ['\dfrac{P(E\mid H_1)}{P(E\mid H_2)}', '\dfrac{P(H_2)}{P(H_1)}']
        feedback: |
          This starts from the prior odds of the wrong hypothesis. The prior odds must be $H_1$ over $H_2$, matching the left side.
    hint: "Posterior odds are the likelihood ratio times the prior odds, both with $H_1$ on top."
    explanation: |
      The likelihood ratio tells how much more expected the evidence is under $H_1$ than under $H_2$, and the prior odds say where one started.

  - type: text
    id: eth
    title: "The extraterrestrial hypothesis among others"
    body: |
      The **extraterrestrial hypothesis** says that some unexplained reports are craft from another civilisation. It is one hypothesis in a list that includes ordinary misidentification, sensor artefacts, secret human technology, hoaxes and unknown natural effects. Its best defence, according to its supporters, is that the Drake and Fermi lessons leave other civilisations possible, and that some cases, with trained observers and several sensors, deserve study. The best objection, according to its critics, is that the distances are great, that no physical object or sample has been shown, and that the pattern fits human attention and missing data.

      What would test it? A hypothesis is tested by what it forbids and by what it adds. Physical samples that can be analysed in many laboratories. Several independent, calibrated sensors on one object, with the raw data public, so that others can check for artefacts. A measured property no known craft can have, such as an acceleration or a material. Repetition. None of these has so far been published, according to AARO and NASA's team; according to critics of those bodies, the strongest data may be classified, and the stigma has kept good data from being collected. Both statements can be put to a test, by releasing the data.

  - type: mcq
    id: eth-q
    title: "What would count"
    prompt: |
      Which new evidence would do most to raise the odds of the extraterrestrial hypothesis for a careful sceptic?
    options:
      - text: "An object tracked at once by several independent, calibrated sensors, with the raw data made public, showing properties that no known aircraft, balloon or artefact can produce."
        correct: true
        feedback: |
          Yes. Independence makes a shared artefact unlikely, public data lets others check, and a property that ordinary causes cannot give makes the likelihood ratio large.
      - text: "More witnesses who describe the same lights, with no recordings."
        feedback: |
          Witnesses can share a misperception, and attention spreads it, as the 1952 chart of reports shows. Many agreeing reports do not give independence.
      - text: "A new video that is blurry but exciting."
        feedback: |
          Blurry footage fits many causes, so its likelihood ratio is close to one, however striking it feels.
      - text: "A government statement that it cannot explain a case."
        feedback: |
          Declaring a case unexplained is the 5.6 per cent kind of result: about missing data, with a small likelihood ratio.
    explanation: |
      Evidence is strong when ordinary hypotheses would rarely produce it, and weak when they would often produce it.

  - type: mcq
    id: layers
    title: "Fact, debate or commitment?"
    prompt: |
      The course keeps three layers apart. Which statement belongs to the layer of **established fact**?
    options:
      - text: "Project Blue Book recorded 12,618 reports, 701 of them unidentified, and the 2021 intelligence assessment explained one of 144 reports with high confidence."
        correct: true
        feedback: |
          Yes. These are documented counts from official records.
      - text: "Some unexplained reports are probably craft from other civilisations."
        feedback: |
          This is a judgement of probability. It is a position in live debate, one that depends on priors and on the quality of evidence.
      - text: "If other minds exist, they must matter for the meaning of human life."
        feedback: |
          That is a commitment or a philosophical view, which the next lesson takes up from several traditions.
      - text: "All unexplained reports will eventually get ordinary explanations."
        feedback: |
          A prediction, held by many but not established, and the opposite prediction is also held. Neither is a fact yet.
    explanation: |
      What the records show is fact; how likely visits are is live debate; what they would mean is commitment.

  - type: text
    id: summary
    body: |
      **Next:** If there are other minds, what would that mean for the great religious questions: the incarnation, redemption, creation and the place of humans? The next lesson, Aliens and Theology, takes the question to several traditions, each on its own terms.
