outroTitle: Level 21 in one picture
outro: |
  The Drake equation turns "are we alone?" into seven factors, four of them guessed from one example. Honest ranges make the answer a wide spread, and the Fermi paradox is the tension between that spread and the silence. The search for life tests the early factors, the evidence ladder and the odds form weigh any claim of contact, and the Copernican principle says where we stand without saying what it means. The religious traditions meet the question each on its own terms. Where people part ways is at the guessed factors, at which Fermi premise fails, and at what, if anything, the answer would mean for purpose.
