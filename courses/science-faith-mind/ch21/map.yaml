id: ch21-map
title: "Content Map: Are We Alone?"
kind: map
name: Level 21, Are We Alone? (the Drake equation and its uncertainty, the Fermi paradox and the Great Filter, the search for life, unidentified aerial phenomena, aliens and theology, the Copernican principle)

intro: |
  A **content map** shows how the ideas of a level fit together. Each box is one idea, written in a few sentences. An arrow goes from an idea to one that builds on it.

  You will rebuild the level on the question of whether we are alone, from memory, one box at a time. For each glowing box, pick the card that belongs there. The other cards look alike, but each hides a classic mistake from the level (a sum where a product belongs, a median read as a typical case, an unexplained report read as an alien one), and every wrong pick comes with a reason.

  Everything is taught according to the scientists, historians and traditions named in each box; whether anyone else is out there is left open. Tap a finished box at any time to reread its card.

cols: 3
nodes:
  - id: drake
    title: The Drake equation
    row: 1
    col: 1
    body: |
      According to **Frank Drake (1961)**, the number $N$ of civilisations in the Milky Way that send out detectable signals is a **product** of seven factors,
      $$N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L$$
      where **$L$ is the number of years a civilisation keeps signalling**: the first six factors give births per year, each stays $L$ years, so **doubling $L$ doubles $N$**. The star and planet factors are **constrained by observation**, while $f_l$, $f_i$, $f_c$ and $L$ rest on **one known case, Earth**.
    decoys:
      - body: |
          According to **Frank Drake (1961)**, the number $N$ of civilisations in the Milky Way that send out detectable signals is a **sum** of seven terms,
          $$N=R_*+f_p+n_e+f_l+f_i+f_c+L$$
          where **$L$ is the number of years a civilisation keeps signalling**: each term adds its own contribution, so **doubling $L$ adds a fixed amount to $N$**. The star and planet factors are **constrained by observation**, while $f_l$, $f_i$, $f_c$ and $L$ rest on **one known case, Earth**.
        feedback: |
          The factors are fractions and rates chained together: only a fraction of stars have planets, of those only a fraction start life, and so on. Each factor scales all the others, so they multiply, and doubling any one of them doubles $N$. A sum of fractions and years would make no sense dimensionally.
      - body: |
          According to **Frank Drake (1961)**, the number $N$ of civilisations in the Milky Way that send out detectable signals is a **product** of seven factors,
          $$N=R_*\,f_p\,n_e\,f_l\,f_i\,f_c\,L$$
          where **$L$ is the number of years a civilisation keeps signalling**: the first six factors give births per year, each stays $L$ years, so **doubling $L$ doubles $N$**. The **life, intelligence and lifetime factors are measured**, while $R_*$ and $f_p$ rest on **one known case, Earth**.
        feedback: |
          It is the other way round. Telescopes have counted stars and planets, so $R_*$ and $f_p$ are constrained, and about 22% of Sun-like stars host an Earth-size planet in the habitable zone. The factors for life, intelligence, signals and lifetime have a single example, which is why they are guesses.
    explanation: |
      The root of the map. The equation organises what we know and do not know; the next box asks what to do when the guessed factors are wide ranges, and the Fermi box asks why the answer seems to be zero.

  - id: fermi
    title: The Fermi paradox and the Great Filter
    row: 1
    col: 2
    body: |
      The paradox is a tension: **P1** many stars are far older than the Sun, **P2** civilisations arose around some, **P3** at least one spread across the galaxy, **P4** that would leave signs we could see, yet we see none, so **one of P1 to P4 must be false**. A wave at $0.1\,c$ crosses $10^5$ light-years in
      $$t=\frac{10^{5}}{0.1}=10^{6}\ \text{years}$$
      only a thousandth of a billion years. **Hanson's Great Filter (1998)** says some step from dead matter to lasting expansion is very improbable, **behind us or ahead of us**. **Hart (1975)** read the silence as strong evidence of absence; Sagan and Newman replied that **absence of evidence is not evidence of absence**.
    decoys:
      - body: |
          The paradox is a tension: **P1** many stars are far older than the Sun, **P2** civilisations arose around some, **P3** at least one spread across the galaxy, **P4** that would leave signs we could see, yet we see none, so **one of P1 to P4 must be false**. A wave at $0.1\,c$ crosses $10^5$ light-years in
          $$t=\frac{10^{5}}{0.1}=10^{9}\ \text{years}$$
          about the age of the galaxy itself. **Hanson's Great Filter (1998)** says some step from dead matter to lasting expansion is very improbable, **behind us or ahead of us**. **Hart (1975)** read the silence as strong evidence of absence; Sagan and Newman replied that **absence of evidence is not evidence of absence**.
        feedback: |
          Dividing $10^5$ light-years by $0.1\,c$ gives $10^6$ years, not $10^9$. That is the force of the paradox: a civilisation a billion years older than us would have had time for a thousand crossings, so slow travel does not explain the silence.
      - body: |
          The paradox is a tension: **P1** many stars are far older than the Sun, **P2** civilisations arose around some, **P3** at least one spread across the galaxy, **P4** that would leave signs we could see, yet we see none, so **one of P1 to P4 must be false**. A wave at $0.1\,c$ crosses $10^5$ light-years in
          $$t=\frac{10^{5}}{0.1}=10^{6}\ \text{years}$$
          only a thousandth of a billion years. **Hanson's Great Filter (1998)** says some step from dead matter to lasting expansion is very improbable, and it **must lie ahead of us**. **Hart (1975)** read the silence as strong evidence of absence; Sagan and Newman replied that **absence of evidence is not evidence of absence**.
        feedback: |
          Hanson left the position open: the filter may lie behind us (a rare start of life or of complex life) or ahead (civilisations do not last). Which of the two is the point of the next boxes, since finding an independent second origin of life would shift the odds toward ahead.
    explanation: |
      The silence turned into an argument. Its three families of answers each reject one premise: we are rare (P2), they do not last or spread (P3), they are here or unseen (P4, as in Ball's zoo hypothesis of 1973).

  - id: life
    title: The search for life
    row: 1
    col: 3
    body: |
      A **biosignature** is something life could make. The Mars results (Viking 1976, the meteorite ALH84001 in **1996**) stayed ambiguous. During a transit the starlight dims by $\delta=(R_p/R_\star)^2$, about **84 parts per million** for Earth and the Sun. **Lovelock (1965)**: **oxygen and methane together** signal life, since each destroys the other. A single gas is weaker: the 2025 claim of dimethyl sulfide on K2-18 b was about **3 sigma** and later analyses found it **weaker, so it is not confirmed**. Independent clues multiply the odds, and an **independent second origin** would suggest the filter lies ahead.
    decoys:
      - body: |
          A **biosignature** is something life could make. The Mars results (Viking 1976, the meteorite ALH84001 in **1996**) stayed ambiguous. During a transit the starlight dims by $\delta=R_p/R_\star$, about **0.9 per cent** for Earth and the Sun. **Lovelock (1965)**: **oxygen and methane together** signal life, since each destroys the other. A single gas is weaker: the 2025 claim of dimethyl sulfide on K2-18 b was about **3 sigma** and later analyses found it **weaker, so it is not confirmed**. Independent clues multiply the odds, and an **independent second origin** would suggest the filter lies ahead.
        feedback: |
          The dimming is the ratio of areas, so the ratio of radii is squared: $(R_p/R_\star)^2$. For an Earth-sized planet and a Sun-sized star the radius ratio is about $0.009$, and its square is about $84\times10^{-6}$, i.e. 84 parts per million.
      - body: |
          A **biosignature** is something life could make. The Mars results (Viking 1976, the meteorite ALH84001 in **1996**) stayed ambiguous. During a transit the starlight dims by $\delta=(R_p/R_\star)^2$, about **84 parts per million** for Earth and the Sun. **Lovelock (1965)**: **a single gas such as oxygen** signals life, since only life makes it. The 2025 claim of dimethyl sulfide on K2-18 b was about **3 sigma** and later analyses found it **weaker, so it is not confirmed**. Independent clues multiply the odds, and an **independent second origin** would suggest the filter lies ahead.
        feedback: |
          Lovelock's point was a pair that cannot last together: oxygen and methane react, so both must be refilled continuously. A single gas can have non-living sources, which is why the oxygen alone is argued over and why the K2-18 b claim needs its alternatives ruled out.
    explanation: |
      The evidence side of the level: what is known about places where life could be. A real detection would also settle P2 in the Fermi box for one more case, and the evidence ladder reappears in the UAP box.

  - id: uncertainty
    title: Estimating civilisations with uncertainty
    row: 2
    col: 1
    body: |
      Instead of one value per factor, give each a **range**, add logarithms and draw many times. The two extreme tables differ by about **16 orders of magnitude**; 20,000 log-uniform draws gave a **median $N\approx1.7$** with **46% of draws below 1**, and 90% between about $10^{-3.4}$ and $10^{3.8}$. The factor with the widest range, **$L$** (about 61% of the variance), matters most. According to **Sandberg, Drexler and Ord (2018)**, such a wide spread makes **an empty galaxy unsurprising**, so the silence need not be a paradox.
    decoys:
      - body: |
          Instead of one value per factor, give each a **range**, add logarithms and draw many times. The two extreme tables differ by about **16 orders of magnitude**; 20,000 log-uniform draws gave a **median $N\approx1.7$**, so **most draws give at least one civilisation**, and 90% fall between about $10^{-3.4}$ and $10^{3.8}$. The factor with the widest range, **$L$** (about 61% of the variance), matters most. According to **Sandberg, Drexler and Ord (2018)**, such a wide spread makes **an empty galaxy unsurprising**, so the silence need not be a paradox.
        feedback: |
          A median near 1.7 does not mean most draws are above 1: 46% of them fall below 1. The distribution is so wide that a typical draw is far from the median, which is why we report the spread and the share below one, not a single value.
      - body: |
          Instead of one value per factor, give each a **range**, add logarithms and draw many times. The two extreme tables differ by about **16 orders of magnitude**; 20,000 log-uniform draws gave a **median $N\approx1.7$** with **46% of draws below 1**, and 90% between about $10^{-3.4}$ and $10^{3.8}$. The factor with the widest range, **$L$** (about 61% of the variance), matters most. According to **Sandberg, Drexler and Ord (2018)**, such a wide spread makes **the silence a strong proof that we are alone**.
        feedback: |
          Their conclusion was weaker and different: with honest ranges there is a substantial chance that no one else exists, so silence is not surprising and no strange explanation is needed. It does not prove loneliness, and critics hold that other modelling choices give other results.
    explanation: |
      The same equation, treated honestly. The method (a range per factor, a spread for the answer) is what the Fermi box needs to judge whether the silence is a paradox at all.

  - id: copernican
    title: The Copernican principle and our place
    row: 2
    col: 2
    body: |
      **Copernicus (1543)** placed the Earth among the planets circling the Sun; the principle of **mediocrity** keeps the idea as a working assumption that our position is not special. **Gott (1993)**: if our moment is a **uniformly random** point in a thing's life, then with confidence $c$
      $$\frac{1-c}{1+c}\,t_\text{past}\le t_\text{future}\le\frac{1+c}{1-c}\,t_\text{past}$$
      which at 95% is from $t_\text{past}/39$ to $39\,t_\text{past}$, and the interval holds for a share $c$ of meeting moments. **Carter (1973)**: observers find themselves only where observers can exist, so **selection is about conditions, not position**, and the two do not contradict.
    decoys:
      - body: |
          **Copernicus (1543)** placed the Earth among the planets circling the Sun; the principle of **mediocrity** keeps the idea as a working assumption that our position is not special. **Gott (1993)**: if our moment is a **uniformly random** point in a thing's life, then with confidence $c$
          $$\frac{1-c}{1+c}\,t_\text{past}\le t_\text{future}\le\frac{1+c}{1-c}\,t_\text{past}$$
          which at 95% is from $t_\text{past}/39$ to $39\,t_\text{past}$, and the interval holds for a share $c$ of meeting moments. **Carter (1973)**: observers find themselves only where observers can exist, so **selection proves we are special and refutes mediocrity**.
        feedback: |
          Selection says something about conditions (we must live where life is possible), not about position. Mediocrity concerns where we stand; the Rare Earth hypothesis of Ward and Brownlee (2000) claims that the conditions are rare, and that claim is not a claim of a special position.
      - body: |
          **Copernicus (1543)** placed the Earth among the planets circling the Sun; the principle of **mediocrity** keeps the idea as a working assumption that our position is not special. **Gott (1993)**: if our moment is **any point we happen to know about** in a thing's life, then with confidence $c$
          $$\frac{1-c}{1+c}\,t_\text{past}\le t_\text{future}\le\frac{1+c}{1-c}\,t_\text{past}$$
          which at 95% is from $t_\text{past}/39$ to $39\,t_\text{past}$, and the interval holds for a share $c$ of meeting moments. **Carter (1973)**: observers find themselves only where observers can exist, so **selection is about conditions, not position**, and the two do not contradict.
        feedback: |
          The share $c$ is guaranteed only if the moment really is a uniformly random point of the whole life. Critics (Buch, Caves) reject the rule where a time scale is known or the moment was chosen, as when we look at something because it is already old or new.
    explanation: |
      Where we stand, and what that does and does not license. The same assumption of ordinariness is behind the Fermi premises, and it must be kept apart from what our place means for purpose.

  - id: ufo
    title: Unidentified aerial phenomena
    row: 2
    col: 3
    body: |
      A **UFO** or **UAP** is only "not yet identified". According to the US Air Force, **Project Blue Book (1952 to 1969)** left **701 of 12,618** reports unidentified, a fraction of about $5.6\%$, and later official studies found no evidence of extraterrestrial technology. In odds form, posterior odds equal $\text{LR}\times$ prior odds; if "unexplained" has chance $0.056$ under ordinary causes, then
      $$\text{LR}\le\frac{1}{0.056}\approx18$$
      Sagan's **extraordinary claims** saying means a small prior needs a large LR. Tests would be **physical samples** and several **independent calibrated sensors**.
    decoys:
      - body: |
          A **UFO** or **UAP** is only "not yet identified". According to the US Air Force, **Project Blue Book (1952 to 1969)** left **701 of 12,618** reports unidentified, a fraction of about $5.6\%$, and later official studies found no evidence of extraterrestrial technology. In odds form, posterior odds equal $\text{LR}\times$ prior odds; if "unexplained" has chance $0.056$ under ordinary causes, then
          $$\text{LR}\le\frac{1}{0.056}\approx18$$
          Sagan's **extraordinary claims** saying means that **an unexplained case is itself extraordinary evidence**. Tests would be **physical samples** and several **independent calibrated sensors**.
        feedback: |
          An unexplained case is not extraordinary evidence: about 5.6% of ordinary reports remain unexplained anyway, so "unexplained" is only mildly more likely under an alien craft, and the LR is capped near 18. Sagan's saying is about the size of the evidence a small prior needs.
      - body: |
          A **UFO** or **UAP** is only "not yet identified". According to the US Air Force, **Project Blue Book (1952 to 1969)** left **701 of 12,618** reports unidentified, a fraction of about $5.6\%$, and later official studies found **evidence that the unresolved cases are extraterrestrial**. In odds form, posterior odds equal $\text{LR}\times$ prior odds; if "unexplained" has chance $0.056$ under ordinary causes, then
          $$\text{LR}\le\frac{1}{0.056}\approx18$$
          Sagan's **extraordinary claims** saying means a small prior needs a large LR. Tests would be **physical samples** and several **independent calibrated sensors**.
        feedback: |
          The official studies (Blue Book, the 2021 assessment, NASA's 2023 study team, AARO) say the unresolved cases mostly lack good data and that no evidence of extraterrestrial technology has been found. Critics answer that the best data may be classified, but that is a position, not a finding.
    explanation: |
      The same Bayes tool as the evidence ladder in the life box, applied to a different claim: an observation counts only as much as the ratio of how likely it is under each rival.

  - id: theology
    title: Aliens and theology
    row: 3
    col: 2
    body: |
      Plural worlds were argued long before telescopes (Cusa, 1440; Bruno, 1584; Kant, 1755), while **Aquinas argued for one world** because creatures form one order. The sharpest Christian worry is the incarnation. With $A$ = other minds exist and $B$ = salvation rests on one unique incarnation that cannot reach them,
      $$A\wedge B\Rightarrow\text{conflict}$$
      so **defenders reject $B$** (unfallen worlds, separate redemption, or one incarnation sufficing for all). According to the Qur'an (42:29), God **dispersed living beings through the heavens and the earth**, which some read as life elsewhere and others as earthly creatures.
    decoys:
      - body: |
          Plural worlds were argued long before telescopes (Cusa, 1440; Bruno, 1584; Kant, 1755), while **Aquinas argued for one world** because creatures form one order. The sharpest Christian worry is the incarnation. With $A$ = other minds exist and $B$ = salvation rests on one unique incarnation that cannot reach them,
          $$A\Rightarrow\text{conflict}$$
          so **defenders reject $B$** (unfallen worlds, separate redemption, or one incarnation sufficing for all). According to the Qur'an (42:29), God **dispersed living beings through the heavens and the earth**, which some read as life elsewhere and others as earthly creatures.
        feedback: |
          The conflict needs both parts. Other minds alone do not contradict the doctrine unless salvation is also tied to one incarnation that cannot reach them; that second premise is exactly what defenders deny. Checking premises one by one is the lesson of the guided arguments.
      - body: |
          Plural worlds were argued long before telescopes (Cusa, 1440; Bruno, 1584; Kant, 1755), while **Aquinas argued for many worlds** because God's power has no limit. The sharpest Christian worry is the incarnation. With $A$ = other minds exist and $B$ = salvation rests on one unique incarnation that cannot reach them,
          $$A\wedge B\Rightarrow\text{conflict}$$
          so **defenders reject $B$** (unfallen worlds, separate redemption, or one incarnation sufficing for all). According to the Qur'an (42:29), God **dispersed living beings through the heavens and the earth**, which some read as life elsewhere and others as earthly creatures.
        feedback: |
          In the Summa Aquinas argued that the world is one, because the order of creatures is one; the objection from God's power he answered by saying that no agent aims at a plurality of material worlds for its own sake. Scholars add that he allowed other worlds as possible but denied that they exist.
    explanation: |
      What the question of other minds does to belief. Its answer depends on a premise, not on the discovery alone, and where thoughtful people part ways is which premise they accept.

